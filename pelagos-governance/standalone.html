async function encryptWorkspace(passphrase){if(!passphrase)throw new Error('Passphrase required');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:250000},material,{name:'AES-GCM',length:256},false,['encrypt']);const plain=new TextEncoder().encode(JSON.stringify(workspace));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);return {schema:ENCRYPTED_SCHEMA,release:RELEASE,kdf:'PBKDF2-SHA-256',iterations:250000,cipher:'AES-GCM-256',salt:b64(salt),iv:b64(iv),ciphertext:b64(new Uint8Array(cipher)),created_at:now()}}

async function importWorkspace(file){const prior=clone(workspace);importJournal={state:'reading',file:file.name,started_at:now(),prior_receipt_head:workspace.receipts.at(-1)?.hash||null};workspace.import_journal=importJournal;await storageWrite();try{const parsed=JSON.parse(await file.text());validateWorkspace(parsed);importJournal.state='validated';workspace=parsed;workspace.import_journal={...importJournal,state:'accepted',accepted_at:now()};await appendReceipt('workspace_import_accepted','workspace',{file:file.name});toast('Workspace imported')}catch(e){workspace=prior;workspace.import_journal={...importJournal,state:'refused',error:e.message,refused_at:now()};await appendReceipt('workspace_import_refused','workspace',{file:file.name,error:e.message});toast(`Import refused: ${e.message}`)}render()}
