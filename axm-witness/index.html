<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; worker-src 'none'">
<title>AXM Witness | Loading qualified application</title>
<style>html,body{margin:0;min-height:100%;background:#080c10;color:#f3f0e8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box}section{max-width:680px;border:1px solid #25313c;border-radius:14px;background:#0d141a;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.35)}b{display:block;color:#d8a84d;letter-spacing:.18em;font-size:12px;margin-bottom:14px}h1{font-size:30px;line-height:1.08;margin:0 0 12px}p{color:#aab4bd;line-height:1.55;margin:0}code{display:block;margin-top:18px;color:#739dad;font-size:11px;overflow-wrap:anywhere}</style>
</head>
<body><main><section><b>AXM WITNESS</b><h1>Opening the qualified Flock-native demonstrator.</h1><p>The application is reconstructing from five content-addressed transport parts. Source records remain in your browser after the application opens.</p><code>qualified inner SHA-256 4adb272395448484229451a33048c2b6c975d7155f1b9fecb6300d3f93b5d8ce</code></section></main>
<script>
(async()=>{
  const expected="4adb272395448484229451a33048c2b6c975d7155f1b9fecb6300d3f93b5d8ce";
  const parts=["payload/part-00.b64","payload/part-01.b64","payload/part-02.b64","payload/part-03a.b64","payload/part-03b.b64"];
  try{
    const responses=await Promise.all(parts.map(path=>fetch(path,{cache:"no-store"})));
    if(responses.some(response=>!response.ok)) throw new Error("transport part unavailable");
    const b64=(await Promise.all(responses.map(response=>response.text()))).join("").trim();
    const compressed=Uint8Array.from(atob(b64),char=>char.charCodeAt(0));
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
    const bytes=new Uint8Array(await new Response(stream).arrayBuffer());
    const actual=[...new Uint8Array(await crypto.subtle.digest("SHA-256",bytes))].map(value=>value.toString(16).padStart(2,"0")).join("");
    if(actual!==expected) throw new Error("qualified application identity mismatch");
    const text=new TextDecoder().decode(bytes);
    document.open();document.write(text);document.close();
  }catch(error){
    document.querySelector("h1").textContent="The qualified application could not open.";
    document.querySelector("p").textContent=String(error&&error.message||error);
  }
})();
</script></body></html>
