<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Organ Evolution · AXM Estate Workbench</title>
<meta name="description" content="A local-only evaluation surface for deciding how an estate organ should be retained, hardened, split, merged, grafted, commoditized, replaced, or retired without confusing function, evidence, motive, credit, and authority.">
<script>
(() => {
  const saved = localStorage.getItem('axm-organ-evolution-theme');
  document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
})();
</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="observations.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="sigil">OE</div><div><b>Organ Evolution</b><span>Estate adaptation workbench</span></div></div>
  <div class="topstats" id="topStats" aria-live="polite"></div>
  <div class="actions">
    <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    <button class="btn small" id="importBtn"><span>Import</span> JSON</button>
    <button class="btn small" id="exportBtn"><span>Export</span> JSON</button>
    <button class="btn small primary" id="newOrganBtn">+ <span>Organ</span></button>
    <input class="file-input" id="fileInput" type="file" accept="application/json,.json">
  </div>
</header>
<div class="shell">
  <aside class="rail">
    <h2 id="estateName"></h2>
    <div class="estate-purpose" id="estatePurpose"></div>
    <input class="rail-search" id="organSearch" type="search" placeholder="Filter organs…" aria-label="Filter organs">
    <div class="organ-list" id="organList"></div>
    <div class="rail-footer">
      This surface stores its current workspace only in this browser. Export JSON for durable custody. Ratings are explicit review inputs, not truth or probability.
      <div style="margin-top:.65rem"><button class="btn small" id="resetBtn">Restore worked example</button></div>
    </div>
  </aside>
  <section class="stage">
    <nav class="tabs" aria-label="Workbench views">
      <button class="tab active" data-view="anatomy">Anatomy</button>
      <button class="tab" data-view="evolution">Evolution</button>
      <button class="tab" data-view="actors">Actors &amp; interests</button>
      <button class="tab" data-view="evidence">Evidence</button>
      <button class="tab" data-view="stress">Stress tests</button>
      <button class="tab" data-view="decision">Decision record</button>
    </nav>
    <main class="workspace" id="workspace"></main>
  </section>
</div>
<dialog class="dialog" id="editorDialog">
  <form method="dialog" id="editorForm">
    <div class="dialog-head"><div><div class="kicker" id="dialogKicker">Create</div><h2 id="dialogTitle">Edit record</h2></div><button class="iconbtn" value="cancel" aria-label="Close">×</button></div>
    <div class="dialog-body" id="dialogBody"></div>
    <div class="dialog-foot"><button class="btn" value="cancel">Cancel</button><button class="btn primary" id="dialogSave" value="default">Save</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data/seed.js"></script>
<script src="data/observations.js"></script>
<script src="core.js"></script>
<script src="views.js"></script>
<script src="observations-view.js"></script>
<script src="app.js"></script>
</body>
</html>
