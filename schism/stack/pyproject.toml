[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-schism"
version = "0.1.0"
description = "Operator-owned general application deployment, execution and recovery"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = ["cryptography==50.0.0", "psutil==7.2.2", "cffi==2.1.1", "pycparser==3.12"]

[project.scripts]
schism = "schism_stack.cli:main"

[tool.setuptools.packages.find]
include = ["schism_stack*"]

[tool.setuptools.package-data]
schism_stack = ["web/*"]
