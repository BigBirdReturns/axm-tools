name: Bootstrap Manzanita estate-wide parity candidate

on:
  push:
    branches:
      - agent/manzanita-estate-parity-021
    paths:
      - ".github/workflows/manzanita-estate-parity-bootstrap.yml"
      - ".github/bootstrap/manzanita-estate-parity-part-*.b64"

permissions:
  contents: write

concurrency:
  group: manzanita-estate-parity-bootstrap
  cancel-in-progress: false

jobs:
  materialize-and-publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-estate-parity-021
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact schema dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Reassemble and verify the exact staged payload
        run: |
          test "$(find .github/bootstrap -maxdepth 1 -name 'manzanita-estate-parity-part-*.b64' | wc -l)" -eq 13
          cat .github/bootstrap/manzanita-estate-parity-part-*.b64 \
            | base64 --decode \
            > /tmp/manzanita-estate-parity.tar.gz
          test "$(sha256sum /tmp/manzanita-estate-parity.tar.gz | awk '{print $1}')" = \
            "a4eb051b050de4a950ac53f82f51406791f70d05f865dd7f8c780c3cf68437ef"
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archive = Path("/tmp/manzanita-estate-parity.tar.gz")
          target = Path("/tmp/manzanita-estate-parity-materialized")
          target.mkdir(parents=True, exist_ok=True)
          allowed_file = ".github/workflows/manzanita-estate-parity.yml"
          allowed_root = "manzanita-next/parity"
          allowed_prefix = "manzanita-next/parity/"
          seen = set()

          with tarfile.open(archive, "r:gz") as bundle:
              for member in bundle.getmembers():
                  name = PurePosixPath(member.name).as_posix()
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive member: {name}")
                  if name in seen:
                      raise SystemExit(f"Duplicate archive member: {name}")
                  seen.add(name)
                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      raise SystemExit(f"Unsupported archive member type: {name}")
                  if (
                      name != allowed_file
                      and name != allowed_root
                      and not name.startswith(allowed_prefix)
                  ):
                      raise SystemExit(f"Out-of-scope archive member: {name}")
              bundle.extractall(target)
          PY

      - name: Materialize the bounded P9 source
        run: |
          test ! -e manzanita-next/parity
          test -f .github/workflows/manzanita-estate-parity.yml
          cmp \
            /tmp/manzanita-estate-parity-materialized/.github/workflows/manzanita-estate-parity.yml \
            .github/workflows/manzanita-estate-parity.yml
          find /tmp/manzanita-estate-parity-materialized \
            -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/manzanita-estate-parity-materialized \
            -type f -name '*.pyc' -delete
          cp -R /tmp/manzanita-estate-parity-materialized/manzanita-next/parity \
            manzanita-next/parity

      - name: Validate the materialized source and contained review contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            manzanita-next/parity/build_parity.py \
            manzanita-next/parity/tests/test_parity.py \
            programs/manzanita-99/review-board/validate_review_board.py
          python -m json.tool manzanita-next/parity/PARITY_CONTRACT.json > /dev/null
          python -m json.tool manzanita-next/parity/SURFACE_DISPOSITIONS.json > /dev/null
          python -m json.tool manzanita-next/parity/review/M99-RB-PKT-011.json > /dev/null
          python -m json.tool manzanita-next/parity/review/M99-RB-DEC-011.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          board = Path("programs/manzanita-99/review-board")
          pairs = (
              (
                  Path("manzanita-next/parity/review/M99-RB-PKT-011.json"),
                  board / "review-packet.schema.json",
              ),
              (
                  Path("manzanita-next/parity/review/M99-RB-DEC-011.json"),
                  board / "review-decision.schema.json",
              ),
          )
          for value_path, schema_path in pairs:
              Draft202012Validator(json.loads(schema_path.read_text())).validate(
                  json.loads(value_path.read_text())
              )
          PY
          python -m unittest discover \
            -s manzanita-next/parity/tests \
            -p "test_parity.py"

      - name: Publish only the validated parity source
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -rf manzanita-next/parity/out
          git config user.name "manzanita-estate-parity-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add manzanita-next/parity
          git commit -m "Manzanita: materialize exact estate-wide parity candidate"
          git push origin HEAD:agent/manzanita-estate-parity-021
