name: Converge Supplier Foundry organ model

on:
  push:
    branches:
      - agent/admit-supplier-foundry-organ
    paths:
      - '.github/workflows/converge-supplier-foundry-model.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/converge-supplier-foundry-model.yml'
      - 'organ-evolution/data/**'
      - 'tests/pages/verify_organ_evolution.mjs'

permissions:
  contents: write

concurrency:
  group: converge-supplier-foundry-model
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admit-supplier-foundry-organ
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add the organ, evidence, candidates, source scope, and browser contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          model_path = root / 'organ-evolution/data/axm-estate.example.json'
          model = json.loads(model_path.read_text(encoding='utf-8'))
          if any(row['id'] == 'organ.supplier-foundry' for row in model['organs']):
              raise SystemExit('Supplier Foundry organ already exists')

          organ = {
              'id': 'organ.supplier-foundry',
              'name': 'Supplier Foundry',
              'class': 'fabrication',
              'stage': 'emerging',
              'mission': 'Acquire, isolate, qualify, transform, package, substitute, and remove external suppliers without allowing the supplier or adapter to define capability, policy, or accepted authority.',
              'functions': [
                  {'id': 'fn.foundry.acquire', 'name': 'Exact supplier acquisition and license custody', 'criticality': 4, 'coverage': 3},
                  {'id': 'fn.foundry.qualify', 'name': 'Capability conformance and provider comparison', 'criticality': 5, 'coverage': 3},
                  {'id': 'fn.foundry.ripout', 'name': 'Substitution, fallback, and supplier-independent rip-out', 'criticality': 5, 'coverage': 4},
              ],
              'inputs': ['human-owned capability contract', 'exact supplier manifests', 'canonical source product', 'budgets and license policy'],
              'outputs': ['qualified supplier bundle', 'measurement recommendation', 'neutral fallback', 'rip-out verification receipt'],
              'dependencies': [
                  {'target': 'organ.tierbench', 'kind': 'measurement and qualification host', 'criticality': 4, 'replaceability': 3}
              ],
              'authority': {
                  'owns': ['supplier acquisition, isolation, qualification, packaging, substitution, and revocation evidence'],
                  'forbidden': ['define domain capability', 'choose estate policy', 'accept evidence or outcomes', 'mutate Arc law or campaigns', 'schedule the estate', 'turn a measured recommendation into a vendor mandate'],
              },
              'custodians': {
                  'authors': ['actor.steward'],
                  'maintainers': ['actor.operator'],
                  'operators': ['actor.operator', 'actor.reviewer'],
                  'stewards': ['actor.steward'],
              },
              'health': {
                  'function': 3,
                  'authority': 5,
                  'observability': 5,
                  'adaptability': 4,
                  'succession': 4,
                  'replaceability': 5,
                  'efficiency': 3,
                  'containment': 5,
              },
              'pressures': ['supplier and license churn', 'performance versus product-size tradeoffs', 'pressure to become a universal package manager or control plane'],
          }
          tier_index = next(i for i, row in enumerate(model['organs']) if row['id'] == 'organ.tierbench')
          model['organs'].insert(tier_index + 1, organ)

          model['evidence'].append({
              'id': 'evidence.supplier-foundry.asset-pilot',
              'title': 'Supplier Foundry glTF asset commodity pilot',
              'tier': 'measured',
              'independence': 'mixed',
              'source': 'Tier Bench PR #140; workflow 30329697910; artifacts 8676909336 and 8676907830',
              'claim': 'Two exact OSS providers produced byte-deterministic, semantically equivalent bounded glTF products under network quarantine; the complete supplier runtime was then removed and the consumer bundle verified with bundled standard-library tools.',
              'limits': 'One synthetic static two-triangle fixture on hosted Linux. No production asset, visual, texture, animation, skin, morph, Unity, Quest, browser, or GPU result is established.',
          })

          common_links = {
              'sponsors': ['actor.steward'],
              'validators': ['actor.reviewer'],
              'deciders': ['actor.steward'],
              'beneficiaries': ['actor.operator', 'actor.consumer'],
          }
          model['candidates'].append({
              'id': 'candidate.foundry.retain-asset-pilot',
              'organId': 'organ.supplier-foundry',
              'name': 'Retain Supplier Foundry at the proven asset-optimization boundary',
              'action': 'retain',
              'summary': 'Admit the organ for exact supplier acquisition, bounded asset conformance, provider comparison, neutral fallback, and rip-out while refusing every broader policy or scheduling claim.',
              'changes': {
                  'preserve': ['asset.optimize.gltf/v1 contract', 'exact package-lock custody', 'source fallback', 'supplier-independent verifier', 'measurement recommendation only'],
                  'alter': ['replace synthetic-only evidence with additional governed fixtures before production routing'],
                  'retire': [],
                  'introduce': ['scoped estate observation', 'successor reconstruction record', 'consumer adoption receipt'],
              },
              'dimensions': {
                  'function': 4, 'authority': 5, 'reversibility': 5, 'dependency': 4,
                  'adaptability': 5, 'observability': 5, 'succession': 4, 'efficiency': 4,
                  'userValue': 4, 'captureResistance': 5, 'containment': 5, 'evidence': 4,
              },
              'gates': {'function': 'pass', 'authority': 'pass', 'evidence': 'pass', 'migration': 'pass', 'reversibility': 'pass'},
              'actorLinks': common_links,
              'evidenceIds': ['evidence.supplier-foundry.asset-pilot', 'evidence.tier.measured'],
              'risks': ['The current capability evidence may be mistaken for production-asset or runtime performance.'],
              'dissent': ['A dedicated organ may be unnecessary if asset optimization remains one small Tier Bench experiment.'],
          })
          model['candidates'].append({
              'id': 'candidate.foundry.expand-texture-class',
              'organId': 'organ.supplier-foundry',
              'name': 'Extend Supplier Foundry to texture compression',
              'action': 'specialize',
              'summary': 'Add a separate texture.compress.ktx2/v1 capability only after a governed image corpus, visual-quality oracle, device decode measurements, license review, fallback, and rip-out plan exist.',
              'changes': {
                  'preserve': ['asset pilot authority membrane', 'capability-specific contracts', 'exact supplier custody', 'neutral fallback and rip-out'],
                  'alter': ['generalize provider adapters only where the second capability proves the shared seam'],
                  'retire': [],
                  'introduce': ['texture corpus', 'visual-quality comparator', 'device decode and memory receipts', 'KTX2 fallback contract'],
              },
              'dimensions': {
                  'function': 3, 'authority': 5, 'reversibility': 4, 'dependency': 3,
                  'adaptability': 4, 'observability': 3, 'succession': 3, 'efficiency': 3,
                  'userValue': 5, 'captureResistance': 5, 'containment': 4, 'evidence': 1,
              },
              'gates': {'function': 'warn', 'authority': 'pass', 'evidence': 'open', 'migration': 'open', 'reversibility': 'pass'},
              'actorLinks': common_links,
              'evidenceIds': ['evidence.supplier-foundry.asset-pilot'],
              'risks': ['A file-size win may conceal unacceptable visual loss, decode latency, memory growth, or platform-specific failure.'],
              'dissent': ['Texture compression may deliver more immediate Quest value than further static-mesh fixtures.'],
          })

          model_path.write_text(json.dumps(model, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          (root / 'organ-evolution/data/seed.js').write_text(
              'window.AXM_ORGAN_EVOLUTION_SEED = ' + json.dumps(model, indent=2, ensure_ascii=False) + ';\n',
              encoding='utf-8',
          )

          sources_path = root / 'organ-evolution/data/sources.json'
          sources = json.loads(sources_path.read_text(encoding='utf-8'))
          if any(row['organId'] == 'organ.supplier-foundry' for row in sources['organs']):
              raise SystemExit('Supplier Foundry source mapping already exists')
          mapping = {
              'organId': 'organ.supplier-foundry',
              'repositories': [{
                  'fullName': 'BigBirdReturns/tier-bench',
                  'scopePath': 'supplier_foundry',
                  'workflowScope': 'declared_only',
                  'workflowPolicy': {
                      'declarations': [{
                          'matchName': 'Supplier Foundry asset pilot',
                          'role': 'permanent_gate',
                          'lifecycle': 'current',
                          'required': True,
                          'basis': 'The exact-provider, semantic-equivalence, network-isolation, fallback, and rip-out transaction is the current Supplier Foundry gate.',
                      }]
                  },
              }],
          }
          insert_at = next(i for i, row in enumerate(sources['organs']) if row['organId'] == 'organ.tierbench') + 1
          sources['organs'].insert(insert_at, mapping)
          sources_path.write_text(json.dumps(sources, indent=2) + '\n', encoding='utf-8')

          observed_path = root / 'organ-evolution/data/observed.json'
          observed = json.loads(observed_path.read_text(encoding='utf-8'))
          observed['observations'].append({
              'id': 'observation.supplier-foundry.asset-pilot-20260728',
              'organId': 'organ.supplier-foundry',
              'observedAt': '2026-07-28T04:47:14Z',
              'kind': 'hosted_qualification',
              'state': 'verified',
              'claim': 'Supplier Foundry capability asset.optimize.gltf/v1 qualified @gltf-transform/cli 4.4.1 and gltfpack 1.2.0 as deterministic semantically equivalent providers under network quarantine. The accepted Tier Bench main commit is 49e630a8f3a37545544bc5ac827f2cbf14f568b1; the exact source fallback and supplier-independent rip-out both passed.',
              'source': 'Tier Bench PR #140; Actions run 30329697910; artifacts 8676909336 and 8676907830',
              'limits': 'One synthetic static two-triangle fixture on hosted Linux. Selection is a measurement recommendation only and establishes no production, visual, Unity, Quest, browser, or GPU result.',
              'evidenceRefs': [
                  'https://github.com/BigBirdReturns/tier-bench/pull/140',
                  'https://github.com/BigBirdReturns/tier-bench/actions/runs/30329697910',
                  'sha256:abcc2c8c13363af2e957c08cafd3970207aa1059d4d21ddb5928f850ed1445ce',
                  'sha256:ae3a340024088e1619f94f66dbedbf4c4af1594b8cb94372d7f396a65fe4be43',
              ],
          })
          observed_path.write_text(json.dumps(observed, indent=2) + '\n', encoding='utf-8')

          test_path = root / 'organ-evolution/scripts/test_observe.py'
          text = test_path.read_text(encoding='utf-8')
          old = '''            "organ.genesis", "organ.core", "organ.embodied", "organ.bloodstream",\n            "organ.hinge", "organ.tierbench", "organ.arc", "organ.world", "organ.tools",'''
          new = '''            "organ.genesis", "organ.core", "organ.embodied", "organ.bloodstream",\n            "organ.hinge", "organ.tierbench", "organ.supplier-foundry",\n            "organ.arc", "organ.world", "organ.tools",'''
          if text.count(old) != 1:
              raise SystemExit('declared organ-set test anchor missing')
          text = text.replace(old, new)
          old = '''        self.assertEqual(\n            [row["id"] for row in local],\n            ["observation.bloodstream.hardening-20260728"],\n        )\n        self.assertEqual(local[0]["organId"], "organ.bloodstream")\n        self.assertEqual(local[0]["state"], "verified")\n        self.assertIn("Hosted synthetic-ledger qualification only", local[0]["limits"])'''
          new = '''        self.assertEqual(\n            [row["id"] for row in local],\n            [\n                "observation.bloodstream.hardening-20260728",\n                "observation.supplier-foundry.asset-pilot-20260728",\n            ],\n        )\n        self.assertEqual(local[0]["organId"], "organ.bloodstream")\n        self.assertEqual(local[0]["state"], "verified")\n        self.assertIn("Hosted synthetic-ledger qualification only", local[0]["limits"])\n        self.assertEqual(local[1]["organId"], "organ.supplier-foundry")\n        self.assertIn("measurement recommendation only", local[1]["limits"])'''
          if text.count(old) != 1:
              raise SystemExit('local evidence test anchor missing')
          test_path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          browser_path = root / 'tests/pages/verify_organ_evolution.mjs'
          browser = browser_path.read_text(encoding='utf-8')
          replacements = [
              ('check("worked estate loads nine organs",\n    await page.locator("#organList .organ-button").count() === 9);', 'check("worked estate loads ten organs",\n    await page.locator("#organList .organ-button").count() === 10);'),
              ('await page.locator(".organ-map svg .map-node").count() === 9);', 'await page.locator(".organ-map svg .map-node").count() === 10);'),
              ('await page.locator("#organList .organ-button").count() === 9 &&', 'await page.locator("#organList .organ-button").count() === 10 &&'),
              ('await page.locator("#organList .organ-button").count() === 10 &&\n    (await page.locator("#organList").innerText()).includes("Test Organ")', 'await page.locator("#organList .organ-button").count() === 11 &&\n    (await page.locator("#organList").innerText()).includes("Test Organ")'),
          ]
          for old, new in replacements:
              if browser.count(old) != 1:
                  raise SystemExit(f'browser count anchor missing: {old[:70]}')
              browser = browser.replace(old, new)
          anchor = '''  check("authority membrane remains explicit",\n    (await page.locator("#workspace").innerText()).includes("Authority membrane") &&\n    (await page.locator("#workspace").innerText()).includes("Forbidden"));\n\n  await page.click('[data-view="evolution"]');'''
          addition = '''  check("authority membrane remains explicit",\n    (await page.locator("#workspace").innerText()).includes("Authority membrane") &&\n    (await page.locator("#workspace").innerText()).includes("Forbidden"));\n  check("Supplier Foundry is a first-class estate organ",\n    (await page.locator("#organList").innerText()).includes("Supplier Foundry"));\n\n  await page.getByRole("button", { name: /Supplier Foundry/ }).click();\n  const foundryAnatomy = await page.locator("#workspace").innerText();\n  check("Supplier Foundry refuses capability, policy, and scheduling authority",\n    foundryAnatomy.includes("define domain capability") &&\n    foundryAnatomy.includes("choose estate policy") &&\n    foundryAnatomy.includes("schedule the estate"));\n  await page.click('[data-view="evolution"]');\n  check("Supplier Foundry exposes a bounded admissible lane and a held expansion",\n    await page.locator(".candidate-strip .candidate").count() === 2 &&\n    (await page.locator(".candidate-strip").innerText()).includes("Admissible") &&\n    (await page.locator(".candidate-strip").innerText()).includes("Hold"));\n  await page.getByRole("button", { name: /Bloodstream/ }).click();\n\n  await page.click('[data-view="evolution"]');'''
          if browser.count(anchor) != 1:
              raise SystemExit('Supplier Foundry browser insertion anchor missing')
          browser_path.write_text(browser.replace(anchor, addition), encoding='utf-8', newline='\n')
          PY

      - name: Qualify and publish the organ model
        shell: bash
        run: |
          set -euo pipefail
          python organ-evolution/scripts/validate.py
          python organ-evolution/scripts/test_observe.py
          python organ-evolution/scripts/observe.py \
            --sources organ-evolution/data/fixtures/sources.fixture.json \
            --observed organ-evolution/data/fixtures/observed.fixture.json \
            --fixture organ-evolution/data/fixtures/github.fixture.json \
            --now 2026-07-28T00:00:00Z \
            --output "$RUNNER_TEMP/observations.json" \
            --js-output "$RUNNER_TEMP/observations.js"
          node --check tests/pages/verify_organ_evolution.mjs
          git diff --check
          git rm .github/workflows/converge-supplier-foundry-model.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add organ-evolution/data organ-evolution/scripts/test_observe.py tests/pages/verify_organ_evolution.mjs
          git diff --cached --check
          git commit -m 'Admit Supplier Foundry at the proven asset boundary'
          git push origin HEAD:agent/admit-supplier-foundry-organ
