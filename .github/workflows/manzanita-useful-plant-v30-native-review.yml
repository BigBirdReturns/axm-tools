name: Manzanita Useful Plant v30 repository-native review

on:
  pull_request:
    paths:
      - 'manzanita-next/review/useful-plant-v30-native/**'
      - '.github/workflows/manzanita-useful-plant-v30-native-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manzanita-useful-plant-v30-native-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-repository-native-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve bounded comparison
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            git fetch origin main --depth=1
            echo "base=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse native source and exact admission gates
        run: |
          set -euo pipefail
          node --check manzanita-next/review/useful-plant-v30-native/app.js
          python -m py_compile \
            manzanita-next/review/useful-plant-v30-native/verify.py \
            manzanita-next/review/useful-plant-v30-native/browser_review.py \
            manzanita-next/review/useful-plant-v30-native/verify_v29_parent.py \
            manzanita-next/review/useful-plant-v30-native/test_v29_parent_admission.py \
            manzanita-next/review/useful-plant-v30-native/verify_plant_donors.py \
            manzanita-next/review/useful-plant-v30-native/test_plant_donor_admission.py
          python -m json.tool \
            manzanita-next/review/useful-plant-v30-native/V29_PARENT_ADMISSION_CONTRACT.json \
            >/dev/null
          python -m json.tool \
            manzanita-next/review/useful-plant-v30-native/PLANT_DONOR_ADMISSION_CONTRACT.json \
            >/dev/null

      - name: Verify source, custody, and changed-path scope
        run: |
          python manzanita-next/review/useful-plant-v30-native/verify.py \
            --base '${{ steps.refs.outputs.base }}' \
            --head '${{ steps.refs.outputs.head }}' \
            --output "$RUNNER_TEMP/useful-plant-v30-source-receipt.json"

      - name: Prove exact v29 parent gate fails closed while unmounted
        run: |
          set -euo pipefail
          python manzanita-next/review/useful-plant-v30-native/verify_v29_parent.py \
            --archive "$RUNNER_TEMP/mw-habitat-live-photo-029.zip" \
            --expect-missing \
            --output "$RUNNER_TEMP/V29_PARENT_ADMISSION_RECEIPT.json"
          python manzanita-next/review/useful-plant-v30-native/test_v29_parent_admission.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "V29_PARENT_ADMISSION_RECEIPT.json").read_text()
          )
          assert receipt["result"] == "HOLD_PARENT_ARCHIVE_UNMOUNTED"
          assert receipt["admission_state"] == "HOLD"
          assert receipt["archive_admitted"] is False
          assert receipt["operator_visual_acceptance"] == "ABSENT"
          assert receipt["merge_authorized"] is False
          assert receipt["release_authorized"] is False
          assert receipt["public_route_effect"] == "none"
          assert receipt["pages_deployment_effect"] == "none"
          assert receipt["external_effect"] == "none"
          PY

      - name: Prove exact Plant donor gate fails closed while unmounted
        run: |
          set -euo pipefail
          python manzanita-next/review/useful-plant-v30-native/verify_plant_donors.py \
            --origin "$RUNNER_TEMP/plant-origin.svg" \
            --cached "$RUNNER_TEMP/plant-derived-reference.webp" \
            --expect-missing \
            --output "$RUNNER_TEMP/PLANT_DONOR_ADMISSION_RECEIPT.json"
          python manzanita-next/review/useful-plant-v30-native/test_plant_donor_admission.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "PLANT_DONOR_ADMISSION_RECEIPT.json").read_text()
          )
          assert receipt["result"] == "HOLD_EXACT_PLANT_DONORS_UNMOUNTED"
          assert receipt["admission_state"] == "HOLD"
          assert receipt["donors_admitted"] is False
          assert receipt["operator_visual_acceptance"] == "ABSENT"
          assert receipt["merge_authorized"] is False
          assert receipt["release_authorized"] is False
          assert receipt["public_route_effect"] == "none"
          assert receipt["pages_deployment_effect"] == "none"
          assert receipt["external_effect"] == "none"
          PY

      - name: Recover and verify historical independent-archive source
        shell: bash
        run: |
          set -euo pipefail
          HISTORICAL_COMMIT="8eda7e87fb8f6789f4392a328c7ab3435f122bdf"
          HISTORICAL_TREE="f695d10fd0651a99d33c52cc0ee9fd17307f1e90"
          TARGET="$RUNNER_TEMP/manzanita-independent-archive-history"
          TRANSPORT="$TARGET/transport"
          EXTRACTED="$TARGET/extracted"
          mkdir -p "$TRANSPORT" "$EXTRACTED"

          git fetch --no-tags --depth=1 origin "$HISTORICAL_COMMIT"
          test "$(git show -s --format=%T "$HISTORICAL_COMMIT")" = "$HISTORICAL_TREE"

          : > "$TRANSPORT/manzanita-independent-archive-source.b64"
          for part in 01 02 03 04 05 06 07 08 09; do
            path=".github/bootstrap/manzanita-independent-archive-source-part-${part}.b64"
            git cat-file -e "${HISTORICAL_COMMIT}:${path}"
            git show "${HISTORICAL_COMMIT}:${path}" \
              > "$TRANSPORT/manzanita-independent-archive-source-part-${part}.b64"
            cat "$TRANSPORT/manzanita-independent-archive-source-part-${part}.b64" \
              >> "$TRANSPORT/manzanita-independent-archive-source.b64"
          done

          base64 --decode "$TRANSPORT/manzanita-independent-archive-source.b64" \
            > "$TRANSPORT/manzanita-independent-archive-source.tar.gz"
          echo "a1c4c12053066c1c579111c9bea16a6acd50e4a0c6cf21120afc944d46e43b46  $TRANSPORT/manzanita-independent-archive-source.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$TRANSPORT/manzanita-independent-archive-source.tar.gz" \
            -C "$EXTRACTED"

          TARGET="$TARGET" HISTORICAL_COMMIT="$HISTORICAL_COMMIT" HISTORICAL_TREE="$HISTORICAL_TREE" python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          target = Path(os.environ["TARGET"])
          transport = target / "transport"
          extracted = target / "extracted"
          commit = os.environ["HISTORICAL_COMMIT"]
          tree = os.environ["HISTORICAL_TREE"]

          def digest(path: Path) -> dict:
              payload = path.read_bytes()
              return {
                  "path": path.relative_to(target).as_posix(),
                  "bytes": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest(),
              }

          parts = []
          for part in range(1, 10):
              path = transport / f"manzanita-independent-archive-source-part-{part:02d}.b64"
              repo_path = f".github/bootstrap/{path.name}"
              blob = subprocess.run(
                  ["git", "rev-parse", f"{commit}:{repo_path}"],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.strip()
              entry = digest(path)
              entry["historical_path"] = repo_path
              entry["git_blob_sha1"] = blob
              parts.append(entry)

          members = [digest(path) for path in sorted(extracted.rglob("*")) if path.is_file()]
          expected_members = {
              ".github/workflows/manzanita-independent-archive.yml",
              ".github/workflows/manzanita-release-control.yml",
              "manzanita-next/release-control/README.md",
              "manzanita-next/release-control/RELEASE_CONTRACT.json",
              "manzanita-next/release-control/EXTERNAL_CAMPAIGN_LEDGER.json",
              "manzanita-next/release-control/tests/test_release_control.py",
              "manzanita-next/release-control/review/M99-RB-PKT-012.json",
              "manzanita-next/release-control/review/M99-RB-DEC-012.json",
              "manzanita-next/release-control/archive-campaign/README.md",
              "manzanita-next/release-control/archive-campaign/M99-PHYS-ARCHIVE-001-RECEIPT.json",
              "manzanita-next/release-control/archive-campaign/verify_archive_campaign.py",
              "manzanita-next/release-control/archive-campaign/tests/test_archive_campaign.py",
          }
          observed_members = {
              path.relative_to(extracted).as_posix()
              for path in extracted.rglob("*")
              if path.is_file()
          }
          if observed_members != expected_members:
              raise SystemExit(
                  f"historical source member mismatch: missing={sorted(expected_members - observed_members)} "
                  f"extra={sorted(observed_members - expected_members)}"
              )

          receipt_path = extracted / "manzanita-next/release-control/archive-campaign/M99-PHYS-ARCHIVE-001-RECEIPT.json"
          campaign_receipt = json.loads(receipt_path.read_text())
          workflow_text = (
              extracted / ".github/workflows/manzanita-independent-archive.yml"
          ).read_text()
          discovery_terms = [
              line.strip()
              for line in workflow_text.splitlines()
              if any(term in line.casefold() for term in ("drive", "selector", "folder", "archive", "file_id", "provider"))
          ]

          result = {
              "schema": "manzanita/useful-plant-v30-historical-archive-source-recovery@1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "result": "PASS_HISTORICAL_ARCHIVE_SOURCE_RECOVERED",
              "source_commit": commit,
              "source_tree": tree,
              "transport_parts": parts,
              "combined_base64": digest(transport / "manzanita-independent-archive-source.b64"),
              "source_archive": digest(transport / "manzanita-independent-archive-source.tar.gz"),
              "source_archive_expected_sha256": "a1c4c12053066c1c579111c9bea16a6acd50e4a0c6cf21120afc944d46e43b46",
              "member_count": len(members),
              "members": members,
              "campaign_receipt": campaign_receipt,
              "workflow_discovery_lines": discovery_terms,
              "operator_visual_acceptance": "ABSENT",
              "merge_authorized": False,
              "release_authorized": False,
              "public_route_effect": "none",
              "pages_deployment_effect": "none",
              "external_effect": "none",
          }
          (target / "HISTORICAL_ARCHIVE_SOURCE_RECOVERY_RECEIPT.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "result": result["result"],
              "source_commit": commit,
              "member_count": len(members),
              "campaign_id": campaign_receipt.get("campaign_id") or campaign_receipt.get("id"),
          }, indent=2))
          PY

      - name: Install bounded browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Exercise operator review surface
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python manzanita-next/review/useful-plant-v30-native/browser_review.py \
            --output "$RUNNER_TEMP/useful-plant-v30-browser-review"

      - name: Enforce fail-closed authority receipts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads((Path(os.environ['RUNNER_TEMP']) / 'useful-plant-v30-source-receipt.json').read_text())
          browser = json.loads((Path(os.environ['RUNNER_TEMP']) / 'useful-plant-v30-browser-review/BROWSER_REVIEW_RECEIPT.json').read_text())
          historical = json.loads((Path(os.environ['RUNNER_TEMP']) / 'manzanita-independent-archive-history/HISTORICAL_ARCHIVE_SOURCE_RECOVERY_RECEIPT.json').read_text())
          for label, receipt in [('source', source), ('browser', browser)]:
              assert receipt['result'] == 'PASS', (label, receipt['result'])
              assert receipt['operator_visual_acceptance'] == 'ABSENT', label
              assert receipt['release_authorized'] is False, label
              assert receipt['merge_authorized'] is False, label
              assert receipt['public_route_effect'] == 'none', label
              assert receipt['pages_deployment_effect'] == 'none', label
              assert receipt['external_effect'] == 'none', label
          assert historical['result'] == 'PASS_HISTORICAL_ARCHIVE_SOURCE_RECOVERED'
          assert historical['source_archive']['sha256'] == historical['source_archive_expected_sha256']
          assert historical['operator_visual_acceptance'] == 'ABSENT'
          assert historical['release_authorized'] is False
          assert historical['merge_authorized'] is False
          assert historical['public_route_effect'] == 'none'
          assert historical['pages_deployment_effect'] == 'none'
          assert historical['external_effect'] == 'none'
          PY

      - name: Retain independent review evidence
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-useful-plant-v30-native-review
          path: |
            manzanita-next/review/useful-plant-v30-native/
            manzanita/assets/plant.webp
            ${{ runner.temp }}/useful-plant-v30-source-receipt.json
            ${{ runner.temp }}/V29_PARENT_ADMISSION_RECEIPT.json
            ${{ runner.temp }}/PLANT_DONOR_ADMISSION_RECEIPT.json
            ${{ runner.temp }}/useful-plant-v30-browser-review/
          retention-days: 30
          if-no-files-found: error

      - name: Retain recovered historical archive source
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-useful-plant-v30-historical-archive-source
          path: ${{ runner.temp }}/manzanita-independent-archive-history/
          retention-days: 30
          if-no-files-found: error
