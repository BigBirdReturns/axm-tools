name: Install Essential Attention onboarding candidate

on:
  push:
    branches:
      - agent/essential-attention-onboarding
    paths:
      - .github/workflows/essential-attention-onboarding-install.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore reviewed onboarding candidate
        shell: bash
        run: |
          cat .github/ea-onboarding-payload/part* > /tmp/ea-onboarding.b64
          base64 -d /tmp/ea-onboarding.b64 > /tmp/ea-onboarding.tar.gz
          echo "d45aa1aa21a585db952f92891c2e871f3815ce3421dda911b4b7a4254f8769f9  /tmp/ea-onboarding.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ea-onboarding.tar.gz -C .
          rm -rf .github/ea-onboarding-payload
          rm -f .github/workflows/essential-attention-onboarding-install.yml

      - name: Verify the one-file contract
        run: |
          python essential-attention/tests/public_contract_test.py
          node --check /tmp/essential-attention-inline.js

      - name: Commit the candidate to the branch
        run: |
          git config user.name "essential-attention-onboarding-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- essential-attention README.md index.html .github/workflows/essential-attention-check.yml .github/ea-onboarding-payload .github/workflows/essential-attention-onboarding-install.yml
          git diff --cached --check
          git commit -m "essential-attention: add guided first-use floor"
          git push origin HEAD:agent/essential-attention-onboarding
