name: clinical-site-fabric-bootstrap

on:
  push:
    branches:
      - feature/clinical-site-fabric-n0
    paths:
      - ".github/import-csf/bootstrap.ready"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clinical-site-fabric-n0
      - name: Reconstruct reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import-csf/part-* > /tmp/clinical-site-fabric.tar.gz.b64
          base64 --decode /tmp/clinical-site-fabric.tar.gz.b64 > /tmp/clinical-site-fabric.tar.gz
          echo "3a72880f87fb35fad56bbc57abc9293b3637b2a5a5e866ff01a7fddfe468b1a1  /tmp/clinical-site-fabric.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/clinical-site-fabric.tar.gz -C .
          rm -rf .github/import-csf
          rm .github/workflows/csf-bootstrap.yml
      - name: Validate reconstructed tool
        shell: bash
        run: |
          set -euo pipefail
          node --check clinical-site-fabric/app-core.js
          node --check clinical-site-fabric/app-ui.js
          python clinical-site-fabric/tests/validate.py
          git diff --check
      - name: Commit reconstructed tool
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "clinical-site-fabric-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "clinical-site-fabric: add local multi-protocol workbench"
          git push origin HEAD:feature/clinical-site-fabric-n0
