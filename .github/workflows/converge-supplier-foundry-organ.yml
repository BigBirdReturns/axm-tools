      - name: Qualify the scoped organ before publication
        shell: bash
        run: |
          set -euo pipefail
          python organ-evolution/scripts/validate.py
          python organ-evolution/scripts/test_observe.py
          python organ-evolution/scripts/observe.py \
            --sources organ-evolution/data/fixtures/sources.fixture.json \
            --observed organ-evolution/data/fixtures/observed.fixture.json \
            --fixture organ-evolution/data/fixtures/github.fixture.json \
            --now 2026-07-28T00:00:00Z \
            --output "$RUNNER_TEMP/observations.json" \
            --js-output "$RUNNER_TEMP/observations.js"
          node --check organ-evolution/observations-view.js
          node --check tests/pages/verify_organ_evolution.mjs
          node --check tests/pages/verify_organ_observations.mjs
          git diff --check

      - name: Publish one carrier-free implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/converge-supplier-foundry-organ.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add organ-evolution tests/pages/verify_organ_evolution.mjs
          git diff --cached --check
          git commit -m 'Admit Supplier Foundry as a scoped estate organ'
          git push origin HEAD:agent/admit-supplier-foundry-organ
