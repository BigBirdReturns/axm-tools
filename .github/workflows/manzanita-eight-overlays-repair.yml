name: Repair and seal Manzanita eight-overlay instruments

on:
  push:
    branches:
      - agent/manzanita-overlays-015
    paths:
      - ".github/workflows/manzanita-eight-overlays-repair.yml"
      - ".github/scripts/manzanita-eight-overlays-repair.py"

permissions:
  contents: write

concurrency:
  group: manzanita-eight-overlays-repair
  cancel-in-progress: false

jobs:
  repair-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-overlays-015
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact overlay dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply bounded geometry-identity correction
        run: python .github/scripts/manzanita-eight-overlays-repair.py

      - name: Prove the corrected overlay builder before sealing
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            manzanita-next/overlays/build_overlays.py \
            manzanita-next/overlays/tests/test_overlays.py
          python -m unittest discover \
            -s manzanita-next/overlays/tests \
            -p "test_overlays.py"

      - name: Seal and publish the corrected branch
        run: |
          rm -f \
            .github/workflows/manzanita-eight-overlays-repair.yml \
            .github/scripts/manzanita-eight-overlays-repair.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "manzanita-eight-overlays-repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/manzanita-eight-overlays-repair.yml \
            .github/scripts/manzanita-eight-overlays-repair.py \
            manzanita-next/overlays/build_overlays.py
          git commit -m "Manzanita: seal corrected overlay geometry identity law"
          git push origin HEAD:agent/manzanita-overlays-015
