name: Repair and seal Manzanita Street Glide kernel

on:
  push:
    branches:
      - agent/manzanita-street-glide-014
    paths:
      - ".github/workflows/manzanita-street-glide-repair.yml"
      - ".github/scripts/manzanita-street-glide-repair.py"

permissions:
  contents: write

concurrency:
  group: manzanita-street-glide-repair
  cancel-in-progress: false

jobs:
  repair-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-street-glide-014
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact kernel dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply bounded resolver and receipt corrections
        run: python .github/scripts/manzanita-street-glide-repair.py

      - name: Prove the corrected kernel before sealing
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            manzanita-next/street-glide/resolve_scene.py \
            manzanita-next/street-glide/register_natural_border.py \
            manzanita-next/street-glide/tests/test_street_glide.py
          python -m unittest discover \
            -s manzanita-next/street-glide/tests \
            -p "test_street_glide.py"

      - name: Seal and publish the corrected branch
        run: |
          rm -f \
            .github/workflows/manzanita-street-glide-repair.yml \
            .github/scripts/manzanita-street-glide-repair.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "manzanita-street-glide-repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/manzanita-street-glide-repair.yml \
            .github/scripts/manzanita-street-glide-repair.py \
            manzanita-next/street-glide/resolve_scene.py \
            manzanita-next/street-glide/register_natural_border.py
          git commit -m "Manzanita: seal corrected Street Glide kernel"
          git push origin HEAD:agent/manzanita-street-glide-014
