name: Repair Essential Attention Mila wording gate

on:
  push:
    branches:
      - review/essential-attention-mila-return-v1-2-1
    paths:
      - '.github/workflows/essential-attention-mila-test-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind the test to the published receiver wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('essential-attention/tests/browser_test.py')
          text = path.read_text(encoding='utf-8')
          old = 'check("Mila projection keeps silence unresolved", "silence remains unresolved" in mila_page.locator("#milaCommunicationState").inner_text().lower())'
          new = 'check("Mila projection keeps silence unresolved", "silence stays unresolved" in mila_page.locator("#milaCommunicationState").inner_text().lower())'
          if text.count(old) != 1:
              raise SystemExit(f'expected one wording gate, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify syntax and static contract
        run: |
          python -m py_compile essential-attention/tests/browser_test.py
          python essential-attention/tests/public_contract_test.py
          node --check /tmp/essential-attention-inline.js

      - name: Remove one-shot controller
        run: rm '.github/workflows/essential-attention-mila-test-fix.yml'

      - name: Commit the exact wording gate repair
        run: |
          git config user.name 'essential-attention-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'essential-attention: align Mila silence gate with receiver copy'
          git push origin HEAD
