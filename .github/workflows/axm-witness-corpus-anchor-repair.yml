name: Repair AXM Witness corpus object anchor

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/axm-witness-corpus-anchor-repair.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Accept the frozen public-corpus object and add a human trigger path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/axm-witness-corpus-release-repair.yml')
          text = path.read_text(encoding='utf-8')
          old = r'const PUBLIC_CORPUS_LEDGER\s*=\s*\{'
          new = r'const PUBLIC_CORPUS_LEDGER\s*=\s*(?:Object\.freeze\(\s*)?\{'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected three corpus object anchors, found {count}')
          text = text.replace(old, new)
          trigger_anchor = '      - ".github/workflows/axm-witness-corpus-release-repair.yml"\n'
          trigger_line = '      - ".github/axm-witness-corpus-repair.trigger"\n'
          if trigger_line not in text:
              if text.count(trigger_anchor) != 1:
                  raise SystemExit('repair workflow trigger anchor missing')
              text = text.replace(trigger_anchor, trigger_anchor + trigger_line, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/axm-witness-corpus-anchor-repair.yml

      - name: Commit the corrected repair lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'axm-witness-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'axm-witness: accept frozen public corpus ledger object'
          git push origin HEAD:${{ github.head_ref }}
