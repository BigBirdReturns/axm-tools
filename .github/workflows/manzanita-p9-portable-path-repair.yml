name: Repair Manzanita P9 portable input paths

on:
  push:
    branches:
      - agent/manzanita-estate-parity-021
    paths:
      - ".github/workflows/manzanita-p9-portable-path-repair.yml"
      - ".github/scripts/manzanita-p9-portable-path-repair.py"

permissions:
  contents: write

concurrency:
  group: manzanita-p9-portable-path-repair
  cancel-in-progress: false

jobs:
  repair-and-publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-estate-parity-021
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact schema dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Apply the bounded portable-path correction
        run: python .github/scripts/manzanita-p9-portable-path-repair.py

      - name: Prove relative and absolute path operation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            manzanita-next/parity/build_parity.py \
            manzanita-next/parity/tests/test_parity.py
          python -m unittest discover \
            -s manzanita-next/parity/tests \
            -p "test_parity.py"
          python - <<'PY'
          from pathlib import Path

          source = Path("manzanita-next/parity/build_parity.py").read_text(encoding="utf-8")
          for token in (
              'source_path = (paths["inventory"].parent / str(relative)).resolve()',
              '"source_inventory": paths["inventory"].relative_to(repo_root).as_posix()',
              '"source_inventory_sha256": sha256_file(paths["inventory"])',
              '"surface_schema": paths["surface_schema"].relative_to(repo_root).as_posix()',
              '"surface_schema_sha256": sha256_file(paths["surface_schema"])',
          ):
              assert token in source, token
          PY

      - name: Publish only the corrected P9 source
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -rf \
            manzanita-next/parity/out \
            manzanita-next/parity/out-relative
          git config user.name "manzanita-p9-portable-path-repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            manzanita-next/parity/build_parity.py \
            manzanita-next/parity/tests/test_parity.py
          git commit -m "Manzanita: normalize P9 inputs against the repository root"
          git push origin HEAD:agent/manzanita-estate-parity-021
