name: Repair Manzanita P8 hostile-text visible operation

on:
  push:
    branches:
      - agent/manzanita-resilience-qualification-019
    paths:
      - ".github/workflows/manzanita-p8-hostile-text-repair.yml"
      - ".github/scripts/manzanita-p8-hostile-text-repair.py"

permissions:
  contents: write

concurrency:
  group: manzanita-p8-hostile-text-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-resilience-qualification-019
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact source-test dependencies
        run: python -m pip install --disable-pip-version-check playwright pyyaml

      - name: Apply bounded hostile-text interaction repair
        run: python .github/scripts/manzanita-p8-hostile-text-repair.py

      - name: Prove the repaired source campaign
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            manzanita-next/qualification/run_qualification.py \
            manzanita-next/qualification/replay_p7_workflow.py \
            manzanita-next/qualification/tests/test_qualification.py
          python -m unittest discover \
            -s manzanita-next/qualification/tests \
            -p "test_qualification.py"
          grep -q 'Hostile source text did not survive as literal text' manzanita-next/qualification/run_qualification.py
          grep -q 'Hostile aperture reading did not survive as literal text' manzanita-next/qualification/run_qualification.py
          grep -q 'role_button.wait_for(state="visible")' manzanita-next/qualification/run_qualification.py

      - name: Seal and publish the corrected P8 candidate
        run: |
          rm -f .github/workflows/manzanita-p8-hostile-text-repair.yml
          rm -f .github/scripts/manzanita-p8-hostile-text-repair.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "manzanita-p8-hostile-text-repair"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/manzanita-p8-hostile-text-repair.yml
          git add .github/scripts/manzanita-p8-hostile-text-repair.py
          git add manzanita-next/qualification/run_qualification.py
          git commit -m "Manzanita: operate hostile text through visible controls"
          git push origin HEAD:agent/manzanita-resilience-qualification-019
