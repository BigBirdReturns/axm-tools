name: Manzanita exact P10 recovery

on:
  push:
    branches: [agent/manzanita-public-convergence-v1-6]
    paths:
      - ".github/workflows/manzanita-p10-recovery.yml"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write

concurrency:
  group: manzanita-p10-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_HEAD: ed387ac8d27576484c71a13a7d0c8c8194f9b2ed
      EXPECTED_CANDIDATE_SHA256: 73a222505b40ffd74c3c2464a0a313b0fc5c4ff7df9f9b6e996cba8be036e90b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-public-convergence-v1-6
          fetch-depth: 0
      - name: Locate and download all release-head artifacts
        run: |
          set -euo pipefail
          rm -rf /tmp/p10-runs /tmp/p10-downloads /tmp/p10-expanded
          mkdir -p /tmp/p10-runs /tmp/p10-downloads /tmp/p10-expanded
          gh api "repos/${GH_REPO}/actions/runs?head_sha=${RELEASE_HEAD}&per_page=100" > /tmp/p10-runs/runs.json
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ['GH_REPO']
          runs = json.loads(Path('/tmp/p10-runs/runs.json').read_text(encoding='utf-8')).get('workflow_runs', [])
          if not runs:
              raise SystemExit('No workflow runs found for exact P10 release head')
          rows = []
          for run in runs:
              run_id = run['id']
              payload = subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'], text=True)
              for artifact in json.loads(payload).get('artifacts', []):
                  if artifact.get('expired'):
                      continue
                  rows.append({
                      'run_id': run_id,
                      'run_name': run.get('name'),
                      'run_conclusion': run.get('conclusion'),
                      'artifact_id': artifact['id'],
                      'artifact_name': artifact['name'],
                      'artifact_size': artifact.get('size_in_bytes'),
                  })
          Path('/tmp/p10-runs/artifacts.json').write_text(json.dumps(rows, indent=2) + '\n', encoding='utf-8')
          if not rows:
              raise SystemExit('No retained artifacts found for exact P10 release head')
          PY
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ['GH_REPO']
          rows = json.loads(Path('/tmp/p10-runs/artifacts.json').read_text(encoding='utf-8'))
          for row in rows:
              target = Path('/tmp/p10-downloads') / f"{row['run_id']}-{row['artifact_id']}-{row['artifact_name']}.zip"
              with target.open('wb') as handle:
                  subprocess.run(['gh', 'api', f"repos/{repo}/actions/artifacts/{row['artifact_id']}/zip"], check=True, stdout=handle)
          PY
      - name: Recover the exact candidate by SHA-256
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          expected = os.environ['EXPECTED_CANDIDATE_SHA256']
          downloads = Path('/tmp/p10-downloads')
          expanded = Path('/tmp/p10-expanded')
          matches = []
          for artifact in sorted(downloads.glob('*.zip')):
              out = expanded / artifact.stem
              out.mkdir(parents=True, exist_ok=True)
              try:
                  with zipfile.ZipFile(artifact) as zf:
                      zf.extractall(out)
              except zipfile.BadZipFile:
                  continue
              for path in out.rglob('*'):
                  if not path.is_file():
                      continue
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  if digest == expected:
                      matches.append(path)
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one P10 candidate match, found {len(matches)}: {matches}')
          candidate = matches[0]
          shutil.copy2(candidate, '/tmp/Manzanita_P10_Candidate.zip')
          receipt = {
              'schema': 'manzanita-works/p10-recovery@1',
              'release_head': os.environ['RELEASE_HEAD'],
              'candidate_sha256': expected,
              'recovered_from': str(candidate.relative_to(expanded)),
              'artifact_inventory': json.loads(Path('/tmp/p10-runs/artifacts.json').read_text(encoding='utf-8')),
          }
          Path('/tmp/P10_RECOVERY.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Extract and identify the exact whole-experience site
        run: |
          set -euo pipefail
          rm -rf /tmp/p10-candidate manzanita-convergence-p10
          mkdir -p /tmp/p10-candidate manzanita-convergence-p10
          unzip -q /tmp/Manzanita_P10_Candidate.zip -d /tmp/p10-candidate
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path('/tmp/p10-candidate')
          candidates = []
          for index in root.rglob('index.html'):
              text = index.read_text(encoding='utf-8', errors='replace')
              score = 0
              for token in ('Manzanita', 'aperture', 'overlay', 'role', 'Essential Attention'):
                  if token.lower() in text.lower():
                      score += 1
              candidates.append((score, len(text), index))
          if not candidates:
              raise SystemExit('Recovered P10 archive contains no HTML entrypoint')
          candidates.sort(reverse=True)
          score, _, index = candidates[0]
          if score < 3:
              raise SystemExit(f'Could not identify whole-experience site: best={index} score={score}')
          source = index.parent
          target = Path('manzanita-convergence-p10')
          shutil.copytree(source, target, dirs_exist_ok=True)
          recovery = json.loads(Path('/tmp/P10_RECOVERY.json').read_text(encoding='utf-8'))
          recovery['selected_site'] = str(source.relative_to(root))
          recovery['selected_entrypoint'] = str(index.relative_to(root))
          recovery['state'] = 'INTERNAL_DONOR_ONLY'
          recovery['public_release_authorized'] = False
          recovery['canonical_task_count_effect'] = 'none'
          (target / 'P10_RECOVERY.json').write_text(json.dumps(recovery, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify the recovered site is self-contained and substantive
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          root = Path('manzanita-convergence-p10')
          html = (root / 'index.html').read_text(encoding='utf-8', errors='replace')
          corpus = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.js','.css','.json'})
          for token in ('Manzanita', 'Essential Attention'):
              assert token.lower() in corpus.lower(), token
          assert len(re.findall(r'aperture', corpus, re.I)) >= 7
          assert len(re.findall(r'overlay', corpus, re.I)) >= 8
          assert len(re.findall(r'role|resident|planner|steward|successor', corpus, re.I)) >= 5
          assert 'http://' not in html
          print('Exact P10 whole-experience donor: PASS')
          PY
      - name: Commit the exact internal donor preview
        run: |
          set -euo pipefail
          git config user.name "manzanita-convergence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manzanita-convergence-p10
          if git diff --cached --quiet; then
            echo "P10 donor already recovered."
          else
            git commit -m "Manzanita: recover exact P10 whole-experience donor"
            git push origin HEAD:agent/manzanita-public-convergence-v1-6
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: manzanita-exact-p10-recovery
          path: |
            /tmp/Manzanita_P10_Candidate.zip
            /tmp/P10_RECOVERY.json
          if-no-files-found: error
          retention-days: 14

  render:
    needs: recover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-public-convergence-v1-6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Render recovered whole-experience donor
        run: |
          python - <<'PY'
          import contextlib
          import subprocess
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path('/tmp/manzanita-p10-screens')
          out.mkdir(parents=True, exist_ok=True)
          server = subprocess.Popen(['python', '-m', 'http.server', '8765', '--bind', '127.0.0.1'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              time.sleep(1)
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  for name, width, height in [('desktop',1440,1000),('tablet',1024,900),('mobile',390,844)]:
                      page = browser.new_page(viewport={'width':width,'height':height})
                      response = page.goto('http://127.0.0.1:8765/manzanita-convergence-p10/', wait_until='networkidle', timeout=60000)
                      assert response and response.status == 200
                      overflow = page.evaluate('document.documentElement.scrollWidth - document.documentElement.clientWidth')
                      assert overflow <= 1, overflow
                      page.screenshot(path=str(out / f'{name}-full.png'), full_page=True)
                      page.close()
                  browser.close()
          finally:
              server.terminate()
              with contextlib.suppress(Exception):
                  server.wait(timeout=5)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: manzanita-exact-p10-screens
          path: /tmp/manzanita-p10-screens
          if-no-files-found: error
          retention-days: 14
