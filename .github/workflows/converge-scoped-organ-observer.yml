name: Converge scoped organ observer

on:
  push:
    branches:
      - agent/admit-supplier-foundry-organ
    paths:
      - '.github/workflows/converge-scoped-organ-observer.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/converge-scoped-organ-observer.yml'
      - 'organ-evolution/scripts/**'
      - 'organ-evolution/observations-view.js'

permissions:
  contents: write

concurrency:
  group: converge-scoped-organ-observer
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admit-supplier-foundry-organ
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind scope and workflow-selection law into the observer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              target.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          path = 'organ-evolution/scripts/observe.py'
          replace_once(
              path,
              'from workflow_roles import apply_workflow_roles, validate_workflow_policy, workflow_finding\n',
              'from observation_scope import (\n'
              '    mapping_identity,\n'
              '    required_workflow_gaps,\n'
              '    scoped_label,\n'
              '    scoped_tree_signals,\n'
              '    select_workflows,\n'
              '    validate_repository_scope,\n'
              ')\n'
              'from workflow_roles import apply_workflow_roles, validate_workflow_policy, workflow_finding\n',
          )
          replace_once(
              path,
              '''            full_name = repository["fullName"]\n            validate_workflow_policy(repository.get("workflowPolicy"))\n            if full_name in seen_repos:\n                raise ObservationError(f"repository mapped more than once: {full_name}")\n            seen_repos.add(full_name)''',
              '''            full_name = repository["fullName"]\n            validate_workflow_policy(repository.get("workflowPolicy"))\n            try:\n                scope_path, _workflow_scope = validate_repository_scope(repository)\n            except ValueError as exc:\n                raise ObservationError(str(exc)) from exc\n            identity = mapping_identity(full_name, scope_path)\n            if identity in seen_repos:\n                raise ObservationError(f"repository scope mapped more than once: {identity}")\n            seen_repos.add(identity)''',
          )
          start = '''def tree_signals(raw_tree: dict[str, Any]) -> dict[str, Any]:\n    rows = raw_tree.get("tree", []) if isinstance(raw_tree, dict) else []\n    paths = {str(row.get("path")) for row in rows if isinstance(row, dict) and row.get("type") == "blob"}\n    upper = {path.upper(): path for path in paths}\n    has_readme = any(path == "README" or path.startswith("README.") for path in upper)\n    has_license = any(path == "LICENSE" or path.startswith("LICENSE.") or path == "COPYING" for path in upper)\n    succession_names = {"CONTINUITY.MD", "AGENTS.MD", "CLAUDE.MD", "MAINTAINERS.MD", "CONTRIBUTING.MD"}\n    succession = sorted(path for path in paths if path.upper() in succession_names)\n    workflows = sorted(path for path in paths if path.startswith(".github/workflows/") and path.endswith((".yml", ".yaml")))\n    return {\n        "readme": has_readme,\n        "license": has_license,\n        "successionFiles": succession,\n        "workflowFiles": workflows,\n        "treeTruncated": bool(raw_tree.get("truncated")),\n    }'''
          replace_once(
              path,
              start,
              '''def tree_signals(\n    raw_tree: dict[str, Any],\n    scope_path: str | None = None,\n    workflow_policy: dict[str, Any] | None = None,\n) -> dict[str, Any]:\n    return scoped_tree_signals(raw_tree, scope_path, workflow_policy)''',
          )
          replace_once(
              path,
              '''def repository_findings(repository: dict[str, Any], rules: SourceRules, now: datetime) -> list[dict[str, Any]]:\n    findings: list[dict[str, Any]] = []\n\n    def add(code: str, severity: str, summary: str, refs: list[str] | None = None) -> None:\n        findings.append({"code": code, "severity": severity, "summary": summary, "sourceRefs": refs or []})\n\n    full_name = repository["fullName"]''',
              '''def repository_findings(repository: dict[str, Any], rules: SourceRules, now: datetime) -> list[dict[str, Any]]:\n    findings: list[dict[str, Any]] = []\n\n    def add(code: str, severity: str, summary: str, refs: list[str] | None = None) -> None:\n        findings.append({"code": code, "severity": severity, "summary": summary, "sourceRefs": refs or []})\n\n    full_name = scoped_label(repository["fullName"], repository.get("scopePath"))''',
          )
          replace_once(
              path,
              '        add("readme_absent", "attention", f"{full_name} has no root README in the observed tree.")',
              '        add("readme_absent", "attention", f"{full_name} has no README in the observed repository scope.")',
          )
          replace_once(
              path,
              '        add("license_absent", "attention", f"{full_name} exposes no repository license or root license file.")',
              '        add("license_absent", "attention", f"{full_name} exposes no repository or scoped license record.")',
          )
          replace_once(
              path,
              '        add("succession_record_absent", "attention", f"{full_name} has no root continuity, agent, maintainer, or contribution handoff file.")',
              '        add("succession_record_absent", "attention", f"{full_name} has no continuity, agent, maintainer, or contribution handoff file in the observed scope.")',
          )
          replace_once(
              path,
              '''        if finding:\n            findings.append(finding)\n    for pull in repository.get("openPullRequests", []):''',
              '''        if finding:\n            findings.append(finding)\n    findings.extend(\n        required_workflow_gaps(\n            repository.get("workflowPolicy"),\n            workflows,\n            repository["fullName"],\n            repository.get("scopePath"),\n        )\n    )\n    for pull in repository.get("openPullRequests", []):''',
          )
          replace_once(
              path,
              '''def collect_repository(\n    provider: Provider,\n    full_name: str,\n    requested_ref: str | None,\n    workflow_policy: dict[str, Any] | None,\n    rules: SourceRules,\n    now: datetime,\n) -> dict[str, Any]:''',
              '''def collect_repository(\n    provider: Provider,\n    full_name: str,\n    requested_ref: str | None,\n    scope_path: str | None,\n    workflow_scope: str,\n    workflow_policy: dict[str, Any] | None,\n    rules: SourceRules,\n    now: datetime,\n) -> dict[str, Any]:''',
          )
          replace_once(
              path,
              '    runs = apply_workflow_roles(latest_workflows(provider.runs(full_name, observed_ref)), workflow_policy)',
              '''    annotated_runs = apply_workflow_roles(\n        latest_workflows(provider.runs(full_name, observed_ref)), workflow_policy\n    )\n    runs, workflow_selection = select_workflows(\n        annotated_runs, workflow_policy, workflow_scope\n    )''',
          )
          replace_once(
              path,
              '    signals = tree_signals(provider.tree(full_name, tree_sha)) if tree_sha else {',
              '    signals = tree_signals(provider.tree(full_name, tree_sha), scope_path, workflow_policy) if tree_sha else {',
          )
          replace_once(
              path,
              '''        "workflowFiles": [],\n        "treeTruncated": True,\n    }''',
              '''        "workflowFiles": [],\n        "scopePath": scope_path,\n        "scopedFileCount": 0,\n        "declaredWorkflowNames": [],\n        "treeTruncated": True,\n    }''',
          )
          replace_once(
              path,
              '''        "fullName": full_name,\n        "url": repo.get("html_url") or f"https://github.com/{full_name}",''',
              '''        "fullName": full_name,\n        "scopePath": scope_path,\n        "workflowScope": workflow_scope,\n        "workflowSelection": workflow_selection,\n        "workflowPolicy": workflow_policy or {"declarations": []},\n        "url": repo.get("html_url") or f"https://github.com/{full_name}",''',
          )
          replace_once(
              path,
              '''            "repositoryApi": repo.get("url"),\n            "collectedRef": observed_ref,\n        },''',
              '''            "repositoryApi": repo.get("url"),\n            "collectedRef": observed_ref,\n            "scopePath": scope_path,\n            "workflowScope": workflow_scope,\n        },''',
          )
          replace_once(
              path,
              '''                observed = collect_repository(\n                    provider,\n                    repository["fullName"],\n                    repository.get("ref"),\n                    repository.get("workflowPolicy"),\n                    rules,\n                    now,\n                )''',
              '''                scope_path, workflow_scope = validate_repository_scope(repository)\n                observed = collect_repository(\n                    provider,\n                    repository["fullName"],\n                    repository.get("ref"),\n                    scope_path,\n                    workflow_scope,\n                    repository.get("workflowPolicy"),\n                    rules,\n                    now,\n                )''',
          )

          view = 'organ-evolution/observations-view.js'
          replace_once(
              view,
              '''<div><a href="${esc(repository.url || '#')}" target="_blank" rel="noreferrer"><b>${esc(repository.fullName)}</b></a><span>${esc(repository.observedRef || repository.defaultBranch || '')}</span></div>''',
              '''<div><a href="${esc(repository.url || '#')}" target="_blank" rel="noreferrer"><b>${esc(repository.fullName)}</b></a><span>${esc(repository.observedRef || repository.defaultBranch || '')}${repository.scopePath ? ` · ${esc(repository.scopePath)}` : ''}</span></div>''',
          )
          replace_once(
              view,
              '''      <span class="tag ${(signals.successionFiles || []).length ? 'green' : 'gold'}">succession ${(signals.successionFiles || []).length ? 'present' : 'open'}</span>\n    </div>''',
              '''      <span class="tag ${(signals.successionFiles || []).length ? 'green' : 'gold'}">succession ${(signals.successionFiles || []).length ? 'present' : 'open'}</span>\n      ${repository.workflowSelection ? `<span class="tag cyan">workflows ${esc(repository.workflowSelection.mode)} · ${repository.workflowSelection.includedCount}/${repository.workflowSelection.observedCount}</span>` : ''}\n    </div>''',
          )
          PY

      - name: Add scope regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('organ-evolution/scripts/test_observe.py')
          text = path.read_text(encoding='utf-8')
          anchor = '\n\nif __name__ == "__main__":\n    unittest.main()\n'
          additions = '''\n\n    def test_same_repository_can_supply_a_scoped_suborgan_without_hiding_omissions(self):\n        sources = json.loads(json.dumps(self.sources))\n        fixture = json.loads(json.dumps(self.fixture))\n        blood_repo = fixture["repositories"]["BigBirdReturns/axm-bloodstream"]\n        blood_repo["runs"]["workflow_runs"].append({\n            "id": 203, "workflow_id": 3, "name": "Sibling publication",\n            "event": "push", "status": "completed", "conclusion": "failure",\n            "head_sha": "2222222222222222222222222222222222222222",\n            "created_at": "2026-07-26T12:06:00Z",\n            "updated_at": "2026-07-26T12:11:00Z",\n            "html_url": "https://github.com/BigBirdReturns/axm-bloodstream/actions/runs/203",\n        })\n        blood_repo["tree"]["tree"].extend([\n            {"path": "supplier_foundry/README.md", "type": "blob"},\n            {"path": "supplier_foundry/CONTINUITY.md", "type": "blob"},\n        ])\n        sources["organs"].append({\n            "organId": "organ.supplier-foundry",\n            "repositories": [{\n                "fullName": "BigBirdReturns/axm-bloodstream",\n                "scopePath": "supplier_foundry",\n                "workflowScope": "declared_only",\n                "workflowPolicy": {"declarations": [{\n                    "matchName": "ci", "role": "permanent_gate",\n                    "lifecycle": "current", "required": True,\n                    "basis": "Scoped fixture gate.",\n                }]},\n            }],\n        })\n        result = observe.compile_observations(\n            sources, self.local, observe.FixtureProvider(fixture), self.now\n        )\n        foundry = next(row for row in result["organs"] if row["organId"] == "organ.supplier-foundry")\n        repository = foundry["repositories"][0]\n        self.assertEqual(repository["scopePath"], "supplier_foundry")\n        self.assertEqual(repository["workflowSelection"]["mode"], "declared_only")\n        self.assertEqual(repository["workflowSelection"]["observedCount"], 2)\n        self.assertEqual(repository["workflowSelection"]["includedCount"], 1)\n        self.assertEqual(repository["workflowSelection"]["omittedCount"], 1)\n        self.assertEqual([row["name"] for row in repository["workflows"]], ["ci"])\n        self.assertTrue(repository["signals"]["readme"])\n        self.assertEqual(repository["signals"]["successionFiles"], ["CONTINUITY.md"])\n\n    def test_duplicate_repository_scope_is_refused_but_parent_and_suborgan_are_distinct(self):\n        sources = json.loads(json.dumps(self.sources))\n        scoped = {\n            "organId": "organ.supplier-foundry",\n            "repositories": [{\n                "fullName": "BigBirdReturns/axm-bloodstream",\n                "scopePath": "supplier_foundry",\n                "workflowScope": "declared_only",\n                "workflowPolicy": {"declarations": [{\n                    "matchName": "ci", "role": "permanent_gate",\n                    "lifecycle": "current", "required": True,\n                    "basis": "Scoped fixture gate.",\n                }]},\n            }],\n        }\n        sources["organs"].append(scoped)\n        observe.validate_sources(sources)\n        duplicate = json.loads(json.dumps(scoped))\n        duplicate["organId"] = "organ.supplier-foundry-copy"\n        sources["organs"].append(duplicate)\n        with self.assertRaises(observe.ObservationError):\n            observe.validate_sources(sources)\n\n    def test_required_scoped_workflow_absence_fails_visible(self):\n        sources = json.loads(json.dumps(self.sources))\n        sources["organs"].append({\n            "organId": "organ.supplier-foundry",\n            "repositories": [{\n                "fullName": "BigBirdReturns/axm-bloodstream",\n                "scopePath": "supplier_foundry",\n                "workflowScope": "declared_only",\n                "workflowPolicy": {"declarations": [{\n                    "matchName": "Supplier Foundry asset pilot",\n                    "role": "permanent_gate", "lifecycle": "current",\n                    "required": True, "basis": "Required scoped gate.",\n                }]},\n            }],\n        })\n        result = observe.compile_observations(\n            sources, self.local, observe.FixtureProvider(self.fixture), self.now\n        )\n        foundry = next(row for row in result["organs"] if row["organId"] == "organ.supplier-foundry")\n        finding = next(row for row in foundry["findings"] if row["code"] == "workflow_required_unobserved")\n        self.assertEqual(finding["severity"], "critical")\n'''
          if text.count(anchor) != 1:
              raise SystemExit('unit-test insertion anchor missing')
          path.write_text(text.replace(anchor, additions + anchor), encoding='utf-8', newline='\n')
          PY

      - name: Qualify and publish the observer law
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            organ-evolution/scripts/observation_scope.py \
            organ-evolution/scripts/workflow_roles.py \
            organ-evolution/scripts/observe.py \
            organ-evolution/scripts/test_observe.py
          python organ-evolution/scripts/test_observe.py
          python organ-evolution/scripts/observe.py \
            --sources organ-evolution/data/fixtures/sources.fixture.json \
            --observed organ-evolution/data/fixtures/observed.fixture.json \
            --fixture organ-evolution/data/fixtures/github.fixture.json \
            --now 2026-07-28T00:00:00Z \
            --output "$RUNNER_TEMP/observations.json" \
            --js-output "$RUNNER_TEMP/observations.js"
          node --check organ-evolution/observations-view.js
          git diff --check
          git rm .github/workflows/converge-scoped-organ-observer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add organ-evolution/scripts organ-evolution/observations-view.js
          git diff --cached --check
          git commit -m 'Support scoped repository organs without hiding workflow gaps'
          git push origin HEAD:agent/admit-supplier-foundry-organ
