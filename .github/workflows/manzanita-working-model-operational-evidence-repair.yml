name: Repair Manzanita working-model evidence visuals

on:
  push:
    branches:
      - fix/manzanita-working-model-operational-evidence-v1
    paths:
      - '.github/workflows/manzanita-working-model-operational-evidence-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replace archival-photo rhetoric with operational instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('manzanita-working-model')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, observed {count}')
              return text.replace(old, new, 1)

          index_path = ROOT / 'index.html'
          html = index_path.read_text(encoding='utf-8')

          old_hero = '''      <div class="hero-visual" aria-label="Public demonstration place">
                <img src="assets/property.webp" alt="Public-safe demonstration property from the Manzanita Place Fabric">
                <div class="visual-label top-left"><span>Place</span> Public-safe demonstration</div>
                <div class="visual-label bottom-left"><span>Evidence</span> Source state stays visible</div>
                <div class="visual-label bottom-right"><span>Effect</span> Held until authority exists</div>
              </div>'''
          new_hero = '''      <div class="hero-visual hero-console" aria-label="Bounded working-case trace. No field activity is claimed.">
                <div class="console-header">
                  <div>
                    <span class="console-kicker">Working case · N=0</span>
                    <strong>MW-CASE-000</strong>
                  </div>
                  <span class="console-status"><i aria-hidden="true"></i>Preparation only</span>
                </div>

                <div class="console-question">
                  <span>Concrete need</span>
                  <h2>Reduce wildfire exposure without creating a risk score.</h2>
                </div>

                <ol class="console-grammar" aria-label="Current case trace">
                  <li class="is-complete"><b>01</b><span>Signal</span></li>
                  <li class="is-complete"><b>02</b><span>Source</span></li>
                  <li class="is-current"><b>03</b><span>Authority</span></li>
                  <li><b>04</b><span>Safe action</span></li>
                  <li><b>05</b><span>Fallback</span></li>
                  <li><b>06</b><span>Closure</span></li>
                  <li><b>07</b><span>Learning</span></li>
                </ol>

                <div class="console-ledger">
                  <div><span>Source</span><strong>Resident + public context</strong><em>Bounded</em></div>
                  <div><span>Authority</span><strong>Accountable owner unresolved</strong><em class="console-hold">Hold</em></div>
                  <div><span>Output</span><strong>Verification path + assistance packet</strong><em>Prepared</em></div>
                  <div><span>External effect</span><strong>None</strong><em class="console-lock">Locked</em></div>
                </div>

                <div class="console-footer">
                  <span>Unresolved</span>
                  <code>sponsor · operator · venue · resources · stop condition</code>
                </div>
              </div>'''
          html = replace_once(html, old_hero, new_hero, 'hero visual')

          old_place = '''        <a class="proof-card photo-card" href="../manzanita/">
                  <div class="proof-image"><img src="assets/household.webp" alt="Household aperture from the public Manzanita Place Fabric"></div>
                  <div class="proof-copy">
                    <p class="proof-state">Public · released projection</p>
                    <h3>Place Fabric</h3>
                    <p>Seven scales over one demonstration place, eight conditions, five operating seats, source states, safe actions, acceptance, and handoff.</p>
                    <span>Open the place →</span>
                  </div>
                </a>'''
          new_place = '''        <a class="proof-card instrument-card" href="../manzanita/">
                  <div class="proof-instrument place-instrument" aria-hidden="true">
                    <div class="instrument-top"><span>Place Fabric</span><b>07 scales</b></div>
                    <ol class="place-stack">
                      <li><span>01</span><strong>Household</strong><i>Lived</i></li>
                      <li><span>02</span><strong>Property</strong><i>Reference</i></li>
                      <li><span>03</span><strong>Street</strong><i>Map</i></li>
                      <li><span>04</span><strong>Neighborhood</strong><i>Cached</i></li>
                      <li><span>05</span><strong>City</strong><i>Public</i></li>
                      <li><span>06</span><strong>Region</strong><i>Public</i></li>
                      <li><span>07</span><strong>Hazard</strong><i>Held</i></li>
                    </ol>
                    <div class="instrument-foot"><span>No score</span><span>No adverse use</span></div>
                  </div>
                  <div class="proof-copy">
                    <p class="proof-state">Public · released projection</p>
                    <h3>Place Fabric</h3>
                    <p>Seven scales over one demonstration place, eight conditions, five operating seats, source states, safe actions, acceptance, and handoff.</p>
                    <span>Open the place →</span>
                  </div>
                </a>'''
          html = replace_once(html, old_place, new_place, 'Place Fabric proof card')
          index_path.write_text(html, encoding='utf-8')

          css_path = ROOT / 'style.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Operational evidence visual system. */'
          if marker in css:
              raise SystemExit('operational evidence CSS already present')
          css += r'''

          /* Operational evidence visual system. */
          .hero-console {
            min-height: 590px;
            display: flex;
            flex-direction: column;
            gap: clamp(22px, 3vw, 38px);
            padding: clamp(24px, 3.2vw, 46px);
            color: var(--bone);
            border: 1px solid rgba(236, 231, 216, .2);
            background:
              linear-gradient(145deg, rgba(112, 117, 77, .18), transparent 46%),
              repeating-linear-gradient(90deg, rgba(236, 231, 216, .035) 0 1px, transparent 1px 72px),
              repeating-linear-gradient(0deg, rgba(236, 231, 216, .026) 0 1px, transparent 1px 72px),
              var(--void);
          }
          .hero-console::after { display: none; }
          .console-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--void-line);
          }
          .console-header > div { display: grid; gap: 5px; min-width: 0; }
          .console-kicker,
          .console-question > span,
          .console-footer > span {
            font: 700 9px/1.2 var(--mono);
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #aeb185;
          }
          .console-header strong {
            font: 800 17px/1 var(--display);
            letter-spacing: .04em;
          }
          .console-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            padding: 8px 10px;
            border: 1px solid rgba(236, 231, 216, .22);
            font: 700 9px/1 var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase;
          }
          .console-status i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #c8ca9a;
            box-shadow: 0 0 0 4px rgba(200, 202, 154, .12);
          }
          .console-question { max-width: 720px; }
          .console-question h2 {
            margin: 10px 0 0;
            font-family: var(--serif);
            font-size: clamp(30px, 3.2vw, 48px);
            font-weight: 400;
            line-height: 1.04;
            letter-spacing: -.035em;
          }
          .console-grammar {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            padding: 0;
            margin: 0;
            border-top: 1px solid var(--void-line);
            border-left: 1px solid var(--void-line);
          }
          .console-grammar li {
            position: relative;
            min-width: 0;
            min-height: 82px;
            padding: 15px 10px 12px;
            border-right: 1px solid var(--void-line);
            border-bottom: 1px solid var(--void-line);
            color: #777568;
          }
          .console-grammar li::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 3px;
            background: transparent;
          }
          .console-grammar li.is-complete { color: #d6d1c2; }
          .console-grammar li.is-complete::before { background: #8f9564; }
          .console-grammar li.is-current { color: #fff6e7; background: rgba(183, 71, 45, .12); }
          .console-grammar li.is-current::before { background: var(--ember); }
          .console-grammar b {
            display: block;
            font: 700 9px/1 var(--mono);
            color: #aeb185;
          }
          .console-grammar span {
            display: block;
            margin-top: 14px;
            font: 800 11px/1.05 var(--display);
            text-transform: uppercase;
            overflow-wrap: anywhere;
          }
          .console-ledger {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            border-top: 1px solid var(--void-line);
            border-left: 1px solid var(--void-line);
          }
          .console-ledger > div {
            min-width: 0;
            display: grid;
            grid-template-columns: minmax(72px, .25fr) minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            min-height: 76px;
            padding: 13px 14px;
            border-right: 1px solid var(--void-line);
            border-bottom: 1px solid var(--void-line);
          }
          .console-ledger span {
            font: 700 8px/1.2 var(--mono);
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #92907f;
          }
          .console-ledger strong {
            min-width: 0;
            font-size: 12px;
            line-height: 1.3;
            overflow-wrap: anywhere;
          }
          .console-ledger em {
            padding: 5px 7px;
            border: 1px solid rgba(200, 202, 154, .34);
            color: #c8ca9a;
            font: normal 700 8px/1 var(--mono);
            letter-spacing: .06em;
            text-transform: uppercase;
          }
          .console-ledger em.console-hold { border-color: rgba(183, 71, 45, .65); color: #dc876f; }
          .console-ledger em.console-lock { border-color: rgba(236, 231, 216, .25); color: #aaa596; }
          .console-footer {
            margin-top: auto;
            display: grid;
            gap: 8px;
            padding-top: 19px;
            border-top: 2px solid rgba(236, 231, 216, .78);
          }
          .console-footer code {
            color: #d8d2c3;
            font: 11px/1.5 var(--mono);
            white-space: normal;
            overflow-wrap: anywhere;
          }

          .proof-instrument {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: var(--bone);
            background:
              linear-gradient(160deg, rgba(112, 117, 77, .22), transparent 44%),
              var(--void);
          }
          .instrument-top,
          .instrument-foot {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font: 700 8px/1.2 var(--mono);
            letter-spacing: .1em;
            text-transform: uppercase;
          }
          .instrument-top { padding-bottom: 13px; border-bottom: 1px solid var(--void-line); }
          .instrument-top span { color: #b7ba8d; }
          .instrument-top b { color: var(--bone); }
          .place-stack {
            list-style: none;
            display: grid;
            padding: 0;
            margin: 14px 0;
            border-top: 1px solid var(--void-line);
          }
          .place-stack li {
            min-width: 0;
            display: grid;
            grid-template-columns: 28px minmax(0, 1fr) auto;
            align-items: center;
            gap: 9px;
            padding: 9px 0;
            border-bottom: 1px solid var(--void-line);
          }
          .place-stack span { font: 8px/1 var(--mono); color: #8e8b7d; }
          .place-stack strong {
            min-width: 0;
            font: 800 13px/1 var(--display);
            text-transform: uppercase;
            overflow-wrap: anywhere;
          }
          .place-stack i {
            padding: 4px 5px;
            border: 1px solid rgba(236, 231, 216, .18);
            color: #b9b5a7;
            font: normal 700 7px/1 var(--mono);
            text-transform: uppercase;
          }
          .place-stack li:nth-child(4) i { border-color: rgba(200, 202, 154, .45); color: #c8ca9a; }
          .place-stack li:last-child i { border-color: rgba(183, 71, 45, .55); color: #dc876f; }
          .instrument-foot {
            margin-top: auto;
            padding-top: 13px;
            border-top: 2px solid rgba(236, 231, 216, .7);
            color: #d6d1c2;
          }

          @media (max-width: 1180px) {
            .proof-instrument { min-height: 300px; }
          }

          @media (max-width: 640px) {
            .hero-console { min-height: 0; padding: 20px 16px; }
            .console-header { display: grid; }
            .console-status { justify-self: start; }
            .console-question h2 { font-size: 30px; }
            .console-grammar { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .console-ledger { grid-template-columns: minmax(0, 1fr); }
            .console-ledger > div { grid-template-columns: 72px minmax(0, 1fr) auto; }
            .proof-instrument { min-height: 280px; }
          }

          @media (max-width: 360px) {
            .console-grammar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .console-ledger > div { grid-template-columns: minmax(0, 1fr); gap: 6px; }
            .console-ledger em { justify-self: start; }
            .instrument-foot { display: grid; }
          }
          '''
          css_path.write_text(css, encoding='utf-8')

          contract_path = ROOT / 'WORKING_MODEL_CONTRACT.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          contract['visual_evidence'] = {
              'primary_mode': 'operational_instrumentation',
              'hero': 'A bounded case trace showing source, authority, prepared output, unresolved gates, and zero external effect.',
              'place_fabric': 'A seven-scale source-state instrument that exposes coverage and adverse-use limits without presenting degraded photography as proof of current field activity.',
              'historical_or_low_resolution_photography_used_as_primary_proof': False,
              'field_activity_claimed': False,
              'acceptance': [
                  'No rendered image element appears in the working-model main surface.',
                  'The hero exposes a seven-stage case trace and four-row authority ledger.',
                  'The Place Fabric proof card exposes seven named scales and explicit no-score and no-adverse-use boundaries.',
                  'Desktop, mobile, narrow, keyboard, reduced-motion, and packet behavior remain qualified.'
              ]
          }
          contract_path.write_text(json.dumps(contract, indent=2) + '\n', encoding='utf-8')

          release_path = ROOT / 'RELEASE_CONTRACT.json'
          release = json.loads(release_path.read_text(encoding='utf-8'))
          release['visual_evidence'] = {
              'primary_mode': 'operational_instrumentation',
              'legacy_photo_assets_rendered': False,
              'legacy_photo_assets_retained_for_byte_custody_only': [
                  'assets/property.webp',
                  'assets/household.webp'
              ],
              'field_activity_claimed': False
          }
          release_path.write_text(json.dumps(release, indent=2) + '\n', encoding='utf-8')

          readme_path = ROOT / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          note = '''

          ## Visual evidence posture

          The primary working-model surface uses operational instrumentation rather than archival or low-resolution photography. The hero shows a bounded case trace, unresolved organizational gates, and the exact zero-effect state. The Place Fabric card shows its seven-scale source posture and adverse-use boundary. The retained photo assets remain in release custody for historical continuity, but the page does not render them as evidence of current field activity.
          '''
          if '## Visual evidence posture' not in readme:
              readme += note
          readme_path.write_text(readme, encoding='utf-8')

          static_path = ROOT / 'tests' / 'public_contract_test.py'
          static = static_path.read_text(encoding='utf-8')
          old = '''    for asset in ["assets/property.webp", "assets/household.webp"]:
                  require(asset in html, f"public-safe image donor absent: {asset}")
                  local = (ROOT / asset).resolve()
                  require(local.is_file(), f"linked public-safe donor missing from repo: {asset}")
          '''
          new = '''    for asset in ["assets/property.webp", "assets/household.webp"]:
                  local = (ROOT / asset).resolve()
                  require(local.is_file(), f"retained legacy photo asset missing from repo: {asset}")
                  require(asset not in html, f"legacy photo asset may not render as primary evidence: {asset}")

              for hook in [
                  'class="hero-visual hero-console"',
                  'class="console-grammar"',
                  'class="console-ledger"',
                  'class="proof-instrument place-instrument"',
                  'class="place-stack"',
                  'No adverse use',
              ]:
                  require(hook in html, f"operational evidence hook absent: {hook}")
              require("<img" not in html, "working-model main surface may not render archival photography")
              visual = contract["visual_evidence"]
              require(visual["primary_mode"] == "operational_instrumentation", "visual evidence mode differs")
              require(visual["historical_or_low_resolution_photography_used_as_primary_proof"] is False, "legacy photography must not carry primary proof")
              require(visual["field_activity_claimed"] is False, "visual system may not manufacture field activity")
          '''
          static = replace_once(static, old, new, 'static visual contract')
          static_path.write_text(static, encoding='utf-8')

          for test_name in ['browser_test.py', 'live_browser_test.py']:
              test_path = ROOT / 'tests' / test_name
              test = test_path.read_text(encoding='utf-8')
              old = '''        assert page.locator(".proof-card").count() == 4
                  assert "Silence is not consent" in page.locator(".invariant").inner_text()
          '''
              new = '''        assert page.locator(".proof-card").count() == 4
                  assert page.locator("main img").count() == 0
                  assert page.locator(".hero-console").count() == 1
                  assert page.locator(".console-grammar li").count() == 7
                  assert page.locator(".console-ledger > div").count() == 4
                  assert page.locator(".place-stack li").count() == 7
                  assert "No adverse use" in page.locator(".instrument-foot").inner_text()
                  assert "Silence is not consent" in page.locator(".invariant").inner_text()
          '''
              test = replace_once(test, old, new, f'{test_name} visual assertions')
              test_path.write_text(test, encoding='utf-8')
          PY

      - name: Remove one-shot repair controller
        run: rm '.github/workflows/manzanita-working-model-operational-evidence-repair.yml'

      - name: Verify static, syntax, and browser contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            manzanita-working-model/tests/public_contract_test.py \
            manzanita-working-model/tests/browser_test.py \
            manzanita-working-model/tests/live_browser_test.py
          node --check manzanita-working-model/app.js
          python manzanita-working-model/tests/public_contract_test.py
          python -m pip install --disable-pip-version-check playwright==1.57.0
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            export MW_CHROMIUM_EXECUTABLE="$browser"
          else
            python -m playwright install --with-deps chromium
          fi
          export MW_WORKING_MODEL_SCREENSHOT_DIR="$RUNNER_TEMP/manzanita-working-model-operational-evidence"
          python manzanita-working-model/tests/browser_test.py

      - name: Commit bounded visual correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-visual-bot'
          git config user.email 'actions@users.noreply.github.com'
          expected='manzanita-working-model/README.md
          manzanita-working-model/RELEASE_CONTRACT.json
          manzanita-working-model/WORKING_MODEL_CONTRACT.json
          manzanita-working-model/index.html
          manzanita-working-model/style.css
          manzanita-working-model/tests/browser_test.py
          manzanita-working-model/tests/live_browser_test.py
          manzanita-working-model/tests/public_contract_test.py'
          observed="$(git status --short | sed -E 's/^.. //' | sort)"
          if [ "$observed" != "$expected" ]; then
            printf 'Expected changed paths:\n%s\nObserved changed paths:\n%s\n' "$expected" "$observed"
            exit 1
          fi
          git add -A
          git commit -m 'manzanita: replace archival photos with operational evidence'
          git push origin HEAD
