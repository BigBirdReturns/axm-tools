name: Repair Manzanita release-control proof coverage

on:
  push:
    branches:
      - agent/manzanita-release-control-022
    paths:
      - ".github/workflows/manzanita-release-control-source-repair.yml"
      - ".github/bootstrap/manzanita-release-control-repair-part-*.b64"

permissions:
  contents: write

concurrency:
  group: manzanita-release-control-source-repair
  cancel-in-progress: false

jobs:
  repair-and-publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-release-control-022
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact replay dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Reassemble and verify the bounded repair payload
        run: |
          test "$(find .github/bootstrap -maxdepth 1 -name 'manzanita-release-control-repair-part-*.b64' | wc -l)" -eq 6
          cat .github/bootstrap/manzanita-release-control-repair-part-*.b64 \
            | base64 --decode \
            > /tmp/manzanita-release-control-repair.tar.gz
          test "$(sha256sum /tmp/manzanita-release-control-repair.tar.gz | awk '{print $1}')" = \
            "3d2715af4e915809317c4f21059e7a18c0d26b0fdd0d2f5b2a4883de4f1bcebe"
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archive = Path("/tmp/manzanita-release-control-repair.tar.gz")
          target = Path("/tmp/manzanita-release-control-repair")
          target.mkdir(parents=True, exist_ok=True)
          allowed = {
              "manzanita-next/release-control/build_release_control.py",
              "manzanita-next/release-control/tests/test_release_control.py",
          }
          seen = set()
          with tarfile.open(archive, "r:gz") as bundle:
              for member in bundle.getmembers():
                  name = PurePosixPath(member.name).as_posix()
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive member: {name}")
                  if name in seen:
                      raise SystemExit(f"Duplicate archive member: {name}")
                  seen.add(name)
                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      raise SystemExit(f"Unsupported archive member type: {name}")
                  if member.isfile() and name not in allowed:
                      raise SystemExit(f"Out-of-scope archive member: {name}")
              if {name for name in seen if name in allowed} != allowed:
                  raise SystemExit(f"Repair payload file coverage drifted: {sorted(seen)}")
              bundle.extractall(target)
          PY

      - name: Apply the proof-coverage and adversarial-suite repair
        run: |
          cp /tmp/manzanita-release-control-repair/manzanita-next/release-control/build_release_control.py \
            manzanita-next/release-control/build_release_control.py
          cp /tmp/manzanita-release-control-repair/manzanita-next/release-control/tests/test_release_control.py \
            manzanita-next/release-control/tests/test_release_control.py
          test "$(sha256sum manzanita-next/release-control/build_release_control.py | awk '{print $1}')" = \
            "09351e1bae2e59e56e935e0d7143934a846a3d86da27dfa0c9e20bf6da76c813"
          test "$(sha256sum manzanita-next/release-control/tests/test_release_control.py | awk '{print $1}')" = \
            "00d6ede10ff8f0599daf9ecab27ece31c9ea70e0445631f3f2bb28e9ce58aab8"

      - name: Prove exact proof vocabulary and the complete adversarial suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            manzanita-next/release-control/build_release_control.py \
            manzanita-next/release-control/replay_p9_workflow.py \
            manzanita-next/release-control/tests/test_release_control.py
          python -m unittest discover \
            -s manzanita-next/release-control/tests \
            -p "test_release_control.py"
          python - <<'PY'
          from pathlib import Path
          source = Path("manzanita-next/release-control/build_release_control.py").read_text()
          required = {
              '"bounded_secret_scan"',
              '"atomic_pointer_file_replace"',
              'AUTOMATED_PROOF_KEYS',
              'scan_tree_for_secrets',
              'validate_regular_tree',
          }
          missing = sorted(token for token in required if token not in source)
          if missing:
              raise SystemExit(f"Release-control proof vocabulary is incomplete: {missing}")
          PY

      - name: Publish only the corrected release-control source
        run: |
          find manzanita-next/release-control -type d -name __pycache__ -prune -exec rm -rf {} +
          find manzanita-next/release-control -type f -name '*.pyc' -delete
          rm -rf manzanita-next/release-control/out*
          git config user.name "manzanita-release-control-source-repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            manzanita-next/release-control/build_release_control.py \
            manzanita-next/release-control/tests/test_release_control.py
          git commit -m "Manzanita: bind complete release-control proof coverage"
          git push origin HEAD:agent/manzanita-release-control-022
