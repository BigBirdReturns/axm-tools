name: repair-home-lab-gradient-v3

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-lab-capability-gradient
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply PR 52 repair
        run: python home-lab-gradient/scripts/repair-pr52.py
      - name: Exercise repaired laws
        run: |
          python -m py_compile home-lab-gradient/scripts/lab.py home-lab-gradient/tests/test_lab.py
          python home-lab-gradient/tests/test_lab.py
          python home-lab-gradient/scripts/lab.py validate-source
          git diff --check
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-lab-gradient/scripts/collect-windows.ps1 home-lab-gradient/scripts/lab.py home-lab-gradient/tests/test_lab.py
          git commit -m "Repair host census byte and disabled-state custody"
          git push origin HEAD:agent/home-lab-capability-gradient
