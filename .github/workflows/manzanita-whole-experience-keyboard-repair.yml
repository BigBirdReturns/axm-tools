name: Repair and seal Manzanita whole-experience keyboard groups

on:
  push:
    branches:
      - agent/manzanita-whole-experience-017
    paths:
      - ".github/workflows/manzanita-whole-experience-keyboard-repair.yml"
      - ".github/scripts/manzanita-whole-experience-keyboard-repair.py"

permissions:
  contents: write

concurrency:
  group: manzanita-whole-experience-keyboard-repair
  cancel-in-progress: false

jobs:
  repair-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-whole-experience-017
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact local test dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply bounded keyboard-group correction
        run: python .github/scripts/manzanita-whole-experience-keyboard-repair.py

      - name: Prove the corrected source before sealing
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          node --check manzanita-next/experience/template/app.js
          python -m py_compile \
            manzanita-next/experience/tests/test_experience.py \
            manzanita-next/experience/tests/browser_test.py
          python -m unittest discover \
            -s manzanita-next/experience/tests \
            -p "test_experience.py"

      - name: Seal and publish the corrected candidate
        run: |
          rm -f \
            .github/workflows/manzanita-whole-experience-keyboard-repair.yml \
            .github/scripts/manzanita-whole-experience-keyboard-repair.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "manzanita-whole-experience-keyboard-repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/manzanita-whole-experience-keyboard-repair.yml \
            .github/scripts/manzanita-whole-experience-keyboard-repair.py \
            manzanita-next/experience/template/app.js \
            manzanita-next/experience/tests/test_experience.py
          git commit -m "Manzanita: seal stable keyboard group navigation"
          git push origin HEAD:agent/manzanita-whole-experience-017
