name: Manzanita semantic instruments v5 and operator v6 review

on:
  push:
    branches: [agent/manzanita-semantic-instruments-v5]
    paths:
      - "programs/manzanita-semantic-instruments-v5/src/**"
      - "programs/manzanita-semantic-instruments-v5/OPERATOR_SOURCE_BUNDLE.*"
      - "programs/manzanita-semantic-instruments-v5/SOURCE_BUNDLE.*"
      - "programs/manzanita-semantic-instruments-v5/donors/**"
      - "programs/manzanita-semantic-instruments-v5/DONOR_REGISTER.json"
      - ".github/workflows/manzanita-semantic-instruments-v5-review.yml"
  pull_request:
    branches: [main]
    paths:
      - "programs/manzanita-semantic-instruments-v5/**"
      - "review/manzanita-semantic-instruments-v5/**"
      - ".github/workflows/manzanita-semantic-instruments-v5-review.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: manzanita-semantic-instruments-v5-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-test-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'agent/manzanita-semantic-instruments-v5' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove review-only scope
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --quiet origin/main...HEAD -- manzanita
          python - <<'PY'
          import subprocess
          changed = subprocess.run(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed = {".github/workflows/manzanita-semantic-instruments-v5-review.yml"}
          invalid = [
              path for path in changed
              if path not in allowed
              and not path.startswith("programs/manzanita-semantic-instruments-v5/")
              and not path.startswith("review/manzanita-semantic-instruments-v5/")
          ]
          if invalid:
              raise SystemExit(f"Semantic review contains out-of-scope paths: {invalid}")
          PY

      - name: Recover the exact semantic engine and operator source
        run: |
          set -euo pipefail
          program=programs/manzanita-semantic-instruments-v5
          root="$program/src"
          operator_bundle=/tmp/manzanita-operator-source-bundle.tgz

          rm -rf "$root"
          mkdir -p "$root"

          cat "$program"/SOURCE_BUNDLE.* \
            | base64 --decode \
            | tar -xzf - -C "$root" --strip-components=1

          cat "$program"/OPERATOR_SOURCE_BUNDLE.*.b64 \
            | base64 --decode \
            > "$operator_bundle"

          cmp --silent "$operator_bundle" "$program/OPERATOR_SOURCE_BUNDLE.tgz"
          tar -tzf "$operator_bundle" > /tmp/manzanita-operator-source-members.txt
          tar -xzf "$operator_bundle" -C "$root"

          printf 'operator_bundle_bytes=%s\n' "$(stat -c%s "$operator_bundle")"
          printf 'operator_bundle_sha256=%s\n' "$(sha256sum "$operator_bundle" | cut -d' ' -f1)"

          test -f "$root/build_review.py"
          test -f "$root/build_operator.py"
          test -f "$root/operator/index.html"
          test -f "$root/operator/app.js"
          test -f "$root/operator/style.css"
          python -m py_compile \
            "$root/build_review.py" \
            "$root/build_operator.py" \
            "$root/tests/test_semantic_contract.py" \
            "$root/tests/test_operator_contract.py" \
            "$root/tests/browser_test.py" \
            "$root/tests/operator_browser_test.py" \
            "$root/tests/capture_review.py" \
            "$root/tests/capture_operator.py"
          node --check "$root/template/app.js"
          node --check "$root/operator/app.js"

      - name: Install deterministic image and browser libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.57.0

      - name: Build the exact semantic qualification console
        run: |
          set -euo pipefail
          rm -rf review/manzanita-semantic-instruments-v5
          python programs/manzanita-semantic-instruments-v5/src/build_review.py \
            --source-root programs/manzanita-semantic-instruments-v5/src \
            --donor-root programs/manzanita-semantic-instruments-v5 \
            --output review/manzanita-semantic-instruments-v5

      - name: Build the progressive-disclosure operator projection
        run: |
          python programs/manzanita-semantic-instruments-v5/src/build_operator.py \
            --source-root programs/manzanita-semantic-instruments-v5/src \
            --review-root review/manzanita-semantic-instruments-v5 \
            --output review/manzanita-semantic-instruments-v5/operator

      - name: Enforce exact-asset semantic custody and operator projection law
        run: |
          python programs/manzanita-semantic-instruments-v5/src/tests/test_semantic_contract.py \
            --site review/manzanita-semantic-instruments-v5
          python programs/manzanita-semantic-instruments-v5/src/tests/test_operator_contract.py \
            --operator review/manzanita-semantic-instruments-v5/operator

      - name: Exercise the qualification console state matrix
        run: |
          python programs/manzanita-semantic-instruments-v5/src/tests/browser_test.py \
            --site review/manzanita-semantic-instruments-v5 \
            --output review/manzanita-semantic-instruments-v5/BROWSER_AUDIT.json

      - name: Exercise the complete operator path and hostile state matrix
        run: |
          python programs/manzanita-semantic-instruments-v5/src/tests/operator_browser_test.py \
            --operator review/manzanita-semantic-instruments-v5/operator \
            --output review/manzanita-semantic-instruments-v5/operator/BROWSER_CAMPAIGN.json

      - name: Render qualification and operator evidence
        run: |
          python programs/manzanita-semantic-instruments-v5/src/tests/capture_review.py \
            --site review/manzanita-semantic-instruments-v5 \
            --output review/manzanita-semantic-instruments-v5/evidence
          python programs/manzanita-semantic-instruments-v5/src/tests/capture_operator.py \
            --operator review/manzanita-semantic-instruments-v5/operator \
            --output review/manzanita-semantic-instruments-v5/operator/evidence

      - name: Seal qualification and operator receipts
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path("review/manzanita-semantic-instruments-v5")
          receipt = json.loads((root / "BUILD_RECEIPT.json").read_text())
          receipt["qualification"] = json.loads((root / "BROWSER_AUDIT.json").read_text())
          receipt["capture_receipt"] = json.loads((root / "evidence/CAPTURE_RECEIPT.json").read_text())
          receipt["operator"] = json.loads((root / "operator/BUILD_RECEIPT.json").read_text())
          receipt["operator_qualification"] = json.loads((root / "operator/BROWSER_CAMPAIGN.json").read_text())
          receipt["operator_capture_receipt"] = json.loads((root / "operator/evidence/CAPTURE_RECEIPT.json").read_text())
          files = {}
          for path in sorted(p for p in root.rglob("*") if p.is_file() and p.name != "BUILD_RECEIPT.json"):
              files[path.relative_to(root).as_posix()] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          receipt["files"] = files
          passes = [
              receipt["qualification"]["result"],
              receipt["capture_receipt"]["result"],
              receipt["operator"]["result"],
              receipt["operator_qualification"]["result"],
              receipt["operator_capture_receipt"]["result"],
          ]
          receipt["result"] = "PASS" if all(value == "PASS" for value in passes) else "FAIL"
          (root / "BUILD_RECEIPT.json").write_text(json.dumps(receipt, indent=2) + "\n")
          assert receipt["result"] == "PASS"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: manzanita-semantic-instruments-v5-operator-v6-${{ github.sha }}
          path: |
            programs/manzanita-semantic-instruments-v5/src
            review/manzanita-semantic-instruments-v5
          if-no-files-found: error
          retention-days: 30

      - name: Retain the exact generated review on the branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "manzanita-semantic-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add programs/manzanita-semantic-instruments-v5/src review/manzanita-semantic-instruments-v5
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Manzanita: materialize operator v6 over semantic instruments v5 [skip ci]"
            git push origin HEAD:agent/manzanita-semantic-instruments-v5
          fi
