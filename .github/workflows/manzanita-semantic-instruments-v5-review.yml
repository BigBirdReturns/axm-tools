name: Manzanita semantic instruments v5 review

on:
  push:
    branches: [agent/manzanita-semantic-instruments-v5]
    paths:
      - "programs/manzanita-semantic-instruments-v5/SOURCE_BUNDLE.*"
      - "programs/manzanita-semantic-instruments-v5/donors/**"
      - "programs/manzanita-semantic-instruments-v5/DONOR_REGISTER.json"
      - ".github/workflows/manzanita-semantic-instruments-v5-review.yml"
  pull_request:
    branches: [main]
    paths:
      - "programs/manzanita-semantic-instruments-v5/**"
      - "review/manzanita-semantic-instruments-v5/**"
      - ".github/workflows/manzanita-semantic-instruments-v5-review.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: manzanita-semantic-instruments-v5-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-test-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'agent/manzanita-semantic-instruments-v5' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove review-only scope
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --quiet origin/main...HEAD -- manzanita
          python - <<'PY'
          import subprocess
          changed = subprocess.run(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed = {".github/workflows/manzanita-semantic-instruments-v5-review.yml"}
          invalid = [
              path for path in changed
              if path not in allowed
              and not path.startswith("programs/manzanita-semantic-instruments-v5/")
              and not path.startswith("review/manzanita-semantic-instruments-v5/")
          ]
          if invalid:
              raise SystemExit(f"Semantic review contains out-of-scope paths: {invalid}")
          PY

      - name: Recover the exact source package
        run: |
          set -euo pipefail
          root=programs/manzanita-semantic-instruments-v5
          rm -rf "$root/src"
          mkdir -p "$root/src"
          cat "$root"/SOURCE_BUNDLE.* | base64 --decode | tar -xzf - -C "$root/src" --strip-components=1
          python -m py_compile \
            "$root/src/build_review.py" \
            "$root/src/tests/test_semantic_contract.py" \
            "$root/src/tests/browser_test.py" \
            "$root/src/tests/capture_review.py"
          node --check "$root/src/template/app.js"

      - name: Install deterministic image and browser libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.57.0

      - name: Build the semantic source-adaptive review
        run: |
          set -euo pipefail
          rm -rf review/manzanita-semantic-instruments-v5
          python programs/manzanita-semantic-instruments-v5/src/build_review.py \
            --source-root programs/manzanita-semantic-instruments-v5/src \
            --donor-root programs/manzanita-semantic-instruments-v5 \
            --output review/manzanita-semantic-instruments-v5

      - name: Enforce exact-asset semantic custody
        run: |
          python programs/manzanita-semantic-instruments-v5/src/tests/test_semantic_contract.py \
            --site review/manzanita-semantic-instruments-v5

      - name: Exercise every admitted state and refusal
        run: |
          python programs/manzanita-semantic-instruments-v5/src/tests/browser_test.py \
            --site review/manzanita-semantic-instruments-v5 \
            --output review/manzanita-semantic-instruments-v5/BROWSER_AUDIT.json

      - name: Render exact semantic review evidence
        run: |
          python programs/manzanita-semantic-instruments-v5/src/tests/capture_review.py \
            --site review/manzanita-semantic-instruments-v5 \
            --output review/manzanita-semantic-instruments-v5/evidence

      - name: Seal qualification into the build receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("review/manzanita-semantic-instruments-v5")
          receipt = json.loads((root / "BUILD_RECEIPT.json").read_text())
          receipt["qualification"] = json.loads((root / "BROWSER_AUDIT.json").read_text())
          receipt["capture_receipt"] = json.loads((root / "evidence/CAPTURE_RECEIPT.json").read_text())
          files = {}
          for path in sorted(p for p in root.rglob("*") if p.is_file() and p.name != "BUILD_RECEIPT.json"):
              files[path.relative_to(root).as_posix()] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          receipt["files"] = files
          receipt["result"] = "PASS" if receipt["qualification"]["result"] == receipt["capture_receipt"]["result"] == "PASS" else "FAIL"
          (root / "BUILD_RECEIPT.json").write_text(json.dumps(receipt, indent=2) + "\n")
          assert receipt["result"] == "PASS"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: manzanita-semantic-instruments-v5-${{ github.sha }}
          path: |
            programs/manzanita-semantic-instruments-v5/src
            review/manzanita-semantic-instruments-v5
          if-no-files-found: error
          retention-days: 30

      - name: Retain the exact generated review on the branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "manzanita-semantic-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add programs/manzanita-semantic-instruments-v5/src review/manzanita-semantic-instruments-v5
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Manzanita: materialize semantic instruments v5 review [skip ci]"
            git push origin HEAD:agent/manzanita-semantic-instruments-v5
          fi
