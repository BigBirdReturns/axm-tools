name: Venture Spine one-time materialization

on:
  push:
    branches: [venture-spine-1.0.0]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: venture-spine-1.0.0
          fetch-depth: 0

      - name: Materialize the staged public-safe foundation
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, io, json, pathlib, shutil, subprocess, tarfile

          root = pathlib.Path.cwd().resolve()
          part_dir = root / '.github' / 'bootstrap'
          parts = sorted(part_dir.glob('venture-spine-overlay-part-*.b64'))
          if not parts:
              raise SystemExit('No Venture Spine overlay parts found')

          payload = base64.b64decode(
              ''.join(p.read_text(encoding='utf-8').strip() for p in parts),
              validate=True,
          )
          stage = root / '.venture-spine-materialize'
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir()

          def safe_target(base: pathlib.Path, name: str) -> pathlib.Path:
              target = (base / name).resolve()
              if target != base and base not in target.parents:
                  raise ValueError(f'unsafe overlay path: {name}')
              return target

          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:*') as archive:
              members = archive.getmembers()
              for member in members:
                  safe_target(stage, member.name)
                  if member.issym() or member.islnk():
                      raise ValueError(f'links forbidden in overlay: {member.name}')
              archive.extractall(stage)
              print('overlay members:', len(members))

          for source in stage.rglob('*'):
              relative = source.relative_to(stage)
              destination = safe_target(root, str(relative))
              if source.is_dir():
                  destination.mkdir(parents=True, exist_ok=True)
              else:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)

          integrator = root / '.github' / 'bootstrap' / 'venture-spine-integrate.py'
          subprocess.run(['python', str(integrator)], check=True)

          # GITHUB_TOKEN may not create new workflow files. Preserve the exact
          # generated workflows inside the tool, then install them through the
          # repository write connector in the next reviewed commit.
          candidates = root / 'venture-spine' / 'workflow-candidates'
          candidates.mkdir(parents=True, exist_ok=True)
          for name in ['venture-spine-check.yml', 'venture-spine-live-readback.yml']:
              source = root / '.github' / 'workflows' / name
              if not source.exists():
                  raise SystemExit(f'generated workflow missing: {name}')
              shutil.move(str(source), str(candidates / name))

          required = [
              root / 'venture-spine' / 'QUALIFICATION.json',
              root / 'venture-spine' / 'ESTATE_COMPARISON.md',
              root / 'venture-spine' / 'LESSONS_APPLIED.md',
              root / 'venture-spine' / 'data' / 'schema.json',
              root / 'venture-spine' / 'data' / 'pelagos-public-cartridge.json',
              candidates / 'venture-spine-check.yml',
              candidates / 'venture-spine-live-readback.yml',
          ]
          missing = [str(p.relative_to(root)) for p in required if not p.exists()]
          if missing:
              raise SystemExit('foundation missing: ' + ', '.join(missing))

          for path in [
              root / 'venture-spine' / 'QUALIFICATION.json',
              root / 'venture-spine' / 'data' / 'observed.json',
              root / 'venture-spine' / 'data' / 'schema.json',
          ]:
              json.loads(path.read_text(encoding='utf-8'))
              print('json ok:', path.relative_to(root))

          for part in parts:
              part.unlink()
          integrator.unlink()
          if part_dir.exists() and not any(part_dir.iterdir()):
              part_dir.rmdir()
          shutil.rmtree(stage)
          pathlib.Path('.github/workflows/venture-spine-materialize-once.yml').unlink()
          PY

      - name: Commit the integrated foundation
        run: |
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add -A
          git commit -m "venture-spine: integrate public-safe foundation"
          git push origin HEAD:venture-spine-1.0.0
