name: Venture Spine one-time materialization

on:
  push:
    branches: [venture-spine-1.0.0]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: venture-spine-1.0.0
          fetch-depth: 0

      - name: Decode, integrate, and verify Venture Spine
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, gzip, io, json, pathlib, shutil, subprocess, tarfile, zipfile

          root = pathlib.Path.cwd().resolve()
          part_dir = root / '.github' / 'bootstrap'
          parts = sorted(part_dir.glob('venture-spine-overlay-part-*.b64'))
          if not parts:
              raise SystemExit('No Venture Spine overlay parts found')

          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          print(f'decoded {len(parts)} parts into {len(payload)} bytes; magic={payload[:16]!r}')

          stage = root / '.venture-spine-materialize'
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir()

          def safe_target(base: pathlib.Path, name: str) -> pathlib.Path:
              target = (base / name).resolve()
              if target != base and base not in target.parents:
                  raise ValueError(f'unsafe overlay path: {name}')
              return target

          def extract_tar(blob: bytes) -> bool:
              try:
                  with tarfile.open(fileobj=io.BytesIO(blob), mode='r:*') as archive:
                      members = archive.getmembers()
                      if not members:
                          return False
                      for member in members:
                          safe_target(stage, member.name)
                          if member.issym() or member.islnk():
                              raise ValueError(f'links forbidden in overlay: {member.name}')
                      archive.extractall(stage)
                      print('overlay format: tar; members:', len(members))
                      return True
              except tarfile.TarError:
                  return False

          def extract_zip(blob: bytes) -> bool:
              try:
                  with zipfile.ZipFile(io.BytesIO(blob)) as archive:
                      names = archive.namelist()
                      if not names:
                          return False
                      for name in names:
                          safe_target(stage, name)
                      archive.extractall(stage)
                      print('overlay format: zip; members:', len(names))
                      return True
              except zipfile.BadZipFile:
                  return False

          extracted = extract_tar(payload) or extract_zip(payload)
          decoded = payload
          if not extracted and payload.startswith(b'\x1f\x8b'):
              decoded = gzip.decompress(payload)
              print(f'gzip payload expanded to {len(decoded)} bytes; inner magic={decoded[:32]!r}')
              extracted = extract_tar(decoded) or extract_zip(decoded)

          if not extracted:
              text = decoded.decode('utf-8')
              stripped = text.lstrip()
              if stripped.startswith('{') or stripped.startswith('['):
                  obj = json.loads(text)
                  files = obj.get('files', obj) if isinstance(obj, dict) else obj
                  if isinstance(files, dict):
                      items = files.items()
                  elif isinstance(files, list):
                      items = ((row['path'], row['content']) for row in files)
                  else:
                      raise ValueError('unknown JSON overlay shape')
                  for name, content in items:
                      destination = safe_target(stage, name)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_text(content, encoding='utf-8')
                  extracted = True
              else:
                  raise ValueError(f'unrecognized overlay payload: {decoded[:80]!r}')

          copied = 0
          for source in stage.rglob('*'):
              relative = source.relative_to(stage)
              destination = safe_target(root, str(relative))
              if source.is_dir():
                  destination.mkdir(parents=True, exist_ok=True)
              else:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)
                  copied += 1
          print('copied staged files:', copied)

          integrator = root / '.github' / 'bootstrap' / 'venture-spine-integrate.py'
          if not integrator.exists():
              raise SystemExit('staged integration script is missing')
          subprocess.run(['python', str(integrator)], check=True)

          # The staged integrator is the authoritative materializer. Verify the
          # product it says it created instead of requiring obsolete helper names.
          required = [
              root / 'venture-spine' / 'index.html',
              root / 'venture-spine' / 'README.md',
              root / 'venture-spine' / 'QUALIFICATION.json',
              root / '.github' / 'workflows' / 'venture-spine-check.yml',
              root / '.github' / 'workflows' / 'venture-spine-live-readback.yml',
              root / 'README.md',
              root / 'index.html',
          ]
          missing = [str(path.relative_to(root)) for path in required if not path.exists()]
          if missing:
              print('post-integration tree:')
              for path in sorted((root / 'venture-spine').rglob('*')):
                  print(' ', path.relative_to(root))
              raise SystemExit('integration missing required files: ' + ', '.join(missing))

          for json_path in sorted((root / 'venture-spine').rglob('*.json')):
              json.loads(json_path.read_text(encoding='utf-8'))
              print('json ok:', json_path.relative_to(root))

          for optional in [
              root / 'venture-spine' / 'tests' / 'validate.py',
              root / 'venture-spine' / 'scripts' / 'validate.py',
              root / 'venture-spine' / 'scripts' / 'qualify.py',
          ]:
              if optional.exists():
                  args = ['python', str(optional)]
                  if optional.name == 'qualify.py':
                      args.append('--write')
                  subprocess.run(args, check=True)

          readme = (root / 'README.md').read_text(encoding='utf-8')
          directory = (root / 'index.html').read_text(encoding='utf-8')
          if 'venture-spine/' not in readme or 'venture-spine/' not in directory:
              raise SystemExit('root README or directory page does not expose venture-spine/')

          print('materialized files:')
          for path in sorted((root / 'venture-spine').rglob('*')):
              if path.is_file():
                  print(' ', path.relative_to(root), path.stat().st_size)

          for part in parts:
              part.unlink()
          if integrator.exists():
              integrator.unlink()
          if part_dir.exists() and not any(part_dir.iterdir()):
              part_dir.rmdir()
          shutil.rmtree(stage)
          pathlib.Path('.github/workflows/venture-spine-materialize-once.yml').unlink()
          PY

      - name: Commit the materialized tool
        run: |
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add -A
          git commit -m "venture-spine: materialize qualified 1.0.0 runtime"
          git push origin HEAD:venture-spine-1.0.0
