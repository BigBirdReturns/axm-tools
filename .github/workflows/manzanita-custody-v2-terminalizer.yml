name: Terminalize Manzanita donor custody v2

on:
  push:
    branches:
      - agent/manzanita-donor-custody-v2-actual
    paths:
      - ".github/workflows/manzanita-custody-v2-terminalizer.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: manzanita-custody-v2-terminalizer
  cancel-in-progress: false

jobs:
  terminalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BRANCH: agent/manzanita-donor-custody-v2-actual
      PRINCIPAL_WORKFLOW: manzanita-donor-custody-v2.yml
      PRINCIPAL_JOB: Validate current donor custody without false closure
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-donor-custody-v2-actual
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for the permanent custody source to materialize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120)
          do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            if test -f programs/manzanita-99/custody-v2/CUSTODY_CONTRACT.json \
              && test -f programs/manzanita-99/custody-v2/build_custody.py \
              && test -f programs/manzanita-99/custody-v2/validate_custody.py \
              && test -f programs/manzanita-99/custody-v2/PUBLIC_ROUTE_GUARD.json \
              && test -f ".github/workflows/$PRINCIPAL_WORKFLOW"
            then
              exit 0
            fi
            # Re-dispatch the materializer when it exists but an earlier run failed.
            if test -f .github/workflows/manzanita-donor-custody-v2-actual-bootstrap.yml
            then
              gh workflow run manzanita-donor-custody-v2-actual-bootstrap.yml \
                --repo "${{ github.repository }}" \
                --ref "$BRANCH" || true
            fi
            sleep 10
          done
          echo "Permanent custody v2 source did not materialize" >&2
          exit 1

      - name: Correct known bootstrap fixture drift and regenerate the route guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          test_path=Path("programs/manzanita-99/custody-v2/tests/test_custody_v2.py")
          text=test_path.read_text(encoding="utf-8")
          replacements={
            'target=write(self.repo/"real.txt","real\\n"); (self.repo/"manzanita-next/source.txt").unlink(); (self.repo/"manzanita-next/source.txt").symlink_to(target)':
            'target=self.repo/"real.txt"; write(target,"real\\n"); (self.repo/"manzanita-next/source.txt").unlink(); (self.repo/"manzanita-next/source.txt").symlink_to(target)',
            'target=write(self.repo/"replacement.txt","source\\n"); (self.repo/"manzanita-next/source.txt").unlink(); (self.repo/"manzanita-next/source.txt").symlink_to(target)':
            'target=self.repo/"replacement.txt"; write(target,"source\\n"); (self.repo/"manzanita-next/source.txt").unlink(); (self.repo/"manzanita-next/source.txt").symlink_to(target)',
          }
          for old,new in replacements.items():
            if old in text:
              text=text.replace(old,new,1)
          test_path.write_text(text,encoding="utf-8")

          rows=[]
          tracked=subprocess.run(
            ["git","ls-files","manzanita"],
            check=True,capture_output=True,text=True
          ).stdout.splitlines()
          for relative in tracked:
            path=Path(relative)
            if not path.is_file() or "__pycache__" in path.parts or path.suffix==".pyc":
              continue
            payload=path.read_bytes()
            blob=subprocess.run(
              ["git","hash-object",relative],
              check=True,capture_output=True,text=True
            ).stdout.strip()
            rows.append({
              "path":relative,
              "bytes":len(payload),
              "sha256":hashlib.sha256(payload).hexdigest(),
              "git_blob_sha1":blob,
            })
          guard={
            "schema":"axm-tools/manzanita-public-route-guard@2",
            "release":"1.4.0-historical-rollback-donor",
            "tree_sha":subprocess.run(
              ["git","rev-parse","HEAD:manzanita"],
              check=True,capture_output=True,text=True
            ).stdout.strip(),
            "files":sorted(rows,key=lambda row:row["path"]),
            "claim_boundary":"This guard proves repository byte identity for the historical public route. It is not observed endpoint-byte or successor-release proof."
          }
          Path("programs/manzanita-99/custody-v2/PUBLIC_ROUTE_GUARD.json").write_text(
            json.dumps(guard,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Replace the permanent exact-head qualification workflow
        run: |
          cat > ".github/workflows/$PRINCIPAL_WORKFLOW" <<'YAML'
          name: Manzanita donor custody v2

          on:
            push:
              branches:
                - agent/manzanita-donor-custody-v2-actual
              paths:
                - "programs/manzanita-99/custody-v2/**"
                - ".github/workflows/manzanita-donor-custody-v2.yml"
            pull_request:
              paths:
                - "programs/manzanita-99/custody-v2/**"
                - ".github/workflows/manzanita-donor-custody-v2.yml"
            workflow_dispatch: {}

          permissions:
            contents: read

          jobs:
            qualify:
              name: Validate current donor custody without false closure
              runs-on: ubuntu-24.04
              timeout-minutes: 25
              env:
                REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0

                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Prove exact head path scope and public-route immutability
                  run: |
                    test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
                    git fetch --no-tags origin main
                    python - <<'PY'
                    import subprocess
                    changed=subprocess.run(
                      ["git","diff","--name-only","origin/main...HEAD"],
                      check=True,capture_output=True,text=True
                    ).stdout.splitlines()
                    allowed={".github/workflows/manzanita-donor-custody-v2.yml"}
                    invalid=[
                      path for path in changed
                      if path not in allowed
                      and not path.startswith("programs/manzanita-99/custody-v2/")
                    ]
                    if invalid:
                      raise SystemExit(f"out-of-scope custody paths: {invalid}")
                    if any(path=="manzanita" or path.startswith("manzanita/") for path in changed):
                      raise SystemExit("historical public route changed")
                    PY
                    git diff --quiet origin/main...HEAD -- manzanita

                - name: Compile and run adversarial custody tests
                  env:
                    PYTHONDONTWRITEBYTECODE: "1"
                  run: |
                    python -m py_compile \
                      programs/manzanita-99/custody-v2/build_custody.py \
                      programs/manzanita-99/custody-v2/validate_custody.py \
                      programs/manzanita-99/custody-v2/audit_history.py \
                      programs/manzanita-99/custody-v2/tests/test_custody_v2.py
                    python -m unittest discover \
                      -s programs/manzanita-99/custody-v2/tests \
                      -p "test_*.py"

                - name: Build and validate the real repository custody manifest
                  run: |
                    rm -rf programs/manzanita-99/custody-v2/out
                    python programs/manzanita-99/custody-v2/build_custody.py \
                      --repo-root . \
                      --output programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json
                    python programs/manzanita-99/custody-v2/validate_custody.py \
                      --repo-root . \
                      --manifest programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json
                    if python programs/manzanita-99/custody-v2/validate_custody.py \
                      --repo-root . \
                      --manifest programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json \
                      --require-complete
                    then
                      echo "Custody falsely closed" >&2
                      exit 1
                    fi
                    python programs/manzanita-99/custody-v2/audit_history.py \
                      --repo-root . \
                      --output programs/manzanita-99/custody-v2/out/HISTORICAL_TREE_AUDIT.json

                - name: Prove partial state and effect firewalls
                  run: |
                    python - <<'PY'
                    import json
                    from pathlib import Path
                    manifest=json.loads(Path(
                      "programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json"
                    ).read_text())
                    assert manifest["custody_state"]=="PARTIAL_BY_CONTRACT"
                    assert len(manifest["open_required_gaps"])==10
                    assert manifest["public_effect"]=="none"
                    assert manifest["constitutional_count_effect"]=="none"
                    assert manifest["public_release_authorized"] is False
                    assert all(
                      row["canonical_task_count_effect"]=="none"
                      for row in manifest["observed_execution"]
                    )
                    PY

                - name: Retain custody manifest history audit and source law
                  uses: actions/upload-artifact@v4
                  with:
                    name: manzanita-donor-custody-v2-${{ env.REVIEW_HEAD_SHA }}
                    path: |
                      programs/manzanita-99/custody-v2/README.md
                      programs/manzanita-99/custody-v2/CUSTODY_CONTRACT.json
                      programs/manzanita-99/custody-v2/DONOR_REGISTER.json
                      programs/manzanita-99/custody-v2/OBSERVED_EXECUTION_LEDGER.json
                      programs/manzanita-99/custody-v2/PUBLIC_ROUTE_GUARD.json
                      programs/manzanita-99/custody-v2/build_custody.py
                      programs/manzanita-99/custody-v2/validate_custody.py
                      programs/manzanita-99/custody-v2/audit_history.py
                      programs/manzanita-99/custody-v2/tests
                      programs/manzanita-99/custody-v2/out
                    if-no-files-found: error
                    retention-days: 90
          YAML

      - name: Prove the clean permanent source before publication
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            programs/manzanita-99/custody-v2/build_custody.py \
            programs/manzanita-99/custody-v2/validate_custody.py \
            programs/manzanita-99/custody-v2/audit_history.py \
            programs/manzanita-99/custody-v2/tests/test_custody_v2.py
          python -m unittest discover \
            -s programs/manzanita-99/custody-v2/tests \
            -p "test_*.py"
          rm -rf programs/manzanita-99/custody-v2/out
          python programs/manzanita-99/custody-v2/build_custody.py \
            --repo-root . \
            --output programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json
          python programs/manzanita-99/custody-v2/validate_custody.py \
            --repo-root . \
            --manifest programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json
          python programs/manzanita-99/custody-v2/audit_history.py \
            --repo-root . \
            --output programs/manzanita-99/custody-v2/out/HISTORICAL_TREE_AUDIT.json
          rm -rf programs/manzanita-99/custody-v2/out

      - name: Seal one clean permanent branch head
        id: seal
        run: |
          rm -f \
            .github/workflows/manzanita-donor-custody-v2-actual-bootstrap.yml \
            .github/workflows/manzanita-donor-custody-v2-admission-bootstrap.yml \
            .github/workflows/manzanita-donor-custody-v2-bootstrap-test-repair.yml \
            .github/workflows/manzanita-history-census-bootstrap.yml \
            .github/workflows/manzanita-history-census-admission-installer.yml \
            .github/workflows/manzanita-custody-orchestrator-cleanup.yml \
            .github/workflows/manzanita-custody-final-requalification-trigger.yml \
            .github/workflows/manzanita-custody-v2-terminalizer.yml
          git config user.name "manzanita-custody-v2-terminalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Manzanita: seal current donor custody v2 on a clean head"
          final_head="$(git rev-parse HEAD)"
          echo "final_head=$final_head" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$BRANCH"

      - name: Dispatch and wait for exact-head permanent qualification
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_HEAD: ${{ steps.seal.outputs.final_head }}
        run: |
          gh workflow run "$PRINCIPAL_WORKFLOW" \
            --repo "${{ github.repository }}" \
            --ref "$BRANCH"

          stable=0
          for attempt in $(seq 1 180)
          do
            runs="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "$PRINCIPAL_WORKFLOW" \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --json databaseId,headSha,status,conclusion,createdAt \
              --limit 30)"
            match="$(printf '%s' "$runs" | jq --arg sha "$FINAL_HEAD" '[.[]|select(.headSha==$sha)]|sort_by(.createdAt)|last // empty')"
            if test -n "$match"
            then
              run_id="$(printf '%s' "$match" | jq -r '.databaseId')"
              status="$(printf '%s' "$match" | jq -r '.status')"
              conclusion="$(printf '%s' "$match" | jq -r '.conclusion // ""')"
              if test "$status" = "completed"
              then
                test "$conclusion" = "success"
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                stable=$((stable+1))
                if test "$stable" -ge 2
                then
                  exit 0
                fi
              else
                stable=0
              fi
            fi
            sleep 10
          done
          echo "Exact-head custody qualification did not complete successfully" >&2
          exit 1

      - name: Merge the one exact qualified pull-request head
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_HEAD: ${{ steps.seal.outputs.final_head }}
        run: |
          pr_json="$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number,headRefOid,isDraft \
            --limit 2)"
          test "$(printf '%s' "$pr_json" | jq 'length')" -eq 1
          pr="$(printf '%s' "$pr_json" | jq -r '.[0].number')"
          test "$(printf '%s' "$pr_json" | jq -r '.[0].headRefOid')" = "$FINAL_HEAD"
          if test "$(printf '%s' "$pr_json" | jq -r '.[0].isDraft')" = "true"
          then
            gh pr ready "$pr" --repo "${{ github.repository }}"
          fi
          gh pr merge "$pr" \
            --repo "${{ github.repository }}" \
            --merge \
            --match-head-commit "$FINAL_HEAD" \
            --subject "Merge Manzanita current donor custody v2" \
            --body "Admit current repository custody, exact public-route guards, deterministic manifests, reachable-history audit, adversarial tests, and ten explicit gaps. Preserve partial state, public bytes, external-campaign reality, release HOLD, and canonical task-count authority."

      - name: Retain terminalization receipt
        if: always()
        env:
          FINAL_HEAD: ${{ steps.seal.outputs.final_head }}
          QUALIFICATION_RUN: ${{ steps.qualify.outputs.run_id }}
        run: |
          mkdir -p terminalization
          python - <<'PY'
          import json, os
          from pathlib import Path
          value={
            "schema":"axm-tools/manzanita-custody-v2-terminalization@1",
            "branch":os.environ.get("BRANCH"),
            "final_head":os.environ.get("FINAL_HEAD"),
            "qualification_run_id":os.environ.get("QUALIFICATION_RUN"),
            "custody_state":"PARTIAL_BY_CONTRACT",
            "open_required_gaps":10,
            "historical_public_route_changed":False,
            "public_release_authorized":False,
            "constitutional_count_effect":"none"
          }
          Path("terminalization/TERMINALIZATION.json").write_text(json.dumps(value,indent=2)+"\n")
          PY
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/artifacts" >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manzanita-custody-v2-terminalization-${{ steps.seal.outputs.final_head }}
          path: terminalization
          if-no-files-found: warn
          retention-days: 90
