name: Manzanita semantic Access v4 review

on:
  push:
    branches: [agent/manzanita-semantic-access-v4]
    paths:
      - "programs/manzanita-semantic-access-v4/SOURCE_BUNDLE.*"
      - "programs/manzanita-semantic-access-v4/donors/**"
      - ".github/workflows/manzanita-semantic-access-v4-review.yml"
  pull_request:
    branches: [main]
    paths:
      - "programs/manzanita-semantic-access-v4/**"
      - "review/manzanita-semantic-access-v4/**"
      - ".github/workflows/manzanita-semantic-access-v4-review.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: manzanita-semantic-access-v4-fast-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-test-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'agent/manzanita-semantic-access-v4' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove review-only scope
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --quiet origin/main...HEAD -- manzanita
          python - <<'PY'
          import subprocess
          changed = subprocess.run(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed = {".github/workflows/manzanita-semantic-access-v4-review.yml"}
          invalid = [
              path for path in changed
              if path not in allowed
              and not path.startswith("programs/manzanita-semantic-access-v4/")
              and not path.startswith("review/manzanita-semantic-access-v4/")
          ]
          if invalid:
              raise SystemExit(f"Semantic review contains out-of-scope paths: {invalid}")
          PY

      - name: Recover the exact source package
        run: |
          set -euo pipefail
          root=programs/manzanita-semantic-access-v4
          rm -rf "$root/src"
          mkdir -p "$root/src"
          cat \
            "$root/SOURCE_BUNDLE.00" \
            "$root/SOURCE_BUNDLE.01" \
            "$root/SOURCE_BUNDLE.02" \
            "$root/SOURCE_BUNDLE.030" \
            "$root/SOURCE_BUNDLE.0310" \
            "$root/SOURCE_BUNDLE.0311" \
            "$root/SOURCE_BUNDLE.0312" \
            "$root/SOURCE_BUNDLE.0320" \
            "$root/SOURCE_BUNDLE.0321" \
            "$root/SOURCE_BUNDLE.0322" \
            "$root/SOURCE_BUNDLE.04" \
            > /tmp/manzanita-semantic-source.b64
          test "$(git hash-object /tmp/manzanita-semantic-source.b64)" = "f432b5789a2aea713da2388491de17950f48adb1"
          test "$(sha256sum /tmp/manzanita-semantic-source.b64 | cut -d' ' -f1)" = "f09cab9c757cbdfd82c621cea1c6d9f05e57825dde96d76c6e93ca597d3d3c5a"
          base64 --decode /tmp/manzanita-semantic-source.b64 > /tmp/manzanita-semantic-source.tar.gz
          test "$(sha256sum /tmp/manzanita-semantic-source.tar.gz | cut -d' ' -f1)" = "4dd6f17806c494d4feba801278d02e5a7560021988adf9bcb5de27b153345319"
          tar -xzf /tmp/manzanita-semantic-source.tar.gz -C "$root/src"
          python -m py_compile \
            "$root/src/build_review.py" \
            "$root/src/tests/test_semantic_contract.py" \
            "$root/src/tests/browser_test.py" \
            "$root/src/tests/capture_review.py"

      - name: Install deterministic image and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.57.0
          python -m playwright install chromium

      - name: Build the semantic source-adaptive review
        run: |
          set -euo pipefail
          rm -rf review/manzanita-semantic-access-v4
          python programs/manzanita-semantic-access-v4/src/build_review.py \
            --source-root programs/manzanita-semantic-access-v4/src \
            --donor-root programs/manzanita-semantic-access-v4 \
            --output review/manzanita-semantic-access-v4

      - name: Enforce semantic feature and exact-asset custody
        run: |
          python programs/manzanita-semantic-access-v4/src/tests/test_semantic_contract.py \
            --site review/manzanita-semantic-access-v4

      - name: Exercise every admitted state and refusal
        run: |
          python programs/manzanita-semantic-access-v4/src/tests/browser_test.py \
            --site review/manzanita-semantic-access-v4 \
            --output review/manzanita-semantic-access-v4/BROWSER_AUDIT.json

      - name: Render exact semantic review evidence
        run: |
          python programs/manzanita-semantic-access-v4/src/tests/capture_review.py \
            --site review/manzanita-semantic-access-v4 \
            --output review/manzanita-semantic-access-v4/evidence

      - name: Seal qualification into the build receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("review/manzanita-semantic-access-v4")
          receipt = json.loads((root / "BUILD_RECEIPT.json").read_text())
          receipt["qualification"] = json.loads((root / "BROWSER_AUDIT.json").read_text())
          receipt["capture_receipt"] = json.loads((root / "evidence/CAPTURE_RECEIPT.json").read_text())
          files = {}
          for path in sorted(p for p in root.rglob("*") if p.is_file() and p.name != "BUILD_RECEIPT.json"):
              files[path.relative_to(root).as_posix()] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          receipt["files"] = files
          receipt["result"] = "PASS" if receipt["qualification"]["result"] == receipt["capture_receipt"]["result"] == "PASS" else "FAIL"
          (root / "BUILD_RECEIPT.json").write_text(json.dumps(receipt, indent=2) + "\n")
          assert receipt["result"] == "PASS"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: manzanita-semantic-access-v4-${{ github.sha }}
          path: |
            programs/manzanita-semantic-access-v4/src
            review/manzanita-semantic-access-v4
          if-no-files-found: error
          retention-days: 30

      - name: Retain the exact generated review on the branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "manzanita-semantic-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add programs/manzanita-semantic-access-v4/src review/manzanita-semantic-access-v4
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Manzanita: materialize semantic Access v4 review [skip ci]"
            git push origin HEAD:agent/manzanita-semantic-access-v4
          fi
