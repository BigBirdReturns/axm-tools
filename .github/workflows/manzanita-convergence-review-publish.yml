name: Manzanita v1.6.0 visual review publication

on:
  push:
    branches: [agent/manzanita-public-convergence-v1-6]
    paths:
      - ".github/workflows/manzanita-convergence-review-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-public-convergence-v1-6
          fetch-depth: 0
      - name: Wait for the exact photographic candidate
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            git fetch origin agent/manzanita-public-convergence-v1-6
            git reset --hard origin/agent/manzanita-public-convergence-v1-6
            if grep -q 'data-release="1.6.0"' manzanita/index.html 2>/dev/null \
              && grep -q 'data-visual-system="photographic-place-fabric"' manzanita/index.html 2>/dev/null; then
              break
            fi
            if [ "$attempt" = "36" ]; then
              echo "Photographic candidate did not materialize"
              exit 1
            fi
            sleep 10
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and contact-sheet dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Replay the exact responsive browser contract
        env:
          MANZANITA_SCREENSHOT_DIR: /tmp/manzanita-review
        run: |
          python manzanita/tests/public_contract_test.py
          python manzanita/tests/browser_test.py
      - name: Build a human-review contact sheet and receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps

          source = Path('/tmp/manzanita-review')
          target = Path('review/manzanita-v1.6.0')
          target.mkdir(parents=True, exist_ok=True)
          selected = [
              ('Desktop hero', source / 'desktop-light-hero.png'),
              ('Desktop place fabric', source / 'desktop-light-fabric.png'),
              ('Tablet place fabric', source / 'tablet-fabric.png'),
              ('Mobile hero', source / 'mobile-hero.png'),
              ('Mobile place fabric', source / 'mobile-fabric.png'),
              ('320px / 200% place fabric', source / 'compact-200-fabric.png'),
          ]
          panels=[]
          for title,path in selected:
              if not path.exists():
                  raise SystemExit(f'Missing review capture: {path}')
              image=Image.open(path).convert('RGB')
              thumb=ImageOps.contain(image,(760,520),method=Image.Resampling.LANCZOS)
              panel=Image.new('RGB',(800,580),'#151611')
              x=(800-thumb.width)//2
              panel.paste(thumb,(x,42))
              draw=ImageDraw.Draw(panel)
              draw.text((24,16),title,fill='#f3efe5')
              panels.append(panel)
          sheet=Image.new('RGB',(1600,1740),'#0f100d')
          for i,panel in enumerate(panels):
              sheet.paste(panel,((i%2)*800,(i//2)*580))
          sheet.save(target/'contact-sheet.jpg','JPEG',quality=90,optimize=True)
          for _,path in selected:
              destination=target/path.name
              destination.write_bytes(path.read_bytes())
          files={}
          for path in sorted(target.glob('*')):
              payload=path.read_bytes()
              files[path.name]={'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest()}
          receipt={
              'schema':'manzanita-works/human-visual-review-packet@1',
              'release':'1.6.0',
              'candidate_commit':__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'captured_at':datetime.now(timezone.utc).isoformat(),
              'states':['desktop hero','desktop fabric','tablet fabric','mobile hero','mobile fabric','320px at 200 percent fabric'],
              'classification':'review_evidence_not_release_authority',
              'files':files,
              'control_question':'Does the photographic place fabric represent the estate we built, with genuine aperture, registration, role, authority, and responsive continuity rather than a simplified synthetic poster?',
          }
          (target/'REVIEW_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          (target/'REVIEW.md').write_text('''# Manzanita Works v1.6.0 visual review\n\nThis packet is generated from the exact convergence-branch candidate after the static and responsive browser contracts pass. It is human visual-review evidence, not public-release authority.\n\n![Contact sheet](contact-sheet.jpg)\n\nThe review must inspect photographic substance, seven genuinely distinct apertures, image/registration continuity, five operational seats, mobile navigation, 320-pixel 200-percent text behavior, source classification, purpose firewall, and the Essential Attention handoff.\n''',encoding='utf-8')
          PY
      - name: Publish review evidence and retire this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "manzanita-review-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/manzanita-convergence-review-publish.yml
          git add -A review/manzanita-v1.6.0 .github/workflows/manzanita-convergence-review-publish.yml
          git commit -m "Manzanita: publish v1.6.0 human visual review packet"
          git push origin HEAD:agent/manzanita-public-convergence-v1-6
