name: Operate Manzanita historical release and failure census

on:
  push:
    branches:
      - ops/manzanita-history-census-controller
    paths:
      - ".github/workflows/manzanita-history-census-controller.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: manzanita-history-census-controller
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_BRANCH: agent/manzanita-historical-release-census-025
      TARGET_WORKFLOW: manzanita-history-census.yml
      PRINCIPAL_JOB: Inventory reachable releases and failed runs without false closure
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/manzanita-history-census-controller
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for custody v2 admission and start from current main
        run: |
          for attempt in $(seq 1 180)
          do
            git fetch origin main
            if git cat-file -e origin/main:programs/manzanita-99/custody-v2/CUSTODY_CONTRACT.json 2>/dev/null
            then
              git checkout -B "$TARGET_BRANCH" origin/main
              exit 0
            fi
            sleep 10
          done
          echo "Current donor custody v2 did not enter main" >&2
          exit 1

      - name: Materialize the exact bounded history census
        run: |
          mkdir -p programs/manzanita-99/custody-v2/history/tests
          cat > programs/manzanita-99/custody-v2/history/README.md <<'EOF'
          # Manzanita historical release and failure census

          This object inventories every `manzanita/` tree reachable from Git history and every currently queryable failed Manzanita Actions run. It distinguishes a reachable tree, an explicitly qualified repository release, failed-run metadata, and observed public endpoint bytes.

          Git reachability is custody evidence. It is not approval, deployment, endpoint-byte proof, or product completion. A tree is classified as an explicitly qualified repository release only when its own `manzanita/QUALIFICATION.json` contains a release or version identity. Failed workflow metadata identifies a failed execution and does not substitute for retained logs, artifacts, root-cause analysis, or the rule that followed.

          The census advances `M99-CUSTODY-GAP-001` and `M99-CUSTODY-GAP-005` without closing either gap. External packages, deleted refs, expired logs and artifacts, rejected visual states, and deployed-byte observations remain open.
          EOF

          cat > programs/manzanita-99/custody-v2/history/build_history_census.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path
          from typing import Any

          SCHEMA = "axm-tools/manzanita-historical-release-census@1"


          class CensusError(ValueError):
              pass


          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise CensusError(message)


          def run(repo: Path, *args: str) -> str:
              result = subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              return result.stdout if result.returncode == 0 else ""


          def canonical_bytes(value: Any) -> bytes:
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")


          def sha256_bytes(payload: bytes) -> str:
              return hashlib.sha256(payload).hexdigest()


          def qualification(repo: Path, commit: str) -> dict[str, Any]:
              raw = run(repo, "show", f"{commit}:manzanita/QUALIFICATION.json")
              if not raw:
                  return {"present": False, "declared_release": None}
              try:
                  value = json.loads(raw)
              except json.JSONDecodeError:
                  return {
                      "present": True,
                      "valid_json": False,
                      "declared_release": None,
                      "qualification_sha256": sha256_bytes(raw.encode("utf-8")),
                  }
              release = value.get("release") or value.get("version")
              return {
                  "present": True,
                  "valid_json": True,
                  "declared_release": release,
                  "qualification_sha256": sha256_bytes(raw.encode("utf-8")),
              }


          def failed_runs(repository: str | None, token: str | None) -> list[dict[str, Any]]:
              if not repository:
                  return []
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "Manzanita-History-Census",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              url = (
                  f"https://api.github.com/repos/{repository}/actions/runs"
                  "?per_page=100&status=failure"
              )
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      value = json.loads(response.read())
              except Exception:
                  return []
              rows = []
              for item in value.get("workflow_runs", []):
                  name = str(item.get("name") or "")
                  if "manzanita" not in name.lower():
                      continue
                  rows.append(
                      {
                          "run_id": item["id"],
                          "workflow": name,
                          "event": item.get("event"),
                          "head_sha": item.get("head_sha"),
                          "status": item.get("status"),
                          "conclusion": item.get("conclusion"),
                          "created_at": item.get("created_at"),
                          "updated_at": item.get("updated_at"),
                          "logs_url": item.get("logs_url"),
                          "artifacts_url": item.get("artifacts_url"),
                          "claim_boundary": (
                              "Run metadata identifies a failed execution. It does not "
                              "prove retained logs, artifacts, root cause, or resulting rule."
                          ),
                      }
                  )
              return sorted(rows, key=lambda row: (row["created_at"] or "", row["run_id"]))


          def build(
              repo: Path,
              repository: str | None = None,
              token: str | None = None,
          ) -> dict[str, Any]:
              repo = repo.resolve()
              commits = run(
                  repo,
                  "rev-list",
                  "--reverse",
                  "--all",
                  "--",
                  "manzanita",
              ).splitlines()
              trees: dict[str, dict[str, Any]] = {}
              for commit in commits:
                  tree = run(repo, "rev-parse", f"{commit}:manzanita").strip()
                  if len(tree) != 40:
                      continue
                  row = trees.setdefault(
                      tree,
                      {
                          "tree_sha": tree,
                          "observed_commits": [],
                          "first_observed_commit": commit,
                          "files": [],
                      },
                  )
                  row["observed_commits"].append(commit)
                  if not row["files"]:
                      for line in run(repo, "ls-tree", "-r", tree).splitlines():
                          meta, path = line.split("\t", 1)
                          mode, object_type, blob = meta.split()
                          size = run(repo, "cat-file", "-s", blob).strip()
                          row["files"].append(
                              {
                                  "path": f"manzanita/{path}",
                                  "mode": mode,
                                  "type": object_type,
                                  "git_blob_sha1": blob,
                                  "bytes": int(size) if size.isdigit() else None,
                              }
                          )
                  current_qualification = qualification(repo, commit)
                  if (
                      current_qualification.get("declared_release")
                      and not row.get("qualification", {}).get("declared_release")
                  ):
                      row["qualification"] = {
                          **current_qualification,
                          "commit": commit,
                      }

              tree_rows = []
              for row in trees.values():
                  qualified = row.get(
                      "qualification",
                      {"present": False, "declared_release": None},
                  )
                  row["classification"] = (
                      "explicitly_qualified_repository_release"
                      if qualified.get("declared_release")
                      else "reachable_tree_not_qualified_release"
                  )
                  row["file_count"] = len(row["files"])
                  row["observed_commit_count"] = len(row["observed_commits"])
                  row["claim_boundary"] = (
                      "Git reachability and an in-tree qualification record do not "
                      "establish observed public endpoint bytes or current successor standing."
                  )
                  tree_rows.append(row)

              failure_rows = failed_runs(repository, token)
              value: dict[str, Any] = {
                  "schema": SCHEMA,
                  "result": "PASS",
                  "reachable_commit_count": len(commits),
                  "unique_tree_count": len(tree_rows),
                  "explicit_release_count": sum(
                      row["classification"].startswith("explicitly")
                      for row in tree_rows
                  ),
                  "trees": sorted(tree_rows, key=lambda row: row["tree_sha"]),
                  "failed_run_count": len(failure_rows),
                  "failed_runs": failure_rows,
                  "gap_effect": {
                      "M99-CUSTODY-GAP-001": "advanced_not_closed",
                      "M99-CUSTODY-GAP-005": "advanced_not_closed",
                  },
                  "public_effect": "none",
                  "constitutional_count_effect": "none",
                  "qualification_boundary": (
                      "The census covers reachable Git trees and currently queryable "
                      "Actions failure metadata only. External packages, deleted refs, "
                      "expired evidence, visual rejections, and deployed-byte observations "
                      "remain open."
                  ),
              }
              value["payload_sha256"] = sha256_bytes(canonical_bytes(value))
              return value


          def main() -> None:
              parser = argparse.ArgumentParser()
              parser.add_argument("--repo-root", type=Path, default=Path.cwd())
              parser.add_argument("--repository")
              parser.add_argument("--output", type=Path, required=True)
              args = parser.parse_args()
              value = build(
                  args.repo_root,
                  args.repository,
                  os.environ.get("GITHUB_TOKEN"),
              )
              args.output.parent.mkdir(parents=True, exist_ok=True)
              args.output.write_text(
                  json.dumps(value, indent=2) + "\n",
                  encoding="utf-8",
              )
              print(
                  json.dumps(
                      {
                          "result": "PASS",
                          "unique_tree_count": value["unique_tree_count"],
                          "explicit_release_count": value["explicit_release_count"],
                          "failed_run_count": value["failed_run_count"],
                          "receipt_sha256": value["payload_sha256"],
                      },
                      indent=2,
                  )
              )


          if __name__ == "__main__":
              try:
                  main()
              except CensusError as exc:
                  raise SystemExit(str(exc)) from exc
          PY

          cat > programs/manzanita-99/custody-v2/history/tests/test_history_census.py <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import subprocess
          import tempfile
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SPEC = importlib.util.spec_from_file_location(
              "history_census",
              ROOT / "build_history_census.py",
          )
          history = importlib.util.module_from_spec(SPEC)
          assert SPEC.loader is not None
          SPEC.loader.exec_module(history)


          class HistoryCensusTests(unittest.TestCase):
              def setUp(self) -> None:
                  self.temp = tempfile.TemporaryDirectory()
                  self.repo = Path(self.temp.name)
                  subprocess.run(
                      ["git", "init"],
                      cwd=self.repo,
                      check=True,
                      capture_output=True,
                  )
                  subprocess.run(
                      ["git", "config", "user.email", "test@example.invalid"],
                      cwd=self.repo,
                      check=True,
                  )
                  subprocess.run(
                      ["git", "config", "user.name", "Test"],
                      cwd=self.repo,
                      check=True,
                  )
                  (self.repo / "manzanita").mkdir()
                  (self.repo / "manzanita/index.html").write_text(
                      "v1\n",
                      encoding="utf-8",
                  )
                  self.commit("v1")

              def tearDown(self) -> None:
                  self.temp.cleanup()

              def commit(self, message: str) -> None:
                  subprocess.run(
                      ["git", "add", "."],
                      cwd=self.repo,
                      check=True,
                  )
                  subprocess.run(
                      ["git", "commit", "-m", message],
                      cwd=self.repo,
                      check=True,
                      capture_output=True,
                  )

              def test_reachable_tree_without_qualification_is_not_release(self) -> None:
                  value = history.build(self.repo)
                  self.assertEqual(value["unique_tree_count"], 1)
                  self.assertEqual(value["explicit_release_count"], 0)
                  self.assertEqual(
                      value["trees"][0]["classification"],
                      "reachable_tree_not_qualified_release",
                  )

              def test_exact_qualification_promotes_only_its_tree(self) -> None:
                  (self.repo / "manzanita/QUALIFICATION.json").write_text(
                      json.dumps({"release": "1.0.0"}),
                      encoding="utf-8",
                  )
                  self.commit("qualified")
                  value = history.build(self.repo)
                  self.assertEqual(value["unique_tree_count"], 2)
                  self.assertEqual(value["explicit_release_count"], 1)

              def test_deterministic_without_remote_failures(self) -> None:
                  first = history.build(self.repo)
                  second = history.build(self.repo)
                  self.assertEqual(first["payload_sha256"], second["payload_sha256"])

              def test_gap_effect_advances_without_closing(self) -> None:
                  value = history.build(self.repo)
                  self.assertTrue(
                      all(
                          state == "advanced_not_closed"
                          for state in value["gap_effect"].values()
                      )
                  )
                  self.assertEqual(value["public_effect"], "none")
                  self.assertEqual(value["constitutional_count_effect"], "none")


          if __name__ == "__main__":
              unittest.main()
          PY

          cat > ".github/workflows/$TARGET_WORKFLOW" <<'YAML'
          name: Manzanita historical release and failure census

          on:
            push:
              branches:
                - agent/manzanita-historical-release-census-025
              paths:
                - "programs/manzanita-99/custody-v2/history/**"
                - ".github/workflows/manzanita-history-census.yml"
            pull_request:
              paths:
                - "programs/manzanita-99/custody-v2/history/**"
                - ".github/workflows/manzanita-history-census.yml"
            workflow_dispatch: {}

          permissions:
            contents: read
            actions: read

          jobs:
            qualify:
              name: Inventory reachable releases and failed runs without false closure
              runs-on: ubuntu-24.04
              timeout-minutes: 25
              env:
                REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0

                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Prove exact path scope and public route
                  run: |
                    test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
                    git fetch --no-tags origin main
                    python - <<'PY'
                    import subprocess
                    changed=subprocess.run(
                      ["git","diff","--name-only","origin/main...HEAD"],
                      check=True,capture_output=True,text=True
                    ).stdout.splitlines()
                    allowed={".github/workflows/manzanita-history-census.yml"}
                    invalid=[
                      path for path in changed
                      if path not in allowed
                      and not path.startswith("programs/manzanita-99/custody-v2/history/")
                    ]
                    if invalid:
                      raise SystemExit(f"out-of-scope history paths: {invalid}")
                    if any(path=="manzanita" or path.startswith("manzanita/") for path in changed):
                      raise SystemExit("historical public route changed")
                    PY
                    git diff --quiet origin/main...HEAD -- manzanita

                - name: Compile and run census tests
                  env:
                    PYTHONDONTWRITEBYTECODE: "1"
                  run: |
                    python -m py_compile \
                      programs/manzanita-99/custody-v2/history/build_history_census.py \
                      programs/manzanita-99/custody-v2/history/tests/test_history_census.py
                    python -m unittest discover \
                      -s programs/manzanita-99/custody-v2/history/tests \
                      -p "test_*.py"

                - name: Build reachable-history and current failed-run census
                  env:
                    GITHUB_TOKEN: ${{ github.token }}
                  run: |
                    rm -rf programs/manzanita-99/custody-v2/history/out
                    python programs/manzanita-99/custody-v2/history/build_history_census.py \
                      --repo-root . \
                      --repository "${{ github.repository }}" \
                      --output programs/manzanita-99/custody-v2/history/out/HISTORICAL_RELEASE_CENSUS.json
                    python - <<'PY'
                    import json
                    from pathlib import Path
                    value=json.loads(Path(
                      "programs/manzanita-99/custody-v2/history/out/HISTORICAL_RELEASE_CENSUS.json"
                    ).read_text())
                    assert value["result"]=="PASS"
                    assert value["unique_tree_count"]>0
                    assert value["gap_effect"]["M99-CUSTODY-GAP-001"]=="advanced_not_closed"
                    assert value["gap_effect"]["M99-CUSTODY-GAP-005"]=="advanced_not_closed"
                    assert value["public_effect"]=="none"
                    assert value["constitutional_count_effect"]=="none"
                    assert all(
                      row["classification"] in {
                        "explicitly_qualified_repository_release",
                        "reachable_tree_not_qualified_release",
                      }
                      for row in value["trees"]
                    )
                    PY

                - name: Retain exact history census evidence
                  uses: actions/upload-artifact@v4
                  with:
                    name: manzanita-history-census-${{ env.REVIEW_HEAD_SHA }}
                    path: |
                      programs/manzanita-99/custody-v2/history/README.md
                      programs/manzanita-99/custody-v2/history/build_history_census.py
                      programs/manzanita-99/custody-v2/history/tests
                      programs/manzanita-99/custody-v2/history/out
                    if-no-files-found: error
                    retention-days: 90
          YAML

      - name: Prove the source census locally and publish one exact branch head
        id: seal
        run: |
          python -m py_compile \
            programs/manzanita-99/custody-v2/history/build_history_census.py \
            programs/manzanita-99/custody-v2/history/tests/test_history_census.py
          python -m unittest discover \
            -s programs/manzanita-99/custody-v2/history/tests \
            -p "test_*.py"
          rm -rf programs/manzanita-99/custody-v2/history/out
          python programs/manzanita-99/custody-v2/history/build_history_census.py \
            --repo-root . \
            --output programs/manzanita-99/custody-v2/history/out/HISTORICAL_RELEASE_CENSUS.json
          rm -rf programs/manzanita-99/custody-v2/history/out
          git config user.name "manzanita-history-census-controller"
          git config user.email "actions@users.noreply.github.com"
          git add ".github/workflows/$TARGET_WORKFLOW" programs/manzanita-99/custody-v2/history
          git diff --cached --check
          git commit -m "Manzanita: inventory reachable releases and failed runs"
          head="$(git rev-parse HEAD)"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1
          then
            old="$(git ls-remote --heads origin "$TARGET_BRANCH" | awk '{print $1}')"
            git push --force-with-lease="refs/heads/$TARGET_BRANCH:$old" origin "HEAD:refs/heads/$TARGET_BRANCH"
          else
            git push -u origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi

      - name: Open or update the draft census pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.seal.outputs.head }}
        run: |
          existing="$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$TARGET_BRANCH" \
            --base main \
            --state open \
            --json number,url,headRefOid \
            --limit 2)"
          if test "$(printf '%s' "$existing" | jq 'length')" -eq 0
          then
            url="$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "$TARGET_BRANCH" \
              --draft \
              --title "Manzanita: inventory reachable releases and failed runs" \
              --body "This pull request advances the predecessor-release and material-failure custody gaps with an exact census of every reachable manzanita tree and every currently queryable failed Manzanita Actions run. It does not close either gap, infer deployed bytes, classify reachability as approval, alter the historical public route, authorize release, or mutate a canonical task row. The controlling question is whether every reachable tree and current failure can be identified without laundering repository history into release standing.")"
            pr="${url##*/}"
          else
            test "$(printf '%s' "$existing" | jq 'length')" -eq 1
            pr="$(printf '%s' "$existing" | jq -r '.[0].number')"
            test "$(printf '%s' "$existing" | jq -r '.[0].headRefOid')" = "$HEAD_SHA"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Dispatch and wait for the exact-head census qualification
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.seal.outputs.head }}
        run: |
          gh workflow run "$TARGET_WORKFLOW" \
            --repo "${{ github.repository }}" \
            --ref "$TARGET_BRANCH"
          for attempt in $(seq 1 180)
          do
            runs="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "$TARGET_WORKFLOW" \
              --branch "$TARGET_BRANCH" \
              --event workflow_dispatch \
              --json databaseId,headSha,status,conclusion,createdAt \
              --limit 30)"
            match="$(printf '%s' "$runs" | jq --arg sha "$HEAD_SHA" '[.[]|select(.headSha==$sha)]|sort_by(.createdAt)|last // empty')"
            if test -n "$match" && test "$(printf '%s' "$match" | jq -r '.status')" = "completed"
            then
              test "$(printf '%s' "$match" | jq -r '.conclusion')" = "success"
              echo "run_id=$(printf '%s' "$match" | jq -r '.databaseId')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Exact-head history census qualification did not pass" >&2
          exit 1

      - name: Merge only the exact qualified history census head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.seal.outputs.head }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          current="$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json headRefOid,isDraft,state)"
          test "$(printf '%s' "$current" | jq -r '.headRefOid')" = "$HEAD_SHA"
          test "$(printf '%s' "$current" | jq -r '.state')" = "OPEN"
          if test "$(printf '%s' "$current" | jq -r '.isDraft')" = "true"
          then
            gh pr ready "$PR_NUMBER" --repo "${{ github.repository }}"
          fi
          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --merge \
            --match-head-commit "$HEAD_SHA" \
            --subject "Merge Manzanita historical release and failure census" \
            --body "Admit exact reachable-tree and current failed-run custody evidence while preserving both gaps as advanced but open, public bytes unchanged, release authority false, and canonical task-count effect none."

      - name: Retain controller terminalization receipt
        if: always()
        run: |
          mkdir -p terminalization
          cat > terminalization/TERMINALIZATION.json <<EOF
          {
            "schema": "axm-tools/manzanita-history-census-terminalization@1",
            "target_branch": "$TARGET_BRANCH",
            "head": "${{ steps.seal.outputs.head }}",
            "pull_request": "${{ steps.pr.outputs.number }}",
            "qualification_run": "${{ steps.qualify.outputs.run_id }}",
            "gap_001_effect": "advanced_not_closed",
            "gap_005_effect": "advanced_not_closed",
            "historical_public_route_changed": false,
            "public_release_authorized": false,
            "constitutional_count_effect": "none"
          }
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manzanita-history-census-controller-${{ steps.seal.outputs.head }}
          path: terminalization
          if-no-files-found: warn
          retention-days: 90
