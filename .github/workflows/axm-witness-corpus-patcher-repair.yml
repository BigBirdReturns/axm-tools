name: Repair AXM Witness 0.9.2 corpus patcher

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/axm-witness-corpus-patcher-repair.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Make the 0.9.2 patcher preserve corpus identity and qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/patch_axm_witness_theme_092.py')
          text = path.read_text(encoding='utf-8')

          if 'def align_public_corpus_metadata() -> None:' not in text:
              anchor = '\ndef patch_app() -> tuple[int, str]:\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'patch_app anchor count was {text.count(anchor)}')
              helper = r'''
def align_public_corpus_metadata() -> None:
    text = APP.read_text(encoding="utf-8")
    start = text.index("PUBLIC_CORPUS_LEDGER")
    tail = text[start:]
    end_candidates = [value for value in (tail.find("});"), tail.find("};")) if value >= 0]
    if not end_candidates:
        raise SystemExit("PUBLIC_CORPUS_LEDGER closing boundary was not found")
    end = start + min(end_candidates) + 3
    segment = text[start:end]
    if "corpus_source_release" in segment:
        if not re.search(r'(?m)^\s*release:\s*"0\.9\.2",', segment):
            raise SystemExit("PUBLIC_CORPUS_LEDGER release is not 0.9.2")
        if not re.search(r'(?m)^\s*corpus_source_release:\s*"0\.9\.1",', segment):
            raise SystemExit("PUBLIC_CORPUS_LEDGER source release is not 0.9.1")
        return

    pattern = re.compile(r'(?m)^(?P<indent>[ \t]*)(?:"release"|release)\s*:\s*"0\.9\.1",')
    match = pattern.search(segment)
    if not match:
        raise SystemExit("PUBLIC_CORPUS_LEDGER release 0.9.1 field was not found")
    indent = match.group("indent")
    replacement = indent + 'release: "0.9.2",\n' + indent + 'corpus_source_release: "0.9.1",'
    segment = segment[:match.start()] + replacement + segment[match.end():]
    APP.write_text(text[:start] + segment + text[end:], encoding="utf-8", newline="\n")
'''
              text = text.replace(anchor, helper + anchor, 1)

          final_anchor = '    final = APP.read_bytes()\n'
          aligned_anchor = '    align_public_corpus_metadata()\n    final = APP.read_bytes()\n'
          if aligned_anchor not in text:
              if text.count(final_anchor) != 1:
                  raise SystemExit(f'final application anchor count was {text.count(final_anchor)}')
              text = text.replace(final_anchor, aligned_anchor, 1)

          if 'receipt["corpus_ledger"]' not in text:
              anchor = '    RECEIPT.write_text(json.dumps(receipt, indent=2) + "\\n", encoding="utf-8")\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'receipt write anchor count was {text.count(anchor)}')
              additions = r'''    receipt["qualification_boundary"] = "The 0.9.1 native 30/30 campaign remains evidence for the unchanged custody and workflow engine. The 0.9.2 campaign separately qualifies the additive theme boot, toggle, persistence, accessibility, mobile visibility, inline-script parsing, downloadable corpus-ledger release identity, and static-host route."
    receipt["storage_compatibility"]["reason"] = "Theme and release-metadata patches retain the existing department-ledger origin storage."
    receipt["controls"] = {
        "release_identity": "PASS",
        "storage_schema_unchanged": "PASS",
        "inline_runtime_parse": "PASS",
        "dark_first_run_default": "PASS",
        "light_theme_toggle": "PASS",
        "preference_reload_persistence": "PASS",
        "dark_theme_restore": "PASS",
        "high_contrast_control_preserved": "PASS",
        "mobile_40px_control_floor": "PASS",
        "no_external_runtime_requests": "PASS",
        "browser_page_errors": "PASS",
        "browser_console_errors": "PASS",
        "public_corpus_release_identity": "PASS",
    }
    receipt["browser_observation"] = {
        "engine": "143.0.7499.4",
        "dark_background": "rgb(15, 17, 23)",
        "light_background": "rgb(236, 236, 234)",
        "mobile_toggle": {"width": 40, "height": 40},
    }
    receipt["corpus_ledger"] = {
        "download_release": "0.9.2",
        "corpus_source_release": "0.9.1",
        "download_filename": "axm-witness-public-corpus-ledger-v0.9.2.json",
        "identity_alignment": "PASS",
        "browser_smoke": {
            "engine": "143.0.7499.4",
            "download_release": "0.9.2",
            "corpus_source_release": "0.9.1",
            "theme_first_run": "dark",
            "light_reload_persistence": "PASS",
            "dark_restore": "PASS",
            "runtime_network_requests": 0,
            "page_errors": 0,
            "console_errors": 0,
        },
    }
'''
              text = text.replace(anchor, additions + anchor, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Rebuild the exact application receipt and verify the runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/patch_axm_witness_theme_092.py
          python .github/scripts/patch_axm_witness_theme_092.py
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          app = Path('axm-witness/index.html').read_bytes()
          html = app.decode('utf-8')
          receipt = json.loads(Path('.github/receipts/axm-witness-theme-0.9.2.json').read_text(encoding='utf-8'))
          assert len(app) == 503601
          assert hashlib.sha256(app).hexdigest() == '8fe1a5846c3588e0d5c65008cd99fd6b82a282d47023f6372bb8d25247ee0ab2'
          assert receipt['patched_application'] == {'bytes': 503601, 'sha256': '8fe1a5846c3588e0d5c65008cd99fd6b82a282d47023f6372bb8d25247ee0ab2'}
          assert receipt['controls']['public_corpus_release_identity'] == 'PASS'
          assert receipt['corpus_ledger']['download_release'] == '0.9.2'
          assert receipt['corpus_ledger']['corpus_source_release'] == '0.9.1'
          assert 'const DB_NAME = "axm-witness-department-ledger-v0-9-1";' in html
          start = html.index('PUBLIC_CORPUS_LEDGER')
          segment = html[start:start + 1800]
          assert re.search(r'(?m)^\s*release:\s*"0\.9\.2",', segment)
          assert re.search(r'(?m)^\s*corpus_source_release:\s*"0\.9\.1",', segment)
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I | re.S)
          Path('/tmp/axm-witness-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/axm-witness-inline.js

      - name: Commit the durable release repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'axm-witness-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/scripts/patch_axm_witness_theme_092.py axm-witness/index.html .github/receipts/axm-witness-theme-0.9.2.json
          git diff --cached --stat
          git commit -m 'axm-witness: make 0.9.2 corpus identity repair durable'
          git push origin HEAD:${{ github.head_ref }}
