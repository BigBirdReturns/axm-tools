name: Materialize exact AXM Witness 0.9.1 site

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/axm-witness-v0.9.1/**"
      - ".github/workflows/axm-witness-bootstrap-pr-0.9.1.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/axm-witness-v0-9-1-exact
          fetch-depth: 0

      - name: Reconstruct and install exact site
        shell: bash
        run: |
          set -euo pipefail
          chunks='.github/axm-witness-v0.9.1'
          cat > /tmp/chunk-sha256s <<'EOF'
          0bc54184ca08b45c8bc995b0eb2ef3eea306d1e17285d69f92c808dbbbfa14b2  .github/axm-witness-v0.9.1/site.part-00.b64
          3d80112d2cceae97c982c7091113f746c7b11216c57d96730b1e07edbd67f80a  .github/axm-witness-v0.9.1/site.part-01.b64
          2601605ad46854811032fe309fde74e4f5a4ab367fc4b7f609abcbb6fca19c3d  .github/axm-witness-v0.9.1/site.part-02.b64
          c2b2df41970e096215b1d4870e3209388bbc6986baf81c23bdf8b3066bf025a3  .github/axm-witness-v0.9.1/site.part-03.b64
          7497ae9c2d3c19b68ae41b51b172ef8a7f43d7ac0f5e9617d08ebd0611c8f044  .github/axm-witness-v0.9.1/site.part-04.b64
          d33f0e9ff55ab658cf115f6a2a3b091afb5fc4f26e24d917df4cebe0bafbee6f  .github/axm-witness-v0.9.1/site.part-05.b64
          d4bbd3cf45b8ace68aab6ecb76a72a6882f03f378bf803ab19d06400f1624c15  .github/axm-witness-v0.9.1/site.part-06.b64
          54b86c30856b0b1e590054505467fee85a1af48eb64148b6f6ede8e5616efc36  .github/axm-witness-v0.9.1/site.part-07.b64
          aec634585125b3f7590fb25ffe14a53a8d8729144bf9723d656244378b985597  .github/axm-witness-v0.9.1/site.part-08.b64
          f4314fccee7e917e4f664495806454fabe16b7fd175b5e82808a16ef3a88e84c  .github/axm-witness-v0.9.1/site.part-09.b64
          1c61269068e173d98ebba53f2d46cfe0e9a991ea05213ac320177fa0531fe6cc  .github/axm-witness-v0.9.1/site.part-10.b64
          2006e1d2b1938c2b073e1668f966e904dcbefe887e5b20724cbfc97dc9b32c7f  .github/axm-witness-v0.9.1/site.part-11.b64
          dab56e57af72d54fd61646e280c799a12f074f70c3ba291bae6af0305bda02cb  .github/axm-witness-v0.9.1/site.part-12.b64
          EOF
          sha256sum -c /tmp/chunk-sha256s
          cat "$chunks"/site.part-*.b64 | base64 --decode > /tmp/site.zip
          test "$(wc -c </tmp/site.zip)" -eq 108298
          test "$(sha256sum /tmp/site.zip | awk '{print $1}')" = b7c70b31e1756543aa2323f1361e0393db488fc4855a9341cc28932d6379412c
          unzip -t /tmp/site.zip
          rm -rf axm-witness witness
          mkdir axm-witness
          unzip -q /tmp/site.zip -d axm-witness
          test "$(find axm-witness -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = '.nojekyll index.html '
          test "$(wc -c <axm-witness/index.html)" -eq 497004
          test "$(sha256sum axm-witness/index.html | awk '{print $1}')" = d5d1f33f6cb2981497489f24468939f752cc5de39e66ebcf4ff11838ad1843f7

      - name: Integrate the public directory and continuity map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          row = "| [`axm-witness/`](axm-witness/) | Department-controlled local export-ledger pilot for authorized Flock-shaped exports: exact source custody, signed evidence and human-decision history, rationale-bearing review, tamper detection, encrypted backup and same-key restoration, interrupted-import recovery, duplicate refusal, and replacement lineage | [AXM Witness Department Ledger 0.9.1](https://bigbirdreturns.github.io/axm-tools/axm-witness/) — 30/30 native qualification; upstream delivery completeness remains outside the ledger |\n"
          if 'AXM Witness Department Ledger 0.9.1' not in text:
              marker = '| [`polybolos/`](polybolos/) |'
              assert marker in text
              text = text.replace(marker, row + marker, 1)
          readme.write_text(text, encoding='utf-8', newline='\n')

          directory = Path('index.html')
          text = directory.read_text(encoding='utf-8')
          card = '''<div class="tool">
  <div class="title"><a href="axm-witness/">AXM Witness Department Ledger 0.9.1</a></div>
  <div class="desc">A department-controlled local export-ledger pilot for authorized Flock-shaped exports. It preserves exact source bytes, signs evidence and rationale-bearing human decisions, detects source and state tampering, supports encrypted full-ledger backup and same-key restoration, recovers interrupted imports, refuses duplicates, and retains replacement lineage. The native release qualification passes 30 of 30 controls; upstream delivery completeness remains outside the ledger.</div>
  <a class="open" href="axm-witness/">Open AXM Witness →</a>
</div>

'''
          if 'AXM Witness Department Ledger 0.9.1' not in text:
              marker = '<div class="tool">\n  <div class="title"><a href="polybolos/">'
              assert marker in text
              text = text.replace(marker, card + marker, 1)
          directory.write_text(text, encoding='utf-8', newline='\n')

          continuity = Path('CONTINUITY.md')
          text = continuity.read_text(encoding='utf-8')
          entry = "- `axm-witness/` — AXM Witness Department Ledger 0.9.1: an exact-byte, department-controlled local export-ledger pilot for authorized Flock-shaped exports, qualified 30/30 under native browser storage and WebCrypto. It proves department custody and decisions after receipt; vendor-declared completeness and pre-delivery origin remain external boundaries.\n"
          if 'AXM Witness Department Ledger 0.9.1' not in text:
              marker = '- `pta-tracker/` — the living tool:'
              assert marker in text
              text = text.replace(marker, entry + marker, 1)
          continuity.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Remove one-shot transport and commit the exact release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/axm-witness-v0.9.1
          rm -f .github/workflows/axm-witness-bootstrap-0.9.1.yml
          rm -f .github/workflows/axm-witness-bootstrap-pr-0.9.1.yml
          git config user.name 'axm-witness-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No release change produced'; exit 1; }
          git commit -m 'axm-witness: publish exact Department Ledger 0.9.1 site'
          git push origin HEAD:repair/axm-witness-v0-9-1-exact
