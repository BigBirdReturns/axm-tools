name: Repair Manzanita P9 not-applicable review reason

on:
  push:
    branches:
      - agent/manzanita-estate-parity-021
    paths:
      - ".github/workflows/manzanita-p9-not-applicable-reason-repair.yml"
      - ".github/scripts/manzanita-p9-not-applicable-reason-repair.py"

permissions:
  contents: write

concurrency:
  group: manzanita-p9-not-applicable-reason-repair
  cancel-in-progress: false

jobs:
  repair-and-publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-estate-parity-021
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact schema dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Apply the bounded review-reason correction
        run: python .github/scripts/manzanita-p9-not-applicable-reason-repair.py

      - name: Prove review schemas validator law and regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            manzanita-next/parity/build_parity.py \
            manzanita-next/parity/tests/test_parity.py \
            programs/manzanita-99/review-board/validate_review_board.py
          python -m json.tool manzanita-next/parity/review/M99-RB-PKT-011.json > /dev/null
          python -m json.tool manzanita-next/parity/review/M99-RB-DEC-011.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("programs/manzanita-99/review-board")
          pairs = (
              (
                  Path("manzanita-next/parity/review/M99-RB-PKT-011.json"),
                  root / "review-packet.schema.json",
              ),
              (
                  Path("manzanita-next/parity/review/M99-RB-DEC-011.json"),
                  root / "review-decision.schema.json",
              ),
          )
          for value_path, schema_path in pairs:
              value = json.loads(value_path.read_text())
              Draft202012Validator(json.loads(schema_path.read_text())).validate(value)
              gates = value.get("gates", value.get("gate_disposition"))
              for gate_id, row in gates.items():
                  if row["state"] == "not_applicable":
                      reason = row["reason"].lower()
                      assert "not" in reason or "no " in reason, (value_path, gate_id)
          PY
          python -m unittest discover \
            -s manzanita-next/parity/tests \
            -p "test_parity.py"

      - name: Publish only the corrected P9 review source
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -rf \
            manzanita-next/parity/out \
            manzanita-next/parity/out-relative
          git config user.name "manzanita-p9-review-reason-repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            manzanita-next/parity/review/M99-RB-PKT-011.json \
            manzanita-next/parity/review/M99-RB-DEC-011.json \
            manzanita-next/parity/tests/test_parity.py
          git commit -m "Manzanita: bound P9 not-applicable accessibility review"
          git push origin HEAD:agent/manzanita-estate-parity-021
