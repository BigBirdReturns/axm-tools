name: Finish Manzanita working model public surface v4

on:
  push:
    branches:
      - fix/manzanita-working-model-editorial-finish-v1
    paths:
      - '.github/workflows/manzanita-working-model-editorial-finish-v11.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final editorial program and normalize rendered-text assertions
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/manzanita_working_model_final_finish.py
          python - <<'PY'
          from pathlib import Path

          static_path = Path('manzanita-working-model/tests/public_contract_test.py')
          static = static_path.read_text(encoding='utf-8')
          bad = '    require("details class="evidence-details"" not in html, "redundant technical disclosure remains")\n'
          good = '    require(\'details class="evidence-details"\' not in html, "redundant technical disclosure remains")\n'
          if static.count(bad) != 1:
              raise SystemExit(f'generated quote repair anchor count differs: {static.count(bad)}')
          static_path.write_text(static.replace(bad, good, 1), encoding='utf-8')

          assertion_replacements = {
              '        assert page.locator(".console-kicker").inner_text() == "Demonstration trace"\n':
                  '        assert page.locator(".console-kicker").inner_text().lower() == "demonstration trace"\n',
              '        assert "No private records" in page.locator(".attention-instrument .instrument-foot").inner_text()\n':
                  '        assert "no private records" in page.locator(".attention-instrument .instrument-foot").inner_text().lower()\n',
              '        assert page.locator(\'label:has(#pilot-venue) > span\').inner_text() == "Venue / participant group"\n':
                  '        assert page.locator(\'label:has(#pilot-venue) > span\').inner_text().lower() == "venue / participant group"\n',
              '        assert page.locator(\'label:has(#pilot-resources) > span\').inner_text() == "Available resources"\n':
                  '        assert page.locator(\'label:has(#pilot-resources) > span\').inner_text().lower() == "available resources"\n',
          }
          for name in ['browser_test.py', 'live_browser_test.py']:
              path = Path('manzanita-working-model/tests') / name
              text = path.read_text(encoding='utf-8')
              for old, new in assertion_replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'{name}: rendered assertion anchor count differs for {old.strip()!r}: {text.count(old)}')
                  text = text.replace(old, new, 1)
              text = text.replace('text.matchAll(/\\S+/g)', 'text.matchAll(/\\\\S+/g)')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manzanita-working-model-editorial-finish-v6.yml
          rm -f .github/workflows/manzanita-working-model-editorial-finish-v7.yml
          rm -f .github/workflows/manzanita-working-model-editorial-finish-v8.yml
          rm -f .github/workflows/manzanita-working-model-editorial-finish-v9.yml
          rm -f .github/workflows/manzanita-working-model-editorial-finish-v10.yml
          rm -f .github/workflows/manzanita-working-model-editorial-finish-v11.yml
          rm -f .github/scripts/manzanita_working_model_final_finish.py

      - name: Qualify source, behavior, layout, and packet controls
        shell: bash
        run: |
          set -euo pipefail
          python -W error::SyntaxWarning -m py_compile \
            manzanita-working-model/tests/public_contract_test.py \
            manzanita-working-model/tests/browser_test.py \
            manzanita-working-model/tests/live_browser_test.py \
            manzanita-working-model/tests/live_readback.py
          node --check manzanita-working-model/app.js
          python manzanita-working-model/tests/public_contract_test.py
          python -m pip install --disable-pip-version-check playwright==1.57.0
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            export MW_CHROMIUM_EXECUTABLE="$browser"
          else
            python -m playwright install --with-deps chromium
          fi
          export MW_WORKING_MODEL_SCREENSHOT_DIR="$RUNNER_TEMP/manzanita-working-model-final-surface"
          python -W error::SyntaxWarning manzanita-working-model/tests/browser_test.py

      - name: Retain exact visual and packet review evidence
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-working-model-final-surface-${{ github.sha }}
          path: ${{ runner.temp }}/manzanita-working-model-final-surface
          if-no-files-found: error
          retention-days: 30

      - name: Commit qualified public surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-editorial-bot'
          git config user.email 'actions@users.noreply.github.com'
          python - <<'PY'
          import subprocess

          required = {
              'manzanita-working-model/WORKING_MODEL_CONTRACT.json',
              'manzanita-working-model/app.js',
              'manzanita-working-model/index.html',
              'manzanita-working-model/tests/browser_test.py',
              'manzanita-working-model/tests/live_browser_test.py',
              'manzanita-working-model/tests/public_contract_test.py',
          }
          allowed = required | {
              '.github/scripts/manzanita_working_model_final_finish.py',
              '.github/workflows/manzanita-working-model-editorial-finish-v6.yml',
              '.github/workflows/manzanita-working-model-editorial-finish-v7.yml',
              '.github/workflows/manzanita-working-model-editorial-finish-v8.yml',
              '.github/workflows/manzanita-working-model-editorial-finish-v9.yml',
              '.github/workflows/manzanita-working-model-editorial-finish-v10.yml',
              '.github/workflows/manzanita-working-model-editorial-finish-v11.yml',
          }
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          observed = {row[3:] for row in rows}
          missing = required - observed
          unexpected = observed - allowed
          if missing or unexpected:
              raise SystemExit(
                  'changed-path gate failed\n'
                  f'missing={sorted(missing)}\n'
                  f'unexpected={sorted(unexpected)}\n'
                  f'observed={sorted(observed)}'
              )
          PY
          git add -A
          git commit -m 'manzanita: finish public working-model surface'
          git push origin HEAD
