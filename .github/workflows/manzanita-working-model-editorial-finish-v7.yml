name: Finish Manzanita working model plain-language cleanup v2

on:
  push:
    branches:
      - fix/manzanita-working-model-editorial-finish-v1
    paths:
      - '.github/workflows/manzanita-working-model-editorial-finish-v7.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize cleanup and normalize generated test blocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import textwrap
          from pathlib import Path

          root = Path('manzanita-working-model')
          controller = Path('.github/workflows/manzanita-working-model-editorial-finish-v6.yml')
          source = controller.read_text(encoding='utf-8')
          anchor = source.index('      - name: Remove final explanatory and status residue')
          marker = "          python - <<'PY'\n"
          start = source.index(marker, anchor) + len(marker)
          end = source.index("\n          PY\n", start)
          exec(compile(textwrap.dedent(source[start:end]), '<plain-language-v6-materializer>', 'exec'), {})

          static_path = root / 'tests/public_contract_test.py'
          static = static_path.read_text(encoding='utf-8')
          block_start_token = 'require("Demonstration trace" in html, "plain-language demonstration label absent")'
          block_end_token = 'require("pilot decisions complete" in js, "plain-language form status absent")'
          hit = static.index(block_start_token)
          block_start = static.rfind('\n', 0, hit) + 1
          end_hit = static.index(block_end_token, hit) + len(block_end_token)
          static_lines = [
              '    require("Demonstration trace" in html, "plain-language demonstration label absent")',
              '    require("No private records" in html, "privacy-forward record label absent")',
              '    require("Prepared output" in html and "Prohibited claims and effects" in html, "case consequence labels differ")',
              '    require("Venue / participant group" in html and "Available resources" in html, "plain-language form labels differ")',
              '    for residue in ["no active case", "0 participant records", "public-safe", "source-linked", "adverse standing", "execution basis", "resource envelope", "technical system", "working-model front door"]:',
              '        require(residue not in html.lower(), f"plain-language residue remains in public HTML: {residue}")',
              '    require("public-safe" not in js.lower(), "public-safe application rhetoric remains")',
              '    require("pilot decisions complete" in js, "plain-language form status absent")',
          ]
          static = static[:block_start] + '\n'.join(static_lines) + static[end_hit:]
          static_path.write_text(static, encoding='utf-8')

          browser_lines = [
              '        assert page.locator(".console-kicker").inner_text() == "Demonstration trace"',
              '        assert "No private records" in page.locator(".attention-instrument .instrument-foot").inner_text()',
              '        assert page.locator("#form-status").inner_text().startswith("0 of 5 pilot decisions complete.")',
              '        assert page.locator(\'label:has(#pilot-venue) > span\').inner_text() == "Venue / participant group"',
              '        assert page.locator(\'label:has(#pilot-resources) > span\').inner_text() == "Available resources"',
          ]
          for name in ['browser_test.py', 'live_browser_test.py']:
              path = root / 'tests' / name
              test = path.read_text(encoding='utf-8')
              token = 'assert page.locator(".console-kicker").inner_text() == "Demonstration trace"'
              hit = test.index(token)
              block_start = test.rfind('\n', 0, hit) + 1
              end_token = 'assert page.locator(\'label:has(#pilot-resources) > span\').inner_text() == "Available resources"'
              end_hit = test.index(end_token, hit) + len(end_token)
              test = test[:block_start] + '\n'.join(browser_lines) + test[end_hit:]
              path.write_text(test, encoding='utf-8')
          PY

      - name: Remove one-shot controllers
        run: |
          rm '.github/workflows/manzanita-working-model-editorial-finish-v6.yml'
          rm '.github/workflows/manzanita-working-model-editorial-finish-v7.yml'

      - name: Qualify the complete public surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            manzanita-working-model/tests/public_contract_test.py \
            manzanita-working-model/tests/browser_test.py \
            manzanita-working-model/tests/live_browser_test.py \
            manzanita-working-model/tests/live_readback.py
          node --check manzanita-working-model/app.js
          python manzanita-working-model/tests/public_contract_test.py
          python -m pip install --disable-pip-version-check playwright==1.57.0
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            export MW_CHROMIUM_EXECUTABLE="$browser"
          else
            python -m playwright install --with-deps chromium
          fi
          export MW_WORKING_MODEL_SCREENSHOT_DIR="$RUNNER_TEMP/manzanita-working-model-plain-language-final"
          python manzanita-working-model/tests/browser_test.py

      - name: Retain final exact review evidence
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-working-model-plain-language-final-${{ github.sha }}
          path: ${{ runner.temp }}/manzanita-working-model-plain-language-final
          if-no-files-found: error
          retention-days: 30

      - name: Commit the qualified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-editorial-bot'
          git config user.email 'actions@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          required = {
              'manzanita-working-model/index.html',
              'manzanita-working-model/app.js',
              'manzanita-working-model/tests/browser_test.py',
              'manzanita-working-model/tests/live_browser_test.py',
              'manzanita-working-model/tests/public_contract_test.py',
          }
          allowed = required | {
              '.github/workflows/manzanita-working-model-editorial-finish-v6.yml',
              '.github/workflows/manzanita-working-model-editorial-finish-v7.yml',
          }
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          observed = {row[3:] for row in rows}
          missing = required - observed
          unexpected = observed - allowed
          if missing or unexpected:
              raise SystemExit(f'changed-path gate failed\nmissing={sorted(missing)}\nunexpected={sorted(unexpected)}\nobserved={sorted(observed)}')
          PY
          git add -A
          git commit -m 'manzanita: remove final public-language residue'
          git push origin HEAD
