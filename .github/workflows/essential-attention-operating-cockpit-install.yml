name: Install Essential Attention Operating Cockpit

on:
  push:
    branches:
      - agent/essential-attention-operating-cockpit
    paths:
      - .github/workflows/essential-attention-operating-cockpit-install.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore reviewed operating-cockpit installer
        shell: bash
        run: |
          cat .github/ea-operating-cockpit-installer/part* > /tmp/ea-operating-cockpit.b64
          base64 -d /tmp/ea-operating-cockpit.b64 > /tmp/ea-operating-cockpit.tar.gz
          echo "02de65b1cd1ae6bbef9e57a93b209c489f0b5fa450f5e486a33f4adc90594cc7  /tmp/ea-operating-cockpit.tar.gz" | sha256sum -c -
          mkdir -p /tmp/ea-operating-cockpit
          tar -xzf /tmp/ea-operating-cockpit.tar.gz -C /tmp/ea-operating-cockpit
          python /tmp/ea-operating-cockpit/deploy_upgrade.py
          cp /tmp/ea-operating-cockpit/essential-attention/tests/public_contract_test.py essential-attention/tests/public_contract_test.py
          cp /tmp/ea-operating-cockpit/essential-attention/tests/browser_test.py essential-attention/tests/browser_test.py

      - name: Verify static contract
        run: |
          python essential-attention/tests/public_contract_test.py
          node --check /tmp/essential-attention-inline.js

      - name: Drive full operating cockpit
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          python essential-attention/tests/browser_test.py

      - name: Commit qualified operating cockpit
        run: |
          rm -rf .github/ea-operating-cockpit-installer
          rm -f .github/workflows/essential-attention-operating-cockpit-install.yml
          git config user.name "essential-attention-cockpit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- essential-attention README.md index.html identity/axm/PROPERTY-FLAVORS.md .github/ea-operating-cockpit-installer .github/workflows/essential-attention-operating-cockpit-install.yml
          git diff --cached --check
          git commit -m "essential-attention: install operating cockpit"
          git push origin HEAD:agent/essential-attention-operating-cockpit
