name: Converge organ evolution workbench

on:
  push:
    branches:
      - agent/organ-evolution-evaluation-surface
    paths:
      - '.github/workflows/converge-organ-evolution.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/converge-organ-evolution.yml'
      - '.organ-payload/**'
      - 'organ-evolution/**'

permissions:
  contents: write

concurrency:
  group: converge-organ-evolution-workbench
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/organ-evolution-evaluation-surface
          fetch-depth: 0
          show-progress: false

      - name: Rehydrate the reviewed self-contained tool
        shell: bash
        run: |
          set -euo pipefail
          cat .organ-payload/part-* | base64 --decode > "$RUNNER_TEMP/organ-evolution-payload.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/organ-evolution-payload.tar.gz" | cut -d' ' -f1)" = "d5d2019c8ba6c29eaf61490d47bd1a1d77bd0cb3bcfc0679bf594148eead3d87"
          tar -xzf "$RUNNER_TEMP/organ-evolution-payload.tar.gz"

      - name: Add the public routing and succession records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          source = index.read_text(encoding='utf-8')
          anchor = '''<div class="tool">
            <div class="title"><a href="pta-tracker/">PTA Legislation Tracker</a></div>'''
          card = '''<div class="tool">
            <div class="title"><a href="organ-evolution/">Organ Evolution Evaluation Surface</a></div>
            <div class="desc">A local-only estate workbench for comparing retain, harden, split,
              merge, graft, commoditize, replace, dormancy, and retirement proposals. It keeps
              function, authority, evidence, motivation, credit, suppliers, migration, and
              succession separate, then runs explicit stress cases before a decision can be recorded.</div>
            <a class="open" href="organ-evolution/">Open the workbench →</a>
          </div>

          ''' + anchor
          if source.count(anchor) != 1:
              raise SystemExit(f'Expected one root-page insertion anchor, found {source.count(anchor)}.')
          index.write_text(source.replace(anchor, card), encoding='utf-8', newline='\n')

          readme = Path('README.md')
          source = readme.read_text(encoding='utf-8')
          anchor = '| [`pta-tracker/`](pta-tracker/) | District-first legislation watch for an Arcadia USD K-6 PTA: nightly fetch, relevance filter, one-click monthly board report | [static page](https://bigbirdreturns.github.io/axm-tools/pta-tracker/) + nightly Action |'
          row = '| [`organ-evolution/`](organ-evolution/) | Evaluate organ anatomy and candidate evolutions against function, authority, evidence, actors, migration, stress, and succession without a backend | [static workbench](https://bigbirdreturns.github.io/axm-tools/organ-evolution/) |\n' + anchor
          if source.count(anchor) != 1:
              raise SystemExit(f'Expected one README insertion anchor, found {source.count(anchor)}.')
          readme.write_text(source.replace(anchor, row), encoding='utf-8', newline='\n')

          continuity = Path('CONTINUITY.md')
          source = continuity.read_text(encoding='utf-8')
          anchor = '''- `pta-tracker/` — the living tool: nightly legislation fetch for a K-6
            PTA, relevance filter, board report, offline PWA. Its README is the
            operating manual.'''
          record = '''- `organ-evolution/` — the local-only estate-anatomy and evolution
            workbench. It separates organ identity, function, implementation, supplier,
            evidence, motive, authority, migration, and succession; guarded by
            `organ-evolution/scripts/validate.py` and
            `tests/pages/verify_organ_evolution.mjs`.
          ''' + anchor
          if source.count(anchor) != 1:
              raise SystemExit(f'Expected one continuity-map insertion anchor, found {source.count(anchor)}.')
          continuity.write_text(source.replace(anchor, record), encoding='utf-8', newline='\n')
          PY

      - name: Qualify the static and bounded source estate before publication
        shell: bash
        run: |
          set -euo pipefail
          python organ-evolution/scripts/validate.py
          node --check organ-evolution/core.js
          node --check organ-evolution/views.js
          node --check organ-evolution/app.js
          node --check tests/pages/verify_organ_evolution.mjs
          git diff --check

      - name: Publish one carrier-free implementation commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .organ-payload
          git rm .github/workflows/converge-organ-evolution.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add organ-evolution tests/pages/verify_organ_evolution.mjs .github/workflows/organ-evolution-check.yml index.html README.md CONTINUITY.md
          git diff --cached --check
          git commit -m 'Build the organ evolution evaluation surface'
          git push origin HEAD:agent/organ-evolution-evaluation-surface
