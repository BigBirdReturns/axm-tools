name: Manzanita Works Operating Fabric v0.2.0 live observation

on:
  push:
    branches: [agent/manzanita-works-live-observation-v0-2]
    paths:
      - ".github/workflows/manzanita-works-live-observe-v0-2.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MW_LIVE_BASE: https://bigbirdreturns.github.io/axm-tools/manzanita-works/
      MW_PRODUCT_SHA: e6e4693d8141e94743bafd708a3b8d3a7fb8c7b5
      MW_PAGES_RUN_ID: "32271637239"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify every qualified public byte
        run: |
          set -euo pipefail
          mkdir -p /tmp/mw-live/files
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote, urljoin
          from urllib.request import Request, urlopen

          base = os.environ["MW_LIVE_BASE"]
          source = quote(os.environ["MW_PRODUCT_SHA"], safe="")
          qualification = json.loads(Path("manzanita-works/QUALIFICATION.json").read_text(encoding="utf-8"))
          observed = {}
          out = Path("/tmp/mw-live/files")
          for relative, expected in sorted(qualification["files"].items()):
              url = urljoin(base, relative) + f"?v={source}"
              request = Request(url, headers={"User-Agent": "manzanita-works-live-observer/0.2.0"})
              with urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise SystemExit(f"HTTP {response.status} for {relative}")
                  payload = response.read()
              digest = hashlib.sha256(payload).hexdigest()
              actual = {"bytes": len(payload), "sha256": digest}
              if actual != expected:
                  raise SystemExit(f"live byte mismatch for {relative}: observed={actual} expected={expected}")
              target = out / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              observed[relative] = actual
          Path("/tmp/mw-live/files.json").write_text(
              json.dumps(observed, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps({"result": "PASS", "qualified_files": len(observed)}, indent=2))
          PY

      - name: Resolve deterministic Chromium runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.57.0
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            echo "MW_CHROMIUM_EXECUTABLE=$browser" >> "$GITHUB_ENV"
            "$browser" --version
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Replay the deployed fundraising-focused surface
        env:
          MW_DREAMBOARD_URL: https://bigbirdreturns.github.io/axm-tools/manzanita-works/?focus=fundraising&v=e6e4693d8141e94743bafd708a3b8d3a7fb8c7b5
          MW_DREAMBOARD_SCREENSHOT_DIR: ${{ runner.temp }}/manzanita-works-live-screens
        run: python manzanita-works/tests/live_browser_test.py

      - name: Materialize the live observation receipt
        env:
          MW_RUN_ID: ${{ github.run_id }}
          MW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "schema": "manzanita-works/operating-dreamboard-live-observation@1",
              "release": "0.2.0",
              "state": "PASS",
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "public_route": os.environ["MW_LIVE_BASE"],
              "product_source_sha": os.environ["MW_PRODUCT_SHA"],
              "pages_run_id": int(os.environ["MW_PAGES_RUN_ID"]),
              "live_observation_run_id": int(os.environ["MW_RUN_ID"]),
              "run_attempt": int(os.environ["MW_RUN_ATTEMPT"]),
              "contracts": {
                  "exact_qualified_files": "PASS",
                  "deployed_browser_replay": "PASS",
                  "fundraising_focus": "PASS",
                  "unexpected_external_requests": 0,
                  "browser_errors": 0,
              },
              "files": json.loads(Path("/tmp/mw-live/files.json").read_text(encoding="utf-8")),
              "authority": {
                  "organizational_effect": "none",
                  "payment_effect": "none",
                  "credit_effect": "none",
                  "source_system_writeback": "none",
              },
          }
          Path("/tmp/mw-live/LIVE_OBSERVATION.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: manzanita-works-operating-dreamboard-v0.2.0-live-observation
          path: |
            ${{ runner.temp }}/manzanita-works-live-screens
            /tmp/mw-live/files.json
            /tmp/mw-live/LIVE_OBSERVATION.json
          if-no-files-found: error
          retention-days: 30
