name: AXM Witness current working 0.8.0

on:
  pull_request:
    paths:
      - "axm-witness/**"
      - "README.md"
      - "index.html"
      - "CONTINUITY.md"
      - ".github/workflows/axm-witness-current-working.yml"
  push:
    branches: [main]
    paths:
      - "axm-witness/**"
      - "README.md"
      - "index.html"
      - "CONTINUITY.md"
      - ".github/workflows/axm-witness-current-working.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify exact release bytes and package custody
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path

          root = Path('.')
          public = root / 'axm-witness' / 'index.html'
          release_root = root / 'axm-witness' / 'releases' / '0.8.0'
          expected_html_sha = '7bc27e0a228dbb19c34aca874882046be8272057b72fb8fc0efc8221e6b2f3a5'
          expected_html_bytes = 462_156
          expected_zip_sha = '90a731fb53334d9613e8467a6cbdfa9ca15deafb8bc151d9715fabb0634aa60c'
          expected_zip_bytes = 1_507_475

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert public.is_file(), public
          assert public.stat().st_size == expected_html_bytes, public.stat().st_size
          assert sha256(public) == expected_html_sha

          zip_matches = sorted(release_root.rglob('AXM_Witness_CURRENT_WORKING_FILES.zip'))
          assert len(zip_matches) == 1, zip_matches
          package = zip_matches[0]
          assert package.stat().st_size == expected_zip_bytes, package.stat().st_size
          assert sha256(package) == expected_zip_sha

          with zipfile.ZipFile(package) as archive:
              bad = archive.testzip()
              assert bad is None, bad
              html_members = []
              for info in archive.infolist():
                  if info.is_dir() or not info.filename.lower().endswith('.html'):
                      continue
                  body = archive.read(info)
                  if hashlib.sha256(body).hexdigest() == expected_html_sha:
                      html_members.append((info.filename, len(body)))
              assert html_members, 'verified HTML is absent from current-working ZIP'
              assert any(size == expected_html_bytes for _, size in html_members), html_members

          manifest_matches = sorted(release_root.rglob('AXM_Witness_CURRENT_WORKING_MANIFEST.json'))
          assert len(manifest_matches) == 1, manifest_matches
          manifest = json.loads(manifest_matches[0].read_text(encoding='utf-8'))
          rendered = json.dumps(manifest, sort_keys=True)
          assert expected_html_sha in rendered
          assert expected_zip_sha in rendered

          qualification = json.loads((root / 'axm-witness' / 'qualification.json').read_text(encoding='utf-8'))
          assert qualification['release'] == 'axm-witness-project-editor/0.8.0'
          assert qualification['classification'] == 'QUALIFIED_LOCAL_DEMONSTRATOR'
          assert qualification['application_sha256'] == expected_html_sha
          assert qualification['application_bytes'] == expected_html_bytes
          assert qualification['current_working_files_sha256'] == expected_zip_sha
          assert qualification['current_working_files_bytes'] == expected_zip_bytes
          assert qualification['browser_controls'] == {'passed': 18, 'failed': 0}
          assert qualification['department_ledger_0_9_0_built'] is False

          readme = (root / 'README.md').read_text(encoding='utf-8')
          directory = (root / 'index.html').read_text(encoding='utf-8')
          continuity = (root / 'CONTINUITY.md').read_text(encoding='utf-8')
          assert 'axm-witness/' in readme
          assert 'axm-witness/' in directory
          assert 'axm-witness/' in continuity
          assert 'Department Ledger 0.9.0' not in public.read_text(encoding='utf-8', errors='ignore')

          html = public.read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I | re.S)
          assert scripts, 'no inline runtime found'
          Path('/tmp/axm-witness-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')

          print(json.dumps({
              'application_sha256': expected_html_sha,
              'application_bytes': expected_html_bytes,
              'package_sha256': expected_zip_sha,
              'package_bytes': expected_zip_bytes,
              'verified_html_members': html_members,
              'zip_members': len(zipfile.ZipFile(package).infolist()),
          }, indent=2))
          PY

      - name: Parse the exact inline runtime
        run: node --check /tmp/axm-witness-inline.js

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Drive the published application without external network
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import threading
          from contextlib import contextmanager
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          ROOT = Path('.').resolve()

          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass

          @contextmanager
          def serve():
              handler = lambda *args, **kwargs: Quiet(*args, directory=str(ROOT), **kwargs)
              server = ThreadingHTTPServer(('127.0.0.1', 0), handler)
              thread = threading.Thread(target=server.serve_forever, daemon=True)
              thread.start()
              try:
                  yield f'http://127.0.0.1:{server.server_port}'
              finally:
                  server.shutdown()
                  thread.join(timeout=5)
                  server.server_close()

          with serve() as origin, sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(viewport={'width': 1440, 'height': 1000}, accept_downloads=True)
              page = context.new_page()
              external = []
              page_errors = []
              console_errors = []
              page.on('request', lambda request: external.append(request.url) if not request.url.startswith(origin + '/') and not request.url.startswith(('data:', 'blob:', 'about:')) else None)
              page.on('pageerror', lambda error: page_errors.append(str(error)))
              page.on('console', lambda message: console_errors.append(message.text) if message.type == 'error' else None)
              response = page.goto(origin + '/axm-witness/', wait_until='domcontentloaded')
              assert response and response.ok, response.status if response else None
              page.wait_for_timeout(750)
              assert page.title().strip()
              desktop = page.evaluate('''() => ({
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                bodyText: document.body.innerText.trim().length,
                controls: document.querySelectorAll('button,input,select,textarea,a[href]').length
              })''')
              assert desktop['bodyText'] > 100, desktop
              assert desktop['controls'] > 0, desktop
              assert desktop['scrollWidth'] <= desktop['clientWidth'] + 1, desktop

              page.set_viewport_size({'width': 390, 'height': 844})
              page.wait_for_timeout(150)
              mobile = page.evaluate('''() => ({
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                targets: [...document.querySelectorAll('button,input,select,textarea,a[href]')]
                  .filter(el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; })
                  .map(el => ({w: el.getBoundingClientRect().width, h: el.getBoundingClientRect().height}))
              })''')
              assert mobile['scrollWidth'] <= mobile['clientWidth'] + 1, mobile
              assert mobile['targets'], mobile
              assert not external, json.dumps(external)
              assert not page_errors, json.dumps(page_errors)
              assert not console_errors, json.dumps(console_errors)
              browser.close()

              print(json.dumps({'desktop': desktop, 'mobile': mobile, 'external_requests': 0}, indent=2))
          PY
