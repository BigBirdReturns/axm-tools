name: One-shot home lab capability gradient import

on:
  push:
    branches: [agent/home-lab-capability-gradient]
    paths:
      - ".import/home-lab-gradient/**"
      - ".github/workflows/home-lab-gradient-import.yml"

permissions:
  contents: write

concurrency:
  group: home-lab-gradient-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-lab-capability-gradient
          fetch-depth: 0

      - name: Wait until the complete bounded payload is present
        id: ready
        shell: bash
        run: |
          count=$(find .import/home-lab-gradient -maxdepth 1 -type f -name 'chunk-*' 2>/dev/null | wc -l)
          if [[ "$count" = "11" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "transport incomplete: chunks=$count"
          fi

      - name: Verify and materialize the exact source tree
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        env:
          EXPECTED_ARCHIVE_SHA256: b05448653e21852a42e9f4d25e056c15396bc2c966a18cb6fa78ffa7e07b5cf9
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          import zipfile

          expected = {
              'chunk-00': '4ccf233d26a8e11d5df8e474c718327605a6c2a9c4c4bbf91850930b65132fad',
              'chunk-01': 'f75d96b257e80cddd56d49e30ba4726a95b8e193978ee2a6ff1fbcfa7f8866eb',
              'chunk-02': '80ab64cf15036bec67d41919a8566618bf1da93cf4e5b449c8bc8ae73244a84c',
              'chunk-03': 'd26ea46711a30730a2bce5623c2008a7ab92221459ed6de5c8eade6bf0540092',
              'chunk-04': '2dda54ea8c3749bc033b84c2f381d7cde3a07ca64fcac5b94709ecd518e6414b',
              'chunk-05': 'f48b841a3f8ed640101bd40ae41439ad050b2188de098d10f9f23426f283bcc7',
              'chunk-06': '663005ec9988cceed7e8ac21538c5b7a414c9d4970cdf5890c71fcd6ba34dd7c',
              'chunk-07': 'fa98357672076b45d9770b21601952b5c73ca945994692ff261105d98816e3bd',
              'chunk-08': '8de73456f856d53d711ebc958b549b9fbf944a9e1c94556aa2905f89ddcdaa7f',
              'chunk-09': '3726eb8f47d2604b1f6f6e4f1bdeaee421c2eca3f92aee7c2c4fba3d0e49d6b3',
              'chunk-10': '03f8e1478bdd1baff9c2eb2e29d7d964dd838157992b0d5fcd328e16aab3fa0f',
          }
          folder = Path('.import/home-lab-gradient')
          parts = []
          for name, digest in expected.items():
              data = (folder / name).read_bytes()
              if name == 'chunk-01' and hashlib.sha256(data).hexdigest() != digest:
                  old = b'j0Z2fZJ3Uo'
                  new = b'j0Z2f2JSJ3Uo'
                  if data.count(old) != 1:
                      raise SystemExit('bounded chunk-01 repair pattern is absent or ambiguous')
                  data = data.replace(old, new, 1)
              actual = hashlib.sha256(data).hexdigest()
              if actual != digest:
                  raise SystemExit(f'{name} digest mismatch: {actual}')
              parts.append(data)

          encoded = b''.join(parts)
          if len(encoded) != 109024:
              raise SystemExit(f'encoded payload length mismatch: {len(encoded)}')
          archive_bytes = base64.b64decode(encoded, validate=True)
          archive_digest = hashlib.sha256(archive_bytes).hexdigest()
          expected_archive = 'b05448653e21852a42e9f4d25e056c15396bc2c966a18cb6fa78ffa7e07b5cf9'
          if archive_digest != expected_archive:
              raise SystemExit(f'archive digest mismatch: {archive_digest}')

          archive = Path('/tmp/home-lab-gradient.zip')
          archive.write_bytes(archive_bytes)
          root = Path('.').resolve()
          with zipfile.ZipFile(archive) as zf:
              for member in zf.infolist():
                  target = (root / member.filename).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError as exc:
                      raise SystemExit(f'archive path escapes repository: {member.filename}') from exc
              zf.extractall(root)
          PY

      - name: Replace transport with the materialized module
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf .import/home-lab-gradient
          rm -f .github/workflows/home-lab-gradient-import.yml
          python home-lab-gradient/scripts/lab.py build --now 2026-08-05T00:00:00Z
          python -m unittest discover -s home-lab-gradient/tests -v
          python home-lab-gradient/scripts/lab.py validate
          git config user.name "home-lab-gradient-import-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "home-lab-gradient: add capability planner"
          git push origin HEAD:agent/home-lab-capability-gradient
