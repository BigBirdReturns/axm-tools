name: Repair AXM Witness 0.9.2 mobile theme control

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/axm-witness-theme-mobile-repair.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Raise the mobile toggle selector above the inherited hide rule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          old = 'body.replit-v08 .topbar-actions .theme-toggle {'
          new = 'body.replit-v08 .topbar-actions .icon-button.theme-toggle:not(.guide-toggle) {'
          for relative in ('axm-witness/index.html', '.github/scripts/patch_axm_witness_theme_092.py'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{relative}: expected one mobile selector, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          app = Path('axm-witness/index.html').read_bytes()
          receipt_path = Path('.github/receipts/axm-witness-theme-0.9.2.json')
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          receipt['patched_application'] = {
              'bytes': len(app),
              'sha256': hashlib.sha256(app).hexdigest(),
          }
          receipt.pop('controls', None)
          receipt.pop('browser_observation', None)
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          python -m py_compile .github/scripts/patch_axm_witness_theme_092.py
          rm .github/workflows/axm-witness-theme-mobile-repair.yml

      - name: Commit the mobile selector repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'axm-witness-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'axm-witness: keep theme toggle visible on mobile'
          git push origin HEAD:${{ github.head_ref }}
