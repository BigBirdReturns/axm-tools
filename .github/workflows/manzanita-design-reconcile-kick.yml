name: Kick Manzanita Forkline reconciliation

on:
  push:
    branches:
      - agent/manzanita-design-constitution-004-011
    paths:
      - ".github/workflows/manzanita-design-reconcile-kick.yml"

permissions:
  contents: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-design-constitution-004-011
          fetch-depth: 0
          persist-credentials: true

      - name: Replace this one-shot trigger with a reconcile-workflow update
        run: |
          git config user.name "manzanita-design-reconcile-kick"
          git config user.email "actions@users.noreply.github.com"
          git pull --ff-only origin agent/manzanita-design-constitution-004-011
          rm .github/workflows/manzanita-design-reconcile-kick.yml
          printf '\n# Re-entered after contained review-board admission.\n' >> .github/workflows/manzanita-design-reconcile-admit.yml
          git add .github/workflows/manzanita-design-reconcile-kick.yml \
            .github/workflows/manzanita-design-reconcile-admit.yml
          git commit -m "Manzanita: re-enter Forkline reconciliation after board admission"
          git push origin HEAD:agent/manzanita-design-constitution-004-011
