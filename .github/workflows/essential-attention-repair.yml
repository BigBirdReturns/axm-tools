name: Essential Attention plain HTML repair

on:
  push:
    branches:
      - agent/essential-attention-repair
    paths:
      - .github/workflows/essential-attention-repair.yml
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  repair-validate-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Recover and validate the plain standalone runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json
          import re

          path = Path("essential-attention/index.html")
          source = path.read_text(encoding="utf-8")
          repaired = False

          if "const b='" in source and "DecompressionStream" in source:
              start_marker = "const b='"
              end_marker = "';if(!('DecompressionStream'"
              start = source.index(start_marker) + len(start_marker)
              end = source.index(end_marker, start)
              payload = source[start:end]
              if not payload.endswith("=="):
                  raise SystemExit("malformed wrapper does not have the expected terminal padding")
              data = payload[:-2]
              if len(data) != 28025:
                  raise SystemExit(f"unexpected malformed payload length: {len(data)}")

              # The published wrapper dropped one base64 character at offset 6867.
              # Restore it only long enough to recover the already-built inner HTML,
              # then publish the inner document directly so this wrapper cannot fail again.
              fixed = data[:6867] + "j" + data[6867:] + "=="
              compressed = base64.b64decode(fixed, validate=True)
              source = gzip.decompress(compressed).decode("utf-8")
              repaired = True

          required_roles = [
              "source-custodian",
              "interpreter",
              "relationship-steward",
              "attention-sovereign",
              "execution-steward",
              "verifier",
              "continuity-steward",
          ]
          checks = {
              "doctype": source.lstrip().lower().startswith("<!doctype html>"),
              "plain_no_atob": "atob(" not in source,
              "plain_no_decompression_loader": "DecompressionStream" not in source,
              "one_inline_script": source.count("<script>") == 1 and "<script src=" not in source,
              "one_inline_style": source.count("<style>") == 1,
              "no_external_stylesheet": "rel=\"stylesheet\"" not in source,
              "network_connect_none": "connect-src 'none'" in source,
              "register_objects_7": source.count("offer_id:'FAB-") == 7,
              "executive_decisions_5": source.count("decision_id:'EA-DEC-") == 5,
              "contained_roles_7": all(f"id:'{role}'" in source for role in required_roles),
              "effect_firewall": "external effect blocked" in source,
              "successor_replay": "Cold replay passed" in source,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("qualification failed: " + ", ".join(failed))

          path.write_text(source, encoding="utf-8")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = "45cd7a8768ef260b3aeae1dfafc63e2cbe70da588ec90db7eb09cf6a7b895a52"
          if digest != expected:
              raise SystemExit(f"recovered artifact digest changed: {digest}")

          script = re.search(r"<script>(.*?)</script>", source, re.S)
          if not script:
              raise SystemExit("inline runtime script missing")
          Path("/tmp/essential-attention-inline.js").write_text(script.group(1), encoding="utf-8")

          receipt = {
              "schema": "essential-attention/pages-qualification@1",
              "release": "1.0.2",
              "artifact": "essential-attention/index.html",
              "repaired_from_malformed_wrapper": repaired,
              "sha256": digest,
              "bytes": path.stat().st_size,
              "checks": checks,
              "operator_surface": "plain standalone HTML",
              "external_effect_adapters": 0,
          }
          Path("essential-attention/QUALIFICATION.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2))
          PY

      - name: Parse the inline runtime
        run: node --check /tmp/essential-attention-inline.js

      - name: Commit the recovered direct HTML to main
        run: |
          git config user.name "essential-attention-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add essential-attention/index.html essential-attention/QUALIFICATION.json .github/workflows/essential-attention-repair.yml
          git commit -m "essential-attention: publish plain standalone runtime"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the repository site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-essential-attention-${{ github.run_attempt }}

      - name: Deploy the repaired site
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-essential-attention-${{ github.run_attempt }}
