name: Admit Manzanita contained review board

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "programs/manzanita-99/review-board/**"
      - ".github/workflows/manzanita-review-board.yml"
      - ".github/workflows/manzanita-review-board-admission.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  qualify-and-admit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/manzanita-review-board-027-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      ORIGINAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-review-board-027-v2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove exact branch and bounded diff
        run: |
          test "$(git rev-parse HEAD)" = "$ORIGINAL_HEAD_SHA"
          git fetch --no-tags origin main
          python - <<'PY'
          import subprocess

          changed = subprocess.run(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed_exact = {
              ".github/workflows/manzanita-review-board.yml",
              ".github/workflows/manzanita-review-board-admission.yml",
          }
          invalid = [
              path
              for path in changed
              if path not in allowed_exact
              and not path.startswith("programs/manzanita-99/review-board/")
          ]
          if invalid:
              raise SystemExit(f"Review-board PR contains out-of-scope paths: {invalid}")
          if not any(path.startswith("programs/manzanita-99/review-board/") for path in changed):
              raise SystemExit("Review-board PR contains no review-board object")
          PY
          git diff --quiet origin/main...HEAD -- manzanita manzanita-next

      - name: Confirm bootstrap corrections landed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          activation = json.loads(
              Path("programs/manzanita-99/review-board/ACTIVATION_STATE.json")
              .read_text(encoding="utf-8")
          )
          assert "constitutional task-count mutation" in activation["prohibited_claims"]

          workflow = Path(".github/workflows/manzanita-review-board.yml").read_text(
              encoding="utf-8"
          )
          assert "expected_head = os.environ" in workflow
          assert "Path(\"/dev/stdin\")" not in workflow
          assert not Path(".github/workflows/manzanita-review-board-bootstrap.yml").exists()
          PY

      - name: Qualify the submitted head
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m py_compile programs/manzanita-99/review-board/validate_review_board.py
          python -m unittest discover \
            -s programs/manzanita-99/review-board/tests \
            -p "test_*.py"
          rm -rf programs/manzanita-99/review-board/out
          python programs/manzanita-99/review-board/validate_review_board.py \
            --repo-root . \
            --receipt programs/manzanita-99/review-board/out/BOARD_ACTIVATION_RECEIPT.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path("programs/manzanita-99/review-board/out/BOARD_ACTIVATION_RECEIPT.json")
              .read_text(encoding="utf-8")
          )
          assert receipt["result"] == "PASS"
          assert receipt["reviewed_head"] == os.environ["REVIEW_HEAD_SHA"]
          assert receipt["outcome"] == "admit_governance_only"
          assert receipt["release_effect"] == "none"
          assert receipt["constitutional_count_effect"] == "none"
          assert receipt["seat_count"] == 12
          assert receipt["open_vetoes"] == []
          assert receipt["open_critical_or_high_defects"] == []
          PY

      - name: Remove the temporary admission actuator
        run: |
          rm .github/workflows/manzanita-review-board-admission.yml
          git config user.name "manzanita-review-board-admission"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/manzanita-review-board-admission.yml
          git commit -m "Manzanita: seal the review board admission candidate"
          git push origin HEAD:agent/manzanita-review-board-027-v2
          echo "SEALED_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Requalify the sealed head
        run: |
          test "$(git rev-parse HEAD)" = "$SEALED_HEAD_SHA"
          test ! -e .github/workflows/manzanita-review-board-admission.yml
          git fetch --no-tags origin main
          git diff --quiet origin/main...HEAD -- manzanita manzanita-next
          REVIEW_HEAD_SHA="$SEALED_HEAD_SHA" python -m unittest discover \
            -s programs/manzanita-99/review-board/tests \
            -p "test_*.py"
          rm -rf programs/manzanita-99/review-board/out
          REVIEW_HEAD_SHA="$SEALED_HEAD_SHA" \
            python programs/manzanita-99/review-board/validate_review_board.py \
            --repo-root . \
            --receipt programs/manzanita-99/review-board/out/BOARD_ACTIVATION_RECEIPT.json
          REVIEW_HEAD_SHA="$SEALED_HEAD_SHA" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path("programs/manzanita-99/review-board/out/BOARD_ACTIVATION_RECEIPT.json")
              .read_text(encoding="utf-8")
          )
          assert receipt["reviewed_head"] == os.environ["REVIEW_HEAD_SHA"]
          assert receipt["payload_sha256"]
          assert receipt["outcome"] == "admit_governance_only"
          assert receipt["release_effect"] == "none"
          PY

      - name: Mark ready and merge the exact sealed head
        run: |
          if test "$(gh pr view "$PR_URL" --json isDraft --jq .isDraft)" = "true"; then
            gh pr ready "$PR_URL"
          fi
          response="$(gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$SEALED_HEAD_SHA" \
            -f commit_title="Manzanita: activate the contained multidisciplinary review board" \
            -f commit_message="Admit the evidence-backed review mechanism with governance-only effect. Preserve the historical public route, constitutional task-count boundary, and all product, release, and external-effect holds.")"
          echo "$response" | jq -e '.merged == true'
