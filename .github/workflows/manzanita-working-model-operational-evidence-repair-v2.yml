name: Repair Manzanita working-model evidence visuals v2

on:
  push:
    branches:
      - fix/manzanita-working-model-operational-evidence-v1
    paths:
      - '.github/workflows/manzanita-working-model-operational-evidence-repair-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize the operational evidence surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import textwrap
          from pathlib import Path

          ROOT = Path('manzanita-working-model')
          SOURCE_WORKFLOW = Path('.github/workflows/manzanita-working-model-operational-evidence-repair.yml')
          source = SOURCE_WORKFLOW.read_text(encoding='utf-8')

          def extract(pattern: str, label: str) -> str:
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(f'could not recover {label} payload from V1 controller')
              return match.group(1)

          def html_block(payload: str, base_indent: int) -> str:
              lines = textwrap.dedent(payload).splitlines()
              rendered = []
              for line in lines:
                  if not line:
                      rendered.append('')
                  elif line[0].isspace():
                      rendered.append(line)
                  else:
                      rendered.append(' ' * base_indent + line)
              return '\n'.join(rendered)

          new_hero = html_block(
              extract(r"new_hero = '''(.*?)'''\n\s*html = replace_once\(html, old_hero", 'hero'),
              6,
          )
          new_place = html_block(
              extract(r"new_place = '''(.*?)'''\n\s*html = replace_once\(html, old_place", 'Place Fabric instrument'),
              8,
          )
          css_payload = extract(r"css \+= r'''(.*?)'''\n\s*css_path\.write_text", 'operational CSS')
          readme_note = textwrap.dedent(
              extract(r"note = '''(.*?)'''\n\s*if '## Visual evidence posture'", 'README note')
          )

          index_path = ROOT / 'index.html'
          html = index_path.read_text(encoding='utf-8')
          hero_pattern = re.compile(
              r'(?ms)^      <div class="hero-visual" aria-label="Public demonstration place">\n.*?^      </div>\n(?=    </section>)'
          )
          html, hero_count = hero_pattern.subn(new_hero + '\n', html, count=1)
          if hero_count != 1:
              raise SystemExit(f'hero source block count differed: {hero_count}')

          place_pattern = re.compile(
              r'(?ms)^        <a class="proof-card photo-card" href="\.\./manzanita/">\n.*?^        </a>\n(?=\n        <a class="proof-card" href="\.\./essential-attention/">)'
          )
          html, place_count = place_pattern.subn(new_place + '\n', html, count=1)
          if place_count != 1:
              raise SystemExit(f'Place Fabric source block count differed: {place_count}')
          index_path.write_text(html, encoding='utf-8')

          css_path = ROOT / 'style.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Operational evidence visual system. */'
          if marker in css:
              raise SystemExit('operational evidence CSS already present before V2 materialization')
          css_path.write_text(css + css_payload, encoding='utf-8')

          contract_path = ROOT / 'WORKING_MODEL_CONTRACT.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          contract['visual_evidence'] = {
              'primary_mode': 'operational_instrumentation',
              'hero': 'A bounded case trace showing source, authority, prepared output, unresolved gates, and zero external effect.',
              'place_fabric': 'A seven-scale source-state instrument that exposes coverage and adverse-use limits without presenting degraded photography as proof of current field activity.',
              'historical_or_low_resolution_photography_used_as_primary_proof': False,
              'field_activity_claimed': False,
              'acceptance': [
                  'No rendered image element appears in the working-model main surface.',
                  'The hero exposes a seven-stage case trace and four-row authority ledger.',
                  'The Place Fabric proof card exposes seven named scales and explicit no-score and no-adverse-use boundaries.',
                  'Desktop, mobile, narrow, keyboard, reduced-motion, and packet behavior remain qualified.'
              ]
          }
          contract_path.write_text(json.dumps(contract, indent=2) + '\n', encoding='utf-8')

          release_path = ROOT / 'RELEASE_CONTRACT.json'
          release = json.loads(release_path.read_text(encoding='utf-8'))
          release['visual_evidence'] = {
              'primary_mode': 'operational_instrumentation',
              'legacy_photo_assets_rendered': False,
              'legacy_photo_assets_retained_for_byte_custody_only': [
                  'assets/property.webp',
                  'assets/household.webp'
              ],
              'field_activity_claimed': False
          }
          release_path.write_text(json.dumps(release, indent=2) + '\n', encoding='utf-8')

          readme_path = ROOT / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          if '## Visual evidence posture' not in readme:
              readme += readme_note
          readme_path.write_text(readme, encoding='utf-8')

          static_path = ROOT / 'tests/public_contract_test.py'
          static = static_path.read_text(encoding='utf-8')
          asset_pattern = re.compile(
              r'(?m)^    for asset in \["assets/property\.webp", "assets/household\.webp"\]:\n'
              r'^        require\(asset in html,.*\n'
              r'^        local = .*\n'
              r'^        require\(local\.is_file\(\),.*\n'
          )
          replacement = '''    for asset in ["assets/property.webp", "assets/household.webp"]:
              local = (ROOT / asset).resolve()
              require(local.is_file(), f"retained legacy photo asset missing from repo: {asset}")
              require(asset not in html, f"legacy photo asset may not render as primary evidence: {asset}")

          for hook in [
              'class="hero-visual hero-console"',
              'class="console-grammar"',
              'class="console-ledger"',
              'class="proof-instrument place-instrument"',
              'class="place-stack"',
              'No adverse use',
          ]:
              require(hook in html, f"operational evidence hook absent: {hook}")
          require("<img" not in html, "working-model main surface may not render archival photography")
          visual = contract["visual_evidence"]
          require(visual["primary_mode"] == "operational_instrumentation", "visual evidence mode differs")
          require(visual["historical_or_low_resolution_photography_used_as_primary_proof"] is False, "legacy photography must not carry primary proof")
          require(visual["field_activity_claimed"] is False, "visual system may not manufacture field activity")
          '''
          static, asset_count = asset_pattern.subn(replacement, static, count=1)
          if asset_count != 1:
              raise SystemExit(f'static legacy-asset block count differed: {asset_count}')
          static_path.write_text(static, encoding='utf-8')

          old_assertions = '''        assert page.locator(".proof-card").count() == 4
          assert "Silence is not consent" in page.locator(".invariant").inner_text()
          '''
          new_assertions = '''        assert page.locator(".proof-card").count() == 4
          assert page.locator("main img").count() == 0
          assert page.locator(".hero-console").count() == 1
          assert page.locator(".console-grammar li").count() == 7
          assert page.locator(".console-ledger > div").count() == 4
          assert page.locator(".place-stack li").count() == 7
          assert "No adverse use" in page.locator(".instrument-foot").inner_text()
          assert "Silence is not consent" in page.locator(".invariant").inner_text()
          '''
          for test_name in ['browser_test.py', 'live_browser_test.py']:
              test_path = ROOT / 'tests' / test_name
              test = test_path.read_text(encoding='utf-8')
              count = test.count(old_assertions)
              if count != 1:
                  raise SystemExit(f'{test_name} visual assertion anchor count differed: {count}')
              test_path.write_text(test.replace(old_assertions, new_assertions, 1), encoding='utf-8')
          PY

      - name: Remove one-shot repair machinery
        run: |
          rm '.github/workflows/manzanita-working-model-operational-evidence-repair.yml'
          rm '.github/workflows/manzanita-working-model-operational-evidence-repair-v2.yml'

      - name: Verify static, syntax, and browser contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            manzanita-working-model/tests/public_contract_test.py \
            manzanita-working-model/tests/browser_test.py \
            manzanita-working-model/tests/live_browser_test.py
          node --check manzanita-working-model/app.js
          python manzanita-working-model/tests/public_contract_test.py
          python -m pip install --disable-pip-version-check playwright==1.57.0
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            export MW_CHROMIUM_EXECUTABLE="$browser"
          else
            python -m playwright install --with-deps chromium
          fi
          export MW_WORKING_MODEL_SCREENSHOT_DIR="$RUNNER_TEMP/manzanita-working-model-operational-evidence"
          python manzanita-working-model/tests/browser_test.py

      - name: Commit bounded visual correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-visual-bot'
          git config user.email 'actions@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/manzanita-working-model-operational-evidence-repair-v2.yml',
              '.github/workflows/manzanita-working-model-operational-evidence-repair.yml',
              'manzanita-working-model/README.md',
              'manzanita-working-model/RELEASE_CONTRACT.json',
              'manzanita-working-model/WORKING_MODEL_CONTRACT.json',
              'manzanita-working-model/index.html',
              'manzanita-working-model/style.css',
              'manzanita-working-model/tests/browser_test.py',
              'manzanita-working-model/tests/live_browser_test.py',
              'manzanita-working-model/tests/public_contract_test.py',
          }
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          observed = {row[3:] for row in rows}
          if observed != expected:
              raise SystemExit(f'changed-path set differs\nexpected={sorted(expected)}\nobserved={sorted(observed)}')
          PY
          git add -A
          git commit -m 'manzanita: replace archival photos with operational evidence'
          git push origin HEAD
