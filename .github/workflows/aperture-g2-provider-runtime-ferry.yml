name: TEMP AXM Aperture G2 provider-runtime ferry

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aperture-g2-provider-runtime-ferry.yml
      - aperture-g2-ferry/**

permissions:
  contents: read

concurrency:
  group: aperture-g2-provider-runtime-ferry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ferry:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/aperture-g2-provider-runtime-ferry-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out temporary ferry source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up exact Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5

      - name: Build and self-verify ferry
        shell: bash
        run: bash aperture-g2-ferry/build-ferry.sh

      - name: Upload checksum-bound provider runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axm-aperture-g2-provider-runtime-ferry-v1
          path: ${{ runner.temp }}/axm-aperture-g2-ferry/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
