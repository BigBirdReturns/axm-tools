name: TEMP AXM Aperture G2 provider-runtime ferry

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aperture-g2-provider-runtime-ferry.yml
      - aperture-g2-ferry/**

permissions:
  contents: read

concurrency:
  group: aperture-g2-provider-runtime-ferry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ferry:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/aperture-g2-provider-runtime-ferry-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out temporary ferry source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up exact Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5

      - name: Build and self-verify ferry
        shell: bash
        run: |
          set -euo pipefail
          bash aperture-g2-ferry/build-ferry.sh

          out="$RUNNER_TEMP/axm-aperture-g2-ferry/out"
          work="$RUNNER_TEMP/axm-aperture-g2-ferry/work"
          mpv_root="$work/mpv-root"

          # libpulse resolves libpulsecommon through an absolute runtime path
          # that top-level ldd traversal does not enumerate. Preserve the
          # package directory and add its transported locations to the explicit
          # portable loader search path before resealing.
          if [ -d /usr/lib/x86_64-linux-gnu/pulseaudio ]; then
            mkdir -p "$mpv_root/usr/lib/x86_64-linux-gnu"
            cp -a /usr/lib/x86_64-linux-gnu/pulseaudio \
              "$mpv_root/usr/lib/x86_64-linux-gnu/"
          fi

          python - "$mpv_root/mpv-portable" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          old = '''  "$ROOT/usr/lib/x86_64-linux-gnu" \\
  "$ROOT/usr/local/lib"; do
'''
          new = '''  "$ROOT/usr/lib/x86_64-linux-gnu" \\
  "$ROOT/lib/x86_64-linux-gnu/pulseaudio" \\
  "$ROOT/usr/lib/x86_64-linux-gnu/pulseaudio" \\
  "$ROOT/usr/local/lib"; do
'''
          if old not in source:
              raise SystemExit("portable wrapper search-path seam changed")
          path.write_text(source.replace(old, new), encoding="utf-8")
          path.chmod(0o755)
          PY

          "$mpv_root/mpv-portable" --version > "$out/mpv/version.txt"

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$work" -cf - mpv-root \
            | gzip -n -9 > "$out/mpv/mpv-linux-x64-portable.tar.gz"

          python - "$out" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          out = pathlib.Path(sys.argv[1])
          receipt_path = out / "provider-runtime-ferry.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))

          def sha(path: pathlib.Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          bundle = out / "mpv" / "mpv-linux-x64-portable.tar.gz"
          receipt["mpv"]["bundle_sha256"] = sha(bundle)
          receipt["mpv"]["portable_wrapper_sha256"] = sha(out.parent / "work" / "mpv-root" / "mpv-portable")
          receipt.pop("receipt_sha256", None)
          core = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receipt_sha256"] = hashlib.sha256(core).hexdigest()
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          rm -f "$out/SHA256SUMS" "$out/SHA512SUMS" \
            "$out/verification.json" "$out/verification.json.sha256"
          (
            cd "$out"
            find . -type f ! -name SHA256SUMS ! -name SHA512SUMS -printf '%P\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            find . -type f ! -name SHA256SUMS ! -name SHA512SUMS -printf '%P\0' \
              | sort -z | xargs -0 sha512sum > SHA512SUMS
            python verify-ferry.py . > verification.json
            sha256sum verification.json > verification.json.sha256
            sha256sum -c verification.json.sha256
          )

      - name: Upload checksum-bound provider runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axm-aperture-g2-provider-runtime-ferry-v1
          path: ${{ runner.temp }}/axm-aperture-g2-ferry/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
