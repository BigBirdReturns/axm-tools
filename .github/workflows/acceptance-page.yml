# Regression harness for acceptance.html — the buyer-facing AXM Readiness demo.
#
# The production page is modular and served through GitHub Pages. The browser
# harness starts a loopback-only HTTP server, drives the real UI, and rejects
# requests outside that local origin. See tests/pages/verify_acceptance.mjs.
#
# The AP-410 jobs below are a bounded, default-branch-authorized execution
# carrier for Tools issue #71. They check out the exact closed-unmerged carrier
# head, qualify its unchanged source archive, retain the hosted receipts, and
# post only a run/artifact witness for independent disposition.

name: Acceptance page

on:
  push:
  pull_request:

permissions:
  actions: read
  contents: read
  issues: write

env:
  AP410_KIT_SOURCE_SHA256: 71f4a03b50138c4f37e1fc5bce16a211f1e72f06ad5338700db1f5eaaf19bf74
  AP410_KIT_SOURCE_BYTES: "90028"
  AP410_KIT_ID: g3observationkit2_6a0784236b71e0c78d22a6087aa837764eadddee17cc58e9522e909358eda9a1
  AP410_KIT_QUALIFICATION_ID: g3observationqualification2_14f759a2212a9119e6d9f0ae81e0e7f9a5937ceddcbe1e2b00864e51380bd4ec
  AP410_KIT_BLOCKED_PROGRESS_ID: uiprogress2_6073d7e2855ec35fece231f86e0cc0aa94ed9499d1b7a44d7fdbd5d1f2837cf2
  AP410_KIT_CARRIER_HEAD: f0925bda2e4eeedd6dfd83c8a7adf1af8ffa54a6

jobs:
  acceptance-page:
    name: Acceptance page (headless browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1 >/tmp/acceptance-npm-install.log 2>&1
          npx playwright install --with-deps chromium >/tmp/acceptance-browser-install.log 2>&1

      - name: Drive acceptance.html and assert the intake rules
        run: node tests/pages/verify_acceptance.mjs


  ap410-kit-v2-announce:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[AP410-KIT-V2-AUTHORIZED]')
    name: AP-410 Kit v2 / start witness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post exact run identity to issue 71
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          lines = [
              "## KIT_V2_DEFAULT_BRANCH_RUN_STARTED",
              "",
              "The already-authorized default-branch Acceptance workflow has created an observable AP-410 Kit v2 execution. This start witness identifies the run only. It is not hosted passage, artifact custody, or issue closure.",
              "",
              "```text",
              f"workflow run                   {os.environ['GITHUB_RUN_ID']}",
              f"workflow attempt               {os.environ['GITHUB_RUN_ATTEMPT']}",
              f"workflow authorization commit  {os.environ['GITHUB_SHA']}",
              f"carrier head                   {os.environ['AP410_KIT_CARRIER_HEAD']}",
              f"source SHA-256                 {os.environ['AP410_KIT_SOURCE_SHA256']}",
              f"source bytes                   {os.environ['AP410_KIT_SOURCE_BYTES']}",
              "accepted gates                 []",
              "canonical AP-410               false",
              "canonical G3                   false",
              "```",
              "",
              "The run must still produce successful Ubuntu, Windows, two-root, retained-artifact, and downloaded-replay evidence before issue #71 changes standing.",
          ]
          payload = json.dumps({"body": "\n".join(lines)}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/71/comments",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "AXM-Aperture-Kit-V2-Default-Branch/2",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              response.read()
          PY

  ap410-kit-v2-source:
    needs: ap410-kit-v2-announce
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[AP410-KIT-V2-AUTHORIZED]')
    name: AP-410 Kit v2 / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Ubuntu 24.04 source and refusal law
          - os: windows-2025
            label: Windows 2025 source and refusal law
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out exact closed-unmerged carrier head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.AP410_KIT_CARRIER_HEAD }}
          fetch-depth: 1
          show-progress: false

      - name: Set up exact Node 22.16.0
        uses: actions/setup-node@1e60f620b9541dca151540d0c4e4342dc1a0c293
        with:
          node-version: 22.16.0

      - name: Recover and qualify exact Kit v2 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/aperture-g3-observation-kit-v2-*.sh
          archive="$RUNNER_TEMP/AXM-Aperture-G3-Platform-Observation-Kit-v2.tar.gz"
          root="$RUNNER_TEMP/aperture-kit-v2-${{ matrix.os }}"
          .github/scripts/aperture-g3-observation-kit-v2-fetch.sh "$archive"
          test "$(wc -c < "$archive" | tr -d '[:space:]')" = "$AP410_KIT_SOURCE_BYTES"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$AP410_KIT_SOURCE_SHA256"
          .github/scripts/aperture-g3-observation-kit-v2-qualify.sh "$archive" "$root"
          printf '%s\n' \
            "workflow_authorization_commit=$GITHUB_SHA" \
            "carrier_head=$AP410_KIT_CARRIER_HEAD" \
            "runner_os=${{ matrix.os }}" \
            >> "$root/qualification.env"

      - name: Upload operating-system receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ap410-kit-v2-${{ matrix.os }}
          path: ${{ runner.temp }}/aperture-kit-v2-${{ matrix.os }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  ap410-kit-v2-custody:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[AP410-KIT-V2-AUTHORIZED]')
    name: AP-410 Kit v2 / two-root custody and downloaded replay
    needs: ap410-kit-v2-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact closed-unmerged carrier head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.AP410_KIT_CARRIER_HEAD }}
          fetch-depth: 1
          show-progress: false

      - name: Set up exact Node 22.16.0
        uses: actions/setup-node@1e60f620b9541dca151540d0c4e4342dc1a0c293
        with:
          node-version: 22.16.0

      - name: Qualify two clean roots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/aperture-g3-observation-kit-v2-*.sh
          archive="$RUNNER_TEMP/AXM-Aperture-G3-Platform-Observation-Kit-v2.tar.gz"
          .github/scripts/aperture-g3-observation-kit-v2-fetch.sh "$archive"
          .github/scripts/aperture-g3-observation-kit-v2-qualify.sh "$archive" "$RUNNER_TEMP/cold-a"
          .github/scripts/aperture-g3-observation-kit-v2-qualify.sh "$archive" "$RUNNER_TEMP/cold-b"
          cmp "$RUNNER_TEMP/cold-a/blocked-progress.json" "$RUNNER_TEMP/cold-b/blocked-progress.json"
          cmp "$RUNNER_TEMP/cold-a/qualification.env" "$RUNNER_TEMP/cold-b/qualification.env"

      - name: Seal carrier artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/carrier-artifact"
          mkdir -p "$out/cold-a" "$out/cold-b"
          cp "$RUNNER_TEMP/AXM-Aperture-G3-Platform-Observation-Kit-v2.tar.gz" "$out/"
          for root in cold-a cold-b; do
            cp "$RUNNER_TEMP/$root/blocked-progress.json" "$out/$root/"
            cp "$RUNNER_TEMP/$root/qualification.env" "$out/$root/"
            cp -r "$RUNNER_TEMP/$root/logs" "$out/$root/"
          done
          python - "$out" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          out = pathlib.Path(sys.argv[1])
          archive = out / "AXM-Aperture-G3-Platform-Observation-Kit-v2.tar.gz"

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          receipt = {
              "format": "axm-aperture-g3-observation-kit-v2-default-branch-carrier-receipt/1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_authorization_commit": os.environ["GITHUB_SHA"],
              "workflow_run": os.environ["GITHUB_RUN_ID"],
              "carrier_head": os.environ["AP410_KIT_CARRIER_HEAD"],
              "carrier_merged": False,
              "source_archive": {
                  "name": archive.name,
                  "bytes": archive.stat().st_size,
                  "sha256": digest(archive),
              },
              "kit_id": os.environ["AP410_KIT_ID"],
              "qualification_id": os.environ["AP410_KIT_QUALIFICATION_ID"],
              "blocked_progress_id": os.environ["AP410_KIT_BLOCKED_PROGRESS_ID"],
              "node_version": "22.16.0",
              "source_contracts_per_execution": 49,
              "hosted_operating_systems": ["ubuntu-24.04", "windows-2025"],
              "cold_roots": 2,
              "downloaded_replays": 1,
              "accepted_gates": [],
              "canonical_ap410_accepted": False,
              "canonical_g3_accepted": False,
              "runtime_binding_present": False,
              "observed_platform_interactions": 0,
              "observed_platform_visuals": 0,
              "manual_reader_groups_passed": 0,
              "carrier_authority": "hosted_source_transport_and_qualification_only",
              "publication_status": "source_candidate_unmerged",
              "status": "PASS",
          }
          core = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receipt_sha256"] = hashlib.sha256(core).hexdigest()
          (out / "CARRIER_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$out"
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload retained carrier artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axm-aperture-g3-observation-kit-v2-default-branch
          path: ${{ runner.temp }}/carrier-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Download artifact through Actions custody
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: axm-aperture-g3-observation-kit-v2-default-branch
          path: ${{ runner.temp }}/downloaded

      - name: Replay downloaded artifact
        shell: bash
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/downloaded"
          (cd "$downloaded" && sha256sum -c SHA256SUMS)
          .github/scripts/aperture-g3-observation-kit-v2-qualify.sh \
            "$downloaded/AXM-Aperture-G3-Platform-Observation-Kit-v2.tar.gz" \
            "$RUNNER_TEMP/downloaded-replay"
          cmp "$downloaded/cold-a/blocked-progress.json" "$RUNNER_TEMP/downloaded-replay/blocked-progress.json"

      - name: Post run and artifact witness to issue 71
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/downloaded/CARRIER_RECEIPT.json" <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          receipt = json.loads(pathlib.Path(__import__("sys").argv[1]).read_text(encoding="utf-8"))
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]

          lines = [
              "## KIT_V2_DEFAULT_BRANCH_RUN_READY_FOR_INDEPENDENT_REPLAY",
              "",
              "The already-authorized default-branch Acceptance workflow completed its Ubuntu, Windows, two-root, and downloaded-artifact execution path. This is a run-and-artifact witness pending independent job, log, and retained-artifact verification.",
              "",
              "```text",
              f"workflow authorization commit  {receipt['workflow_authorization_commit']}",
              f"workflow run                   {run_id}",
              f"carrier head                   {receipt['carrier_head']}",
              f"carrier merged                 {str(receipt['carrier_merged']).lower()}",
              f"artifact ID                    {os.environ['ARTIFACT_ID']}",
              f"artifact digest                {os.environ['ARTIFACT_DIGEST']}",
              f"source SHA-256                 {receipt['source_archive']['sha256']}",
              f"source bytes                   {receipt['source_archive']['bytes']}",
              f"carrier receipt                {receipt['receipt_sha256']}",
              f"kit                            {receipt['kit_id']}",
              f"qualification                  {receipt['qualification_id']}",
              f"blocked progress               {receipt['blocked_progress_id']}",
              "contracts per execution        49",
              "hosted systems                 Ubuntu 24.04, Windows 2025",
              "cold roots                     2",
              "downloaded replays             1",
              "runtime binding                absent",
              "physical evidence              0 interactions, 0 visuals, 0 reader groups",
              "accepted gates                 []",
              "canonical AP-410               false",
              "canonical G3                   false",
              "```",
              "",
              f"Artifact: {os.environ['ARTIFACT_URL']}",
              "",
              "Do not close issue #71 from this witness alone. Independent verification must confirm all completed jobs, logs, retained checksums, source identity, and downloaded replay before disposition.",
          ]

          payload = json.dumps({"body": "\n".join(lines)}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/71/comments",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "AXM-Aperture-Kit-V2-Default-Branch/1",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              response.read()
          PY
