# AP-410 Kit v2 hosted source portability. The data branch remains unmerged and grants no runtime, physical, canonical, repository, or gate authority.
name: Acceptance page
on:
  push:
  pull_request:
permissions:
  actions: read
  contents: read
  issues: write
env:
  AP410_DATA_BRANCH: agent/aperture-g3-observation-kit-v2-dispatch-data-v5-segmented
  AP410_DATA_HEAD: 9342476fe6ef501b9d3776e738d0822f1c474a4b
  AP410_DATA_ROOT: aperture-kit-v2-dispatch-data
  AP410_SOURCE_SHA256: 71f4a03b50138c4f37e1fc5bce16a211f1e72f06ad5338700db1f5eaaf19bf74
  AP410_SOURCE_BYTES: "90028"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
jobs:
  acceptance-page:
    name: Acceptance page (headless browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium && node tests/pages/verify_acceptance.mjs
  ap410-announce:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[AP410-KIT-V2-AUTHORIZED]')
    name: AP-410 Kit v2 / start witness
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          body="## KIT_V2_SEGMENTED_HOSTED_RUN_STARTED

          Run \`$GITHUB_RUN_ID\`, attempt \`$GITHUB_RUN_ATTEMPT\`, authorization commit \`$GITHUB_SHA\`, data head \`$AP410_DATA_HEAD\`. This is an execution coordinate only. Accepted gates remain \`[]\`; canonical AP-410 and G3 remain false."
          gh api "repos/$GITHUB_REPOSITORY/issues/71/comments" -f body="$body"
  ap410-source:
    needs: ap410-announce
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[AP410-KIT-V2-AUTHORIZED]')
    name: AP-410 Kit v2 / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, label: Ubuntu 24.04 source and refusal law}
          - {os: windows-2025, label: Windows 2025 source and refusal law}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.AP410_DATA_HEAD }}", fetch-depth: 1, show-progress: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22.16.0}
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AP410_DATA_HEAD"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            shim="$RUNNER_TEMP/ap410-windows-file-url-path-shim.mjs"
            cat > "$shim" <<'NODE'
          import path from 'node:path';
          import { syncBuiltinESMExports } from 'node:module';
          const nativeResolve = path.resolve;
          path.resolve = (...parts) => {
            if (parts.length && typeof parts[0] === 'string' && /^\/[A-Za-z]:[\\/]/.test(parts[0])) {
              parts[0] = parts[0].slice(1);
            }
            return nativeResolve(...parts);
          };
          syncBuiltinESMExports();
          NODE
            shim_url="$(node -e "console.log(require('node:url').pathToFileURL(process.argv[1]).href)" "$shim")"
            export NODE_OPTIONS="--import=$shim_url"
          fi
          python "$GITHUB_WORKSPACE/$AP410_DATA_ROOT/scripts/hosted_entry.py" source --data-root "$GITHUB_WORKSPACE/$AP410_DATA_ROOT" --work-root "$RUNNER_TEMP/source-${{ matrix.os }}" --runner-label "${{ matrix.os }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ap410-kit-v2-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-${{ matrix.os }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  ap410-custody:
    needs: ap410-source
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[AP410-KIT-V2-AUTHORIZED]')
    name: AP-410 Kit v2 / two-root custody
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.AP410_DATA_HEAD }}", fetch-depth: 1, show-progress: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22.16.0}
      - uses: actions/download-artifact@v4
        with:
          pattern: ap410-kit-v2-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/os-receipts
          merge-multiple: false
      - shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/$AP410_DATA_ROOT/scripts/hosted_entry.py" custody --data-root "$GITHUB_WORKSPACE/$AP410_DATA_ROOT" --temp-root "$RUNNER_TEMP/custody" --os-receipts "$RUNNER_TEMP/os-receipts" --output "$RUNNER_TEMP/carrier"
      - uses: actions/upload-artifact@v4
        with:
          name: ap410-kit-v2-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/carrier/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  ap410-witness:
    needs: ap410-custody
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[AP410-KIT-V2-AUTHORIZED]')
    name: AP-410 Kit v2 / downloaded independent replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.AP410_DATA_HEAD }}", fetch-depth: 1, show-progress: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22.16.0}
      - uses: actions/download-artifact@v4
        with:
          name: ap410-kit-v2-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded
      - shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/$AP410_DATA_ROOT/scripts/hosted_entry.py" witness --data-root "$GITHUB_WORKSPACE/$AP410_DATA_ROOT" --downloaded "$RUNNER_TEMP/downloaded" --output "$RUNNER_TEMP/witness"
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ap410-kit-v2-independent-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/witness/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          body="## KIT_V2_SEGMENTED_HOSTED_RUN_READY_FOR_DISPOSITION

          Run \`$GITHUB_RUN_ID\` reached downloaded replay. Witness artifact \`$ARTIFACT_ID\`, digest \`$ARTIFACT_DIGEST\`. Issue #71 remains open pending separate read-only disposition."
          gh api "repos/$GITHUB_REPOSITORY/issues/71/comments" -f body="$body"
