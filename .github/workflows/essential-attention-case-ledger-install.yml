name: Install Essential Attention Case Ledger

on:
  push:
    branches:
      - agent/essential-attention-case-ledger
    paths:
      - .github/workflows/essential-attention-case-ledger-install.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the AXM Case Ledger from frozen estate donors
        run: |
          cat .github/ea-case-ledger-payload/build.part* > /tmp/build_case_ledger.py
          python /tmp/build_case_ledger.py
          python essential-attention/tests/public_contract_test.py
          node --check /tmp/essential-attention-inline.js

      - name: Drive the cold-user and mobile floor
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          python essential-attention/tests/browser_test.py

      - name: Commit the qualified Case Ledger
        run: |
          rm -rf .github/ea-case-ledger-payload
          rm -f .github/workflows/essential-attention-case-ledger-install.yml
          git config user.name "essential-attention-case-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- essential-attention README.md index.html identity/axm/PROPERTY-FLAVORS.md .github/ea-case-ledger-payload .github/workflows/essential-attention-case-ledger-install.yml
          git diff --cached --check
          git commit -m "essential-attention: install AXM Case Ledger floor"
          git push origin HEAD:agent/essential-attention-case-ledger
