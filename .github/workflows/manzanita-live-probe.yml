name: Manzanita Works v1.4.1 one-shot live probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manzanita-live-probe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MANZANITA_BASE_URL: https://bigbirdreturns.github.io/axm-tools/manzanita
      OBSERVATION_TRIGGER_SHA: ${{ github.sha }}
      EVIDENCE_BRANCH: evidence/manzanita-live
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Observe and hash the public release
        id: exact
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/manzanita-live
          cp .github/pages-deployment.json /tmp/manzanita-live/pages-deployment.json
          exec > >(tee /tmp/manzanita-live/probe.log) 2>&1

          for attempt in $(seq 1 18); do
            code=$(curl -L -sS \
              -o /tmp/manzanita-live/index.html \
              -w '%{http_code}' \
              "$MANZANITA_BASE_URL/?v=$OBSERVATION_TRIGGER_SHA" || true)
            if [ "$code" = "200" ] \
              && grep -q 'data-release="1.4.1"' /tmp/manzanita-live/index.html \
              && grep -q 'data-visual-system="signal-sheet"' /tmp/manzanita-live/index.html; then
              break
            fi
            if [ "$attempt" = "18" ]; then
              echo "Public endpoint failed release marker gate: HTTP $code"
              head -100 /tmp/manzanita-live/index.html || true
              exit 1
            fi
            sleep 5
          done

          for path in style.css app.js theme-init.js; do
            curl -L -f -sS \
              "$MANZANITA_BASE_URL/$path?v=$OBSERVATION_TRIGGER_SHA" \
              -o "/tmp/manzanita-live/$path"
          done

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/manzanita-live")
          qualification = json.loads(Path("manzanita/QUALIFICATION.json").read_text())
          observed = {}
          for path in ("index.html", "style.css", "app.js", "theme-init.js"):
              payload = (root / path).read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              expected = qualification["files"][path]
              if len(payload) != expected["bytes"] or digest != expected["sha256"]:
                  raise SystemExit(
                      f"live byte mismatch for {path}: "
                      f"observed=({len(payload)}, {digest}) "
                      f"expected=({expected['bytes']}, {expected['sha256']})"
                  )
              observed[path] = {"bytes": len(payload), "sha256": digest}

          Path("/tmp/manzanita-live/files.json").write_text(
              json.dumps(observed, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Retain the external observation
        if: always()
        env:
          EXACT_OUTCOME: ${{ steps.exact.outcome }}
          PROBE_RUN_ID: ${{ github.run_id }}
          PROBE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git fetch origin "$EVIDENCE_BRANCH"
          git switch -C "$EVIDENCE_BRANCH" "origin/$EVIDENCE_BRANCH"

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def tail(path: str, limit: int = 12000) -> str:
              target = Path(path)
              if not target.exists():
                  return ""
              return target.read_text(encoding="utf-8", errors="replace")[-limit:]

          files_path = Path("/tmp/manzanita-live/files.json")
          pages_path = Path("/tmp/manzanita-live/pages-deployment.json")
          passed = os.environ["EXACT_OUTCOME"] == "success"
          receipt = {
              "schema": "manzanita-works/external-byte-observation@1",
              "release": "1.4.1",
              "release_class": "public_maintenance_patch",
              "state": "PASS" if passed else "FAIL",
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "public_route": os.environ["MANZANITA_BASE_URL"] + "/",
              "observation_trigger_sha": os.environ["OBSERVATION_TRIGGER_SHA"],
              "probe": {
                  "workflow_run_id": int(os.environ["PROBE_RUN_ID"]),
                  "run_attempt": int(os.environ["PROBE_RUN_ATTEMPT"]),
                  "release_marker": "1.4.1",
                  "visual_system_marker": "signal-sheet",
                  "exact_file_gate": os.environ["EXACT_OUTCOME"],
              },
              "pages_deployment_receipt_at_observation": (
                  json.loads(pages_path.read_text()) if pages_path.exists() else {}
              ),
              "files": json.loads(files_path.read_text()) if files_path.exists() else {},
              "failure_receipt": tail("/tmp/manzanita-live/probe.log") if not passed else "",
              "authority": {
                  "successor_program_effect": "none",
                  "external_campaign_effect": "none",
                  "canonical_task_count_effect": "none",
              },
          }
          target = Path(".github/manzanita-live-receipts") / f"push-{os.environ['OBSERVATION_TRIGGER_SHA']}.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          Path("/tmp/manzanita-live/receipt-state.txt").write_text(receipt["state"] + "\n")
          PY

          target=".github/manzanita-live-receipts/push-$OBSERVATION_TRIGGER_SHA.json"
          git config user.name "manzanita-live-probe"
          git config user.email "actions@users.noreply.github.com"
          git add "$target"
          git diff --cached --check
          git commit -m "Manzanita: retain external byte observation $OBSERVATION_TRIGGER_SHA"
          git push origin "HEAD:$EVIDENCE_BRANCH"

      - name: Enforce the retained observation
        if: always()
        run: test "$(cat /tmp/manzanita-live/receipt-state.txt)" = "PASS"
