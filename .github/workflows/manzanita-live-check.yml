name: Manzanita Works live Pages gate

on:
  push:
    branches: [main]
    paths:
      - "manzanita/**"
      - ".github/workflows/manzanita-live-check.yml"
  workflow_run:
    workflows: ["PTA tracker fetch + deploy"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Wait for Pages and drive the public endpoint
        env:
          MANZANITA_URL: https://bigbirdreturns.github.io/axm-tools/manzanita/?v=${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for attempt in $(seq 1 18); do
            code=$(curl -L -sS -o /tmp/manzanita.html -w '%{http_code}' "$MANZANITA_URL" || true)
            if [ "$code" = "200" ] && grep -q "Manzanita Works · One Place, Every Scale" /tmp/manzanita.html; then
              break
            fi
            if [ "$attempt" = "18" ]; then
              echo "Public endpoint failed identity gate: HTTP $code"
              head -80 /tmp/manzanita.html || true
              exit 1
            fi
            sleep 10
          done
          python manzanita/tests/browser_test.py
