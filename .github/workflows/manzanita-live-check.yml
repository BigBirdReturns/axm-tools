name: Manzanita Works v1.4.1 live Pages gate

on:
  workflow_run:
    workflows: ["PTA tracker fetch + deploy"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MANZANITA_BASE_URL: https://bigbirdreturns.github.io/axm-tools/manzanita
      MANZANITA_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PAGES_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p /tmp/manzanita-live
          {
            python -m pip install --disable-pip-version-check playwright==1.57.0
            python -m playwright install --with-deps chromium
          } 2>&1 | tee /tmp/manzanita-live/install.log

      - name: Wait for and verify the exact public release bytes
        id: bytes
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/manzanita-live
          exec > >(tee /tmp/manzanita-live/bytes.log) 2>&1

          for attempt in $(seq 1 24); do
            code=$(curl -L -sS \
              -o /tmp/manzanita-live/index.html \
              -w '%{http_code}' \
              "$MANZANITA_BASE_URL/?v=$MANZANITA_SOURCE_SHA" || true)
            if [ "$code" = "200" ] \
              && grep -q 'data-release="1.4.1"' /tmp/manzanita-live/index.html \
              && grep -q 'data-visual-system="signal-sheet"' /tmp/manzanita-live/index.html; then
              break
            fi
            if [ "$attempt" = "24" ]; then
              echo "Public endpoint failed exact release marker gate: HTTP $code"
              head -100 /tmp/manzanita-live/index.html || true
              exit 1
            fi
            sleep 10
          done

          for path in style.css app.js theme-init.js; do
            curl -L -f -sS \
              "$MANZANITA_BASE_URL/$path?v=$MANZANITA_SOURCE_SHA" \
              -o "/tmp/manzanita-live/$path"
          done

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/manzanita-live")
          qualification = json.loads(Path("manzanita/QUALIFICATION.json").read_text())
          observed = {}
          for path in ("index.html", "style.css", "app.js", "theme-init.js"):
              payload = (root / path).read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              expected = qualification["files"][path]
              if len(payload) != expected["bytes"] or digest != expected["sha256"]:
                  raise SystemExit(
                      f"live byte mismatch for {path}: "
                      f"observed=({len(payload)}, {digest}) "
                      f"expected=({expected['bytes']}, {expected['sha256']})"
                  )
              observed[path] = {"bytes": len(payload), "sha256": digest}

          Path("/tmp/manzanita-live/files.json").write_text(
              json.dumps(observed, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Drive the public endpoint
        id: browser
        if: steps.install.outcome == 'success' && steps.bytes.outcome == 'success'
        continue-on-error: true
        env:
          MANZANITA_URL: ${{ env.MANZANITA_BASE_URL }}/?v=${{ env.MANZANITA_SOURCE_SHA }}
          MANZANITA_SCREENSHOT_DIR: ${{ runner.temp }}/manzanita-live-screens
        run: |
          set -o pipefail
          python manzanita/tests/browser_test.py 2>&1 \
            | tee /tmp/manzanita-live/browser.log

      - name: Retain live screenshots
        id: upload
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-signal-sheet-v1.4.1-live-screens
          path: ${{ runner.temp }}/manzanita-live-screens
          if-no-files-found: error
          retention-days: 30

      - name: Retain the completed Pages observation
        id: receipt
        if: always() && github.event_name == 'workflow_run'
        env:
          LIVE_GATE_RUN_ID: ${{ github.run_id }}
          LIVE_GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BYTE_OUTCOME: ${{ steps.bytes.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def tail(path: str, limit: int = 8000) -> str:
              target = Path(path)
              if not target.exists():
                  return ""
              text = target.read_text(encoding="utf-8", errors="replace")
              return text[-limit:]

          outcomes = {
              "install": os.environ["INSTALL_OUTCOME"],
              "exact_files": os.environ["BYTE_OUTCOME"],
              "browser_contract": os.environ["BROWSER_OUTCOME"],
              "screenshot_retention": os.environ["UPLOAD_OUTCOME"],
          }
          passed = all(value == "success" for value in outcomes.values())
          pages_receipt_path = Path(".github/pages-deployment.json")
          pages_receipt = json.loads(pages_receipt_path.read_text()) if pages_receipt_path.exists() else {}
          files_path = Path("/tmp/manzanita-live/files.json")
          receipt = {
              "schema": "manzanita-works/live-pages-receipt@1",
              "release": "1.4.1",
              "release_class": "public_maintenance_patch",
              "state": "PASS" if passed else "FAIL",
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "public_route": os.environ["MANZANITA_BASE_URL"] + "/",
              "pages": {
                  "workflow_run_id": int(os.environ["PAGES_RUN_ID"]),
                  "source_sha": os.environ["MANZANITA_SOURCE_SHA"],
                  "deployment_receipt": pages_receipt,
              },
              "live_gate": {
                  "workflow_run_id": int(os.environ["LIVE_GATE_RUN_ID"]),
                  "run_attempt": int(os.environ["LIVE_GATE_RUN_ATTEMPT"]),
                  "release_marker": "1.4.1",
                  "visual_system_marker": "signal-sheet",
                  "outcomes": outcomes,
              },
              "files": json.loads(files_path.read_text()) if files_path.exists() else {},
              "failure_receipts": {
                  "install_tail": tail("/tmp/manzanita-live/install.log") if outcomes["install"] != "success" else "",
                  "exact_files_tail": tail("/tmp/manzanita-live/bytes.log") if outcomes["exact_files"] != "success" else "",
                  "browser_tail": tail("/tmp/manzanita-live/browser.log") if outcomes["browser_contract"] != "success" else "",
              },
              "authority": {
                  "successor_program_effect": "none",
                  "external_campaign_effect": "none",
                  "canonical_task_count_effect": "none",
              },
          }
          target = Path(".github/manzanita-live-receipts") / f"{os.environ['PAGES_RUN_ID']}.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          Path("/tmp/manzanita-live/receipt-state.txt").write_text(receipt["state"] + "\n")
          PY

          target=".github/manzanita-live-receipts/$PAGES_RUN_ID.json"
          git config user.name "manzanita-live-gate"
          git config user.email "actions@users.noreply.github.com"
          git add "$target"
          git diff --cached --check
          git commit -m "Manzanita: record v1.4.1 live observation $PAGES_RUN_ID"
          git push origin HEAD:main

      - name: Enforce the retained observation
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "$(cat /tmp/manzanita-live/receipt-state.txt)" = "PASS"
          else
            test "${{ steps.install.outcome }}" = "success"
            test "${{ steps.bytes.outcome }}" = "success"
            test "${{ steps.browser.outcome }}" = "success"
            test "${{ steps.upload.outcome }}" = "success"
          fi
