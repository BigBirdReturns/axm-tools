name: Manzanita Works v1.4.1 live Pages gate

on:
  push:
    branches: [main]
    paths:
      - "manzanita/**"
      - ".github/workflows/manzanita-live-check.yml"
  workflow_run:
    workflows: ["PTA tracker fetch + deploy"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Wait for the exact public release
        env:
          MANZANITA_URL: https://bigbirdreturns.github.io/axm-tools/manzanita/?v=${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS -o /tmp/manzanita.html -w '%{http_code}' "$MANZANITA_URL" || true)
            if [ "$code" = "200" ] \
              && grep -q 'data-release="1.4.1"' /tmp/manzanita.html \
              && grep -q 'data-visual-system="signal-sheet"' /tmp/manzanita.html; then
              break
            fi
            if [ "$attempt" = "24" ]; then
              echo "Public endpoint failed exact release gate: HTTP $code"
              head -100 /tmp/manzanita.html || true
              exit 1
            fi
            sleep 10
          done
      - name: Drive the public endpoint
        env:
          MANZANITA_URL: https://bigbirdreturns.github.io/axm-tools/manzanita/?v=${{ github.event.workflow_run.head_sha || github.sha }}
          MANZANITA_SCREENSHOT_DIR: ${{ runner.temp }}/manzanita-live-screens
        run: python manzanita/tests/browser_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: manzanita-signal-sheet-v1.4.1-live-screens
          path: ${{ runner.temp }}/manzanita-live-screens
          if-no-files-found: error
          retention-days: 30
