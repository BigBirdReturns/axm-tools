name: Manzanita Works v1.6.0 live Pages gate

on:
  workflow_run:
    workflows: ["PTA tracker fetch + deploy"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MANZANITA_BASE_URL: https://bigbirdreturns.github.io/axm-tools/manzanita
      MANZANITA_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PAGES_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic browser dependencies
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p /tmp/manzanita-live
          {
            python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.57.0
            python -m playwright install --with-deps chromium
          } 2>&1 | tee /tmp/manzanita-live/install.log

      - name: Wait for and verify every qualified public byte
        id: bytes
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/manzanita-live/files
          exec > >(tee /tmp/manzanita-live/bytes.log) 2>&1

          for attempt in $(seq 1 30); do
            code=$(curl -L -sS \
              -o /tmp/manzanita-live/index.html \
              -w '%{http_code}' \
              "$MANZANITA_BASE_URL/?v=$MANZANITA_SOURCE_SHA" || true)
            if [ "$code" = "200" ] \
              && grep -q 'data-release="1.6.0"' /tmp/manzanita-live/index.html \
              && grep -q 'data-visual-system="photographic-place-fabric"' /tmp/manzanita-live/index.html; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Public endpoint failed the v1.6.0 release-marker gate: HTTP $code"
              head -80 /tmp/manzanita-live/index.html || true
              exit 1
            fi
            sleep 10
          done

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote, urljoin
          from urllib.request import Request, urlopen

          base = os.environ["MANZANITA_BASE_URL"].rstrip("/") + "/"
          source = quote(os.environ["MANZANITA_SOURCE_SHA"], safe="")
          qualification = json.loads(Path("manzanita/QUALIFICATION.json").read_text(encoding="utf-8"))
          observed = {}
          out = Path("/tmp/manzanita-live/files")

          for relative, expected in sorted(qualification["files"].items()):
              url = urljoin(base, relative) + f"?v={source}"
              request = Request(url, headers={"User-Agent": "manzanita-live-gate/1.6.0"})
              with urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise SystemExit(f"HTTP {response.status} for {relative}")
                  payload = response.read()
              digest = hashlib.sha256(payload).hexdigest()
              if len(payload) != expected["bytes"] or digest != expected["sha256"]:
                  raise SystemExit(
                      f"live byte mismatch for {relative}: "
                      f"observed=({len(payload)}, {digest}) "
                      f"expected=({expected['bytes']}, {expected['sha256']})"
                  )
              target = out / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              observed[relative] = {"bytes": len(payload), "sha256": digest}

          Path("/tmp/manzanita-live/files.json").write_text(
              json.dumps(observed, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"result": "PASS", "qualified_files": len(observed)}, indent=2))
          PY

      - name: Drive the deployed public endpoint
        id: browser
        if: steps.install.outcome == 'success' && steps.bytes.outcome == 'success'
        continue-on-error: true
        env:
          MANZANITA_URL: ${{ env.MANZANITA_BASE_URL }}/?v=${{ env.MANZANITA_SOURCE_SHA }}
          MANZANITA_SCREENSHOT_DIR: ${{ runner.temp }}/manzanita-v1.6.0-live-screens
        run: |
          set -o pipefail
          python manzanita/tests/browser_test.py 2>&1 | tee /tmp/manzanita-live/browser.log

      - name: Enforce the deployed photographic composition
        id: visual
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        env:
          MANZANITA_URL: ${{ env.MANZANITA_BASE_URL }}/?v=${{ env.MANZANITA_SOURCE_SHA }}
        run: |
          set -o pipefail
          python programs/manzanita-public-convergence/rendered_visual_floor.py \
            --target "$MANZANITA_URL" \
            --output /tmp/manzanita-live/rendered-visual-floor 2>&1 \
            | tee /tmp/manzanita-live/visual.log

      - name: Retain the live browser evidence
        id: upload
        if: steps.browser.outcome == 'success' && steps.visual.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-photographic-place-fabric-v1.6.0-live-evidence
          path: |
            ${{ runner.temp }}/manzanita-v1.6.0-live-screens
            /tmp/manzanita-live/rendered-visual-floor
            /tmp/manzanita-live/files.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain the completed Pages observation
        id: receipt
        if: always()
        env:
          LIVE_GATE_RUN_ID: ${{ github.run_id }}
          LIVE_GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BYTE_OUTCOME: ${{ steps.bytes.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def tail(path: str, limit: int = 8000) -> str:
              target = Path(path)
              if not target.exists():
                  return ""
              return target.read_text(encoding="utf-8", errors="replace")[-limit:]

          outcomes = {
              "install": os.environ["INSTALL_OUTCOME"],
              "exact_qualified_files": os.environ["BYTE_OUTCOME"],
              "browser_contract": os.environ["BROWSER_OUTCOME"],
              "rendered_visual_floor": os.environ["VISUAL_OUTCOME"],
              "evidence_retention": os.environ["UPLOAD_OUTCOME"],
          }
          passed = all(value == "success" for value in outcomes.values())
          files_path = Path("/tmp/manzanita-live/files.json")
          pages_path = Path(".github/pages-deployment.json")
          receipt = {
              "schema": "manzanita-works/live-pages-receipt@2",
              "release": "1.6.0",
              "release_class": "bounded_public_photographic_convergence",
              "state": "PASS" if passed else "FAIL",
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "public_route": os.environ["MANZANITA_BASE_URL"] + "/",
              "pages": {
                  "workflow_run_id": os.environ["PAGES_RUN_ID"],
                  "source_sha": os.environ["MANZANITA_SOURCE_SHA"],
                  "deployment_receipt": json.loads(pages_path.read_text()) if pages_path.exists() else {},
              },
              "live_gate": {
                  "workflow_run_id": int(os.environ["LIVE_GATE_RUN_ID"]),
                  "run_attempt": int(os.environ["LIVE_GATE_RUN_ATTEMPT"]),
                  "release_marker": "1.6.0",
                  "visual_system_marker": "photographic-place-fabric",
                  "outcomes": outcomes,
              },
              "files": json.loads(files_path.read_text()) if files_path.exists() else {},
              "failure_receipts": {
                  "install_tail": tail("/tmp/manzanita-live/install.log") if outcomes["install"] != "success" else "",
                  "exact_files_tail": tail("/tmp/manzanita-live/bytes.log") if outcomes["exact_qualified_files"] != "success" else "",
                  "browser_tail": tail("/tmp/manzanita-live/browser.log") if outcomes["browser_contract"] != "success" else "",
                  "visual_tail": tail("/tmp/manzanita-live/visual.log") if outcomes["rendered_visual_floor"] != "success" else "",
              },
              "authority": {
                  "successor_program_effect": "none",
                  "external_campaign_effect": "none",
                  "canonical_task_count_effect": "none",
              },
          }
          target = Path(".github/manzanita-live-receipts") / f"{os.environ['PAGES_RUN_ID']}.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          Path("/tmp/manzanita-live/receipt-state.txt").write_text(receipt["state"] + "\n", encoding="utf-8")
          PY

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            git fetch origin main
            git rebase origin/main
            target=".github/manzanita-live-receipts/$PAGES_RUN_ID.json"
            git config user.name "manzanita-live-gate"
            git config user.email "actions@users.noreply.github.com"
            git add "$target"
            if ! git diff --cached --quiet; then
              git commit -m "Manzanita: record v1.6.0 live observation $PAGES_RUN_ID [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - name: Enforce the retained observation
        if: always()
        run: test "$(cat /tmp/manzanita-live/receipt-state.txt)" = "PASS"
