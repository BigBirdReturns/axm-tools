name: Repair Manzanita working-model same-document routing

on:
  push:
    branches:
      - fix/manzanita-working-model-hash-route-v1
    paths:
      - '.github/workflows/manzanita-working-model-hash-route-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize the route-state repair and regression gates
        run: python .github/scripts/repair_manzanita_working_model_hash_route.py

      - name: Remove one-shot repair machinery
        run: |
          rm .github/scripts/repair_manzanita_working_model_hash_route.py
          rm .github/workflows/manzanita-working-model-hash-route-repair.yml

      - name: Verify static contract and syntax
        run: |
          python manzanita-working-model/tests/public_contract_test.py
          node --check manzanita-working-model/app.js
          python -m py_compile \
            manzanita-working-model/tests/public_contract_test.py \
            manzanita-working-model/tests/browser_test.py \
            manzanita-working-model/tests/live_browser_test.py
          git diff --check
          git status --short

      - name: Commit the bounded repair
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'manzanita: reconcile same-document scenario routes'
          git push origin HEAD:${GITHUB_REF_NAME}
