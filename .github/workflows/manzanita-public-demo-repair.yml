name: Repair and seal Manzanita public-safe demonstration place

on:
  push:
    branches:
      - agent/manzanita-public-demo-018
    paths:
      - ".github/workflows/manzanita-public-demo-repair.yml"
      - ".github/scripts/manzanita-public-demo-repair.py"

permissions:
  contents: write

concurrency:
  group: manzanita-public-demo-repair
  cancel-in-progress: false

jobs:
  repair-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-public-demo-018
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 pillow jsonschema pytest playwright
          python -m playwright install --with-deps chromium

      - name: Apply bounded public-demo corrections
        run: python .github/scripts/manzanita-public-demo-repair.py

      - name: Prove the corrected candidate before sealing
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pytest -q manzanita-next/tests
          python -m py_compile \
            manzanita-next/public-demo/build_public_demo.py \
            manzanita-next/public-demo/tests/test_public_demo.py \
            manzanita-next/public-demo/tests/browser_test.py \
            programs/manzanita-99/review-board/validate_review_board.py
          python -m unittest discover \
            -s manzanita-next/public-demo/tests \
            -p "test_public_demo.py"

      - name: Seal and publish the corrected branch
        run: |
          rm -f \
            .github/workflows/manzanita-public-demo-repair.yml \
            .github/scripts/manzanita-public-demo-repair.py
          rm -rf \
            .pytest_cache \
            manzanita-next/.pytest_cache \
            manzanita-next/public-demo/out \
            manzanita-next/out
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "manzanita-public-demo-repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/manzanita-public-demo-repair.yml \
            .github/scripts/manzanita-public-demo-repair.py \
            manzanita-next/public-demo/PLACE_DEMO_CONTRACT.json \
            manzanita-next/public-demo/build_public_demo.py \
            manzanita-next/public-demo/template/app.js \
            manzanita-next/public-demo/template/style.css \
            manzanita-next/public-demo/tests/browser_test.py \
            manzanita-next/public-demo/tests/test_public_demo.py
          git commit -m "Manzanita: seal corrected public-safe demonstration candidate"
          git push origin HEAD:agent/manzanita-public-demo-018
