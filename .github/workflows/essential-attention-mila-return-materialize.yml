name: Repair Essential Attention Mila browser qualification

on:
  push:
    branches:
      - review/essential-attention-mila-return-v1-2-1
    paths:
      - '.github/workflows/essential-attention-mila-return-materialize.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize the inserted Mila test block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('essential-attention/tests/browser_test.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '\n\\\n            page.screenshot(path=str(OUT / "operating-desk-mobile.png"), full_page=True)'
          end_marker = '\n    reduced = browser.new_context(viewport={"width": 900, "height": 700}, reduced_motion="reduce").new_page()'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Mila test-block markers differ')
          before, rest = text.split(start_marker, 1)
          block, after = rest.split(end_marker, 1)
          first = '    page.screenshot(path=str(OUT / "operating-desk-mobile.png"), full_page=True)'
          fixed_lines = [first]
          for line in block.splitlines()[1:]:
              fixed_lines.append(line[8:] if line.startswith('        ') else line)
          fixed = '\n'.join(fixed_lines).rstrip() + '\n'
          path.write_text(before + '\n' + fixed + end_marker + after, encoding='utf-8')
          PY

      - name: Parse repaired test and inline runtime
        run: |
          python -m py_compile essential-attention/tests/browser_test.py
          python essential-attention/tests/public_contract_test.py
          node --check /tmp/essential-attention-inline.js

      - name: Commit the repaired browser qualification
        run: |
          git config user.name 'essential-attention-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add essential-attention/tests/browser_test.py
          git commit -m 'essential-attention: repair Mila browser qualification'
          git push origin HEAD
