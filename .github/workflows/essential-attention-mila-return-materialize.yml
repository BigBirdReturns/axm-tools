name: Materialize Essential Attention Mila return projection

on:
  push:
    branches:
      - review/essential-attention-mila-return-v1-2-1
    paths:
      - '.github/workflows/essential-attention-mila-return-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind the materializer to the indented executive section
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/materialize_essential_attention_mila_return.py')
          text = path.read_text(encoding='utf-8')
          old = '    html = replace_once(html, old_executive, new_executive, "executive projection")'
          new = '    old_executive = textwrap.indent(old_executive, "      ")\n    new_executive = textwrap.indent(new_executive, "      ")\n    html = replace_once(html, old_executive, new_executive, "executive projection")'
          if text.count(old) != 1:
              raise SystemExit('executive replacement anchor differs')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Materialize the direct Mila return projection
        run: python tools/materialize_essential_attention_mila_return.py

      - name: Regenerate and verify the static qualification receipt
        run: python essential-attention/tests/public_contract_test.py

      - name: Parse the materialized inline runtime
        run: node --check /tmp/essential-attention-inline.js

      - name: Remove one-shot materializer
        run: |
          rm tools/materialize_essential_attention_mila_return.py
          rm .github/workflows/essential-attention-mila-return-materialize.yml

      - name: Commit the exact Mila return projection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'essential-attention-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'essential-attention: add direct Mila return projection v1.2.1'
          git push origin HEAD
