name: Manzanita convergence materializer

on:
  push:
    branches: [agent/manzanita-public-convergence-v1-6]
    paths:
      - ".github/workflows/manzanita-convergence-materialize.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: manzanita-public-convergence-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-public-convergence-v1-6
          fetch-depth: 0
      - name: Recover the exact photographic donor
        run: |
          set -euo pipefail
          rm -rf /tmp/manzanita-photographic manzanita-convergence-preview
          mkdir -p /tmp/manzanita-photographic manzanita-convergence-preview
          git archive --format=tar 507ace9af2d2121cb93614158809ee5ff88437f2 manzanita \
            | tar -xf - -C /tmp/manzanita-photographic
          cp -a /tmp/manzanita-photographic/manzanita/. manzanita-convergence-preview/
      - name: Classify the preview and preserve donor identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('manzanita-convergence-preview')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace('data-release="1.1.2"', 'data-release="1.6.0-preview.1"')
          text = text.replace('<title>Manzanita Works · One Place, Every Scale</title>', '<title>Manzanita Works · Photographic Convergence Preview</title>')
          text = text.replace('</head>', '  <meta name="robots" content="noindex,nofollow">\n</head>')
          index.write_text(text, encoding='utf-8')

          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              payload = path.read_bytes()
              files.append({
                  'path': path.relative_to(root).as_posix(),
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
              })
          receipt = {
              'schema': 'manzanita-works/convergence-preview@1',
              'state': 'PREVIEW_ONLY',
              'preview_release': '1.6.0-preview.1',
              'photographic_donor': {
                  'release': '1.1.2',
                  'commit': '507ace9af2d2121cb93614158809ee5ff88437f2',
              },
              'current_public_rollback': {
                  'release': '1.4.1',
                  'route_tree': 'f6ea68bd4c5e07919277a099039354a5920d7b2b',
              },
              'authority': {
                  'public_release': False,
                  'successor_program_effect': 'none',
                  'external_campaign_effect': 'none',
                  'canonical_task_count_effect': 'none',
              },
              'files': files,
          }
          (root / 'PREVIEW_RECEIPT.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify recovered runtime and classify visual substance
        run: |
          set -euo pipefail
          node --check manzanita-convergence-preview/app.js
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('manzanita-convergence-preview')
          html = (root / 'index.html').read_text(encoding='utf-8')
          js = (root / 'app.js').read_text(encoding='utf-8')
          assert '1.6.0-preview.1' in html
          assert 'data:image/webp;base64,' in js
          assert js.count('data:image/webp;base64,') >= 2
          assert len(re.findall(r"(?:plant|household|property|street|neighborhood|region|stewardship)", js, re.I)) >= 7
          receipt = json.loads((root / 'PREVIEW_RECEIPT.json').read_text(encoding='utf-8'))
          assert receipt['state'] == 'PREVIEW_ONLY'
          assert receipt['authority']['public_release'] is False
          print('Photographic convergence donor: PASS')
          PY
      - name: Commit the bounded preview
        run: |
          set -euo pipefail
          git config user.name "manzanita-convergence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manzanita-convergence-preview
          if git diff --cached --quiet; then
            echo "Preview already materialized."
          else
            git commit -m "Manzanita: materialize photographic convergence preview"
            git push origin HEAD:agent/manzanita-public-convergence-v1-6
          fi

  render:
    needs: materialize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-public-convergence-v1-6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Render desktop, tablet, and mobile preview evidence
        run: |
          python - <<'PY'
          import contextlib
          import subprocess
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path('/tmp/manzanita-convergence-screens')
          out.mkdir(parents=True, exist_ok=True)
          server = subprocess.Popen(['python', '-m', 'http.server', '8765', '--bind', '127.0.0.1'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              time.sleep(1)
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  for name, width, height in [
                      ('desktop', 1440, 1000),
                      ('tablet', 1024, 900),
                      ('mobile', 390, 844),
                  ]:
                      page = browser.new_page(viewport={'width': width, 'height': height})
                      response = page.goto('http://127.0.0.1:8765/manzanita-convergence-preview/', wait_until='networkidle')
                      assert response and response.status == 200
                      assert page.locator('html').get_attribute('data-release') == '1.6.0-preview.1'
                      assert page.locator('body').evaluate('el => getComputedStyle(el).backgroundImage') is not None
                      overflow = page.evaluate('document.documentElement.scrollWidth - document.documentElement.clientWidth')
                      assert overflow <= 1, overflow
                      page.screenshot(path=str(out / f'{name}-full.png'), full_page=True)
                      page.close()
                  browser.close()
          finally:
              server.terminate()
              with contextlib.suppress(Exception):
                  server.wait(timeout=5)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: manzanita-convergence-preview-screens
          path: /tmp/manzanita-convergence-screens
          if-no-files-found: error
          retention-days: 14
