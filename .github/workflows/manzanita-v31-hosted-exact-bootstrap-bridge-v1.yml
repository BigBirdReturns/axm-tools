name: Manzanita v31 hosted exact bootstrap bridge

on:
  push:
    branches:
      - agent/manzanita-v31-origin-host-recovery-execution-v1
    paths:
      - '.github/workflows/manzanita-v31-hosted-exact-bootstrap-bridge-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manzanita-v31-hosted-exact-bootstrap-bridge-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-exact-bootstrap-and-platform-replay:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize exact V3 R1 package and execute bounded platform replay
        id: bridge
        continue-on-error: true
        shell: powershell
        env:
          BRIDGE_ROOT: ${{ runner.temp }}\v31-hosted-exact-bootstrap-bridge-v1
          HEAD_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $ExpectedName = 'MW_V31_OPERATOR_EXECUTION_BOOTSTRAP_V3_R1.zip'
          $ExpectedBytes = 553074
          $ExpectedSha256 = '2c4437c2f3c0cd7599b790ddc1a31315751db751daa3a81e4245e2a32b5f3738'
          $ExpectedRoot = 'MW_V31_OPERATOR_EXECUTION_BOOTSTRAP_V3_R1'
          $ExpectedPlatformResult = 'PASS_OPERATOR_EXECUTION_BOOTSTRAP_V3_R1_WINDOWS_PLATFORM_REPLAY'
          $DownloadUrl = 'https://drive.usercontent.google.com/download?id=1tX9hAVhNdThVUq6ozuIfrqn5vAhgSxU3&export=download&confirm=t'
          $PlatformReceiptName = 'V31_OPERATOR_EXECUTION_BOOTSTRAP_V3_R1_WINDOWS_PLATFORM_REPLAY_RECEIPT.json'
          $WorkflowPath = '.github\workflows\manzanita-v31-hosted-exact-bootstrap-bridge-v1.yml'

          $Root = $env:BRIDGE_ROOT
          $Output = Join-Path $Root 'artifact'
          $Extract = Join-Path $Root 'exact-package'
          $Workspace = Join-Path $Root 'platform-workspace'
          $PackagePath = Join-Path $Output $ExpectedName
          $BridgeReceiptPath = Join-Path $Output 'V31_HOSTED_EXACT_BOOTSTRAP_BRIDGE_RECEIPT_V1.json'
          $CopiedPlatformReceiptPath = Join-Path $Output $PlatformReceiptName
          $ChecksumsPath = Join-Path $Output 'SHA256SUMS.txt'
          $StdoutPath = Join-Path $Root 'platform-replay.stdout.txt'
          $StderrPath = Join-Path $Root 'platform-replay.stderr.txt'

          function Get-Sha256([string]$Path) {
            return (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          function Write-Utf8NoBom([string]$Path, [string]$Text) {
            $Encoding = [Text.UTF8Encoding]::new($false)
            [IO.File]::WriteAllText($Path, $Text, $Encoding)
          }

          function Is-UnsafeZipName([string]$Name) {
            if ([string]::IsNullOrWhiteSpace($Name)) { return $true }
            if ($Name.Contains('\')) { return $true }
            if ($Name.StartsWith('/')) { return $true }
            if ($Name -match '^[A-Za-z]:') { return $true }
            $Parts = $Name.Split('/')
            if (@($Parts | Where-Object { $_ -eq '..' -or $_ -eq '.' }).Count -gt 0) { return $true }
            return $false
          }

          $Receipt = [ordered]@{
            schema = 'manzanita/v31-hosted-exact-bootstrap-bridge@1'
            result = 'FAIL_HOSTED_EXACT_BOOTSTRAP_BRIDGE_NOT_COMPLETED'
            generated_at = [DateTimeOffset]::UtcNow.ToString('o')
            source = [ordered]@{
              workflow = $WorkflowPath.Replace('\','/')
              workflow_sha256 = $null
              repository_head_sha = $env:HEAD_SHA
              run_attempt = [int]$env:RUN_ATTEMPT
              hosted_runner = 'windows-2025'
            }
            package = [ordered]@{
              filename = $ExpectedName
              expected_bytes = $ExpectedBytes
              expected_sha256 = $ExpectedSha256
              observed_bytes = $null
              observed_sha256 = $null
              exact_identity = $false
              artifact_retained = $false
            }
            archive = [ordered]@{
              members = 0
              paths_safe = $false
              names_casefold_unique = $false
              symbolic_links_absent = $false
              exact_single_root = $false
              required_entrypoints_present = $false
            }
            platform_replay = [ordered]@{
              invoked = $false
              exit_code = $null
              stdout_bytes = 0
              stdout_sha256 = $null
              stderr_bytes = 0
              stderr_sha256 = $null
              receipt_present = $false
              receipt_bytes = $null
              receipt_sha256 = $null
              receipt_result = $null
              pass = $false
            }
            authority = [ordered]@{
              operator_storage_inspected = $false
              preparation_invoked = $false
              accepted_parent_recovery_invoked = $false
              remaining_input_recovery_invoked = $false
              deterministic_return_collection_invoked = $false
              receiving_intake_invoked = $false
              production_admission_invoked = $false
              accepted_parent_extracted = $false
              inherited_baseline_replay_authorized = $false
              v31_created = $false
              product_files_modified = 0
              operator_visual_acceptance = 'ABSENT'
              merge_authorized = $false
              release_authorized = $false
              public_route_effect = 'none'
              pages_effect = 'none'
              external_effect = 'hosted source bridge artifact only'
            }
            error = $null
          }

          $ExitCode = 1

          try {
            if (Test-Path -LiteralPath $Root) {
              Remove-Item -LiteralPath $Root -Recurse -Force
            }
            New-Item -ItemType Directory -Path $Output -Force | Out-Null
            New-Item -ItemType Directory -Path $Extract -Force | Out-Null
            New-Item -ItemType Directory -Path $Workspace -Force | Out-Null

            if (-not (Test-Path -LiteralPath $WorkflowPath -PathType Leaf)) {
              throw 'bridge workflow source is absent after checkout'
            }
            $Receipt.source.workflow_sha256 = Get-Sha256 $WorkflowPath

            & curl.exe -L --fail --silent --show-error --retry 3 --retry-delay 2 --output $PackagePath $DownloadUrl
            if ($LASTEXITCODE -ne 0) {
              throw "exact package download failed with exit code $LASTEXITCODE"
            }

            $Receipt.package.observed_bytes = (Get-Item -LiteralPath $PackagePath).Length
            $Receipt.package.observed_sha256 = Get-Sha256 $PackagePath
            if ($Receipt.package.observed_bytes -ne $ExpectedBytes) {
              throw "exact package byte count mismatch: $($Receipt.package.observed_bytes)"
            }
            if ($Receipt.package.observed_sha256 -ne $ExpectedSha256) {
              throw "exact package SHA-256 mismatch: $($Receipt.package.observed_sha256)"
            }
            $Receipt.package.exact_identity = $true
            $Receipt.package.artifact_retained = $true

            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $Archive = [IO.Compression.ZipFile]::OpenRead($PackagePath)
            try {
              $Names = @()
              $Folded = @{}
              $Unsafe = @()
              $CaseCollisions = @()
              $SymbolicLinks = @()
              $Roots = @{}
              $Required = @(
                "$ExpectedRoot/RUN_WINDOWS_PLATFORM_REPLAY.cmd",
                "$ExpectedRoot/RUN_PREPARE_ONLY.cmd",
                "$ExpectedRoot/RUN_ALL_RECOVERY_ADMIN.cmd",
                "$ExpectedRoot/RUN_COLLECT_RETURNS.cmd",
                "$ExpectedRoot/START_HERE.txt"
              )

              foreach ($Entry in $Archive.Entries) {
                $Name = $Entry.FullName
                $Names += $Name
                if (Is-UnsafeZipName $Name) {
                  $Unsafe += $Name
                }
                $Key = $Name.ToLowerInvariant()
                if ($Folded.ContainsKey($Key)) {
                  $CaseCollisions += $Name
                } else {
                  $Folded[$Key] = $true
                }
                $UnixType = (($Entry.ExternalAttributes -shr 16) -band 0xF000)
                if ($UnixType -eq 0xA000) {
                  $SymbolicLinks += $Name
                }
                $First = $Name.Split('/')[0]
                if ($First) {
                  $Roots[$First] = $true
                }
              }

              $Receipt.archive.members = $Archive.Entries.Count
              $Receipt.archive.paths_safe = ($Unsafe.Count -eq 0)
              $Receipt.archive.names_casefold_unique = ($CaseCollisions.Count -eq 0)
              $Receipt.archive.symbolic_links_absent = ($SymbolicLinks.Count -eq 0)
              $Receipt.archive.exact_single_root = ($Roots.Keys.Count -eq 1 -and $Roots.ContainsKey($ExpectedRoot))
              $Receipt.archive.required_entrypoints_present = (@($Required | Where-Object { -not $Folded.ContainsKey($_.ToLowerInvariant()) }).Count -eq 0)

              if (-not $Receipt.archive.paths_safe) { throw 'unsafe ZIP member path detected' }
              if (-not $Receipt.archive.names_casefold_unique) { throw 'duplicate or case-colliding ZIP member detected' }
              if (-not $Receipt.archive.symbolic_links_absent) { throw 'symbolic-link ZIP member detected' }
              if (-not $Receipt.archive.exact_single_root) { throw 'ZIP does not carry exactly one expected release root' }
              if (-not $Receipt.archive.required_entrypoints_present) { throw 'required package entrypoint absent' }
            } finally {
              $Archive.Dispose()
            }

            Expand-Archive -LiteralPath $PackagePath -DestinationPath $Extract -Force
            $PackageRoot = Join-Path $Extract $ExpectedRoot
            $PlatformLauncher = Join-Path $PackageRoot 'RUN_WINDOWS_PLATFORM_REPLAY.cmd'
            if (-not (Test-Path -LiteralPath $PlatformLauncher -PathType Leaf)) {
              throw 'platform replay launcher absent after extraction'
            }

            $env:V31_OPERATOR_WORKSPACE = $Workspace
            $env:PYTHONDONTWRITEBYTECODE = '1'
            $Receipt.platform_replay.invoked = $true

            $Command = 'call "' + $PlatformLauncher + '"'
            $Process = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d','/s','/c',$Command) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $StdoutPath -RedirectStandardError $StderrPath
            $Receipt.platform_replay.exit_code = $Process.ExitCode

            if (Test-Path -LiteralPath $StdoutPath -PathType Leaf) {
              $Receipt.platform_replay.stdout_bytes = (Get-Item -LiteralPath $StdoutPath).Length
              $Receipt.platform_replay.stdout_sha256 = Get-Sha256 $StdoutPath
            }
            if (Test-Path -LiteralPath $StderrPath -PathType Leaf) {
              $Receipt.platform_replay.stderr_bytes = (Get-Item -LiteralPath $StderrPath).Length
              $Receipt.platform_replay.stderr_sha256 = Get-Sha256 $StderrPath
            }

            $PlatformReceipts = @(Get-ChildItem -LiteralPath $Workspace -Recurse -File -Filter $PlatformReceiptName -ErrorAction SilentlyContinue)
            if ($PlatformReceipts.Count -ne 1) {
              throw "expected exactly one platform replay receipt; observed $($PlatformReceipts.Count)"
            }
            $PlatformReceipt = $PlatformReceipts[0]
            Copy-Item -LiteralPath $PlatformReceipt.FullName -Destination $CopiedPlatformReceiptPath -Force
            $PlatformObject = Get-Content -LiteralPath $CopiedPlatformReceiptPath -Raw -Encoding UTF8 | ConvertFrom-Json

            $Receipt.platform_replay.receipt_present = $true
            $Receipt.platform_replay.receipt_bytes = (Get-Item -LiteralPath $CopiedPlatformReceiptPath).Length
            $Receipt.platform_replay.receipt_sha256 = Get-Sha256 $CopiedPlatformReceiptPath
            $Receipt.platform_replay.receipt_result = $PlatformObject.result
            $Receipt.platform_replay.pass = ($Process.ExitCode -eq 0 -and $PlatformObject.result -eq $ExpectedPlatformResult)

            if (-not $Receipt.platform_replay.pass) {
              throw "platform replay did not close: exit=$($Process.ExitCode), result=$($PlatformObject.result)"
            }

            $Receipt.result = 'PASS_HOSTED_EXACT_BOOTSTRAP_MATERIALIZED_AND_WINDOWS_PLATFORM_REPLAY_CLOSED'
            $ExitCode = 0
          } catch {
            $Receipt.error = $_.Exception.Message
            $ExitCode = 1
          } finally {
            if (-not (Test-Path -LiteralPath $Output -PathType Container)) {
              New-Item -ItemType Directory -Path $Output -Force | Out-Null
            }
            $Receipt.generated_at = [DateTimeOffset]::UtcNow.ToString('o')
            $Json = $Receipt | ConvertTo-Json -Depth 40
            Write-Utf8NoBom -Path $BridgeReceiptPath -Text ($Json + "`n")

            $LedgerLines = @()
            foreach ($File in @(Get-ChildItem -LiteralPath $Output -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name)) {
              $LedgerLines += ((Get-Sha256 $File.FullName) + '  ' + $File.Name)
            }
            Write-Utf8NoBom -Path $ChecksumsPath -Text (($LedgerLines -join "`n") + "`n")
          }

          exit $ExitCode

      - name: Retain exact bootstrap source and bounded platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-v31-exact-bootstrap-bridge-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\v31-hosted-exact-bootstrap-bridge-v1\artifact\MW_V31_OPERATOR_EXECUTION_BOOTSTRAP_V3_R1.zip
            ${{ runner.temp }}\v31-hosted-exact-bootstrap-bridge-v1\artifact\V31_HOSTED_EXACT_BOOTSTRAP_BRIDGE_RECEIPT_V1.json
            ${{ runner.temp }}\v31-hosted-exact-bootstrap-bridge-v1\artifact\V31_OPERATOR_EXECUTION_BOOTSTRAP_V3_R1_WINDOWS_PLATFORM_REPLAY_RECEIPT.json
            ${{ runner.temp }}\v31-hosted-exact-bootstrap-bridge-v1\artifact\SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error

      - name: Require bounded bridge PASS
        if: always()
        shell: powershell
        env:
          BRIDGE_RECEIPT: ${{ runner.temp }}\v31-hosted-exact-bootstrap-bridge-v1\artifact\V31_HOSTED_EXACT_BOOTSTRAP_BRIDGE_RECEIPT_V1.json
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:BRIDGE_RECEIPT -PathType Leaf)) {
            throw 'bridge receipt absent'
          }
          $Receipt = Get-Content -LiteralPath $env:BRIDGE_RECEIPT -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($Receipt.result -ne 'PASS_HOSTED_EXACT_BOOTSTRAP_MATERIALIZED_AND_WINDOWS_PLATFORM_REPLAY_CLOSED') {
            throw "bridge result is $($Receipt.result): $($Receipt.error)"
          }
          if (-not $Receipt.package.exact_identity -or -not $Receipt.platform_replay.pass) {
            throw 'bridge PASS lacks exact package identity or platform replay PASS'
          }
