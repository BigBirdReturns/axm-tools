name: Manzanita v31 hosted private-source visibility probe

on:
  push:
    branches:
      - agent/manzanita-v31-origin-host-recovery-execution-v1
    paths:
      - '.github/workflows/manzanita-v31-hosted-exact-bootstrap-bridge-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manzanita-v31-hosted-private-source-visibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify-private-source-visibility:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Exercise runner-local staging HOLD on hosted Windows
        shell: powershell
        env:
          SELF_TEST_ROOT: ${{ runner.temp }}\v31-runner-local-stage-self-test
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $Root = $env:SELF_TEST_ROOT
          if (Test-Path -LiteralPath $Root) { Remove-Item -LiteralPath $Root -Recurse -Force }
          New-Item -ItemType Directory -Path $Root -Force | Out-Null
          $Wrong = Join-Path $Root 'MW_V31_OPERATOR_EXECUTION_BOOTSTRAP_V3_R1.zip'
          [IO.File]::WriteAllBytes($Wrong, [byte[]](1,2,3,4))
          $Output = Join-Path $Root 'staged.zip'
          $Receipt = Join-Path $Root 'V31_RUNNER_LOCAL_STAGE_WINDOWS_HOLD_SELF_TEST_RECEIPT.json'
          $Script = '.\manzanita-next\recovery\v31-origin-host-recovery-execution-v1\stage_exact_bootstrap_from_local_custody.ps1'
          $Arguments = @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$Script,'-OutputPath',$Output,'-ReceiptPath',$Receipt,'-MaximumDirectoriesPerRoot','0')
          $PriorExactPath = $env:V31_EXACT_BOOTSTRAP_PATH
          try {
            $env:V31_EXACT_BOOTSTRAP_PATH = $Wrong
            $Process = Start-Process -FilePath 'powershell.exe' -ArgumentList $Arguments -Wait -PassThru -NoNewWindow
          } finally {
            $env:V31_EXACT_BOOTSTRAP_PATH = $PriorExactPath
          }
          if ($Process.ExitCode -ne 2) { throw "stage HOLD self-test exit code is $($Process.ExitCode)" }
          $Object = Get-Content -LiteralPath $Receipt -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($Object.result -ne 'HOLD_EXACT_BOOTSTRAP_NOT_PRESENT_IN_RUNNER_LOCAL_OR_SYNCED_CUSTODY') { throw "stage HOLD self-test result is $($Object.result)" }
          if ($Object.search.wrong_identity_candidates -ne 1 -or $Object.output.written -ne $false) { throw 'stage HOLD self-test evidence differs' }

      - name: Exercise temporary local-file source bridge rewrite
        shell: powershell
        env:
          BRIDGE_SELF_TEST: ${{ runner.temp }}\V31_LOCAL_FILE_SOURCE_BRIDGE_WINDOWS_SELF_TEST_RECEIPT.json
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $SourcePath = '.\manzanita-next\recovery\v31-origin-host-recovery-execution-v1\run_origin_host_recovery.ps1'
          $Source = Get-Content -LiteralPath $SourcePath -Raw -Encoding UTF8
          $Pattern = '(?m)^\$DownloadUrl = ''[^'']+''\r?$'
          $Matches = [Regex]::Matches($Source, $Pattern)
          $FileUri = ([Uri]([IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'synthetic exact package.zip')))).AbsoluteUri
          $Replacement = '$DownloadUrl = ' + [char]39 + $FileUri + [char]39
          $Patched = [Regex]::Replace($Source, $Pattern, $Replacement, 1)
          $Pass = ($Matches.Count -eq 1 -and $Patched -ne $Source -and $Patched -match [Regex]::Escape($FileUri))
          $Receipt = [ordered]@{
            schema = 'manzanita/v31-local-file-source-bridge-windows-self-test@1'
            result = if ($Pass) { 'PASS_LOCAL_FILE_SOURCE_BRIDGE_REWRITE_EXACTLY_ONCE' } else { 'FAIL_LOCAL_FILE_SOURCE_BRIDGE_REWRITE' }
            source_matches = $Matches.Count
            file_uri_present = ($Patched -match [Regex]::Escape($FileUri))
            recovery_invoked = $false
            product_mutation = $false
          }
          [IO.File]::WriteAllText($env:BRIDGE_SELF_TEST, (($Receipt | ConvertTo-Json -Depth 10) + "`n"), [Text.UTF8Encoding]::new($false))
          if (-not $Pass) { throw $Receipt.result }

      - name: Probe private Drive source without retaining a false package
        shell: powershell
        env:
          OUTPUT_ROOT: ${{ runner.temp }}\v31-hosted-private-source-visibility
          HEAD_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ExpectedName = 'MW_V31_OPERATOR_EXECUTION_BOOTSTRAP_V3_R1.zip'
          $ExpectedBytes = 553074
          $ExpectedSha256 = '2c4437c2f3c0cd7599b790ddc1a31315751db751daa3a81e4245e2a32b5f3738'
          $DownloadUrl = 'https://drive.usercontent.google.com/download?id=1tX9hAVhNdThVUq6ozuIfrqn5vAhgSxU3&export=download&confirm=t'
          $Root = $env:OUTPUT_ROOT
          $Response = Join-Path $Root 'untrusted-response.bin'
          $Headers = Join-Path $Root 'response-headers.txt'
          $ReceiptPath = Join-Path $Root 'V31_HOSTED_PRIVATE_SOURCE_VISIBILITY_RECEIPT_V2.json'
          if (Test-Path -LiteralPath $Root) { Remove-Item -LiteralPath $Root -Recurse -Force }
          New-Item -ItemType Directory -Path $Root -Force | Out-Null

          $Receipt = [ordered]@{
            schema = 'manzanita/v31-hosted-private-source-visibility@2'
            result = 'FAIL_PRIVATE_SOURCE_VISIBILITY_NOT_CLASSIFIED'
            generated_at = [DateTimeOffset]::UtcNow.ToString('o')
            source = [ordered]@{
              provider = 'Google Drive'
              file_id = '1tX9hAVhNdThVUq6ozuIfrqn5vAhgSxU3'
              filename = $ExpectedName
              expected_bytes = $ExpectedBytes
              expected_sha256 = $ExpectedSha256
              repository_head_sha = $env:HEAD_SHA
              run_attempt = [int]$env:RUN_ATTEMPT
              runner = 'windows-2025'
              runner_authentication_to_drive = 'ABSENT'
            }
            response = [ordered]@{
              curl_exit_code = $null
              bytes = $null
              sha256 = $null
              content_class = $null
              exact_package = $false
              retained = $false
            }
            platform_replay = [ordered]@{ invoked = $false; observed = false }
            authority = [ordered]@{
              operator_storage_inspected = $false
              production_inputs_materialized = 0
              receiving_intake_invoked = $false
              production_admission_invoked = $false
              product_mutation = $false
              merge_authorized = $false
              release_authorized = $false
              public_route_effect = 'none'
              pages_effect = 'none'
              external_effect = 'source visibility observation only'
            }
            error = $null
          }

          try {
            & curl.exe -L --silent --show-error --retry 2 --retry-delay 1 --dump-header $Headers --output $Response $DownloadUrl
            $Receipt.response.curl_exit_code = $LASTEXITCODE
            if ($LASTEXITCODE -ne 0) { throw "curl exited $LASTEXITCODE" }
            $Receipt.response.bytes = (Get-Item -LiteralPath $Response).Length
            $Receipt.response.sha256 = (Get-FileHash -LiteralPath $Response -Algorithm SHA256).Hash.ToLowerInvariant()
            $Raw = [IO.File]::ReadAllBytes($Response)
            $PrefixLength = [Math]::Min(4096, $Raw.Length)
            $Prefix = [Text.Encoding]::UTF8.GetString($Raw, 0, $PrefixLength)
            if ($Receipt.response.bytes -eq $ExpectedBytes -and $Receipt.response.sha256 -eq $ExpectedSha256) {
              $Receipt.response.content_class = 'EXACT_BOOTSTRAP_PACKAGE'
              $Receipt.response.exact_package = $true
              $Receipt.result = 'PASS_HOSTED_SOURCE_EXACT_PACKAGE_VISIBLE'
            } elseif ($Prefix -match '<!doctype html>' -and $Prefix -match 'accounts\.google\.com') {
              $Receipt.response.content_class = 'GOOGLE_ACCOUNTS_SIGN_IN_HTML'
              $Receipt.result = 'HOLD_PRIVATE_DRIVE_SOURCE_REQUIRES_AUTHENTICATED_TRANSFER_OR_RUNNER_LOCAL_EXACT_STAGE'
            } else {
              $Receipt.response.content_class = 'NON_PACKAGE_RESPONSE'
              $Receipt.result = 'HOLD_DRIVE_SOURCE_DID_NOT_RETURN_THE_EXACT_PACKAGE'
            }
          } catch {
            $Receipt.error = $_.Exception.Message
            $Receipt.result = 'FAIL_PRIVATE_SOURCE_VISIBILITY_PROBE_ABORTED'
          } finally {
            if (Test-Path -LiteralPath $Response) { Remove-Item -LiteralPath $Response -Force }
            if (Test-Path -LiteralPath $Headers) { Remove-Item -LiteralPath $Headers -Force }
            [IO.File]::WriteAllText($ReceiptPath, (($Receipt | ConvertTo-Json -Depth 30) + "`n"), [Text.UTF8Encoding]::new($false))
          }

      - name: Retain bounded visibility receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-v31-hosted-private-source-visibility-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\v31-hosted-private-source-visibility\V31_HOSTED_PRIVATE_SOURCE_VISIBILITY_RECEIPT_V2.json
            ${{ runner.temp }}\v31-runner-local-stage-self-test\V31_RUNNER_LOCAL_STAGE_WINDOWS_HOLD_SELF_TEST_RECEIPT.json
            ${{ runner.temp }}\V31_LOCAL_FILE_SOURCE_BRIDGE_WINDOWS_SELF_TEST_RECEIPT.json
          retention-days: 7
          if-no-files-found: error

      - name: Require an exact PASS or explicit private-source HOLD
        if: always()
        shell: powershell
        env:
          RECEIPT: ${{ runner.temp }}\v31-hosted-private-source-visibility\V31_HOSTED_PRIVATE_SOURCE_VISIBILITY_RECEIPT_V2.json
          STAGE_SELF_TEST: ${{ runner.temp }}\v31-runner-local-stage-self-test\V31_RUNNER_LOCAL_STAGE_WINDOWS_HOLD_SELF_TEST_RECEIPT.json
          BRIDGE_SELF_TEST: ${{ runner.temp }}\V31_LOCAL_FILE_SOURCE_BRIDGE_WINDOWS_SELF_TEST_RECEIPT.json
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $Receipt = Get-Content -LiteralPath $env:RECEIPT -Raw -Encoding UTF8 | ConvertFrom-Json
          $Accepted = @(
            'PASS_HOSTED_SOURCE_EXACT_PACKAGE_VISIBLE',
            'HOLD_PRIVATE_DRIVE_SOURCE_REQUIRES_AUTHENTICATED_TRANSFER_OR_RUNNER_LOCAL_EXACT_STAGE',
            'HOLD_DRIVE_SOURCE_DID_NOT_RETURN_THE_EXACT_PACKAGE'
          )
          if ($Accepted -notcontains $Receipt.result) { throw "visibility result is $($Receipt.result): $($Receipt.error)" }
          if ($Receipt.platform_replay.invoked -ne $false -or $Receipt.authority.product_mutation -ne $false) { throw 'visibility probe exceeded its authority boundary' }
          $StageSelfTest = Get-Content -LiteralPath $env:STAGE_SELF_TEST -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($StageSelfTest.result -ne 'HOLD_EXACT_BOOTSTRAP_NOT_PRESENT_IN_RUNNER_LOCAL_OR_SYNCED_CUSTODY') { throw 'runner-local stage Windows HOLD self-test did not close' }
          $BridgeSelfTest = Get-Content -LiteralPath $env:BRIDGE_SELF_TEST -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($BridgeSelfTest.result -ne 'PASS_LOCAL_FILE_SOURCE_BRIDGE_REWRITE_EXACTLY_ONCE') { throw 'local-file source bridge Windows self-test did not close' }
          Write-Host $Receipt.result
