name: signal-sheet-bootstrap

on:
  push:
    branches:
      - feature/axm-signal-sheet-v1-3
    paths:
      - ".github/import-signal-sheet/bootstrap.ready"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/axm-signal-sheet-v1-3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Reconstruct reviewed release
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import-signal-sheet/part-* > /tmp/axm-signal-sheet-v13.tar.gz.b64
          base64 --decode /tmp/axm-signal-sheet-v13.tar.gz.b64 > /tmp/axm-signal-sheet-v13.tar.gz
          echo "8af52d2b84de5ecdf163f92b5c3848f455516772ecf888f3f6d0d5c0c5560331  /tmp/axm-signal-sheet-v13.tar.gz" | sha256sum --check --strict
          rm -rf clinical-site-fabric
          tar -xzf /tmp/axm-signal-sheet-v13.tar.gz -C .
      - name: Validate tool and house-style binding
        shell: bash
        run: |
          set -euo pipefail
          node --check clinical-site-fabric/app.mjs
          node --check clinical-site-fabric/core.mjs
          node --check clinical-site-fabric/ingest.mjs
          node --check clinical-site-fabric/sample.mjs
          node --test clinical-site-fabric/tests/core.test.mjs
          python clinical-site-fabric/scripts/validate.py --write
          git diff --check
      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "axm-signal-sheet-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A clinical-site-fabric
          git add identity/axm/house-style/README.md identity/axm/house-style/AXM-House-Style-v1.3.standalone.html
          git add .github/workflows/clinical-site-fabric-verify.yml
          git commit -m "clinical-site-fabric: adopt AXM Signal Sheet v1.3"
          git push origin HEAD:feature/axm-signal-sheet-v1-3
