name: Repair Manzanita working-model evidence visuals v4

on:
  push:
    branches:
      - fix/manzanita-working-model-operational-evidence-v1
    paths:
      - '.github/workflows/manzanita-working-model-operational-evidence-repair-v4.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize corrected operational instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          import textwrap
          from pathlib import Path

          controller = Path('.github/workflows/manzanita-working-model-operational-evidence-repair-v3.yml')
          source = controller.read_text(encoding='utf-8')
          match = re.search(
              r"      - name: Materialize operational instrumentation\n"
              r".*?          python - <<'PY'\n(.*?)\n          PY\n",
              source,
              re.S,
          )
          if not match:
              raise SystemExit('could not recover V3 materialization program')
          program = textwrap.dedent(match.group(1))
          old = '\'        assert "No adverse use" in page.locator(".instrument-foot").inner_text()\','
          new = '\'        assert "no adverse use" in page.locator(".instrument-foot").inner_text().lower()\','
          if program.count(old) != 1:
              raise SystemExit(f'visual assertion correction anchor differed: {program.count(old)}')
          program = program.replace(old, new, 1)
          exec(compile(program, '<operational-evidence-v4>', 'exec'), {})
          PY

      - name: Remove one-shot repair machinery
        run: |
          rm '.github/workflows/manzanita-working-model-operational-evidence-repair.yml'
          rm '.github/workflows/manzanita-working-model-operational-evidence-repair-v2.yml'
          rm '.github/workflows/manzanita-working-model-operational-evidence-repair-v3.yml'
          rm '.github/workflows/manzanita-working-model-operational-evidence-repair-v4.yml'

      - name: Verify static, syntax, and browser contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            manzanita-working-model/tests/public_contract_test.py \
            manzanita-working-model/tests/browser_test.py \
            manzanita-working-model/tests/live_browser_test.py
          node --check manzanita-working-model/app.js
          python manzanita-working-model/tests/public_contract_test.py
          python -m pip install --disable-pip-version-check playwright==1.57.0
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            export MW_CHROMIUM_EXECUTABLE="$browser"
          else
            python -m playwright install --with-deps chromium
          fi
          export MW_WORKING_MODEL_SCREENSHOT_DIR="$RUNNER_TEMP/manzanita-working-model-operational-evidence"
          python manzanita-working-model/tests/browser_test.py

      - name: Retain visual qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-working-model-operational-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/manzanita-working-model-operational-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Commit bounded visual correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-visual-bot'
          git config user.email 'actions@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          required = {
              'manzanita-working-model/README.md',
              'manzanita-working-model/RELEASE_CONTRACT.json',
              'manzanita-working-model/WORKING_MODEL_CONTRACT.json',
              'manzanita-working-model/index.html',
              'manzanita-working-model/style.css',
              'manzanita-working-model/tests/browser_test.py',
              'manzanita-working-model/tests/live_browser_test.py',
              'manzanita-working-model/tests/public_contract_test.py',
          }
          allowed = required | {
              '.github/workflows/manzanita-working-model-operational-evidence-repair.yml',
              '.github/workflows/manzanita-working-model-operational-evidence-repair-v2.yml',
              '.github/workflows/manzanita-working-model-operational-evidence-repair-v3.yml',
              '.github/workflows/manzanita-working-model-operational-evidence-repair-v4.yml',
          }
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          observed = {row[3:] for row in rows}
          missing = required - observed
          unexpected = observed - allowed
          if missing or unexpected:
              raise SystemExit(f'changed-path gate failed\nmissing={sorted(missing)}\nunexpected={sorted(unexpected)}\nobserved={sorted(observed)}')
          PY
          git add -A
          git commit -m 'manzanita: replace archival photos with operational evidence'
          git push origin HEAD
