name: Install Mila estate front door

on:
  push:
    branches:
      - agent/mila-estate-front-door-v2
    paths:
      - .github/workflows/mila-estate-install.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore the reviewed Mila estate package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import binascii
          import hashlib
          import re

          payload_dir = Path('.github/mila-estate-payload')
          expected_sha = '6622c465173954f7a83d8b07bf22a2e54f6a4e22c9e3e976546f96b55d4bdeef'
          pieces = []

          for path in sorted(payload_dir.glob('chunk*')):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'^MILA_PAYLOAD_CHUNK_[^=]+=', '', text)
              pieces.append(''.join(text.split()))

          def exact_archive(candidate: str):
              try:
                  archive = base64.b64decode(candidate, validate=True)
              except (binascii.Error, ValueError):
                  return None
              if hashlib.sha256(archive).hexdigest() != expected_sha:
                  return None
              return archive

          payload = ''.join(pieces)
          archive = exact_archive(payload)
          repair = None

          if archive is None:
              suspect_index = 5
              suspect = pieces[suspect_index]
              for local_index in range(len(suspect)):
                  repaired_piece = suspect[:local_index] + suspect[local_index + 1:]
                  candidate = ''.join(pieces[:suspect_index] + [repaired_piece] + pieces[suspect_index + 1:])
                  archive = exact_archive(candidate)
                  if archive is not None:
                      repair = {
                          'chunk': suspect_index,
                          'local_index': local_index,
                          'removed_character': suspect[local_index],
                      }
                      payload = candidate
                      break

          if archive is None:
              raise SystemExit(f'No exact archive reconstruction found; payload_length={len(payload)}')

          if len(payload) != 42108:
              raise SystemExit(f'Unexpected repaired payload length: {len(payload)}')

          output = Path('/tmp/mila-estate-front-door.tar.gz')
          output.write_bytes(archive)
          print({
              'payload_length': len(payload),
              'archive_bytes': len(archive),
              'sha256': expected_sha,
              'repair': repair,
          })
          PY
          tar -xzf /tmp/mila-estate-front-door.tar.gz -C .

      - name: Verify the static contract
        run: |
          python mila/tests/public_contract_test.py
          node --check /tmp/mila-inline.js
          git diff --exit-code -- mila/QUALIFICATION.json

      - name: Drive the complete household-to-region journey
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          python mila/tests/browser_test.py

      - name: Commit the qualified front door
        shell: bash
        run: |
          rm -rf .github/mila-estate-payload
          rm -f .github/workflows/mila-estate-install.yml
          git config user.name "mila-estate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- mila README.md index.html .github/workflows/mila-site-check.yml .github/mila-estate-payload .github/workflows/mila-estate-install.yml
          git diff --cached --check
          git commit -m "mila: install household-to-region estate front door"
          git push origin HEAD:agent/mila-estate-front-door-v2
