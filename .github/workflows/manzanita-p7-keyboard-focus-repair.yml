name: Repair Manzanita P7 keyboard focus continuity

on:
  push:
    branches:
      - fix/manzanita-p7-keyboard-focus-race
    paths:
      - ".github/workflows/manzanita-p7-keyboard-focus-repair.yml"
      - ".github/scripts/manzanita-p7-keyboard-focus-repair.py"

permissions:
  contents: write

concurrency:
  group: manzanita-p7-keyboard-focus-repair
  cancel-in-progress: false

jobs:
  repair-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manzanita-p7-keyboard-focus-race
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact source-test dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow

      - name: Apply the bounded focus-continuity correction
        run: python .github/scripts/manzanita-p7-keyboard-focus-repair.py

      - name: Prove the corrected source and regression contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          node --check manzanita-next/experience/template/app.js
          python -m py_compile \
            manzanita-next/experience/build_experience.py \
            manzanita-next/experience/tests/browser_test.py \
            manzanita-next/experience/tests/test_experience.py
          python -m unittest discover \
            -s manzanita-next/experience/tests \
            -p "test_experience.py"
          python - <<'PY'
          from pathlib import Path

          app = Path("manzanita-next/experience/template/app.js").read_text(encoding="utf-8")
          start = app.index("  function focusControl(kind, id) {")
          end = app.index("\n  function select(kind, id", start)
          focus = app[start:end]
          assert "requestAnimationFrame" not in focus
          assert "if (control) control.focus();" in focus

          browser = Path("manzanita-next/experience/tests/browser_test.py").read_text(encoding="utf-8")
          for assertion in (
              'page.keyboard.press("End")',
              'page.keyboard.press("ArrowLeft")',
              'page.keyboard.press("Home")',
              'page.keyboard.press("ArrowRight")',
              'Consecutive ArrowLeft did not move exactly one aperture',
              'Consecutive ArrowRight did not move exactly one aperture',
          ):
              assert assertion in browser, assertion
          PY

      - name: Seal and publish the corrected branch
        run: |
          rm -f \
            .github/workflows/manzanita-p7-keyboard-focus-repair.yml \
            .github/scripts/manzanita-p7-keyboard-focus-repair.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "manzanita-p7-keyboard-focus-repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/manzanita-p7-keyboard-focus-repair.yml \
            .github/scripts/manzanita-p7-keyboard-focus-repair.py \
            manzanita-next/experience/template/app.js \
            manzanita-next/experience/tests/browser_test.py \
            manzanita-next/experience/tests/test_experience.py
          git commit -m "Manzanita: preserve focus across consecutive aperture keys"
          git push origin HEAD:fix/manzanita-p7-keyboard-focus-race
