name: Reconcile and admit Manzanita public-safe demonstration place

on:
  push:
    branches:
      - agent/manzanita-public-demo-018
    paths:
      - ".github/workflows/manzanita-public-demo-reconcile-admit.yml"

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: manzanita-public-demo-admission
  cancel-in-progress: false

jobs:
  reconcile-seal-qualify-admit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH_NAME: agent/manzanita-public-demo-018
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-public-demo-018
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile the candidate with the current production baseline
        run: |
          git config user.name "manzanita-public-demo-admission"
          git config user.email "actions@users.noreply.github.com"
          git pull --ff-only origin "$BRANCH_NAME"
          git fetch --no-tags origin main
          git merge --no-edit origin/main
          test -f manzanita-next/design-system/CONSTITUTION.json
          test -f programs/manzanita-99/review-board/BOARD_CHARTER.json
          test -f programs/manzanita-99/review-board/validate_review_board.py

      - name: Correct source sanitization, registration, and qualification defects
        run: |
          python - <<'PY'
          from pathlib import Path

          builder_path = Path("manzanita-next/public-demo/build_public_demo.py")
          builder = builder_path.read_text(encoding="utf-8")

          register_paths = {
              "place": "M92 575 C195 496 278 431 371 376 C469 319 565 296 659 269 C753 242 843 211 927 170 C1014 128 1091 111 1153 95",
              "weather": "M78 581 C168 499 247 438 342 389 C438 340 536 315 628 278 C723 240 814 208 901 166 C994 121 1082 103 1158 88",
              "water": "M72 600 C164 547 254 502 341 450 C431 396 513 350 602 314 C694 276 771 233 852 190 C939 144 1025 126 1110 115",
              "fire": "M66 590 C157 508 237 440 331 387 C428 332 523 300 616 258 C711 215 794 155 880 120 C970 84 1054 82 1142 66",
          }
          for view_id, register_path in register_paths.items():
              marker = f'    "{view_id}": {{\n        "ground": '
              start = builder.find(marker)
              if start < 0:
                  raise SystemExit(f"Cannot locate {view_id} geometry")
              overlay_marker = '\n        "overlay": '
              overlay_at = builder.find(overlay_marker, start)
              if overlay_at < 0:
                  raise SystemExit(f"Cannot locate {view_id} overlay")
              segment = builder[start:overlay_at]
              if '"register"' not in segment:
                  builder = (
                      builder[:overlay_at]
                      + f'\n        "register": "{register_path}",'
                      + builder[overlay_at:]
                  )

          old_error = '''    error = receipt.get("error") if state != "ok" else None\n    if isinstance(error, str) and len(error) > 240:\n        error = error[:237] + "..."\n'''
          new_error = '''    raw_error = receipt.get("error") if state != "ok" else None\n    public_errors = {\n        "empty": "The provider returned no qualifying item or coverage for this request.",\n        "stale": "The retained source exceeds its admitted freshness window.",\n        "skipped_missing_credential": "An approved provider credential is not configured; the request was not attempted.",\n        "rate_limited": "The provider deferred or refused the request under a rate or quota limit.",\n        "unavailable": "The provider, network, transform, or required artifact was unavailable.",\n        "terms_blocked": "Provider rights or redistribution terms prohibit inclusion in this public artifact.",\n        "unknown": "The retained receipt does not support a more specific public failure classification.",\n    }\n    error = public_errors.get(state) if state != "ok" else None\n    if raw_error and state == "unknown":\n        error = public_errors["unknown"]\n'''
          if old_error in builder:
              builder = builder.replace(old_error, new_error, 1)
          if 'public_errors = {' not in builder:
              raise SystemExit("Public error sanitization did not apply")
          builder_path.write_text(builder, encoding="utf-8")

          app_path = Path("manzanita-next/public-demo/template/app.js")
          app = app_path.read_text(encoding="utf-8")
          app = app.replace(
              '    elements.fieldRegister.setAttribute("d", view.geometry.ground);',
              '    elements.fieldRegister.setAttribute("d", view.geometry.register);',
          )
          if 'view.geometry.register' not in app:
              raise SystemExit("Distinct registration geometry did not apply")
          app_path.write_text(app, encoding="utf-8")

          style_path = Path("manzanita-next/public-demo/template/style.css")
          style = style_path.read_text(encoding="utf-8")
          old_empty = '''  .state-empty {\n    border-color: var(--uncertain);\n    background: repeating-linear-gradient(45deg, transparent 0 4px, var(--uncertain) 4px 6px);\n  }\n'''
          new_empty = '''  .state-empty {\n    border-color: var(--uncertain);\n    background: transparent;\n  }\n\n  .state-empty::before,\n  .state-empty::after {\n    content: \"\";\n    position: absolute;\n    left: 2px;\n    right: 2px;\n    height: 2px;\n    background: var(--uncertain);\n  }\n\n  .state-empty::before {\n    top: 4px;\n  }\n\n  .state-empty::after {\n    bottom: 4px;\n  }\n'''
          if old_empty in style:
              style = style.replace(old_empty, new_empty, 1)
          if "gradient(" in style.lower():
              raise SystemExit("A gradient shortcut remains in the public-demo visual grammar")
          style_path.write_text(style, encoding="utf-8")

          browser_path = Path("manzanita-next/public-demo/tests/browser_test.py")
          browser = browser_path.read_text(encoding="utf-8")
          old_runtime = '''    runtime = page.evaluate("window.__MANZANITA_PUBLIC_DEMO_RUNTIME__")\n    data = page.evaluate("window.__MANZANITA_PUBLIC_DEMO__")\n'''
          new_runtime = '''    runtime = page.evaluate(\n        \"\"\"\n        () => {\n          const runtime = window.__MANZANITA_PUBLIC_DEMO_RUNTIME__;\n          return {\n            version: runtime.version,\n            sourceRunId: runtime.sourceRunId,\n            buildId: runtime.buildId,\n            views: runtime.views,\n            actors: runtime.actors,\n            themes: runtime.themes,\n            sourceStateCounts: runtime.sourceStateCounts,\n            state: runtime.getState(),\n          };\n        }\n        \"\"\"\n    )\n    data = page.evaluate("window.__MANZANITA_PUBLIC_DEMO__")\n'''
          if old_runtime in browser:
              browser = browser.replace(old_runtime, new_runtime, 1)
          if "state: runtime.getState()" not in browser:
              raise SystemExit("Serializable runtime inspection did not apply")
          browser_path.write_text(browser, encoding="utf-8")

          unit_path = Path("manzanita-next/public-demo/tests/test_public_demo.py")
          unit = unit_path.read_text(encoding="utf-8")
          anchor = '''        self.assertNotIn("access_token", serialized)\n        self.assertNotIn("https://public.example.invalid", serialized)\n'''
          replacement = '''        self.assertNotIn("access_token", serialized)\n        self.assertNotIn("airnow_api_key", serialized)\n        self.assertNotIn("firms_map_key", serialized)\n        self.assertNotIn("google_maps_api_key", serialized)\n        self.assertNotIn("mapillary_access_token", serialized)\n        self.assertNotIn("https://public.example.invalid", serialized)\n'''
          if anchor in unit:
              unit = unit.replace(anchor, replacement, 1)
          if "airnow_api_key" not in unit:
              raise SystemExit("Credential-name regression assertions did not apply")
          unit_path.write_text(unit, encoding="utf-8")
          PY

      - name: Prove the reconciled candidate diff is bounded
        run: |
          python - <<'PY'
          import subprocess

          changed = subprocess.run(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed = {
              ".github/workflows/manzanita-public-demo.yml",
              ".github/workflows/manzanita-public-demo-reconcile-admit.yml",
          }
          invalid = [
              path
              for path in changed
              if path not in allowed
              and not path.startswith("manzanita-next/public-demo/")
          ]
          if invalid:
              raise SystemExit(f"Public-demo candidate contains out-of-scope paths: {invalid}")
          if not any(path.startswith("manzanita-next/public-demo/") for path in changed):
              raise SystemExit("Candidate contains no public-demo object")
          PY
          git diff --quiet origin/main...HEAD -- manzanita

      - name: Install acquisition, projection, and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 pillow jsonschema pytest playwright
          python -m playwright install --with-deps chromium

      - name: Prove deterministic code and synthetic projection before sealing
        run: |
          pytest -q manzanita-next/tests
          python -m py_compile \
            manzanita-next/public-demo/build_public_demo.py \
            manzanita-next/public-demo/tests/test_public_demo.py \
            manzanita-next/public-demo/tests/browser_test.py \
            programs/manzanita-99/review-board/validate_review_board.py
          python -m unittest discover \
            -s manzanita-next/public-demo/tests \
            -p "test_public_demo.py"

      - name: Remove the temporary actuator and seal the candidate
        run: |
          rm .github/workflows/manzanita-public-demo-reconcile-admit.yml
          rm -rf manzanita-next/public-demo/out manzanita-next/out
          git add -A
          git commit -m "Manzanita: seal the public-safe demonstration candidate"
          echo "SEALED_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Qualify the exact sealed head with a fresh source run
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          REVIEW_HEAD_SHA: ${{ env.SEALED_HEAD_SHA }}
        run: |
          test "$(git rev-parse HEAD)" = "$SEALED_HEAD_SHA"
          test ! -e .github/workflows/manzanita-public-demo-reconcile-admit.yml
          git diff --quiet origin/main...HEAD -- manzanita
          rm -rf manzanita-next/out manzanita-next/public-demo/out
          cd manzanita-next
          python -m scripts.acquire_foundation \
            --place config/place-demo.json \
            --registry config/source-registry.json \
            --out out
          cd ..
          python manzanita-next/scripts/validate_foundation.py \
            --root manzanita-next/out \
            --source-schema manzanita-next/contracts/source-envelope.schema.json
          python manzanita-next/public-demo/build_public_demo.py \
            --repo-root . \
            --acquisition-root manzanita-next/out \
            --output manzanita-next/public-demo/out
          python manzanita-next/public-demo/tests/browser_test.py \
            --root manzanita-next/public-demo/out/site \
            --out manzanita-next/public-demo/out/qualification
          python programs/manzanita-99/review-board/validate_review_board.py \
            --repo-root . \
            --packet manzanita-next/public-demo/review/M99-RB-PKT-003.json \
            --decision manzanita-next/public-demo/review/M99-RB-DEC-003.json \
            --receipt manzanita-next/public-demo/out/qualification/BOARD_DECISION_RECEIPT.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          public_data = json.loads(Path("manzanita-next/public-demo/out/PUBLIC_DATA.json").read_text())
          projection = json.loads(Path("manzanita-next/public-demo/out/PUBLIC_PROJECTION_RECEIPT.json").read_text())
          build = json.loads(Path("manzanita-next/public-demo/out/BUILD_RECEIPT.json").read_text())
          browser = json.loads(Path("manzanita-next/public-demo/out/qualification/BROWSER_REPORT.json").read_text())
          board = json.loads(Path("manzanita-next/public-demo/out/qualification/BOARD_DECISION_RECEIPT.json").read_text())

          serialized = json.dumps(public_data).lower()
          for prohibited in (
              "airnow_api_key", "firms_map_key", "google_maps_api_key",
              "mapillary_access_token", "access_token", "street_address",
              "resident_name", "private key", "bearer "
          ):
              assert prohibited not in serialized, prohibited
          assert public_data["place"]["public_safe"] is True
          assert public_data["place"]["coordinate_precision_decimals"] <= 4
          assert set(public_data["views"]) == {"place", "weather", "water", "fire"}
          assert set(public_data["actors"]) == {"visitor", "steward", "program_operator"}
          assert len(public_data["sources"]) >= 20
          assert projection["result"] == "PASS"
          assert projection["prohibited_keys_found"] == []
          assert projection["secret_scan"]["result"] == "PASS"
          assert projection["secret_scan"]["high_confidence_findings"] == []
          assert build["result"] == "PASS"
          assert build["release_effect"] == "none"
          assert build["constitutional_count_effect"] == "none"
          assert browser["result"] == "PASS"
          assert len(browser["captures"]) == 8
          assert len(browser["mechanics"]["views"]) == 4
          assert len(browser["mechanics"]["actors"]) == 3
          assert len(browser["mechanics"]["control_targets"]) == 10
          assert all(row["width"] >= 44 and row["height"] >= 44 for row in browser["mechanics"]["control_targets"])
          assert all(not row["external_requests"] for row in browser["observations"])
          assert all(not row["console_errors"] for row in browser["observations"])
          assert all(not row["page_errors"] for row in browser["observations"])
          assert all(not row["failed_requests"] for row in browser["observations"])
          assert board["result"] == "PASS"
          assert board["reviewed_head"] == os.environ["REVIEW_HEAD_SHA"]
          assert board["outcome"] == "admit_with_holds"
          assert board["release_effect"] == "internal_candidate_only"
          assert board["constitutional_count_effect"] == "none"
          assert board["seat_count"] == 12
          assert board["open_vetoes"] == []
          assert board["open_critical_or_high_defects"] == []
          assert len(board["holds"]) >= 7
          PY

      - name: Publish the sealed branch
        run: |
          rm -rf manzanita-next/out manzanita-next/public-demo/out
          test -z "$(git status --porcelain)"
          git push origin HEAD:"$BRANCH_NAME"

      - name: Wait for the repository exact-head qualification
        run: |
          check_name="Acquire, project, test, and review the public dossier"
          success="false"
          for attempt in $(seq 1 80); do
            response="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$SEALED_HEAD_SHA/check-runs?per_page=100")"
            status="$(echo "$response" | jq -r --arg name "$check_name" '[.check_runs[] | select(.name == $name)] | last | .status // empty')"
            conclusion="$(echo "$response" | jq -r --arg name "$check_name" '[.check_runs[] | select(.name == $name)] | last | .conclusion // empty')"
            echo "attempt=$attempt status=$status conclusion=$conclusion"
            if test "$status" = "completed" && test "$conclusion" = "success"; then
              success="true"
              break
            fi
            if test "$status" = "completed" && test -n "$conclusion" && test "$conclusion" != "success"; then
              exit 1
            fi
            sleep 15
          done
          test "$success" = "true"

      - name: Mark ready and merge only the qualified sealed head
        run: |
          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')"
          test -n "$PR_NUMBER"
          PR_URL="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
          if test "$(gh pr view "$PR_URL" --json isDraft --jq .isDraft)" = "true"; then
            gh pr ready "$PR_URL"
          fi
          response="$(gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=merge \
            -f sha="$SEALED_HEAD_SHA" \
            -f commit_title="Merge Manzanita public-safe demonstration place" \
            -f commit_message="Admit the exact source-backed public-safe dossier for internal product work with provider, freshness, field, whole-product, succession, release, and constitutional-count holds preserved.")"
          echo "$response" | jq -e '.merged == true'
