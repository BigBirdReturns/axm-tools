name: Essential Attention orientation and contract

on:
  push:
    paths:
      - "essential-attention/**"
      - "tests/pages/verify_essential_attention.mjs"
      - ".github/workflows/essential-attention-check.yml"
  pull_request:
    paths:
      - "essential-attention/**"
      - "tests/pages/verify_essential_attention.mjs"
      - ".github/workflows/essential-attention-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  essential-attention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify the one-file contract and bounded receiver surface
        run: python essential-attention/tests/public_contract_test.py

      - name: Parse the inline runtime
        run: node --check /tmp/essential-attention-inline.js

      - name: Confirm the qualification receipt is current
        run: git diff --exit-code -- essential-attention/QUALIFICATION.json

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Drive operating desk, bounded Mila route, export, and narrow rendering
        run: python essential-attention/tests/browser_test.py

      - name: Retain Essential Attention v1.3.0 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essential-attention-v1.3.0-${{ github.sha }}
          path: |
            /tmp/essential-attention-v1.3.0-browser
            essential-attention/QUALIFICATION.json
          if-no-files-found: error
          retention-days: 30
