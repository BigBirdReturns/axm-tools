            ".github/workflows/manzanita-donor-custody-v2.yml": r'''
          name: Manzanita donor custody v2

          on:
            push:
              branches:
                - agent/manzanita-donor-custody-v2-actual
              paths:
                - "programs/manzanita-99/custody-v2/**"
                - ".github/workflows/manzanita-donor-custody-v2.yml"
            pull_request:
              paths:
                - "programs/manzanita-99/custody-v2/**"
                - ".github/workflows/manzanita-donor-custody-v2.yml"
            workflow_dispatch: {}

          permissions:
            contents: read

          jobs:
            qualify:
              name: Validate current donor custody without false closure
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              env:
                REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              steps:
                - uses: actions/checkout@v4
                  with:
