            "programs/manzanita-99/custody-v2/build_custody.py": r'''
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse, hashlib, json, stat, subprocess
          from pathlib import Path, PurePosixPath
          from typing import Any, Iterable

          ROOT = Path(__file__).resolve().parent
          CONTRACT = ROOT / "CUSTODY_CONTRACT.json"
          REGISTER = ROOT / "DONOR_REGISTER.json"
          LEDGER = ROOT / "OBSERVED_EXECUTION_LEDGER.json"
          GUARD = ROOT / "PUBLIC_ROUTE_GUARD.json"
          SCHEMA = "axm-tools/manzanita-donor-custody-manifest@2"

          class CustodyError(ValueError): pass
          def require(c: bool, m: str) -> None:
              if not c: raise CustodyError(m)
          def canonical(v: Any) -> bytes:
              return json.dumps(v, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          def sha256(b: bytes) -> str: return hashlib.sha256(b).hexdigest()
          def git_blob(b: bytes) -> str: return hashlib.sha1(f"blob {len(b)}\0".encode() + b).hexdigest()
          def load(path: Path) -> dict[str, Any]:
              v=json.loads(path.read_text()); require(isinstance(v,dict), f"{path} must contain an object"); return v
          def safe_rel(value: str) -> str:
              p=PurePosixPath(value); require(value and value!="." and not p.is_absolute() and ".." not in p.parts, f"unsafe path {value!r}"); return p.as_posix()
          def regular(repo: Path, rel: str) -> Path:
              rel=safe_rel(rel); candidate=repo/rel
              require(candidate.exists() or candidate.is_symlink(), f"missing source {rel}")
              mode=candidate.lstat().st_mode
              require(not stat.S_ISLNK(mode), f"source may not be a symlink: {rel}")
              require(stat.S_ISREG(mode), f"source is not a regular file: {rel}")
              resolved=candidate.resolve(strict=True); require(resolved.is_relative_to(repo), f"source escapes repository: {rel}"); return resolved
          def iter_files(repo: Path, rel: str, output: Path) -> Iterable[Path]:
              root=repo/safe_rel(rel)
              if not root.exists(): return
              candidates=[root] if root.is_file() else sorted(root.rglob("*"))
              for p in candidates:
                  if not p.is_file() or "__pycache__" in p.parts or p.suffix==".pyc": continue
                  rp=p.relative_to(repo).as_posix()
                  if "/out/" in f"/{rp}/" or rp.endswith("CUSTODY_MANIFEST.json") or rp.endswith("HISTORICAL_TREE_AUDIT.json"): continue
                  yield regular(repo,rp)
          def head(repo: Path) -> str:
              p=subprocess.run(["git","-C",str(repo),"rev-parse","HEAD"],capture_output=True,text=True); return p.stdout.strip() if p.returncode==0 else "WORKTREE"
          def build(repo: Path) -> dict[str, Any]:
              repo=repo.resolve(); contract=load(CONTRACT); register=load(REGISTER); ledger=load(LEDGER); guard=load(GUARD)
              require(contract.get("schema")=="axm-tools/manzanita-donor-custody-contract@2","contract schema")
              require(register.get("schema")=="axm-tools/manzanita-donor-register@2","register schema")
              files: dict[str,dict[str,Any]]={}; donors=[]
              for donor in register["donors"]:
                  rel=safe_rel(donor["path"]); exists=(repo/rel).exists()
                  if donor.get("required"): require(exists, f"required donor missing: {donor['id']}")
                  paths=[]
                  if exists:
                      for p in iter_files(repo,rel,ROOT/"out/CUSTODY_MANIFEST.json"):
                          rp=p.relative_to(repo).as_posix(); b=p.read_bytes(); row=files.setdefault(rp,{"path":rp,"bytes":len(b),"sha256":sha256(b),"git_blob_sha1":git_blob(b),"donor_ids":[]}); row["donor_ids"].append(donor["id"]); paths.append(rp)
                  donors.append({"id":donor["id"],"class":donor["class"],"path":rel,"declared_state":donor["custody_state"],"present":exists,"file_count":len(paths),"scope_sha256":sha256("".join(f"{p}\0{files[p]['sha256']}\n" for p in sorted(paths)).encode()),"claim_boundary":donor["claim_boundary"]})
              file_rows=[]
              for p in sorted(files): files[p]["donor_ids"]=sorted(set(files[p]["donor_ids"])); file_rows.append(files[p])
              observed=[]
              for row in ledger["entries"]:
                  present=(repo/safe_rel(row["path"])).exists(); observed.append({**row,"present":present,"canonical_task_count_effect":"none"})
              gaps=sorted(g["id"] for g in contract["gaps"] if g.get("required_for_close") and g.get("state")!="closed")
              result={"schema":SCHEMA,"task":"JDB99-001","task_state":contract["state"],"custody_state":"COMPLETE" if not gaps else "PARTIAL_BY_CONTRACT","generated_from":{"git_commit":head(repo),"contract_sha256":sha256(CONTRACT.read_bytes()),"register_sha256":sha256(REGISTER.read_bytes()),"ledger_sha256":sha256(LEDGER.read_bytes()),"public_guard_sha256":sha256(GUARD.read_bytes())},"source_file_count":len(file_rows),"source_bytes":sum(r["bytes"] for r in file_rows),"files":file_rows,"donors":donors,"observed_execution":observed,"open_required_gaps":gaps,"public_effect":"none","constitutional_count_effect":"none","public_release_authorized":False,"qualification_boundary":contract["qualification_boundary"]}
              result["payload_sha256"]=sha256(canonical(result)); return result
          def main() -> None:
              ap=argparse.ArgumentParser(); ap.add_argument("--repo-root",type=Path,default=Path.cwd()); ap.add_argument("--output",type=Path,default=ROOT/"out/CUSTODY_MANIFEST.json"); a=ap.parse_args(); value=build(a.repo_root); a.output.parent.mkdir(parents=True,exist_ok=True); a.output.write_text(json.dumps(value,indent=2)+"\n"); print(json.dumps({"result":"PASS","custody_state":value["custody_state"],"files":value["source_file_count"],"open_required_gaps":len(value["open_required_gaps"]),"manifest_sha256":value["payload_sha256"]},indent=2))
          if __name__=="__main__":
              try: main()
              except CustodyError as e: raise SystemExit(str(e)) from e
          ''',
            "programs/manzanita-99/custody-v2/validate_custody.py": r'''
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse, hashlib, json, stat
          from pathlib import Path, PurePosixPath
          from typing import Any

          ROOT=Path(__file__).resolve().parent
          class CustodyError(ValueError): pass
          def require(c: bool,m: str)->None:
              if not c: raise CustodyError(m)
          def canonical(v: Any)->bytes: return json.dumps(v,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          def sha256(b: bytes)->str:return hashlib.sha256(b).hexdigest()
          def git_blob(b: bytes)->str:return hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          def load(p: Path)->dict[str,Any]:
              v=json.loads(p.read_text()); require(isinstance(v,dict),f"{p} must contain object"); return v
          def safe(value: str)->str:
              p=PurePosixPath(value); require(value and value!="." and not p.is_absolute() and ".." not in p.parts,f"unsafe path {value!r}"); return p.as_posix()
          def source(repo: Path,rel: str)->Path:
              rel=safe(rel); p=repo/rel; require(p.exists() or p.is_symlink(),f"missing {rel}"); mode=p.lstat().st_mode; require(not stat.S_ISLNK(mode),f"symlink source {rel}"); require(stat.S_ISREG(mode),f"not regular {rel}"); q=p.resolve(strict=True); require(q.is_relative_to(repo),f"escape {rel}"); return q
          def validate(repo: Path,manifest: dict[str,Any],require_complete: bool=False)->dict[str,Any]:
              repo=repo.resolve(); contract=load(ROOT/"CUSTODY_CONTRACT.json"); register=load(ROOT/"DONOR_REGISTER.json"); ledger=load(ROOT/"OBSERVED_EXECUTION_LEDGER.json"); guard=load(ROOT/"PUBLIC_ROUTE_GUARD.json")
              require(manifest.get("schema")=="axm-tools/manzanita-donor-custody-manifest@2","manifest schema")
              payload=dict(manifest); supplied=payload.pop("payload_sha256",None); require(supplied==sha256(canonical(payload)),"manifest checksum")
              required=set(contract["required_classes"]); covered={d["class"] for d in register["donors"]}|{g["class"] for g in contract["gaps"]}; require(required<=covered,f"uncovered classes {sorted(required-covered)}")
              current=[]
              for row in guard["files"]:
                  p=source(repo,row["path"]); b=p.read_bytes(); require(len(b)==row["bytes"],f"public byte drift {row['path']}"); require(sha256(b)==row["sha256"],f"public SHA drift {row['path']}"); require(git_blob(b)==row["git_blob_sha1"],f"public blob drift {row['path']}"); current.append(row["path"])
              tracked=sorted(p.relative_to(repo).as_posix() for p in (repo/"manzanita").rglob("*") if p.is_file() and "__pycache__" not in p.parts and p.suffix!=".pyc"); require(sorted(current)==tracked,"public route file set drift")
              require(manifest["source_file_count"]==len(manifest["files"]),"file count")
              require(manifest["source_bytes"]==sum(r["bytes"] for r in manifest["files"]),"byte count")
              paths=[r["path"] for r in manifest["files"]]; require(paths==sorted(paths) and len(paths)==len(set(paths)),"path ordering or duplicates")
              for row in manifest["files"]:
                  p=source(repo,row["path"]); b=p.read_bytes(); require(len(b)==row["bytes"],f"byte drift {row['path']}"); require(sha256(b)==row["sha256"],f"hash drift {row['path']}"); require(git_blob(b)==row["git_blob_sha1"],f"blob drift {row['path']}")
              expected=sorted(g["id"] for g in contract["gaps"] if g.get("required_for_close") and g.get("state")!="closed"); require(manifest["open_required_gaps"]==expected,"gap set drift"); expected_state="COMPLETE" if not expected else "PARTIAL_BY_CONTRACT"; require(manifest["custody_state"]==expected_state,"false custody state")
              require(manifest.get("public_effect")=="none" and manifest.get("constitutional_count_effect")=="none" and manifest.get("public_release_authorized") is False,"unauthorized effect")
              for row in ledger["entries"]: require(row.get("state") in {"observed_on_head","observed_if_present"},"execution ledger invents lifecycle state")
              if contract["state"]=="closed": require(not expected,"closed task retains gaps")
              if require_complete: require(not expected,"custody remains partial")
              return {"result":"PASS","custody_state":expected_state,"open_required_gaps":len(expected),"files":len(paths),"manifest_sha256":supplied}
          def main()->None:
              ap=argparse.ArgumentParser(); ap.add_argument("--repo-root",type=Path,default=Path.cwd()); ap.add_argument("--manifest",type=Path,default=ROOT/"out/CUSTODY_MANIFEST.json"); ap.add_argument("--require-complete",action="store_true"); a=ap.parse_args(); print(json.dumps(validate(a.repo_root,load(a.manifest),a.require_complete),indent=2))
          if __name__=="__main__":
              try: main()
              except CustodyError as e: raise SystemExit(str(e)) from e
          ''',
            "programs/manzanita-99/custody-v2/audit_history.py": r'''
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse, hashlib, json, subprocess
          from pathlib import Path

          def run(repo: Path,*args: str)->str:
              p=subprocess.run(["git","-C",str(repo),*args],capture_output=True,text=True); return p.stdout if p.returncode==0 else ""
          def main()->None:
              ap=argparse.ArgumentParser(); ap.add_argument("--repo-root",type=Path,default=Path.cwd()); ap.add_argument("--output",type=Path,required=True); a=ap.parse_args(); repo=a.repo_root.resolve(); commits=run(repo,"rev-list","--all","--","manzanita").splitlines(); trees={}
              for commit in commits:
                  tree=run(repo,"rev-parse",f"{commit}:manzanita").strip()
                  if len(tree)!=40 or tree in trees: continue
                  files=[]
                  for line in run(repo,"ls-tree","-r",tree).splitlines():
                      meta,path=line.split("\t",1); mode,typ,sha=meta.split(); files.append({"path":f"manzanita/{path}","mode":mode,"type":typ,"git_blob_sha1":sha})
                  qualification=""
                  q=run(repo,"show",f"{commit}:manzanita/QUALIFICATION.json")
                  try: qualification=json.loads(q).get("release") or json.loads(q).get("version") or ""
                  except Exception: pass
                  trees[tree]={"tree_sha":tree,"first_observed_commit":commit,"file_count":len(files),"files":files,"classification":"repository_release_candidate" if qualification else "reachable_tree_not_release","declared_release":qualification,"claim_boundary":"Reachable Git history is custody evidence, not deployed-byte or approval proof."}
