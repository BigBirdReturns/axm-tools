              {"id":"review-board","class":"program_control","path":"programs/manzanita-99/review-board","required":true,"custody_state":"archived","claim_boundary":"Contained functional review law only. It is not independent external review or whole-product release authority."},
              {"id":"design-constitution","class":"program_control","path":"manzanita-next/design-system","required":false,"custody_state":"archived_repo_resident","claim_boundary":"Design constitution and specimens only. Visual finish and physical campaigns remain separately qualified."},
              {"id":"public-demo","class":"live_data_acquisition","path":"manzanita-next/public-demo","required":false,"custody_state":"archived_repo_resident","claim_boundary":"Public-safe demonstration place and source projection only; no private household or field standing."},
              {"id":"seven-apertures","class":"program_control","path":"manzanita-next/apertures","required":false,"custody_state":"archived_repo_resident","claim_boundary":"Seven governed scale projections over one place; no source authority transfer."},
              {"id":"street-glide","class":"asset_provenance","path":"manzanita-next/street-glide","required":false,"custody_state":"archived_repo_resident","claim_boundary":"Provider-order scene and registration kernel; no physical-feature or field determination."},
              {"id":"registered-overlays","class":"asset_provenance","path":"manzanita-next/overlays","required":false,"custody_state":"archived_repo_resident","claim_boundary":"Authored and source-bounded overlay geometry; no observed field condition or adverse decision."},
              {"id":"five-roles-and-fab","class":"program_control","path":"manzanita-next/roles","required":false,"custody_state":"archived_repo_resident","claim_boundary":"Internal role projections and bounded FAB handoff; no external-effect adapter."},
              {"id":"whole-experience","class":"standalone_export","path":"manzanita-next/experience","required":false,"custody_state":"archived_repo_resident","claim_boundary":"Internal whole-experience source and receipts; not a public endpoint or whole-product release."},
              {"id":"automated-qualification","class":"failure_receipt","path":"manzanita-next/qualification","required":false,"custody_state":"archived_repo_resident","claim_boundary":"Automated browser security and resilience evidence only; real people devices networks and assistive technology remain separate."},
              {"id":"estate-parity","class":"program_control","path":"manzanita-next/parity","required":false,"custody_state":"archived_repo_resident","claim_boundary":"Estate disposition register only; complete accounting does not absorb independently governed products."},
              {"id":"release-control","class":"deployment_receipt","path":"manzanita-next/release-control","required":false,"custody_state":"archived_repo_resident","claim_boundary":"Internal portable candidate and local continuity proofs under public-release HOLD; no public endpoint or deployed rollback standing."},
              {"id":"external-campaign-runner","class":"playtest","path":"manzanita-next/external-campaigns","required":false,"custody_state":"archived_repo_resident","claim_boundary":"Evidence instrument only. Its existence does not perform a physical human private provider field deployment or rollback campaign."}
            ]
          }
          ''',
            "programs/manzanita-99/custody-v2/OBSERVED_EXECUTION_LEDGER.json": r'''
          {
            "schema": "axm-tools/manzanita-observed-execution-ledger@2",
            "state": "path_observed_not_task_closed",
            "public_effect": "none",
            "constitutional_count_effect": "none",
            "qualification_boundary": "An entry means the named path is present in the reviewed repository head. It does not prove public deployment, physical execution, external campaign passage, or canonical task closure.",
            "entries": [
              {"id":"source-foundation","path":"manzanita-next","state":"observed_on_head"},
              {"id":"contained-review-board","path":"programs/manzanita-99/review-board","state":"observed_on_head"},
              {"id":"public-demo","path":"manzanita-next/public-demo","state":"observed_if_present"},
              {"id":"seven-apertures","path":"manzanita-next/apertures","state":"observed_if_present"},
