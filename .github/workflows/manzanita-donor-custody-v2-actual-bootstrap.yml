              {"id":"M99-CUSTODY-GAP-004","class":"playtest","state":"open","required_for_close":true,"target":"Seat and affected-actor playtests","admission":"Every finding names build, seat, scenario, observation, severity, disposition, and retained evidence.","failure_mode":"A known human failure survives only as summary prose."},
