                  self.old={p:(p.read_bytes() if p.exists() else None) for p in (ROOT/"CUSTODY_CONTRACT.json",ROOT/"DONOR_REGISTER.json",ROOT/"OBSERVED_EXECUTION_LEDGER.json",ROOT/"PUBLIC_ROUTE_GUARD.json")}
                  contract={"schema":"axm-tools/manzanita-donor-custody-contract@2","task":"JDB99-001","state":"in_progress","required_classes":["public_release","source_foundation","program_control"],"gaps":[{"id":"G1","class":"program_control","state":"open","required_for_close":True}],"qualification_boundary":"fixture"}
                  register={"schema":"axm-tools/manzanita-donor-register@2","donors":[{"id":"public","class":"public_release","path":"manzanita","required":True,"custody_state":"archived","claim_boundary":"fixture"},{"id":"source","class":"source_foundation","path":"manzanita-next","required":True,"custody_state":"archived","claim_boundary":"fixture"}]}
                  ledger={"schema":"axm-tools/manzanita-observed-execution-ledger@2","entries":[{"id":"source","path":"manzanita-next","state":"observed_on_head"}]}
                  guard={"schema":"axm-tools/manzanita-public-route-guard@2","files":[guard_row("manzanita/index.html",public)]}
                  for p,v in ((ROOT/"CUSTODY_CONTRACT.json",contract),(ROOT/"DONOR_REGISTER.json",register),(ROOT/"OBSERVED_EXECUTION_LEDGER.json",ledger),(ROOT/"PUBLIC_ROUTE_GUARD.json",guard)): p.write_text(json.dumps(v,indent=2)+"\n")
              def tearDown(self):
                  for p,b in self.old.items():
