              {"id":"automated-qualification","path":"manzanita-next/qualification","state":"observed_if_present"},
              {"id":"estate-parity","path":"manzanita-next/parity","state":"observed_if_present"},
              {"id":"release-control","path":"manzanita-next/release-control","state":"observed_if_present"},
