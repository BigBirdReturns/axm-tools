name: Bootstrap Manzanita donor custody v2

on:
  push:
    branches:
      - agent/manzanita-donor-custody-v2-actual
    paths:
      - ".github/workflows/manzanita-donor-custody-v2-actual-bootstrap.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: manzanita-donor-custody-v2-actual-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-donor-custody-v2-actual
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize the permanent custody object
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          files = {
            "programs/manzanita-99/custody-v2/README.md": r'''
          # Manzanita donor custody v2

          This directory operates `JDB99-001` against the current admitted Manzanita repository chain. The object is the recoverable evidence base beneath the successor build. Source custody may locate, hash, classify, retain, and reject donor evidence. It may not promote a donor into a product, infer a physical or external campaign, change public Manzanita bytes, authorize release, or reconstruct a canonical task row.

          `CUSTODY_CONTRACT.json` defines the ten evidence classes that still prevent closure. `DONOR_REGISTER.json` names the current repo-resident donors and their claim boundaries. `OBSERVED_EXECUTION_LEDGER.json` records only path-observed operating objects and carries no canonical task-count effect. `PUBLIC_ROUTE_GUARD.json` binds every tracked file in the historical public `manzanita/` route to Git blob and SHA-256 identities.

          `build_custody.py` emits a deterministic manifest over every admitted repo-resident donor. `validate_custody.py` re-hashes the source files, verifies the historical route, rejects symlinks before resolution, checks the open-gap ledger, and refuses false closure. `audit_history.py` inventories every reachable historical `manzanita/` tree without treating reachability as release approval or deployed-byte proof.

          From the repository root:

          ```bash
          python -m unittest discover -s programs/manzanita-99/custody-v2/tests -p "test_*.py"
          python programs/manzanita-99/custody-v2/build_custody.py --repo-root . --output programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json
          python programs/manzanita-99/custody-v2/validate_custody.py --repo-root . --manifest programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json
          python programs/manzanita-99/custody-v2/audit_history.py --repo-root . --output programs/manzanita-99/custody-v2/out/HISTORICAL_TREE_AUDIT.json
          ```

          The ordinary validator must report `PARTIAL_BY_CONTRACT` while returning `PASS`. `--require-complete` must fail until all ten required gaps are closed and every required donor has durable cold-successor custody. The controlling question is whether a cold successor can recover every admitted donor and every retained absence without confusing consistency with product or program completion.
          ''',
