                    git fetch --no-tags origin main
                    python - <<'PY'
                    import subprocess
                    changed=subprocess.run(["git","diff","--name-only","origin/main...HEAD"],check=True,capture_output=True,text=True).stdout.splitlines()
                    invalid=[p for p in changed if p!=".github/workflows/manzanita-donor-custody-v2.yml" and not p.startswith("programs/manzanita-99/custody-v2/")]
                    if invalid: raise SystemExit(f"out-of-scope custody paths: {invalid}")
                    PY
                    git diff --quiet origin/main...HEAD -- manzanita
                - name: Compile and run adversarial custody tests
                  env:
                    PYTHONDONTWRITEBYTECODE: "1"
                  run: |
                    python -m py_compile \
                      programs/manzanita-99/custody-v2/build_custody.py \
                      programs/manzanita-99/custody-v2/validate_custody.py \
                      programs/manzanita-99/custody-v2/audit_history.py \
                      programs/manzanita-99/custody-v2/tests/test_custody_v2.py
                    python -m unittest discover \
                      -s programs/manzanita-99/custody-v2/tests \
                      -p "test_*.py"
                - name: Build and validate the real repository custody manifest
                  run: |
                    rm -rf programs/manzanita-99/custody-v2/out
                    python programs/manzanita-99/custody-v2/build_custody.py \
                      --repo-root . \
                      --output programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json
                    python programs/manzanita-99/custody-v2/validate_custody.py \
                      --repo-root . \
                      --manifest programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json
                    if python programs/manzanita-99/custody-v2/validate_custody.py \
                      --repo-root . \
                      --manifest programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json \
                      --require-complete
                    then
                      echo "Custody falsely closed" >&2
                      exit 1
                    fi
                    python programs/manzanita-99/custody-v2/audit_history.py \
                      --repo-root . \
                      --output programs/manzanita-99/custody-v2/out/HISTORICAL_TREE_AUDIT.json
                - name: Prove partial state and effect firewalls
                  run: |
                    python - <<'PY'
                    import json
                    from pathlib import Path
                    m=json.loads(Path("programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json").read_text())
                    assert m["custody_state"]=="PARTIAL_BY_CONTRACT"
                    assert len(m["open_required_gaps"])==10
                    assert m["public_effect"]=="none"
                    assert m["constitutional_count_effect"]=="none"
                    assert m["public_release_authorized"] is False
                    assert all(r["canonical_task_count_effect"]=="none" for r in m["observed_execution"])
                    PY
                - name: Retain custody manifest history audit and source law
                  uses: actions/upload-artifact@v4
                  with:
                    name: manzanita-donor-custody-v2-${{ env.REVIEW_HEAD_SHA }}
                    path: |
                      programs/manzanita-99/custody-v2/README.md
                      programs/manzanita-99/custody-v2/CUSTODY_CONTRACT.json
                      programs/manzanita-99/custody-v2/DONOR_REGISTER.json
                      programs/manzanita-99/custody-v2/OBSERVED_EXECUTION_LEDGER.json
                      programs/manzanita-99/custody-v2/PUBLIC_ROUTE_GUARD.json
                      programs/manzanita-99/custody-v2/build_custody.py
                      programs/manzanita-99/custody-v2/validate_custody.py
                      programs/manzanita-99/custody-v2/audit_history.py
                      programs/manzanita-99/custody-v2/tests
                      programs/manzanita-99/custody-v2/out
                    if-no-files-found: error
                    retention-days: 90
          '''
          }

          for path, content in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip(), encoding="utf-8")
          PY

      - name: Generate the exact historical public-route guard
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          rows=[]
          for relative in subprocess.run(
              ["git","ls-files","manzanita"],
              check=True,capture_output=True,text=True
          ).stdout.splitlines():
              path=Path(relative)
              if not path.is_file() or "__pycache__" in path.parts or path.suffix==".pyc":
                  continue
              payload=path.read_bytes()
              blob=subprocess.run(["git","hash-object",relative],check=True,capture_output=True,text=True).stdout.strip()
              rows.append({"path":relative,"bytes":len(payload),"sha256":hashlib.sha256(payload).hexdigest(),"git_blob_sha1":blob})
          value={
              "schema":"axm-tools/manzanita-public-route-guard@2",
              "release":"1.4.0-historical-rollback-donor",
              "tree_sha":subprocess.run(["git","rev-parse","HEAD:manzanita"],check=True,capture_output=True,text=True).stdout.strip(),
              "files":sorted(rows,key=lambda row:row["path"]),
              "claim_boundary":"This guard proves repository byte identity for the historical public route. It is not observed endpoint-byte or successor-release proof."
          }
          Path("programs/manzanita-99/custody-v2/PUBLIC_ROUTE_GUARD.json").write_text(json.dumps(value,indent=2)+"\n")
          PY

      - name: Prove the materialized object before sealing
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            programs/manzanita-99/custody-v2/build_custody.py \
            programs/manzanita-99/custody-v2/validate_custody.py \
            programs/manzanita-99/custody-v2/audit_history.py \
            programs/manzanita-99/custody-v2/tests/test_custody_v2.py
          python -m unittest discover \
            -s programs/manzanita-99/custody-v2/tests \
            -p "test_*.py"
          python programs/manzanita-99/custody-v2/build_custody.py \
            --repo-root . \
            --output programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json
          python programs/manzanita-99/custody-v2/validate_custody.py \
            --repo-root . \
            --manifest programs/manzanita-99/custody-v2/out/CUSTODY_MANIFEST.json

      - name: Seal permanent source and remove bootstrap outputs
        run: |
          rm -rf programs/manzanita-99/custody-v2/out
          rm .github/workflows/manzanita-donor-custody-v2-actual-bootstrap.yml
          git config user.name "manzanita-donor-custody-v2-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/manzanita-donor-custody-v2-actual-bootstrap.yml \
            .github/workflows/manzanita-donor-custody-v2.yml \
            programs/manzanita-99/custody-v2
          git commit -m "Manzanita: establish current donor custody v2"
          git push origin HEAD:agent/manzanita-donor-custody-v2-actual
