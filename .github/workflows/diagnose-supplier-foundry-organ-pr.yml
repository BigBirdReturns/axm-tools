name: Diagnose Supplier Foundry organ PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write exact anchor counts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = [
            ('observe-import', 'organ-evolution/scripts/observe.py', 'from workflow_roles import apply_workflow_roles, validate_workflow_policy, workflow_finding\n'),
            ('validate-repo', 'organ-evolution/scripts/observe.py', '            full_name = repository["fullName"]\n            validate_workflow_policy(repository.get("workflowPolicy"))\n            if full_name in seen_repos:\n                raise ObservationError(f"repository mapped more than once: {full_name}")\n            seen_repos.add(full_name)'),
            ('tree-signals', 'organ-evolution/scripts/observe.py', 'def tree_signals(raw_tree: dict[str, Any]) -> dict[str, Any]:'),
            ('findings-full-name', 'organ-evolution/scripts/observe.py', '    full_name = repository["fullName"]\n'),
            ('findings-loop', 'organ-evolution/scripts/observe.py', '        if finding:\n            findings.append(finding)\n    for pull in repository.get("openPullRequests", []):'),
            ('collect-signature', 'organ-evolution/scripts/observe.py', 'def collect_repository(\n    provider: Provider,\n    full_name: str,\n    requested_ref: str | None,\n    workflow_policy: dict[str, Any] | None,\n    rules: SourceRules,\n    now: datetime,\n) -> dict[str, Any]:'),
            ('runs', 'organ-evolution/scripts/observe.py', '    runs = apply_workflow_roles(latest_workflows(provider.runs(full_name, observed_ref)), workflow_policy)'),
            ('signals-call', 'organ-evolution/scripts/observe.py', '    signals = tree_signals(provider.tree(full_name, tree_sha)) if tree_sha else {'),
            ('fallback-tail', 'organ-evolution/scripts/observe.py', '        "treeTruncated": True,\n    }'),
            ('output-full-name', 'organ-evolution/scripts/observe.py', '        "fullName": full_name,\n        "url": repo.get("html_url") or f"https://github.com/{full_name}",'),
            ('source-collected', 'organ-evolution/scripts/observe.py', '            "collectedRef": observed_ref,\n        },'),
            ('compile-call', 'organ-evolution/scripts/observe.py', '                observed = collect_repository(\n                    provider,\n                    repository["fullName"],\n                    repository.get("ref"),\n                    repository.get("workflowPolicy"),\n                    rules,\n                    now,\n                )'),
            ('view-head', 'organ-evolution/observations-view.js', '<div><a href="${esc(repository.url || \'#\')}" target="_blank" rel="noreferrer"><b>${esc(repository.fullName)}</b></a><span>${esc(repository.observedRef || repository.defaultBranch || \'\')}</span></div>'),
            ('view-signals', 'organ-evolution/observations-view.js', '      <span class="tag ${(signals.successionFiles || []).length ? \'green\' : \'gold\'}">succession ${(signals.successionFiles || []).length ? \'present\' : \'open\'}</span>\n    </div>'),
            ('browser-anchor', 'tests/pages/verify_organ_evolution.mjs', '  check("authority membrane remains explicit",\n    (await page.locator("#workspace").innerText()).includes("Authority membrane") &&\n    (await page.locator("#workspace").innerText()).includes("Forbidden"));\n\n  await page.click(\'[data-view="evolution"]\');'),
            ('local-test', 'organ-evolution/scripts/test_observe.py', '        self.assertEqual(\n            [row["id"] for row in local],\n            ["observation.bloodstream.hardening-20260728"],\n        )'),
          ]
          lines=[]
          for name, path, anchor in checks:
              count=Path(path).read_text(encoding='utf-8').count(anchor)
              lines.append(f'{name}: {count}')
          Path('/tmp/supplier-foundry-anchor-counts.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: supplier-foundry-anchor-counts
          path: /tmp/supplier-foundry-anchor-counts.txt
          if-no-files-found: error
          retention-days: 3
