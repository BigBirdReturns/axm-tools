name: Manzanita v1.6.0 exact-head admission gate

on:
  push:
    branches: [agent/manzanita-convergence-observer-v2]
    paths:
      - ".github/workflows/manzanita-final-observer.yml"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: "117"
      EXPECTED_HEAD: 37c90d4d7088a52e4a3fc9e70e71559495bd47fd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 37c90d4d7088a52e4a3fc9e70e71559495bd47fd
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prove the exact release head and retired temporary actuators
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          grep -q 'data-release="1.6.0"' manzanita/index.html
          grep -q 'data-visual-system="photographic-place-fabric"' manzanita/index.html
          test -z "$(find .github/workflows -maxdepth 1 -type f \( \
            -name 'manzanita-convergence-*.yml' -o \
            -name 'manzanita-final-admission.yml' -o \
            -name 'manzanita-visual-donor-export.yml' -o \
            -name 'manzanita-p10-recovery.yml' -o \
            -name 'manzanita-live-browser-probe.yml' \
          \) -print -quit)"

      - name: Install deterministic image and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Run exact source, interaction, and photographic gates
        env:
          MANZANITA_SCREENSHOT_DIR: ${{ runner.temp }}/manzanita-v1.6.0-exact-head-screens
        run: |
          set -euo pipefail
          python programs/manzanita-public-convergence/visual_substance_test.py \
            --root manzanita \
            --output ${{ runner.temp }}/manzanita-photographic-substance.json
          python manzanita/tests/public_contract_test.py
          node --check manzanita/app.js
          node --check manzanita/theme-init.js
          node --check manzanita/assets/scene-data.js
          python manzanita/tests/browser_test.py
          python programs/manzanita-public-convergence/rendered_visual_floor.py \
            --output ${{ runner.temp }}/manzanita-rendered-visual-floor

      - name: Rebuild custody and require byte-identical final-source outputs
        run: |
          set -euo pipefail
          python programs/manzanita-99/custody/build_custody.py --repo-root .
          python programs/manzanita-99/custody/validate_custody.py --repo-root .
          python -m unittest discover -s programs/manzanita-99/custody/tests -p 'test_*.py'
          python programs/manzanita-99/custody/audit_history.py \
            --repo-root . \
            --output ${{ runner.temp }}/manzanita-history-audit.json
          git diff --exit-code -- programs/manzanita-99/custody

      - uses: actions/upload-artifact@v4
        with:
          name: manzanita-v1.6.0-exact-head-admission
          path: |
            ${{ runner.temp }}/manzanita-v1.6.0-exact-head-screens
            ${{ runner.temp }}/manzanita-rendered-visual-floor
            ${{ runner.temp }}/manzanita-photographic-substance.json
            ${{ runner.temp }}/manzanita-history-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Bind PR 117 to the admitted head and move it out of draft
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Object

          Bounded public photographic convergence release for the existing Manzanita route. It replaces the simplified v1.4.1 Signal Sheet with the retained photographic place fabric while preserving v1.4.1 as the exact rollback donor and leaving the complete `manzanita-next` successor on HOLD.

          ## Admitted public surface

          - seven materially distinct apertures: useful plant, household, property, street, neighborhood, region, and stewardship;
          - seven normalized 1600×1000 visual assets with independent photographic-substance and non-duplication checks;
          - image-registered analytical geometry and eight independently selectable conditions;
          - five operating seats that change action, acceptance, handoff, and recommended evidence layers;
          - assistance-first horticultural and wildfire remediation;
          - explicit firewall against automatic insurance denial, unrelated property scoring, resident ranking, and punitive enforcement;
          - URL-addressable state, local JSON export, print, light and dark themes, reduced motion, mobile operation, and 320-pixel 200-percent text reflow;
          - public-safe Essential Attention handoff;
          - zero backend and zero external-effect adapters.

          ## Exact-head qualification

          Exact admitted head: `37c90d4d7088a52e4a3fc9e70e71559495bd47fd`.

          The independent admission gate rebuilds and replays the source contract, JavaScript parsing, photographic substance audit, seven-aperture non-duplication, browser interactions, responsive and 200-percent-text states, rendered visual composition, donor-custody validator, nineteen adversarial custody tests, and reachable-history audit. Rebuilding custody must leave the committed final-source outputs byte-identical.

          ## Authority boundary

          This release performs no `manzanita-next` external campaign, closes no remaining custody gap, releases no private or physical standing, reconstructs no canonical backlog rows, and has no canonical task-count effect. The complete successor remains `HOLD`; this PR changes the already public route only.
          EOF
          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" \
            --title "Manzanita: photographic public place fabric v1.6.0" \
            --body-file /tmp/pr-body.md
          gh pr ready "$PR_NUMBER" --repo "$GH_REPO"
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" \
            --body "Exact-head admission PASS for \`$EXPECTED_HEAD\`. The photographic, browser, responsive, rendered-visual, custody, adversarial-test, and reachable-history gates all passed against the same head."
