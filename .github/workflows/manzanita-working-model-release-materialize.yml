                        break
                      fi
                      sleep 5
                    done
                    test "$pages_source" = "$TRIGGER_SHA"

                    if ! git diff --quiet "$TRIGGER_SHA" -- manzanita-working-model README.md index.html .github/workflows/manzanita-working-model.yml; then
                      echo '::error::release-controlled files changed after the triggering source SHA'
                      git diff --stat "$TRIGGER_SHA" -- manzanita-working-model README.md index.html .github/workflows/manzanita-working-model.yml
                      exit 1
                    fi

                    python - <<'PY'
                    import json
                    import os
