name: Materialize Manzanita working-model public release

on:
  push:
    branches:
      - agent/manzanita-working-model-public-v1
    paths:
      - '.github/workflows/manzanita-working-model-release-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize the coherent release tree
        run: python .github/scripts/materialize_manzanita_working_model_v1.py

      - name: Remove one-shot construction machinery
        run: |
          rm .github/scripts/materialize_manzanita_working_model_v1.py
          rm .github/workflows/manzanita-working-model-release-materialize.yml

      - name: Run the exact static release contract
        run: python manzanita-working-model/tests/public_contract_test.py

      - name: Inspect the release diff
        run: |
          git diff --check
          git status --short

      - name: Commit the self-contained v1.0.0 release candidate
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'manzanita: cut self-contained working model v1.0.0'
          git push origin HEAD:${GITHUB_REF_NAME}
