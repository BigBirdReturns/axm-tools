          python - <<'PY'
          from pathlib import Path

          template = r'''name: Manzanita Works working model v1.0.0

          on:
            push:
              branches:
                - main
                - agent/manzanita-working-model-public-v1
              paths:
                - 'manzanita-working-model/**'
                - '.github/workflows/manzanita-working-model.yml'
                - 'README.md'
                - 'index.html'
            pull_request:
              paths:
                - 'manzanita-working-model/**'
                - '.github/workflows/manzanita-working-model.yml'
                - 'README.md'
                - 'index.html'
            workflow_dispatch: {}

          permissions:
            contents: write

          concurrency:
            group: manzanita-working-model-@@ github.ref }}
            cancel-in-progress: true

          jobs:
            qualify:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4

                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'

                - name: Run exact static release contract
                  run: python manzanita-working-model/tests/public_contract_test.py

                - name: Resolve deterministic browser runtime
                  run: |
                    set -euo pipefail
                    python -m pip install --disable-pip-version-check playwright==1.57.0
                    browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
                    if [ -n "$browser" ]; then
                      echo "MW_CHROMIUM_EXECUTABLE=$browser" >> "$GITHUB_ENV"
                      "$browser" --version
                    else
                      python -m playwright install --with-deps chromium
                    fi

                - name: Run local Chromium release campaign
                  env:
                    MW_WORKING_MODEL_SCREENSHOT_DIR: @@ runner.temp }}/manzanita-working-model-local-review
                  run: python manzanita-working-model/tests/browser_test.py

                - name: Retain local qualification evidence
                  uses: actions/upload-artifact@v4
                  with:
                    name: manzanita-working-model-v1-local-@@ github.sha }}
                    path: @@ runner.temp }}/manzanita-working-model-local-review
                    if-no-files-found: error
                    retention-days: 30

            live-readback:
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              needs: qualify
              runs-on: ubuntu-latest
              timeout-minutes: 30
              env:
                MW_WORKING_MODEL_URL: https://bigbirdreturns.github.io/axm-tools/manzanita-working-model/
                MW_ROOT_URL: https://bigbirdreturns.github.io/axm-tools/
              steps:
                - uses: actions/checkout@v4
