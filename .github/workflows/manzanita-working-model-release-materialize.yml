                            raise SystemExit(0)
                    path.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
                    PY

                    git add .github/receipts/manzanita-working-model-live-v1.0.0.json
                    if git diff --cached --quiet; then
                      echo 'Exact live-release receipt already recorded for this source SHA.'
                      exit 0
                    fi
                    git commit -m 'manzanita: seal working model v1.0.0 live release'
                    git push origin main
          '''
          Path('.github/workflows/manzanita-working-model.yml').write_text(
              template.replace('@@', '$' + '{{'), encoding='utf-8'
          )
          PY

          rm .github/workflows/manzanita-working-model-release-materialize.yml
          python manzanita-working-model/tests/public_contract_test.py
          git diff --check
          git status --short

      - name: Commit the coherent release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-materializer'
          git config user.email 'actions@users.noreply.github.com'
