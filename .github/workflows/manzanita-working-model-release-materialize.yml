                      pages_source="$(python - <<'PY'
                    import json
                    from pathlib import Path
                    path = Path('.github/pages-deployment.json')
                    print(json.loads(path.read_text(encoding='utf-8')).get('source_sha', '') if path.exists() else '')
                    PY
                    )"
