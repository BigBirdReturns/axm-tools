name: MiMo one-GPU handoff qualification
on:
  push:
    paths: ['mimo-one-gpu/**', '.github/workflows/mimo-one-gpu-check.yml']
  pull_request:
    paths: ['mimo-one-gpu/**', '.github/workflows/mimo-one-gpu-check.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python mimo-one-gpu/scripts/check.py
      - run: node --check mimo-one-gpu/app.js
      - name: Controller tests, synthetic only
        run: python -m unittest discover -s mimo-one-gpu/tests -v
      - name: Test-only browser runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser handoff and downloads
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/mimo-evidence/local
        run: python mimo-one-gpu/tests/browser.py
      - name: Verify published bytes and browser behavior
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/mimo-evidence/public
          PUBLIC_BASE: https://bigbirdreturns.github.io/axm-tools/mimo-one-gpu
        run: |
          python mimo-one-gpu/scripts/check_live.py
          python mimo-one-gpu/tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mimo-one-gpu-publication-evidence
          path: ${{ runner.temp }}/mimo-evidence
          if-no-files-found: warn
