name: Manzanita Works Operating Fabric v0.1.0 candidate contract

on:
  pull_request:
    paths:
      - "manzanita-works/**"
      - ".github/workflows/manzanita-works-check.yml"
      - "README.md"
      - "index.html"
  push:
    branches: [main, "agent/**"]
    paths:
      - "manzanita-works/**"
      - ".github/workflows/manzanita-works-check.yml"
      - "README.md"
      - "index.html"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: manzanita-works-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Static public-safe contract
        run: python manzanita-works/tests/public_contract_test.py
      - name: Install deterministic browser harness
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Full browser and accessibility-floor campaign
        run: python manzanita-works/tests/browser_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: manzanita-works-operating-fabric-v0.1.0-observations
          path: qualification-observations
          if-no-files-found: error
          retention-days: 30
