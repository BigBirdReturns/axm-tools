name: Manzanita Street Glide scene and registration kernel

on:
  push:
    branches:
      - agent/manzanita-street-glide-014
    paths:
      - "manzanita-next/street-glide/**"
      - ".github/workflows/manzanita-street-glide.yml"
  pull_request:
    paths:
      - "manzanita-next/street-glide/**"
      - ".github/workflows/manzanita-street-glide.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qualify:
    name: Resolve scenes and register natural borders
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove the exact candidate and dependency boundary
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
          git fetch --no-tags origin main
          python - <<'PY'
          import subprocess

          changed = subprocess.run(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed = {
              ".github/workflows/manzanita-street-glide.yml",
              ".github/workflows/manzanita-street-glide-reconcile-admit.yml",
          }
          invalid = [
              path
              for path in changed
              if path not in allowed
              and not path.startswith("manzanita-next/street-glide/")
          ]
          if invalid:
              raise SystemExit(f"Street Glide candidate contains out-of-scope paths: {invalid}")
          if not any(path.startswith("manzanita-next/street-glide/") for path in changed):
              raise SystemExit("Candidate contains no Street Glide kernel object")
          PY
          git diff --quiet origin/main...HEAD -- manzanita
          test -f manzanita-next/public-demo/PLACE_DEMO_CONTRACT.json
          test -f manzanita-next/public-demo/build_public_demo.py
          test -f manzanita-next/apertures/APERTURE_CONTRACT.json
          test -f manzanita-next/apertures/build_apertures.py
          test -f manzanita-next/design-system/CONSTITUTION.json
          test -f programs/manzanita-99/review-board/BOARD_CHARTER.json
          test -f programs/manzanita-99/review-board/validate_review_board.py

      - name: Install source, projection, and image dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 pillow jsonschema pytest

      - name: Validate source, public-demo, aperture, Street Glide, and review contracts
        run: |
          pytest -q manzanita-next/tests
          python -m py_compile \
            manzanita-next/public-demo/build_public_demo.py \
            manzanita-next/apertures/build_apertures.py \
            manzanita-next/street-glide/resolve_scene.py \
            manzanita-next/street-glide/register_natural_border.py \
            manzanita-next/street-glide/tests/test_street_glide.py \
            programs/manzanita-99/review-board/validate_review_board.py
          python -m json.tool manzanita-next/street-glide/STREET_GLIDE_CONTRACT.json > /dev/null
          python -m json.tool manzanita-next/street-glide/AUTHORED_REGISTRATION_DEMO.json > /dev/null
          python -m json.tool manzanita-next/street-glide/review/M99-RB-PKT-006.json > /dev/null
          python -m json.tool manzanita-next/street-glide/review/M99-RB-DEC-006.json > /dev/null
          python -m unittest discover \
            -s manzanita-next/public-demo/tests \
            -p "test_public_demo.py"
          python -m unittest discover \
            -s manzanita-next/apertures/tests \
            -p "test_apertures.py"
          python -m unittest discover \
            -s manzanita-next/street-glide/tests \
            -p "test_street_glide.py"

      - name: Acquire the exact live source foundation
        id: acquire
        continue-on-error: true
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: |
          rm -rf manzanita-next/out
          cd manzanita-next
          python -m scripts.acquire_foundation \
            --place config/place-demo.json \
            --registry config/source-registry.json \
            --out out

      - name: Validate every source receipt and retained payload
        id: validate_source
        if: always()
        run: |
          python manzanita-next/scripts/validate_foundation.py \
            --root manzanita-next/out \
            --source-schema manzanita-next/contracts/source-envelope.schema.json

      - name: Rebuild the exact public-safe place donor
        if: always()
        run: |
          rm -rf manzanita-next/public-demo/out
          python manzanita-next/public-demo/build_public_demo.py \
            --repo-root . \
            --acquisition-root manzanita-next/out \
            --output manzanita-next/public-demo/out

      - name: Rebuild the seven-aperture architecture donor
        if: always()
        run: |
          rm -rf manzanita-next/apertures/out
          python manzanita-next/apertures/build_apertures.py \
            --repo-root . \
            --public-demo-root manzanita-next/public-demo/out \
            --output manzanita-next/apertures/out

      - name: Resolve the exact scene or map-only state
        if: always()
        run: |
          rm -rf manzanita-next/street-glide/out
          python manzanita-next/street-glide/resolve_scene.py \
            --contract manzanita-next/street-glide/STREET_GLIDE_CONTRACT.json \
            --public-data manzanita-next/public-demo/out/PUBLIC_DATA.json \
            --scenes manzanita-next/street-glide/AUTHORED_REGISTRATION_DEMO.json \
            --target-heading 0 \
            --output manzanita-next/street-glide/out/SCENE_DECISION.json

      - name: Propose a bounded natural-border registration
        if: always()
        run: |
          python manzanita-next/street-glide/register_natural_border.py \
            --contract manzanita-next/street-glide/STREET_GLIDE_CONTRACT.json \
            --demo manzanita-next/street-glide/AUTHORED_REGISTRATION_DEMO.json \
            --image manzanita-next/public-demo/out/site/assets/base-imagery.png \
            --output manzanita-next/street-glide/out/REGISTRATION_RECEIPT.json

      - name: Run the contained multidisciplinary review
        if: always()
        run: |
          python programs/manzanita-99/review-board/validate_review_board.py \
            --repo-root . \
            --packet manzanita-next/street-glide/review/M99-RB-PKT-006.json \
            --decision manzanita-next/street-glide/review/M99-RB-DEC-006.json \
            --receipt manzanita-next/street-glide/out/BOARD_DECISION_RECEIPT.json

      - name: Prove the exact-head scene, registration, and board receipts
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          public_build = json.loads(Path("manzanita-next/public-demo/out/BUILD_RECEIPT.json").read_text())
          aperture_build = json.loads(Path("manzanita-next/apertures/out/BUILD_RECEIPT.json").read_text())
          scene = json.loads(Path("manzanita-next/street-glide/out/SCENE_DECISION.json").read_text())
          registration = json.loads(Path("manzanita-next/street-glide/out/REGISTRATION_RECEIPT.json").read_text())
          board = json.loads(Path("manzanita-next/street-glide/out/BOARD_DECISION_RECEIPT.json").read_text())

          assert public_build["result"] == "PASS"
          assert public_build["release_effect"] == "none"
          assert public_build["constitutional_count_effect"] == "none"
          assert aperture_build["result"] == "PASS"
          assert aperture_build["bundle"]["aperture_count"] == 7
          assert aperture_build["public_effect"] == "none"
          assert aperture_build["constitutional_count_effect"] == "none"

          assert scene["schema"] == "axm-tools/manzanita-street-glide-scene-decision@1"
          assert scene["result"] == "PASS"
          assert scene["selected_mode"] == "map_only"
          assert scene["selected_provider"] == "map_only"
          assert scene["selected_scene"] is None
          assert len(scene["provider_attempts"]) == 5
          assert len(scene["map_only_receipts"]) == 3
          assert scene["public_effect"] == "none"
          assert scene["constitutional_count_effect"] == "none"
          assert len(scene["payload_sha256"]) == 64

          assert registration["schema"] == "axm-tools/manzanita-natural-border-registration@1"
          assert registration["result"] == "PASS"
          assert registration["admission_state"] in {"registration_proposal", "no_snap_proposal"}
          assert registration["point_count"] == 6
          assert len(registration["original_points"]) == 6
          assert len(registration["proposed_points"]) == 6
          assert len(registration["point_receipts"]) == 6
          assert registration["within_displacement_gate"] is True
          assert registration["method"]["normal_search_only"] is True
          assert registration["method"]["feature_identity"] == "prohibited"
          assert not Path(registration["image"]["path"]).is_absolute()
          assert "not a curb" in registration["claim_boundary"].lower()
          assert "physical identity" in registration["unknown"].lower()
          assert registration["public_effect"] == "none"
          assert registration["constitutional_count_effect"] == "none"
          assert len(registration["payload_sha256"]) == 64

          assert board["result"] == "PASS"
          assert board["reviewed_head"] == os.environ["REVIEW_HEAD_SHA"]
          assert board["packet_id"] == "M99-RB-PKT-006"
          assert board["decision_id"] == "M99-RB-DEC-006"
          assert board["outcome"] == "admit_with_holds"
          assert board["release_effect"] == "internal_candidate_only"
          assert board["constitutional_count_effect"] == "none"
          assert board["seat_count"] == 12
          assert board["open_vetoes"] == []
          assert board["open_critical_or_high_defects"] == []
          assert len(board["holds"]) >= 7
          PY

      - name: Retain source, public-demo, aperture, Street Glide, and board evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-street-glide-${{ env.REVIEW_HEAD_SHA }}
          path: |
            manzanita-next/out
            manzanita-next/public-demo/out/PUBLIC_DATA.json
            manzanita-next/public-demo/out/PUBLIC_PROJECTION_RECEIPT.json
            manzanita-next/public-demo/out/BUILD_RECEIPT.json
            manzanita-next/public-demo/out/site/assets/base-imagery.png
            manzanita-next/apertures/out/APERTURE_BUNDLE.json
            manzanita-next/apertures/out/BUILD_RECEIPT.json
            manzanita-next/street-glide/README.md
            manzanita-next/street-glide/STREET_GLIDE_CONTRACT.json
            manzanita-next/street-glide/AUTHORED_REGISTRATION_DEMO.json
            manzanita-next/street-glide/resolve_scene.py
            manzanita-next/street-glide/register_natural_border.py
            manzanita-next/street-glide/tests/test_street_glide.py
            manzanita-next/street-glide/review/M99-RB-PKT-006.json
            manzanita-next/street-glide/review/M99-RB-DEC-006.json
            manzanita-next/street-glide/out
          if-no-files-found: error
          retention-days: 90

      - name: Enforce the acquisition and source-validation outcomes
        if: always()
        env:
          ACQUIRE_OUTCOME: ${{ steps.acquire.outcome }}
          VALIDATE_SOURCE_OUTCOME: ${{ steps.validate_source.outcome }}
        run: |
          test "$ACQUIRE_OUTCOME" = "success"
          test "$VALIDATE_SOURCE_OUTCOME" = "success"
