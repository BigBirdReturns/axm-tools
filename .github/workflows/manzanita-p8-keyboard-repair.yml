name: Repair Manzanita P8 keyboard focus

on:
  push:
    branches:
      - agent/manzanita-resilience-qualification-019
    paths:
      - ".github/workflows/manzanita-p8-keyboard-repair.yml"
      - ".github/scripts/manzanita-p8-keyboard-repair.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-resilience-qualification-019
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source-test dependencies
        run: python -m pip install --disable-pip-version-check playwright pyyaml

      - name: Apply the bounded keyboard repair
        run: python .github/scripts/manzanita-p8-keyboard-repair.py

      - name: Prove the repaired source campaign
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile manzanita-next/qualification/run_qualification.py
          python -m unittest discover -s manzanita-next/qualification/tests -p "test_qualification.py"

      - name: Seal the corrected P8 candidate
        run: |
          rm -f .github/workflows/manzanita-p8-keyboard-repair.yml
          rm -f .github/scripts/manzanita-p8-keyboard-repair.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "manzanita-p8-keyboard-repair"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/manzanita-p8-keyboard-repair.yml
          git add .github/scripts/manzanita-p8-keyboard-repair.py
          git add manzanita-next/qualification/run_qualification.py
          git commit -m "Manzanita: synchronize P8 keyboard focus transfer"
          git push origin HEAD:agent/manzanita-resilience-qualification-019
