name: Install Manzanita Works Signal Sheet v1.4.0

on:
  push:
    branches:
      - agent/manzanita-signal-sheet-v1-4-0
    paths:
      - ".github/manzanita-signal-sheet-payload/**"
      - ".github/workflows/manzanita-signal-sheet-install.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore and harden exact Signal Sheet release
        shell: bash
        run: |
          cat .github/manzanita-signal-sheet-payload/chunk* > /tmp/manzanita.b64
          base64 -d /tmp/manzanita.b64 > /tmp/manzanita.tar.gz
          echo "fd2a7af647bae50cb26a2c6b4a534cfabe7fe6879102bc30468b09d2d535f79c  /tmp/manzanita.tar.gz" | sha256sum -c -
          rm -rf /tmp/manzanita-release
          mkdir -p /tmp/manzanita-release
          tar -xzf /tmp/manzanita.tar.gz -C /tmp/manzanita-release
          rm -rf manzanita
          cp -a /tmp/manzanita-release/manzanita ./manzanita
          cp /tmp/manzanita-release/.github/workflows/manzanita-check.yml .github/workflows/manzanita-check.yml
          cp /tmp/manzanita-release/.github/workflows/manzanita-live-check.yml .github/workflows/manzanita-live-check.yml

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path("manzanita")

          app_path = root / "app.js"
          app = app_path.read_text(encoding="utf-8")
          app_replacements = {
              'class="scene-ink" style="stroke-width:15"': 'class="scene-ink scene-stroke-15"',
              'class="scene-ink" style="stroke-width:13"': 'class="scene-ink scene-stroke-13"',
          }
          for old, new in app_replacements.items():
              if old not in app:
                  raise SystemExit(f"expected app fragment not found: {old}")
              app = app.replace(old, new)
          if 'style="' in app:
              raise SystemExit("inline style remains in app.js")
          app_path.write_text(app, encoding="utf-8")

          css_path = root / "style.css"
          css = css_path.read_text(encoding="utf-8")
          stroke_law = ".scene-stroke-15{stroke-width:15}.scene-stroke-13{stroke-width:13}\n"
          if stroke_law.strip() not in css:
              marker = "\n@media (max-width:1100px){"
              if marker not in css:
                  raise SystemExit("CSS media marker not found")
              css = css.replace(marker, "\n" + stroke_law + marker, 1)
          css_path.write_text(css, encoding="utf-8")

          index_path = root / "index.html"
          html = index_path.read_text(encoding="utf-8")
          favicon = "  <link rel=\"icon\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4f0e8'/%3E%3Cpath d='M6 26 26 6M9 7h5v5H9zm9 9h5v5h-5z' fill='none' stroke='%23ff4b1f' stroke-width='2'/%3E%3C/svg%3E\">\n"
          if 'rel="icon"' not in html:
              marker = '  <meta http-equiv="Content-Security-Policy"'
              if marker not in html:
                  raise SystemExit("CSP marker not found")
              html = html.replace(marker, favicon + marker, 1)
          index_path.write_text(html, encoding="utf-8")

          browser_path = root / "tests" / "browser_test.py"
          browser = browser_path.read_text(encoding="utf-8")
          browser_replacements = {
              'assert "No backend · no external-effect adapters" in body_text':
                  'assert "no backend · no external-effect adapters" in body_text.lower()',
              "    page.add_init_script(f\"localStorage.setItem('manzanita-theme', '{theme}')\")\n    response = page.goto(TARGET_URL, wait_until=\"networkidle\", timeout=60_000)\n    assert response is not None and response.status == 200, response.status if response else None\n":
                  "    response = page.goto(TARGET_URL, wait_until=\"networkidle\", timeout=60_000)\n    assert response is not None and response.status == 200, response.status if response else None\n    page.evaluate(\"theme => localStorage.setItem('manzanita-theme', theme)\", theme)\n    response = page.reload(wait_until=\"networkidle\")\n    assert response is not None and response.status == 200, response.status if response else None\n",
          }
          for old, new in browser_replacements.items():
              if old not in browser:
                  raise SystemExit(f"expected browser-test fragment not found: {old[:80]}")
              browser = browser.replace(old, new)
          browser_path.write_text(browser, encoding="utf-8")

          contract_path = root / "tests" / "public_contract_test.py"
          contract = contract_path.read_text(encoding="utf-8")
          contract_marker = "assert 'themeToggle' in html\n"
          contract_addition = "assert 'rel=\"icon\"' in html\nassert 'style=\"' not in js\nassert '.scene-stroke-15' in css and '.scene-stroke-13' in css\n"
          if contract_addition not in contract:
              if contract_marker not in contract:
                  raise SystemExit("contract insertion marker not found")
              contract = contract.replace(contract_marker, contract_marker + contract_addition, 1)
          contract_path.write_text(contract, encoding="utf-8")

          receipt_path = root / "QUALIFICATION.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          for name, row in receipt["files"].items():
              data = (root / name).read_bytes()
              row["bytes"] = len(data)
              row["sha256"] = hashlib.sha256(data).hexdigest()
          receipt_path.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Verify static contract
        run: |
          python manzanita/tests/public_contract_test.py
          node --check manzanita/app.js
          node --check manzanita/theme-init.js

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Drive complete Signal Sheet experience
        env:
          MANZANITA_SCREENSHOT_DIR: ${{ runner.temp }}/manzanita-signal-screens
        run: python manzanita/tests/browser_test.py

      - name: Commit qualified release
        shell: bash
        run: |
          rm -rf .github/manzanita-signal-sheet-payload
          rm -f .github/workflows/manzanita-signal-sheet-install.yml
          git config user.name "manzanita-signal-sheet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- manzanita .github/workflows/manzanita-check.yml .github/workflows/manzanita-live-check.yml .github/manzanita-signal-sheet-payload .github/workflows/manzanita-signal-sheet-install.yml
          git diff --cached --check
          git commit -m "manzanita: install Signal Sheet visual constitution"
          git push origin HEAD:agent/manzanita-signal-sheet-v1-4-0
