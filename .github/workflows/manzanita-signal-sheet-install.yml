name: Install Manzanita Works Signal Sheet v1.4.0

on:
  push:
    branches:
      - agent/manzanita-signal-sheet-v1-4-0
    paths:
      - ".github/manzanita-signal-sheet-payload/**"
      - ".github/workflows/manzanita-signal-sheet-install.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore exact Signal Sheet release
        shell: bash
        run: |
          cat .github/manzanita-signal-sheet-payload/chunk* > /tmp/manzanita.b64
          base64 -d /tmp/manzanita.b64 > /tmp/manzanita.tar.gz
          echo "fd2a7af647bae50cb26a2c6b4a534cfabe7fe6879102bc30468b09d2d535f79c  /tmp/manzanita.tar.gz" | sha256sum -c -
          rm -rf /tmp/manzanita-release
          mkdir -p /tmp/manzanita-release
          tar -xzf /tmp/manzanita.tar.gz -C /tmp/manzanita-release
          rm -rf manzanita
          cp -a /tmp/manzanita-release/manzanita ./manzanita
          cp /tmp/manzanita-release/.github/workflows/manzanita-check.yml .github/workflows/manzanita-check.yml
          cp /tmp/manzanita-release/.github/workflows/manzanita-live-check.yml .github/workflows/manzanita-live-check.yml
          python - <<'PY'
          from pathlib import Path
          path = Path("manzanita/tests/browser_test.py")
          text = path.read_text(encoding="utf-8")
          old = 'assert "No backend · no external-effect adapters" in body_text'
          new = 'assert "no backend · no external-effect adapters" in body_text.lower()'
          if old not in text:
              raise SystemExit("expected browser assertion not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify static contract
        run: |
          python manzanita/tests/public_contract_test.py
          node --check manzanita/app.js
          node --check manzanita/theme-init.js

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Drive complete Signal Sheet experience
        env:
          MANZANITA_SCREENSHOT_DIR: ${{ runner.temp }}/manzanita-signal-screens
        run: python manzanita/tests/browser_test.py

      - name: Commit qualified release
        shell: bash
        run: |
          rm -rf .github/manzanita-signal-sheet-payload
          rm -f .github/workflows/manzanita-signal-sheet-install.yml
          git config user.name "manzanita-signal-sheet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- manzanita .github/workflows/manzanita-check.yml .github/workflows/manzanita-live-check.yml .github/manzanita-signal-sheet-payload .github/workflows/manzanita-signal-sheet-install.yml
          git diff --cached --check
          git commit -m "manzanita: install Signal Sheet visual constitution"
          git push origin HEAD:agent/manzanita-signal-sheet-v1-4-0
