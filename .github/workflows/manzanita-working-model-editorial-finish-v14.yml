name: Finish Manzanita working model clarity pass v3

on:
  push:
    branches:
      - fix/manzanita-working-model-editorial-finish-v1
    paths:
      - '.github/workflows/manzanita-working-model-editorial-finish-v14.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final clarity changes and normalize rendered readback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import textwrap
          from pathlib import Path

          controller = Path('.github/workflows/manzanita-working-model-editorial-finish-v13.yml')
          source = controller.read_text(encoding='utf-8')
          anchor = source.index('      - name: Apply final clarity changes and exact qualification assertions')
          marker = "          python - <<'PY'\n"
          start = source.index(marker, anchor) + len(marker)
          end = source.index("\n          PY\n", start)
          exec(compile(textwrap.dedent(source[start:end]), '<clarity-v13-materializer>', 'exec'), {})

          replacements = {
              '        assert "Set what can happen and the stop conditions." in page.locator(".decision-list").inner_text()\n':
                  '        assert "set what can happen and the stop conditions." in page.locator(".decision-list").inner_text().lower()\n',
              '        assert "External effect" in page.locator(".handoff-state").inner_text()\n':
                  '        assert "external effect" in page.locator(".handoff-state").inner_text().lower()\n',
          }
          for name in ['browser_test.py', 'live_browser_test.py']:
              path = Path('manzanita-working-model/tests') / name
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'{name}: rendered readback anchor count differs for {old.strip()!r}: {text.count(old)}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot controllers
        shell: bash
        run: |
          set -euo pipefail
          rm '.github/workflows/manzanita-working-model-editorial-finish-v12.yml'
          rm '.github/workflows/manzanita-working-model-editorial-finish-v13.yml'
          rm '.github/workflows/manzanita-working-model-editorial-finish-v14.yml'

      - name: Qualify the complete public surface
        shell: bash
        run: |
          set -euo pipefail
          python -W error::SyntaxWarning -m py_compile \
            manzanita-working-model/tests/public_contract_test.py \
            manzanita-working-model/tests/browser_test.py \
            manzanita-working-model/tests/live_browser_test.py \
            manzanita-working-model/tests/live_readback.py
          node --check manzanita-working-model/app.js
          python manzanita-working-model/tests/public_contract_test.py
          python -m pip install --disable-pip-version-check playwright==1.57.0
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            export MW_CHROMIUM_EXECUTABLE="$browser"
          else
            python -m playwright install --with-deps chromium
          fi
          export MW_WORKING_MODEL_SCREENSHOT_DIR="$RUNNER_TEMP/manzanita-working-model-final-clarity"
          python -W error::SyntaxWarning manzanita-working-model/tests/browser_test.py

      - name: Retain exact visual and packet review evidence
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-working-model-final-clarity-${{ github.sha }}
          path: ${{ runner.temp }}/manzanita-working-model-final-clarity
          if-no-files-found: error
          retention-days: 30

      - name: Commit the qualified clarity pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-editorial-bot'
          git config user.email 'actions@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          required = {
              'manzanita-working-model/app.js',
              'manzanita-working-model/index.html',
              'manzanita-working-model/tests/browser_test.py',
              'manzanita-working-model/tests/live_browser_test.py',
              'manzanita-working-model/tests/public_contract_test.py',
          }
          allowed = required | {
              '.github/workflows/manzanita-working-model-editorial-finish-v12.yml',
              '.github/workflows/manzanita-working-model-editorial-finish-v13.yml',
              '.github/workflows/manzanita-working-model-editorial-finish-v14.yml',
          }
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          observed = {row[3:] for row in rows}
          missing = required - observed
          unexpected = observed - allowed
          if missing or unexpected:
              raise SystemExit(f'changed-path gate failed\nmissing={sorted(missing)}\nunexpected={sorted(unexpected)}\nobserved={sorted(observed)}')
          PY
          git add -A
          git commit -m 'manzanita: finish final public-language details'
          git push origin HEAD
