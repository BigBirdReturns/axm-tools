name: Manzanita Useful Plant v30 source replay review

on:
  pull_request:
    paths:
      - 'manzanita-next/review/mw-habitat-live-photo-030-continuation/**'
      - '.github/workflows/manzanita-useful-plant-v30-continuation-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-bounded-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify changed-path scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="$(git rev-parse HEAD^)"
            HEAD="$(git rev-parse HEAD)"
          fi
          python manzanita-next/review/mw-habitat-live-photo-030-continuation/verify_scope.py --base "$BASE" --head "$HEAD"
      - name: Expand verified text source payload
        run: python manzanita-next/review/mw-habitat-live-photo-030-continuation/unpack_source.py --destination "$RUNNER_TEMP/mw-source-replay" --receipt "$RUNNER_TEMP/mw-unpack-receipt.json"
      - name: Install bounded browser runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/mw-source-replay/manzanita-next/review/mw-habitat-live-photo-030-continuation/requirements.txt"
          python -m playwright install --with-deps chromium
      - name: Verify expanded source carrier
        run: python "$RUNNER_TEMP/mw-source-replay/manzanita-next/review/mw-habitat-live-photo-030-continuation/harness/verify_source_carrier.py"
      - name: Materialize runtime continuation
        run: python "$RUNNER_TEMP/mw-source-replay/manzanita-next/review/mw-habitat-live-photo-030-continuation/harness/materialize_runtime.py"
      - name: Exercise operator review console
        run: python "$RUNNER_TEMP/mw-source-replay/manzanita-next/review/mw-habitat-live-photo-030-continuation/harness/browser_review.py"
      - name: Retain bounded review artifact
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-useful-plant-v30-source-replay-review
          path: |
            ${{ runner.temp }}/mw-source-replay/manzanita-next/review/mw-habitat-live-photo-030-continuation/
            ${{ runner.temp }}/mw-unpack-receipt.json
            manzanita-next/review/mw-habitat-live-photo-030-continuation/CARRIER_CONTRACT.json
            manzanita-next/review/mw-habitat-live-photo-030-continuation/PAYLOAD_RECEIPT.json
            manzanita-next/review/mw-habitat-live-photo-030-continuation/BOOTSTRAP_SCOPE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
