name: Reconcile and admit Manzanita seven-aperture architecture

on:
  push:
    branches:
      - agent/manzanita-seven-apertures-013
    paths:
      - ".github/workflows/manzanita-seven-apertures-reconcile-admit.yml"

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: manzanita-seven-apertures-admission
  cancel-in-progress: false

jobs:
  reconcile-seal-qualify-admit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH_NAME: agent/manzanita-seven-apertures-013
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-seven-apertures-013
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile the candidate with admitted dependencies
        run: |
          git config user.name "manzanita-seven-apertures-admission"
          git config user.email "actions@users.noreply.github.com"
          git pull --ff-only origin "$BRANCH_NAME"
          git fetch --no-tags origin main
          git merge --no-edit origin/main
          test -f manzanita-next/public-demo/PLACE_DEMO_CONTRACT.json
          test -f manzanita-next/public-demo/build_public_demo.py
          test -f manzanita-next/design-system/CONSTITUTION.json
          test -f programs/manzanita-99/review-board/BOARD_CHARTER.json
          test -f programs/manzanita-99/review-board/validate_review_board.py
          test ! -e .github/workflows/manzanita-public-demo-reconcile-admit.yml

      - name: Normalize the architecture review boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          authored_path = Path("manzanita-next/apertures/AUTHORED_DEMO.json")
          authored = json.loads(authored_path.read_text(encoding="utf-8"))
          boundary = authored["claim_boundary"]
          sentence = " This cartridge is not a private record."
          if sentence.strip() not in boundary:
              authored["claim_boundary"] = boundary + sentence
          authored_path.write_text(json.dumps(authored, indent=2) + "\n", encoding="utf-8")

          packet_path = Path("manzanita-next/apertures/review/M99-RB-PKT-005.json")
          packet = json.loads(packet_path.read_text(encoding="utf-8"))
          packet["requested_authority"] = "prototype_admission"
          packet_path.write_text(json.dumps(packet, indent=2) + "\n", encoding="utf-8")

          decision_path = Path("manzanita-next/apertures/review/M99-RB-DEC-005.json")
          decision = json.loads(decision_path.read_text(encoding="utf-8"))
          decision["release_effect"] = "internal_candidate_only"
          decision_path.write_text(json.dumps(decision, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Prove the reconciled candidate diff is bounded
        run: |
          python - <<'PY'
          import subprocess

          changed = subprocess.run(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed = {
              ".github/workflows/manzanita-seven-apertures.yml",
              ".github/workflows/manzanita-seven-apertures-reconcile-admit.yml",
          }
          invalid = [
              path
              for path in changed
              if path not in allowed
              and not path.startswith("manzanita-next/apertures/")
          ]
          if invalid:
              raise SystemExit(f"Seven-aperture candidate contains out-of-scope paths: {invalid}")
          if not any(path.startswith("manzanita-next/apertures/") for path in changed):
              raise SystemExit("Candidate contains no aperture object")
          PY
          git diff --quiet origin/main...HEAD -- manzanita

      - name: Install source and projection dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 pillow jsonschema pytest

      - name: Prove deterministic code and synthetic aperture behavior
        run: |
          pytest -q manzanita-next/tests
          python -m py_compile \
            manzanita-next/public-demo/build_public_demo.py \
            manzanita-next/apertures/build_apertures.py \
            manzanita-next/apertures/tests/test_apertures.py \
            programs/manzanita-99/review-board/validate_review_board.py
          python -m unittest discover \
            -s manzanita-next/public-demo/tests \
            -p "test_public_demo.py"
          python -m unittest discover \
            -s manzanita-next/apertures/tests \
            -p "test_apertures.py"

      - name: Remove the temporary actuator and seal the architecture candidate
        run: |
          rm .github/workflows/manzanita-seven-apertures-reconcile-admit.yml
          rm -rf manzanita-next/out manzanita-next/public-demo/out manzanita-next/apertures/out
          git add -A
          git commit -m "Manzanita: seal the seven-aperture architecture candidate"
          echo "SEALED_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Qualify the exact sealed head against a fresh source run
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          REVIEW_HEAD_SHA: ${{ env.SEALED_HEAD_SHA }}
        run: |
          test "$(git rev-parse HEAD)" = "$SEALED_HEAD_SHA"
          test ! -e .github/workflows/manzanita-seven-apertures-reconcile-admit.yml
          git diff --quiet origin/main...HEAD -- manzanita
          rm -rf manzanita-next/out manzanita-next/public-demo/out manzanita-next/apertures/out
          cd manzanita-next
          python -m scripts.acquire_foundation \
            --place config/place-demo.json \
            --registry config/source-registry.json \
            --out out
          cd ..
          python manzanita-next/scripts/validate_foundation.py \
            --root manzanita-next/out \
            --source-schema manzanita-next/contracts/source-envelope.schema.json
          python manzanita-next/public-demo/build_public_demo.py \
            --repo-root . \
            --acquisition-root manzanita-next/out \
            --output manzanita-next/public-demo/out
          python manzanita-next/apertures/build_apertures.py \
            --repo-root . \
            --public-demo-root manzanita-next/public-demo/out \
            --output manzanita-next/apertures/out
          python programs/manzanita-99/review-board/validate_review_board.py \
            --repo-root . \
            --packet manzanita-next/apertures/review/M99-RB-PKT-005.json \
            --decision manzanita-next/apertures/review/M99-RB-DEC-005.json \
            --receipt manzanita-next/apertures/out/BOARD_DECISION_RECEIPT.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          bundle = json.loads(Path("manzanita-next/apertures/out/APERTURE_BUNDLE.json").read_text())
          build = json.loads(Path("manzanita-next/apertures/out/BUILD_RECEIPT.json").read_text())
          board = json.loads(Path("manzanita-next/apertures/out/BOARD_DECISION_RECEIPT.json").read_text())

          assert bundle["aperture_count"] == 7
          assert bundle["aperture_order"] == [
              "plant", "household", "property", "street",
              "neighborhood", "region", "stewardship"
          ]
          assert len({row["place_id"] for row in bundle["apertures"]}) == 1
          assert len({row["source_run_id"] for row in bundle["apertures"]}) == 1
          for field in (
              "object_class", "reading", "safe_action", "authority",
              "acceptance", "handoff", "prohibited_consequence"
          ):
              assert len({row[field] for row in bundle["apertures"]}) == 7, field
          assert len({row["geometry"]["id"] for row in bundle["apertures"]}) == 7
          assert len({row["geometry"]["path"] for row in bundle["apertures"]}) == 7
          assert all(row["evidence_count"] >= 2 for row in bundle["apertures"])
          assert bundle["public_effect"] == "none"
          assert bundle["constitutional_count_effect"] == "none"

          assert build["result"] == "PASS"
          assert build["bundle"]["payload_sha256"] == bundle["payload_sha256"]
          assert build["public_effect"] == "none"
          assert build["constitutional_count_effect"] == "none"

          assert board["result"] == "PASS"
          assert board["reviewed_head"] == os.environ["REVIEW_HEAD_SHA"]
          assert board["packet_id"] == "M99-RB-PKT-005"
          assert board["decision_id"] == "M99-RB-DEC-005"
          assert board["outcome"] == "admit_with_holds"
          assert board["release_effect"] == "internal_candidate_only"
          assert board["constitutional_count_effect"] == "none"
          assert board["seat_count"] == 12
          assert board["open_vetoes"] == []
          assert board["open_critical_or_high_defects"] == []
          assert len(board["holds"]) >= 7
          PY

      - name: Publish the sealed branch
        run: |
          rm -rf manzanita-next/out manzanita-next/public-demo/out manzanita-next/apertures/out
          test -z "$(git status --porcelain)"
          git push origin HEAD:"$BRANCH_NAME"

      - name: Wait for repository exact-head qualification
        run: |
          check_name="Build and review seven source-bounded apertures"
          success="false"
          for attempt in $(seq 1 80); do
            response="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$SEALED_HEAD_SHA/check-runs?per_page=100")"
            status="$(echo "$response" | jq -r --arg name "$check_name" '[.check_runs[] | select(.name == $name)] | last | .status // empty')"
            conclusion="$(echo "$response" | jq -r --arg name "$check_name" '[.check_runs[] | select(.name == $name)] | last | .conclusion // empty')"
            echo "attempt=$attempt status=$status conclusion=$conclusion"
            if test "$status" = "completed" && test "$conclusion" = "success"; then
              success="true"
              break
            fi
            if test "$status" = "completed" && test -n "$conclusion" && test "$conclusion" != "success"; then
              exit 1
            fi
            sleep 15
          done
          test "$success" = "true"

      - name: Mark ready and merge only the qualified sealed head
        run: |
          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')"
          test -n "$PR_NUMBER"
          PR_URL="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
          if test "$(gh pr view "$PR_URL" --json isDraft --jq .isDraft)" = "true"; then
            gh pr ready "$PR_URL"
          fi
          response="$(gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=merge \
            -f sha="$SEALED_HEAD_SHA" \
            -f commit_title="Merge Manzanita seven-aperture architecture" \
            -f commit_message="Admit the exact seven-aperture canonical-place architecture for internal production with interaction, visual, motion, accessibility, field, resilience, release, and constitutional-count holds preserved.")"
          echo "$response" | jq -e '.merged == true'
