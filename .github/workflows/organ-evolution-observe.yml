name: Organ evolution observe + deploy

on:
  schedule:
    - cron: '20 13 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'organ-evolution/data/sources.json'
      - 'organ-evolution/data/observed.json'
      - 'organ-evolution/scripts/observe.py'
      - 'organ-evolution/scripts/test_observe.py'
      - '.github/workflows/organ-evolution-observe.yml'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  observe-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qualify the observer before using its output
        run: |
          python organ-evolution/scripts/test_observe.py -v
          python organ-evolution/scripts/validate.py

      - name: Observe the configured estate organs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python organ-evolution/scripts/observe.py \
            --sources organ-evolution/data/sources.json \
            --observed organ-evolution/data/observed.json \
            --output organ-evolution/data/observations.json \
            --js-output organ-evolution/data/observations.js

      - name: Validate generated observation custody
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('organ-evolution/data')
          observed = json.loads((root / 'observations.json').read_text(encoding='utf-8'))
          if observed.get('format') != 'axm-organ-observations/1':
              raise SystemExit('wrong observation format')
          if not str(observed.get('sourceDigest', '')).startswith('organobs1_'):
              raise SystemExit('missing observation source digest')
          if not observed.get('generatedAt'):
              raise SystemExit('missing collection time')
          text = json.dumps(observed)
          for forbidden in ('"decision"', '"candidates"', '"gates"', '"dimensions"', '"health"', '"mandates"', '"interests"'):
              if forbidden in text:
                  raise SystemExit(f'observation product crossed authority boundary: {forbidden}')
          print(f"PASS: {len(observed.get('organs', []))} organ observation rows, {observed['sourceDigest']}")
          PY

      - name: Commit the exact machine-owned observation pack
        run: |
          git config user.name 'organ-observer-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add organ-evolution/data/observations.json organ-evolution/data/observations.js
          if git diff --cached --quiet; then
            echo 'Observation pack is unchanged.'
          else
            git commit -m 'organ-evolution: refresh estate observations'
            git push
          fi

      - name: Build the established offline readiness launcher
        run: python acceptance-assets/build_offline.py

      - uses: actions/configure-pages@v5

      - name: Upload the complete static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-organ-observation-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy the observed estate surface
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-organ-observation-${{ github.run_id }}-${{ github.run_attempt }}
