name: Manzanita corrected public and P10 donor comparison

on:
  push:
    branches: [agent/manzanita-public-convergence-v1-6]
    paths:
      - ".github/workflows/manzanita-convergence-donor-compare-v2.yml"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: agent/manzanita-public-convergence-v1-6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-public-convergence-v1-6
          fetch-depth: 0
      - name: Wait for exact public v1.6.0 candidate
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            if grep -q 'data-release="1.6.0"' manzanita/index.html 2>/dev/null; then break; fi
            if [ "$attempt" = "60" ]; then echo "Public candidate unavailable"; exit 1; fi
            sleep 10
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover exact P10 candidate and install render dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.57.0
          python -m playwright install --with-deps chromium
          python programs/manzanita-public-convergence/recover_p10.py --output /tmp/p10
          rm -f p10-donor-site
          ln -s /tmp/p10/site p10-donor-site
      - name: Render public candidate and exact internal donor
        run: |
          python - <<'PY'
          import contextlib
          import subprocess
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out=Path('/tmp/donor-compare'); out.mkdir(parents=True,exist_ok=True)
          server=subprocess.Popen(['python','-m','http.server','8765','--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
              time.sleep(1)
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  targets=[
                      ('public-desktop','http://127.0.0.1:8765/manzanita/',1440,1000),
                      ('p10-desktop','http://127.0.0.1:8765/p10-donor-site/',1440,1000),
                      ('public-mobile','http://127.0.0.1:8765/manzanita/',390,844),
                      ('p10-mobile','http://127.0.0.1:8765/p10-donor-site/',390,844),
                  ]
                  for label,url,width,height in targets:
                      page=browser.new_page(viewport={'width':width,'height':height})
                      response=page.goto(url,wait_until='networkidle',timeout=60000)
                      assert response and response.status==200,(label,response.status if response else None)
                      page.screenshot(path=str(out/f'{label}.png'),full_page=True)
                      page.close()
                  browser.close()
          finally:
              server.terminate()
              with contextlib.suppress(Exception):server.wait(timeout=5)
          PY
          rm p10-donor-site
      - name: Build comparison contact sheet and receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from datetime import datetime,timezone
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageOps

          source=Path('/tmp/donor-compare')
          target=Path('review/manzanita-v1.6.0'); target.mkdir(parents=True,exist_ok=True)
          panels=[]
          rows=[('Public v1.6.0 desktop',source/'public-desktop.png'),('Exact P10 donor desktop',source/'p10-desktop.png'),('Public v1.6.0 mobile',source/'public-mobile.png'),('Exact P10 donor mobile',source/'p10-mobile.png')]
          for title,path in rows:
              image=Image.open(path).convert('RGB')
              thumb=ImageOps.contain(image,(760,620),method=Image.Resampling.LANCZOS)
              panel=Image.new('RGB',(800,680),'#11120f'); panel.paste(thumb,((800-thumb.width)//2,42))
              ImageDraw.Draw(panel).text((22,16),title,fill='#f3efe5')
              panels.append(panel)
              shutil.copy2(path,target/path.name)
          sheet=Image.new('RGB',(1600,1360),'#0d0e0b')
          for i,panel in enumerate(panels):sheet.paste(panel,((i%2)*800,(i//2)*680))
          sheet.save(target/'donor-comparison.jpg','JPEG',quality=90,optimize=True)
          recovery=json.loads(Path('/tmp/p10/P10_RECOVERY.json').read_text(encoding='utf-8'))
          receipt={
              'schema':'manzanita-works/public-p10-visual-comparison@1',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'public_release':'1.6.0',
              'p10_candidate_sha256':recovery['candidate_sha256'],
              'p10_classification':'internal_donor_only',
              'comparison_classification':'visual_review_evidence_only',
              'public_release_authorized_by_comparison':False,
              'files':{},
          }
          for path in sorted(target.glob('*comparison*')):
              payload=path.read_bytes();receipt['files'][path.name]={'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest()}
          (target/'DONOR_COMPARISON_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          review=target/'REVIEW.md'
          text=review.read_text(encoding='utf-8') if review.exists() else '# Manzanita Works v1.6.0 visual review\n'
          addition='''\n## Exact P10 donor comparison\n\nThe public candidate is shown beside the exact archived P10 whole-experience donor. The comparison is visual evidence only. The P10 donor remains an internal candidate and carries no public-release authority.\n\n![Public and P10 donor comparison](donor-comparison.jpg)\n'''
          if '## Exact P10 donor comparison' not in text:text+=addition
          review.write_text(text,encoding='utf-8')
          PY
      - name: Commit review evidence, reconcile with branch, and retire comparison workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/manzanita-convergence-donor-compare.yml
          rm -f .github/workflows/manzanita-convergence-donor-compare-v2.yml
          git config user.name "manzanita-comparison-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A review/manzanita-v1.6.0 .github/workflows/manzanita-convergence-donor-compare.yml .github/workflows/manzanita-convergence-donor-compare-v2.yml
          git commit -m "Manzanita: compare public convergence with exact P10 donor"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
