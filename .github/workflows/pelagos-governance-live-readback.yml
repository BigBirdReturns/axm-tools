name: Pelagos Governance Layer live readback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pelagos-governance-live-readback.yml'
  workflow_run:
    workflows: ['PTA tracker fetch + deploy']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pelagos-governance-live-readback
  cancel-in-progress: true

jobs:
  readback:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable browser harness
        run: |
          mkdir -p /tmp/pelagos-live-readback
          cd /tmp/pelagos-live-readback
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Boot the exact public Pages route
        env:
          LIVE_URL: https://bigbirdreturns.github.io/axm-tools/pelagos-governance/
        working-directory: /tmp/pelagos-live-readback
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const base = process.env.LIVE_URL;
          const allowedHost = new URL(base).host;
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:900}});
          const pageErrors = [];
          const consoleErrors = [];
          const failedRequests = [];
          const outsideRequests = [];
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
          page.on('requestfailed', r => failedRequests.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText || 'failed'}`));
          page.on('request', r => {
            const u = r.url();
            if (u.startsWith('data:') || u.startsWith('blob:')) return;
            try { if (new URL(u).host !== allowedHost) outsideRequests.push(u); }
            catch { outsideRequests.push(u); }
          });

          let last = null;
          for (let attempt = 0; attempt < 12; attempt++) {
            pageErrors.length = 0;
            consoleErrors.length = 0;
            failedRequests.length = 0;
            outsideRequests.length = 0;
            const url = `${base}?readback=ddv-pel-003-${Date.now()}-${attempt}`;
            try {
              const response = await page.goto(url, {waitUntil:'networkidle', timeout:30000});
              await page.waitForFunction(() => document.body.dataset.ready === 'pass' || document.body.dataset.ready === 'fail', null, {timeout:15000}).catch(()=>{});
              last = await page.evaluate(() => ({
                ready: document.body.dataset.ready,
                title: document.title,
                body: document.body.innerText,
                roles: document.querySelectorAll('#roleSelect option').length,
                apertures: document.querySelectorAll('#apertureSelect option').length,
                artifact: window.__PELAGOS_TEST__?.PUBLIC?.meta?.artifact_id || null,
                version: window.__PELAGOS_TEST__?.PUBLIC?.meta?.version || null,
                external_effect_adapters: window.__PELAGOS_TEST__?.PUBLIC?.meta?.external_effect_adapters,
                public_parts: Object.keys(window.__PELAGOS_PUBLIC_PARTS__ || {}).sort(),
              }));
              const pass = response && response.ok() &&
                last.ready === 'pass' &&
                last.artifact === 'DDV-PEL-003' &&
                last.version === '0.3.0' &&
                last.external_effect_adapters === 0 &&
                last.roles === 7 &&
                last.apertures === 4 &&
                last.public_parts.length === 19 &&
                !last.body.includes('Startup failed visibly') &&
                pageErrors.length === 0 &&
                consoleErrors.length === 0 &&
                failedRequests.length === 0 &&
                outsideRequests.length === 0;
              if (pass) {
                console.log(JSON.stringify({
                  result:'PASS', url:base, attempt:attempt+1,
                  artifact:last.artifact, version:last.version,
                  ready:last.ready, roles:last.roles, apertures:last.apertures,
                  public_parts:last.public_parts.length,
                  page_errors:0, console_errors:0, failed_requests:0,
                  outside_requests:0
                }, null, 2));
                await browser.close();
                process.exit(0);
              }
              console.log(`attempt ${attempt+1} not ready`, JSON.stringify({status:response?.status(), last, pageErrors, consoleErrors, failedRequests, outsideRequests}));
            } catch (e) {
              console.log(`attempt ${attempt+1} exception: ${e}`);
            }
            await page.waitForTimeout(15000);
          }
          console.error(JSON.stringify({result:'FAIL', url:base, last, pageErrors, consoleErrors, failedRequests, outsideRequests}, null, 2));
          await browser.close();
          process.exit(1);
          NODE
