name: Scrub the final Manzanita public language

on:
  push:
    branches:
      - review/manzanita-working-model-v1-1
    paths:
      - '.github/workflows/manzanita-working-model-final-language-scrub.yml'

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove residual internal language and clipped prompts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('manzanita-working-model')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          # Public HTML: state the function directly and keep narrow inputs legible.
          index_path = ROOT / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          index_replacements = [
              ('Resident request plus public context.', 'Resident request plus public records and maps.', 'hero evidence'),
              ('A sponsor must still accept responsibility.', 'An accountable owner must still accept responsibility.', 'hero owner'),
              ('Accountable sponsor · day-to-day owner · place and resources · permitted action · stop rule', 'Accountable owner · day-to-day owner · place and resources · permitted action · stop rule', 'hero required facts'),
              ('The problem changes. The evidence, decision-maker, safe next step, fallback, outcome, and handoff still must be explicit.', 'The problem changes. The evidence, decision-maker, safe next step, backup path, outcome, and handoff still must be explicit.', 'case method'),
              ('Public context can focus attention. Resident facts and qualified field evidence determine what can be said or done.', 'Public records and maps can focus attention. What the resident reports and verified on-site evidence determine what can be said or done.', 'initial wildfire summary'),
              ('A source-linked verification and assistance path.', 'A verification and assistance path tied to its evidence.', 'initial wildfire output'),
              ('or a fallback when live sources fail.', 'or a backup path when live sources fail.', 'working parts summary'),
              ('<footer><span>No score</span><span>No adverse use</span></footer>', '<footer><span>No score</span><span>Not used to penalize</span></footer>', 'place footer'),
              ('<div class="ledger-row"><span>Source</span><strong>Resident request</strong><em>Saved</em></div>', '<div class="ledger-row"><span>Evidence</span><strong>Resident request</strong><em>Saved</em></div>', 'case record evidence'),
              ('<div class="ledger-row"><span>Decision</span><strong>Sponsor review</strong><em>Open</em></div>', '<div class="ledger-row"><span>Decision</span><strong>Owner review</strong><em>Open</em></div>', 'case record owner'),
              ('<div><span>Place</span><strong>Source context</strong></div>', '<div><span>Place</span><strong>Place evidence</strong></div>', 'resource map place'),
              ('<footer><span>Shared work</span><span>Authority stays separate</span></footer>', '<footer><span>Shared work</span><span>Control stays separate</span></footer>', 'resource map footer'),
              ('<header><span>Source fallback</span><b>Provider down</b></header>', '<header><span>Backup source</span><b>Provider down</b></header>', 'backup instrument header'),
              ('<li class="pass"><span>Map context</span><em>Available</em></li>', '<li class="pass"><span>Map only</span><em>Available</em></li>', 'backup map state'),
              ('<div class="system-copy"><p>When a live source fails</p><h3>Fallback + role-specific views</h3>', '<div class="system-copy"><p>When a live source fails</p><h3>Backup path + job-specific views</h3>', 'backup card heading'),
              ('Shown here; use requires separate authorization', 'Shown here; use requires separate permission', 'backup card permission'),
              ('Evidence gathered to help cannot punish.', 'Evidence gathered to help cannot be used against people.', 'guardrail heading'),
              ('No risk score, eligibility grade, enforcement profile, resident profile, or adverse standing.', 'No risk score, eligibility grade, enforcement profile, resident profile, or penalty record.', 'guardrail consequence'),
              ('Completing the packet makes it ready for organizational review, not action.', 'Completing the packet makes it ready for review, not action.', 'pilot review status'),
              ('placeholder="Named person or organizational role"', 'placeholder="Name or role"', 'accountable owner placeholder'),
              ('placeholder="Named and funded operating role"', 'placeholder="Funded owner"', 'day-to-day owner placeholder'),
              ('>Release record</a>', '>Version record</a>', 'footer version label'),
          ]
          for old, new, label in index_replacements:
              index = replace_once(index, old, new, label)
          index_path.write_text(index, encoding='utf-8')

          # Dynamic cases: preserve the exact mechanisms while translating the display language.
          app_path = ROOT / 'app.js'
          app = app_path.read_text(encoding='utf-8')
          app_replacements = [
              ("summary: 'Public context can focus attention. Resident facts and qualified field evidence determine what can be said or done.'", "summary: 'Public records and maps can focus attention. What the resident reports and verified on-site evidence determine what can be said or done.'", 'wildfire summary'),
              ("['source', 'Use public context plus resident facts; show gaps, staleness, and contradictions.']", "['source', 'Use public records and maps plus what the resident reports; show gaps, staleness, and contradictions.']", 'wildfire evidence'),
              ("['authority', 'The resident controls lived facts and consent. The sponsor controls the program offer.']", "['authority', 'The resident controls what they report and whether they participate. The accountable owner controls the help offered.']", 'wildfire owner'),
              ("prohibited: 'Unverified promises of availability, route safety, funding, repair completion, or participant fitness.'", "prohibited: 'Unverified promises of availability, route safety, funding, completed repairs, or whether the option fits the participant.'", 'mobility prohibited'),
              ("['source', 'Use current resource records, public route context, first-party constraints, and provider terms.']", "['source', 'Use current resource records, public route information, the participant’s own constraints, and provider terms.']", 'mobility evidence'),
              ("summary: 'Interest, decisions, unknowns, decision rights, and next steps remain separate so enthusiasm never becomes hidden labor.'", "summary: 'Interest, decisions, unknowns, permission, and next steps remain separate so enthusiasm never becomes hidden labor.'", 'continuity summary'),
              ("output: 'A portable record another person can reopen without inheriting unstated authority.'", "output: 'A portable record another person can reopen without inheriting permission nobody granted.'", 'continuity output'),
              ("prohibited: 'Turning interest into assignment, silence into rejection, or remembered context into institutional authority.'", "prohibited: 'Turning interest into assignment, silence into rejection, or remembered information into permission to act for the organization.'", 'continuity prohibited'),
              ("['fallback', 'A missing owner, source, budget, scope, or permission keeps the item unresolved.']", "['fallback', 'A missing owner, source, budget, boundary, or permission keeps the item unresolved.']", 'continuity backup'),
              ("byId('packet-next').textContent = count === 5 ? 'Separate authority is still required.' : 'Name only the missing facts.';", "byId('packet-next').textContent = count === 5 ? 'Permission to act is still required.' : 'Name only the missing facts.';", 'complete form status'),
              ("? 'Present this packet for explicit organizational review. Every real-world action requires separate authority and acceptance.'", "? 'Present this packet for explicit organizational review. Every real-world action still requires explicit permission and acceptance.'", 'export next action'),
          ]
          for old, new, label in app_replacements:
              app = replace_once(app, old, new, label)
          app_path.write_text(app, encoding='utf-8')

          # Static contract: reject both old page archaeology and subtler receiver-facing nomenclature.
          static_path = ROOT / 'tests' / 'public_contract_test.py'
          static = static_path.read_text(encoding='utf-8')
          static = replace_once(
              static,
              '        "front door routes",\n',
              '        "front door routes",\n'
              '        "accountable sponsor",\n'
              '        "sponsor review",\n'
              '        "no adverse use",\n'
              '        "authority stays separate",\n'
              '        "separate authorization",\n'
              '        "adverse standing",\n'
              '        "qualified field evidence",\n'
              '        "role-specific views",\n'
              '        "source fallback",\n',
              'static HTML terminology gate',
          )
          static = replace_once(
              static,
              '    require(\'<link rel="icon" href="data:,">\' in html, "inline empty favicon absent")\n',
              '    for jargon in [\n'
              '        "qualified field evidence",\n'
              '        "lived facts",\n'
              '        "the sponsor controls",\n'
              '        "first-party constraints",\n'
              '        "participant fitness",\n'
              '        "decision rights",\n'
              '        "unstated authority",\n'
              '        "institutional authority",\n'
              '        "budget, scope",\n'
              '        "separate authority is still required",\n'
              '    ]:\n'
              '        require(jargon not in app.lower(), f"untranslated dynamic language remains: {jargon}")\n\n'
              '    require(\'<link rel="icon" href="data:,">\' in html, "inline empty favicon absent")\n'
              '    require(\'placeholder="Name or role"\' in html, "compact accountable-owner placeholder absent")\n'
              '    require(\'placeholder="Funded owner"\' in html, "compact day-to-day-owner placeholder absent")\n',
              'static dynamic terminology gate',
          )
          static = replace_once(
              static,
              "        '<div><span>Place</span><strong>Source context</strong></div>',",
              "        '<div><span>Place</span><strong>Place evidence</strong></div>',",
              'static capacity row',
          )
          static = replace_once(
              static,
              '        "public_stage_labels": 7,\n',
              '        "public_stage_labels": 7,\n'
              '        "visible_internal_nomenclature": 0,\n'
              '        "compact_input_placeholders": True,\n',
              'static result ledger',
          )
          static_path.write_text(static, encoding='utf-8')

          # Browser campaigns: inspect the rendered strings for every case and the clipped-input failure mode.
          visible_terms = [
              'qualified field evidence',
              'lived facts',
              'the sponsor controls',
              'first-party constraints',
              'participant fitness',
              'decision rights',
              'unstated authority',
              'institutional authority',
              'adverse standing',
              'separate authorization',
              'role-specific views',
              'source fallback',
          ]

          for relative, schema_old, schema_new in [
              ('tests/browser_test.py', 'manzanita-works/working-model-browser-qualification@5', 'manzanita-works/working-model-browser-qualification@6'),
              ('tests/live_browser_test.py', 'manzanita-works/working-model-live-browser@5', 'manzanita-works/working-model-live-browser@6'),
          ]:
              path = ROOT / relative
              text = path.read_text(encoding='utf-8')
              text = replace_once(
                  text,
                  '        body = page.locator("body").inner_text()\n'
                  '        for stale in ["Not another architecture review", "public-safe", "If leadership returns tomorrow", "Do not schedule a scoping call", "N=0"]:\n'
                  '            assert stale not in body, stale\n',
                  '        body = page.locator("body").inner_text()\n'
                  '        visible_internal_terms = ' + repr(visible_terms) + '\n'
                  '        for stale in ["Not another architecture review", "public-safe", "If leadership returns tomorrow", "Do not schedule a scoping call", "N=0"]:\n'
                  '            assert stale not in body, stale\n'
                  '        for internal in visible_internal_terms:\n'
                  '            assert internal not in body.lower(), internal\n',
                  f'{relative} initial rendered terminology',
              )
              text = replace_once(
                  text,
                  '            assert [value.strip().lower() for value in page.locator(".stage-list h4").all_inner_texts()] == expected_stages\n',
                  '            assert [value.strip().lower() for value in page.locator(".stage-list h4").all_inner_texts()] == expected_stages\n'
                  '            scenario_text = page.locator("#scenario-panel").inner_text().lower()\n'
                  '            for internal in visible_internal_terms:\n'
                  '                assert internal not in scenario_text, {"scenario": scenario, "term": internal}\n',
                  f'{relative} scenario terminology',
              )
              text = replace_once(
                  text,
                  '        page.goto(' + ('base_url + "#run-continuity"' if relative == 'tests/browser_test.py' else 'target("#run-continuity")') + ', wait_until="networkidle")\n'
                  '        page.evaluate("document.documentElement.style.fontSize = \'200%\'")\n',
                  '        page.goto(' + ('base_url + "#run-continuity"' if relative == 'tests/browser_test.py' else 'target("#run-continuity")') + ', wait_until="networkidle")\n'
                  '        assert page.locator("#pilot-sponsor").get_attribute("placeholder") == "Name or role"\n'
                  '        assert page.locator("#pilot-operator").get_attribute("placeholder") == "Funded owner"\n'
                  '        page.evaluate("document.documentElement.style.fontSize = \'200%\'")\n',
                  f'{relative} narrow placeholders',
              )
              text = replace_once(text, schema_old, schema_new, f'{relative} schema')
              text = replace_once(
                  text,
                  '        "stable_stage_ids_in_export": "PASS",\n',
                  '        "stable_stage_ids_in_export": "PASS",\n'
                  '        "visible_internal_nomenclature": 0,\n'
                  '        "compact_input_placeholders": "PASS",\n',
                  f'{relative} result ledger',
              )
              path.write_text(text, encoding='utf-8')

          # Contracts preserve the public-language terminal condition.
          contract_path = ROOT / 'WORKING_MODEL_CONTRACT.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          additions = [
              'accountable sponsor',
              'sponsor review',
              'no adverse use',
              'authority stays separate',
              'separate authorization',
              'adverse standing',
              'qualified field evidence',
              'lived facts',
              'first-party constraints',
              'participant fitness',
              'decision rights',
              'unstated authority',
              'institutional authority',
              'role-specific views',
              'source fallback',
          ]
          terms = contract['public_language']['prohibited_visible_terms']
          for term in additions:
              if term not in terms:
                  terms.append(term)
          contract['public_language']['compact_single_line_placeholders'] = {
              'accountable_owner': 'Name or role',
              'day_to_day_owner': 'Funded owner',
          }
          contract['working_surfaces'][3]['public_label'] = 'backup source and job-specific views'
          contract['working_surfaces'][3]['job'] = 'Keep claims honest when a live provider fails and show each participant only the view needed for the job.'
          contract_path.write_text(json.dumps(contract, indent=2) + '\n', encoding='utf-8')

          release_path = ROOT / 'RELEASE_CONTRACT.json'
          release = json.loads(release_path.read_text(encoding='utf-8'))
          release['visual_posture']['visible_internal_nomenclature'] = 0
          release['visual_posture']['compact_single_line_placeholders'] = True
          release['visual_posture']['dynamic_cases_checked_for_public_language'] = 4
          release_path.write_text(json.dumps(release, indent=2) + '\n', encoding='utf-8')

          readme_path = ROOT / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = replace_once(
              readme,
              'The public page translates those mechanics into receiver language. Its seven visible steps are Need, Evidence, Decision owner, Safe next step, Backup path, Outcome, and Next improvement. Stable machine-readable identifiers remain available in the contracts and exported packet rather than occupying the visible explanation. The browser campaigns verify the visible labels and their exported identities together.\n',
              'The public page translates those mechanics into receiver language. Its seven visible steps are Need, Evidence, Decision owner, Safe next step, Backup path, Outcome, and Next improvement. Stable machine-readable identifiers remain available in the contracts and exported packet rather than occupying the visible explanation. Browser campaigns verify every visible case, its exported identities, the absence of prohibited internal phrasing, and compact prompts at 320 pixels with 200 percent text.\n',
              'README final public-language proof',
          )
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Remove one-shot controller
        run: rm '.github/workflows/manzanita-working-model-final-language-scrub.yml'

      - name: Verify static release contract
        run: python manzanita-working-model/tests/public_contract_test.py

      - name: Commit the exact public-language scrub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-review-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'manzanita: remove the last visible internal language'
          git push origin HEAD
