name: Polish Essential Attention Mila receiver surface

on:
  push:
    branches:
      - review/essential-attention-mila-return-v1-2-1
    paths:
      - '.github/workflows/essential-attention-mila-visual-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize receiver polish
        run: python tools/polish_essential_attention_mila.py

      - name: Verify generated contracts and syntax
        run: |
          python essential-attention/tests/public_contract_test.py
          python -m py_compile essential-attention/tests/browser_test.py
          node --check /tmp/essential-attention-inline.js

      - name: Remove one-shot polish sources
        run: |
          rm tools/polish_essential_attention_mila.py
          rm .github/workflows/essential-attention-mila-visual-polish.yml

      - name: Commit final receiver polish
        run: |
          git config user.name 'essential-attention-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'essential-attention: polish Mila receiver surface v1.2.1'
          git push origin HEAD
