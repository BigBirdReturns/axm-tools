name: Manzanita donor custody v2

on:
  push:
    branches:
      - main
    paths:
      - "programs/manzanita-99/custody/**"
      - ".github/workflows/manzanita-donor-custody.yml"
      - "manzanita/**"
      - "manzanita-next/**"
      - "programs/manzanita-99/recovery/**"
      - "programs/manzanita-99/review-board/**"
      - "resolution-backfill/**"
      - ".github/pages-deployment.json"
      - ".github/workflows/manzanita-*.yml"
  pull_request:
    paths:
      - "programs/manzanita-99/custody/**"
      - ".github/workflows/manzanita-donor-custody.yml"
      - "manzanita/**"
      - "manzanita-next/**"
      - "programs/manzanita-99/recovery/**"
      - "programs/manzanita-99/review-board/**"
      - "resolution-backfill/**"
      - ".github/pages-deployment.json"
      - ".github/workflows/manzanita-*.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  custody:
    name: Build and validate donor custody
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind qualification to the exact submitted head
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
          git diff --quiet HEAD -- manzanita

      - name: Compile and test custody controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            programs/manzanita-99/custody/build_custody.py \
            programs/manzanita-99/custody/validate_custody.py \
            programs/manzanita-99/custody/audit_history.py \
            programs/manzanita-99/custody/tests/test_custody.py
          python -m unittest discover \
            -s programs/manzanita-99/custody/tests \
            -p "test_*.py"

      - name: Build deterministic repo-resident custody manifest
        run: |
          python programs/manzanita-99/custody/build_custody.py \
            --repo-root . \
            --output programs/manzanita-99/custody/CUSTODY_MANIFEST.json

      - name: Validate custody consistency and public-route byte guards
        run: |
          python programs/manzanita-99/custody/validate_custody.py \
            --repo-root . \
            --manifest programs/manzanita-99/custody/CUSTODY_MANIFEST.json

      - name: Audit reachable Manzanita history without promoting commits into releases
        run: |
          python programs/manzanita-99/custody/audit_history.py \
            --repo-root . \
            --output programs/manzanita-99/custody/HISTORY_AUDIT.json

      - name: Prove the bounded partial-custody result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          directory = Path('programs/manzanita-99/custody')
          manifest = json.loads((directory / 'CUSTODY_MANIFEST.json').read_text())
          history = json.loads((directory / 'HISTORY_AUDIT.json').read_text())
          register = json.loads((directory / 'DONOR_REGISTER.json').read_text())
          donor = next(
              row for row in register['donors']
              if row['id'] == 'pr-109-release_control'
          )
          assert manifest['status'] == 'PARTIAL'
          assert len(manifest['open_required_gaps']) == 10
          assert manifest['canonical_task_count_effect'] == 'none'
          assert donor['class'] == 'generated_candidate'
          assert history['unique_historical_public_route_tree_count'] >= 1
          assert 'not automatically an approved release' in history['classification_boundary']
          PY

      - name: Retain custody source manifest history audit and open-gap ledger
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-donor-custody-${{ env.REVIEW_HEAD_SHA }}
          path: |
            programs/manzanita-99/custody/README.md
            programs/manzanita-99/custody/CUSTODY_CONTRACT.json
            programs/manzanita-99/custody/DONOR_REGISTER.json
            programs/manzanita-99/custody/OBSERVED_EXECUTION_LEDGER.json
            programs/manzanita-99/custody/CUSTODY_MANIFEST.json
            programs/manzanita-99/custody/HISTORY_AUDIT.json
            programs/manzanita-99/custody/build_custody.py
            programs/manzanita-99/custody/validate_custody.py
            programs/manzanita-99/custody/audit_history.py
            programs/manzanita-99/custody/tests
          if-no-files-found: error
          retention-days: 90
