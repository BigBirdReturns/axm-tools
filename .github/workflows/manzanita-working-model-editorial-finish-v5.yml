name: Finish Manzanita working model narrow-screen typography

on:
  push:
    branches:
      - fix/manzanita-working-model-editorial-finish-v1
    paths:
      - '.github/workflows/manzanita-working-model-editorial-finish-v5.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove final public jargon and narrow-screen word breaks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, observed {count}')
              return text.replace(old, new, 1)

          root = Path('manzanita-working-model')
          index_path = root / 'index.html'
          html = index_path.read_text(encoding='utf-8')
          replacements = {
              '<p class="proof-state">Public · released projection</p>': '<p class="proof-state">Released · source-state view</p>',
              '<p class="proof-state">Local-first · administrative runtime</p>': '<p class="proof-state">Local-first · case operations</p>',
              '<p class="proof-state">Architecture · advanced view</p>': '<p class="proof-state">System map · organization-owned</p>',
              '<p class="proof-state">Internal · bounded kernel</p>': '<p class="proof-state">Bounded · authority held</p>',
              '<strong>Runtime owner</strong>': '<strong>Operating owner</strong>',
              'placeholder="Operator and funding unresolved"': 'placeholder="Operator unresolved"',
              '<summary>Technical evidence and boundaries</summary>': '<summary>Evidence and boundaries</summary>',
          }
          for old, new in replacements.items():
              html = replace_once(html, old, new, old)
          visible_text = html.lower()
          for residue in ['administrative runtime', 'runtime owner', 'bounded kernel', 'advanced view']:
              if residue in visible_text:
                  raise SystemExit(f'public editorial residue remains: {residue}')
          index_path.write_text(html, encoding='utf-8')

          css_path = root / 'style.css'
          css = css_path.read_text(encoding='utf-8')
          css = replace_once(
              css,
              '''.handoff-box h2,
          .handoff-state span,
          .handoff-state b {
            overflow-wrap: anywhere;
          }''',
              '''.handoff-state span,
          .handoff-state b {
            overflow-wrap: anywhere;
          }
          .handoff-box h2 {
            overflow-wrap: normal;
            word-break: normal;
          }''',
              'handoff word-wrap rule',
          )
          css = replace_once(
              css,
              '''@media (max-width: 360px) {
            .handoff-box { width: 100%; padding-inline: 16px; }
          }''',
              '''@media (max-width: 360px) {
            .handoff-box { width: 100%; padding-inline: 16px; }
            .handoff-box h2 { font-size: 34px; }
          }''',
              'narrow handoff rule',
          )
          css_path.write_text(css, encoding='utf-8')

          static_path = root / 'tests/public_contract_test.py'
          static = static_path.read_text(encoding='utf-8')
          anchor = '    require("THEME_KEY" not in js and "applyTheme" not in js, "theme subsystem remains in script")\n'
          insertion = anchor + '    require("administrative runtime" not in html.lower(), "public administrative-runtime jargon remains")\n    require("runtime owner" not in html.lower(), "public runtime-owner jargon remains")\n    require("bounded kernel" not in html.lower(), "public bounded-kernel jargon remains")\n    require("advanced view" not in html.lower(), "public advanced-view jargon remains")\n    require(\'placeholder="Operator unresolved"\' in html, "compact operator placeholder absent")\n    require("Evidence and boundaries" in html, "concise evidence disclosure label absent")\n'
          static = replace_once(static, anchor, insertion, 'static editorial assertions')
          static_path.write_text(static, encoding='utf-8')

          line_check = '''
                  heading = page.locator(".handoff-box h2")
                  assert heading.evaluate("""el => {
                    const node = Array.from(el.childNodes).find(item => item.nodeType === Node.TEXT_NODE);
                    if (!node) return false;
                    const text = node.textContent || '';
                    const words = [...text.matchAll(/\\S+/g)];
                    return words.every(match => {
                      const range = document.createRange();
                      range.setStart(node, match.index);
                      range.setEnd(node, match.index + match[0].length);
                      return range.getClientRects().length === 1;
                    });
                  }""")
                  assert page.locator("#pilot-operator").get_attribute("placeholder") == "Operator unresolved"
          '''
          for name in ['browser_test.py', 'live_browser_test.py']:
              path = root / 'tests' / name
              test = path.read_text(encoding='utf-8')
              target = '        page.evaluate("document.documentElement.style.fontSize=\'200%\'")\n        page.wait_for_timeout(150)\n        assert_no_overflow(page)\n'
              replacement = target.replace('        assert_no_overflow(page)\n', line_check + '        assert_no_overflow(page)\n')
              test = replace_once(test, target, replacement, f'{name} narrow typography assertion')
              path.write_text(test, encoding='utf-8')
          PY

      - name: Remove one-shot controller
        run: rm '.github/workflows/manzanita-working-model-editorial-finish-v5.yml'

      - name: Qualify final typography and behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            manzanita-working-model/tests/public_contract_test.py \
            manzanita-working-model/tests/browser_test.py \
            manzanita-working-model/tests/live_browser_test.py \
            manzanita-working-model/tests/live_readback.py
          node --check manzanita-working-model/app.js
          python manzanita-working-model/tests/public_contract_test.py
          python -m pip install --disable-pip-version-check playwright==1.57.0
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            export MW_CHROMIUM_EXECUTABLE="$browser"
          else
            python -m playwright install --with-deps chromium
          fi
          export MW_WORKING_MODEL_SCREENSHOT_DIR="$RUNNER_TEMP/manzanita-working-model-editorial-final"
          python manzanita-working-model/tests/browser_test.py

      - name: Retain final visual review evidence
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-working-model-editorial-final-${{ github.sha }}
          path: ${{ runner.temp }}/manzanita-working-model-editorial-final
          if-no-files-found: error
          retention-days: 30

      - name: Commit final editorial pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-editorial-bot'
          git config user.email 'actions@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          required = {
              'manzanita-working-model/index.html',
              'manzanita-working-model/style.css',
              'manzanita-working-model/tests/browser_test.py',
              'manzanita-working-model/tests/live_browser_test.py',
              'manzanita-working-model/tests/public_contract_test.py',
          }
          allowed = required | {'.github/workflows/manzanita-working-model-editorial-finish-v5.yml'}
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          observed = {row[3:] for row in rows}
          missing = required - observed
          unexpected = observed - allowed
          if missing or unexpected:
              raise SystemExit(f'changed-path gate failed\nmissing={sorted(missing)}\nunexpected={sorted(unexpected)}\nobserved={sorted(observed)}')
          PY
          git add -A
          git commit -m 'manzanita: finish narrow-screen typography and labels'
          git push origin HEAD
