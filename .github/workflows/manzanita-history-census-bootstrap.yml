name: Bootstrap Manzanita historical release census

on:
  push:
    branches:
      - agent/manzanita-donor-custody-v2-actual
    paths:
      - ".github/workflows/manzanita-history-census-bootstrap.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manzanita-history-census-bootstrap
  cancel-in-progress: false

jobs:
  create-next-tranche:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for custody v2 to enter main
        run: |
          for attempt in $(seq 1 60)
          do
            git fetch origin main
            if git cat-file -e origin/main:programs/manzanita-99/custody-v2/CUSTODY_CONTRACT.json 2>/dev/null
            then
              exit 0
            fi
            sleep 10
          done
          echo "Custody v2 did not enter main" >&2
          exit 1

      - name: Create the exact history-census branch
        run: |
          git checkout -B agent/manzanita-historical-release-census-025 origin/main
          python - <<'PY'
          from pathlib import Path
          import textwrap

          files = {
            "programs/manzanita-99/custody-v2/history/README.md": r'''
          # Manzanita historical release census

          This object inventories every `manzanita/` tree reachable from Git history and every currently queryable failed Manzanita Actions run. It distinguishes a reachable tree, a repository release candidate, an explicitly qualified release, an Actions failure, and observed public endpoint bytes.

          Reachability is custody evidence. It is not approval, deployment, public-byte proof, or product completion. A tree is classified as an explicitly qualified release only when its own `manzanita/QUALIFICATION.json` contains a release or version identity. Failed workflow metadata remains a failure receipt index and does not substitute for retained logs or artifacts.

          The census advances `M99-CUSTODY-GAP-001` and `M99-CUSTODY-GAP-005` without closing either gap. External packages, deleted refs, expired logs, rejected visual states, and deployed-byte observations remain open.
          ''',
            "programs/manzanita-99/custody-v2/history/build_history_census.py": r'''
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          from typing import Any

          SCHEMA="axm-tools/manzanita-historical-release-census@1"
          class CensusError(ValueError): pass
          def require(c,m):
              if not c: raise CensusError(m)
          def run(repo: Path,*args: str)->str:
              p=subprocess.run(["git","-C",str(repo),*args],capture_output=True,text=True); return p.stdout if p.returncode==0 else ""
          def canonical(v: Any)->bytes:return json.dumps(v,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          def sha256(b: bytes)->str:return hashlib.sha256(b).hexdigest()
          def qualified(repo: Path,commit: str)->dict[str,Any]:
              raw=run(repo,"show",f"{commit}:manzanita/QUALIFICATION.json")
              if not raw:return {"present":False,"declared_release":None}
              try:value=json.loads(raw)
              except json.JSONDecodeError:return {"present":True,"valid_json":False,"declared_release":None}
              release=value.get("release") or value.get("version")
              return {"present":True,"valid_json":True,"declared_release":release,"qualification_sha256":sha256(raw.encode())}
          def action_failures(repository: str|None,token: str|None)->list[dict[str,Any]]:
              if not repository:return []
              headers={"Accept":"application/vnd.github+json","User-Agent":"Manzanita-History-Census"}
              if token:headers["Authorization"]=f"Bearer {token}"
              url=f"https://api.github.com/repos/{repository}/actions/runs?per_page=100&status=failure"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:value=json.loads(r.read())
              except Exception:return []
              rows=[]
              for item in value.get("workflow_runs",[]):
                  name=str(item.get("name") or "")
                  if "manzanita" not in name.lower():continue
                  rows.append({"run_id":item["id"],"workflow":name,"event":item.get("event"),"head_sha":item.get("head_sha"),"status":item.get("status"),"conclusion":item.get("conclusion"),"created_at":item.get("created_at"),"updated_at":item.get("updated_at"),"logs_url":item.get("logs_url"),"artifacts_url":item.get("artifacts_url"),"claim_boundary":"Run metadata identifies a failed execution. It does not prove retained logs, artifacts, root cause, or resulting rule."})
              return sorted(rows,key=lambda row:(row["created_at"] or "",row["run_id"]))
          def build(repo: Path,repository: str|None=None,token: str|None=None)->dict[str,Any]:
              repo=repo.resolve(); commits=run(repo,"rev-list","--all","--","manzanita").splitlines(); trees={}
              for commit in commits:
                  tree=run(repo,"rev-parse",f"{commit}:manzanita").strip()
                  if len(tree)!=40:continue
                  row=trees.setdefault(tree,{"tree_sha":tree,"observed_commits":[],"first_observed_commit":commit,"files":[]})
                  row["observed_commits"].append(commit)
                  if not row["files"]:
                      for line in run(repo,"ls-tree","-r",tree).splitlines():
                          meta,path=line.split("\t",1); mode,typ,blob=meta.split(); size=run(repo,"cat-file","-s",blob).strip(); row["files"].append({"path":f"manzanita/{path}","mode":mode,"type":typ,"git_blob_sha1":blob,"bytes":int(size) if size.isdigit() else None})
                  q=qualified(repo,commit)
                  if q.get("declared_release") and not row.get("qualification",{}).get("declared_release"):row["qualification"]={**q,"commit":commit}
              rows=[]
              for tree,row in trees.items():
                  q=row.get("qualification",{"present":False,"declared_release":None})
                  row["classification"]="explicitly_qualified_repository_release" if q.get("declared_release") else "reachable_tree_not_qualified_release"
                  row["file_count"]=len(row["files"]); row["observed_commit_count"]=len(row["observed_commits"]); row["claim_boundary"]="Git reachability and an in-tree qualification record do not establish observed public endpoint bytes or current successor standing."
                  rows.append(row)
              failures=action_failures(repository,token)
              value={"schema":SCHEMA,"result":"PASS","reachable_commit_count":len(commits),"unique_tree_count":len(rows),"explicit_release_count":sum(r["classification"].startswith("explicitly") for r in rows),"trees":sorted(rows,key=lambda r:r["tree_sha"]),"failed_run_count":len(failures),"failed_runs":failures,"gap_effect":{"M99-CUSTODY-GAP-001":"advanced_not_closed","M99-CUSTODY-GAP-005":"advanced_not_closed"},"public_effect":"none","constitutional_count_effect":"none","qualification_boundary":"The census covers reachable Git trees and currently queryable Actions failure metadata only. External packages, deleted refs, expired evidence, visual rejections, and deployed-byte observations remain open."}; value["payload_sha256"]=sha256(canonical(value)); return value
          def main():
              ap=argparse.ArgumentParser(); ap.add_argument("--repo-root",type=Path,default=Path.cwd()); ap.add_argument("--repository"); ap.add_argument("--output",type=Path,required=True); a=ap.parse_args(); value=build(a.repo_root,a.repository,os.environ.get("GITHUB_TOKEN")); a.output.parent.mkdir(parents=True,exist_ok=True); a.output.write_text(json.dumps(value,indent=2)+"\n"); print(json.dumps({"result":"PASS","unique_tree_count":value["unique_tree_count"],"explicit_release_count":value["explicit_release_count"],"failed_run_count":value["failed_run_count"],"receipt_sha256":value["payload_sha256"]},indent=2))
          if __name__=="__main__":
              try:main()
              except CensusError as e:raise SystemExit(str(e)) from e
          ''',
            "programs/manzanita-99/custody-v2/history/tests/test_history_census.py": r'''
          from __future__ import annotations
          import importlib.util, json, subprocess, tempfile, unittest
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          spec=importlib.util.spec_from_file_location("history",ROOT/"build_history_census.py"); history=importlib.util.module_from_spec(spec); spec.loader.exec_module(history)
          class HistoryCensusTests(unittest.TestCase):
              def setUp(self):
                  self.t=tempfile.TemporaryDirectory(); self.repo=Path(self.t.name); subprocess.run(["git","init"],cwd=self.repo,check=True,capture_output=True); subprocess.run(["git","config","user.email","test@example.invalid"],cwd=self.repo,check=True); subprocess.run(["git","config","user.name","Test"],cwd=self.repo,check=True); (self.repo/"manzanita").mkdir(); (self.repo/"manzanita/index.html").write_text("v1\n"); subprocess.run(["git","add","."],cwd=self.repo,check=True); subprocess.run(["git","commit","-m","v1"],cwd=self.repo,check=True,capture_output=True)
              def tearDown(self):self.t.cleanup()
              def commit(self,message):subprocess.run(["git","add","."],cwd=self.repo,check=True); subprocess.run(["git","commit","-m",message],cwd=self.repo,check=True,capture_output=True)
              def test_reachable_tree_without_qualification_is_not_release(self):
                  value=history.build(self.repo); self.assertEqual(value["unique_tree_count"],1); self.assertEqual(value["explicit_release_count"],0); self.assertEqual(value["trees"][0]["classification"],"reachable_tree_not_qualified_release")
              def test_exact_qualification_promotes_only_its_tree(self):
                  (self.repo/"manzanita/QUALIFICATION.json").write_text(json.dumps({"release":"1.0.0"})); self.commit("qualified"); value=history.build(self.repo); self.assertEqual(value["unique_tree_count"],2); self.assertEqual(value["explicit_release_count"],1)
              def test_deterministic(self):
                  a=history.build(self.repo); b=history.build(self.repo); self.assertEqual(a["payload_sha256"],b["payload_sha256"])
              def test_gap_effect_does_not_close(self):
                  value=history.build(self.repo); self.assertTrue(all(v=="advanced_not_closed" for v in value["gap_effect"].values())); self.assertEqual(value["public_effect"],"none"); self.assertEqual(value["constitutional_count_effect"],"none")
          if __name__=="__main__":unittest.main()
          ''',
            ".github/workflows/manzanita-history-census.yml": r'''
          name: Manzanita historical release and failure census

          on:
            push:
              branches:
                - agent/manzanita-historical-release-census-025
              paths:
                - "programs/manzanita-99/custody-v2/history/**"
                - ".github/workflows/manzanita-history-census.yml"
            pull_request:
              paths:
                - "programs/manzanita-99/custody-v2/history/**"
                - ".github/workflows/manzanita-history-census.yml"
            workflow_dispatch: {}

          permissions:
            contents: read
            actions: read

          jobs:
            qualify:
              name: Inventory reachable releases and failed runs without false closure
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              env:
                REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - name: Prove exact path scope and public route
                  run: |
                    test "$(git rev-parse HEAD)" = "$REVIEW_HEAD_SHA"
                    git fetch --no-tags origin main
                    python - <<'PY2'
                    import subprocess
                    changed=subprocess.run(["git","diff","--name-only","origin/main...HEAD"],check=True,capture_output=True,text=True).stdout.splitlines()
                    allowed={".github/workflows/manzanita-history-census.yml"}
                    invalid=[p for p in changed if p not in allowed and not p.startswith("programs/manzanita-99/custody-v2/history/")]
                    if invalid:raise SystemExit(f"out-of-scope history paths: {invalid}")
                    PY2
                    git diff --quiet origin/main...HEAD -- manzanita
                - name: Compile and run census tests
                  env:
                    PYTHONDONTWRITEBYTECODE: "1"
                  run: |
                    python -m py_compile programs/manzanita-99/custody-v2/history/build_history_census.py programs/manzanita-99/custody-v2/history/tests/test_history_census.py
                    python -m unittest discover -s programs/manzanita-99/custody-v2/history/tests -p "test_*.py"
                - name: Build exact reachable history and current failed-run census
                  env:
                    GITHUB_TOKEN: ${{ github.token }}
                  run: |
                    rm -rf programs/manzanita-99/custody-v2/history/out
                    python programs/manzanita-99/custody-v2/history/build_history_census.py --repo-root . --repository "${{ github.repository }}" --output programs/manzanita-99/custody-v2/history/out/HISTORICAL_RELEASE_CENSUS.json
                    python - <<'PY2'
                    import json
                    from pathlib import Path
                    value=json.loads(Path("programs/manzanita-99/custody-v2/history/out/HISTORICAL_RELEASE_CENSUS.json").read_text())
                    assert value["result"]=="PASS"
                    assert value["unique_tree_count"]>0
                    assert value["gap_effect"]["M99-CUSTODY-GAP-001"]=="advanced_not_closed"
                    assert value["gap_effect"]["M99-CUSTODY-GAP-005"]=="advanced_not_closed"
                    assert value["public_effect"]=="none"
                    assert value["constitutional_count_effect"]=="none"
                    assert all(row["classification"] in {"explicitly_qualified_repository_release","reachable_tree_not_qualified_release"} for row in value["trees"])
                    PY2
                - uses: actions/upload-artifact@v4
                  with:
                    name: manzanita-history-census-${{ env.REVIEW_HEAD_SHA }}
                    path: |
                      programs/manzanita-99/custody-v2/history/README.md
                      programs/manzanita-99/custody-v2/history/build_history_census.py
                      programs/manzanita-99/custody-v2/history/tests
                      programs/manzanita-99/custody-v2/history/out
                    if-no-files-found: error
                    retention-days: 90
          '''
          }
          for path,content in files.items():
              target=Path(path); target.parent.mkdir(parents=True,exist_ok=True); target.write_text(textwrap.dedent(content).lstrip(),encoding="utf-8")
          PY

      - name: Prove and publish the bounded acquisition branch
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile programs/manzanita-99/custody-v2/history/build_history_census.py programs/manzanita-99/custody-v2/history/tests/test_history_census.py
          python -m unittest discover -s programs/manzanita-99/custody-v2/history/tests -p "test_*.py"
          git config user.name "manzanita-history-census-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/manzanita-history-census.yml programs/manzanita-99/custody-v2/history
          git commit -m "Manzanita: inventory reachable releases and failed runs"
          git push -u origin agent/manzanita-historical-release-census-025
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head agent/manzanita-historical-release-census-025 \
            --draft \
            --title "Manzanita: inventory reachable releases and failed runs" \
            --body "This pull request advances the predecessor-release and material-failure custody gaps with an exact census of every reachable manzanita tree and every currently queryable failed Manzanita Actions run. It does not close either gap, infer deployed bytes, classify reachability as approval, alter the historical public route, authorize release, or mutate a canonical task row. The controlling question is whether every reachable tree and current failure can be identified without laundering repository history into release standing."
