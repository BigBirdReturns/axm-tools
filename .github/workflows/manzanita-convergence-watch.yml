name: Manzanita convergence run watcher

# Observe the isolated final-v5 convergence execution.
on:
  push:
    branches: [agent/manzanita-public-convergence-v1-6]
    paths:
      - ".github/workflows/manzanita-convergence-watch.yml"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: agent/manzanita-public-convergence-v1-6
      PR_NUMBER: "117"
      EXPECTED_HEAD: 824bc09ddc2c8bc8989a71b6e6ae21ee0669664b
    steps:
      - name: Wait for the exact rendered convergence run
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            row=$(gh run list --repo "$GH_REPO" \
              --workflow manzanita-convergence-build-v5.yml \
              --branch "$BRANCH" \
              --limit 10 \
              --json databaseId,status,conclusion,headSha,createdAt,updatedAt \
              --jq ".[] | select(.headSha == \"$EXPECTED_HEAD\")" | head -1)
            if [ -n "$row" ]; then
              status=$(printf '%s' "$row" | jq -r '.status')
              if [ "$status" = "completed" ]; then
                printf '%s\n' "$row" > /tmp/run.json
                break
              fi
            fi
            if [ "$attempt" = "100" ]; then
              echo "Exact rendered convergence run did not complete in time"
              exit 1
            fi
            sleep 15
          done
      - name: Report the exact run to PR 117
        run: |
          run_id=$(jq -r '.databaseId' /tmp/run.json)
          status=$(jq -r '.status' /tmp/run.json)
          conclusion=$(jq -r '.conclusion // ""' /tmp/run.json)
          head_sha=$(jq -r '.headSha' /tmp/run.json)
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "Isolated rendered convergence run \`$run_id\` completed with status \`$status\`, conclusion \`$conclusion\`, head \`$head_sha\`."
          if [ "$conclusion" != "success" ]; then
            gh run view "$run_id" --repo "$GH_REPO" --log-failed > /tmp/failed.log || true
            tail -c 50000 /tmp/failed.log > /tmp/failed-tail.log
            gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file /tmp/failed-tail.log
            exit 1
          fi
