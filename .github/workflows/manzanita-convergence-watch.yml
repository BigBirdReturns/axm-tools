name: Manzanita convergence run watcher

# Enumerate the exact convergence runs after the structure-safe repair.
on:
  push:
    branches: [agent/manzanita-public-convergence-v1-6]
    paths:
      - ".github/workflows/manzanita-convergence-watch.yml"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: agent/manzanita-public-convergence-v1-6
      PR_NUMBER: "117"
    steps:
      - name: Report the five latest rendered convergence runs
        run: |
          set -euo pipefail
          gh run list --repo "$GH_REPO" \
            --workflow manzanita-convergence-build-v5.yml \
            --branch "$BRANCH" \
            --limit 5 \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt \
            > /tmp/runs.json
          {
            echo 'Latest rendered convergence runs:'
            echo
            echo '```json'
            jq . /tmp/runs.json
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file /tmp/comment.md
