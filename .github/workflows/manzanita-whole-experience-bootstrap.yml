name: Bootstrap Manzanita whole experience

on:
  push:
    branches:
      - agent/manzanita-whole-experience-017
    paths:
      - ".github/bootstrap/manzanita-p7-whole-experience-part-*.b64"
      - ".github/workflows/manzanita-whole-experience-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: manzanita-whole-experience-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-whole-experience-017
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover the bounded transport under its exact chunk digest
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('.github/bootstrap/manzanita-p7-whole-experience-part-01.b64')
          expected = '1bf6a00bcb94a87ffe4c85c9e3f16cf4f9937f5d57b7cbd8e961161f8d789b32'
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          payload = bytearray(path.read_bytes())

          if sha256(payload).hexdigest() != expected:
              matches = []
              for index in range(len(payload)):
                  original = payload[index]
                  for candidate in alphabet:
                      if candidate == original:
                          continue
                      payload[index] = candidate
                      if sha256(payload).hexdigest() == expected:
                          matches.append((index, original, candidate, bytes(payload)))
                  payload[index] = original
              if len(matches) != 1:
                  raise SystemExit(
                      f'Expected one single-symbol recovery, found {len(matches)} candidates'
                  )
              index, original, candidate, recovered = matches[0]
              path.write_bytes(recovered)
              print(
                  'Recovered part-01 at byte '
                  f'{index}: {chr(original)!r} -> {chr(candidate)!r}'
              )

          actual = sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'part-01 digest remains {actual}, expected {expected}')
          PY

      - name: Audit, reconstruct, verify, and expand the bounded payload
        run: |
          wc -c .github/bootstrap/manzanita-p7-whole-experience-part-*.b64
          echo "e56214b3d9d7a89c2a670a019f9400d570e16c13237898f6a0547a2821178f0d  .github/bootstrap/manzanita-p7-whole-experience-part-00.b64" | sha256sum -c -
          echo "1bf6a00bcb94a87ffe4c85c9e3f16cf4f9937f5d57b7cbd8e961161f8d789b32  .github/bootstrap/manzanita-p7-whole-experience-part-01.b64" | sha256sum -c -
          echo "c9f42ab1241b0a0464537f686f67e7ed324477edb700891156ef0bf481e4a2cb  .github/bootstrap/manzanita-p7-whole-experience-part-02.b64" | sha256sum -c -
          echo "6e4052b94c98a462eff25c7aefc2c243ea0dc373d8cd980d4b83c3f7f232bde1  .github/bootstrap/manzanita-p7-whole-experience-part-03.b64" | sha256sum -c -
          echo "dc8122dd2792556a4771b7a7931e592b9ef8e67d445a700c01f1dde29c0b705d  .github/bootstrap/manzanita-p7-whole-experience-part-04.b64" | sha256sum -c -
          echo "a5e31fd5faae208997c7fb71909ba39f1b9b23f85e611d517aca35a617867bd0  .github/bootstrap/manzanita-p7-whole-experience-part-05.b64" | sha256sum -c -
          echo "3e605ad194ebad03018bfc84909ea858523ee467cc54e2ea35689191fa8cd300  .github/bootstrap/manzanita-p7-whole-experience-part-06.b64" | sha256sum -c -
          cat \
            .github/bootstrap/manzanita-p7-whole-experience-part-00.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-01.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-02.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-03.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-04.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-05.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-06.b64 \
            > /tmp/manzanita-p7-whole-experience.tar.gz.b64
          echo "906afd3091a9c965092e0606bf6e28d2f21cbf308536ef12f158aceaae4560af  /tmp/manzanita-p7-whole-experience.tar.gz.b64" | sha256sum -c -
          base64 --decode /tmp/manzanita-p7-whole-experience.tar.gz.b64 \
            > /tmp/manzanita-p7-whole-experience.tar.gz
          echo "b4f6a252f52b508d80c700eb9b9dff9c23ba67a2a47726ccb7303ea5678e058d  /tmp/manzanita-p7-whole-experience.tar.gz" | sha256sum -c -
          tar -xzf /tmp/manzanita-p7-whole-experience.tar.gz

      - name: Prove local contracts before sealing
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -m py_compile \
            manzanita-next/experience/build_experience.py \
            manzanita-next/experience/tests/test_experience.py \
            manzanita-next/experience/tests/browser_test.py
          node --check manzanita-next/experience/template/app.js
          python -m json.tool manzanita-next/experience/EXPERIENCE_CONTRACT.json > /dev/null
          python -m json.tool manzanita-next/experience/review/M99-RB-PKT-009.json > /dev/null
          python -m json.tool manzanita-next/experience/review/M99-RB-DEC-009.json > /dev/null
          python -m unittest discover \
            -s manzanita-next/experience/tests \
            -p "test_experience.py"

      - name: Seal and publish the materialized source object
        run: |
          rm -f \
            .github/bootstrap/manzanita-p7-whole-experience.tar.gz \
            .github/bootstrap/manzanita-p7-whole-experience-part-00.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-01.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-02.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-03.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-04.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-05.b64 \
            .github/bootstrap/manzanita-p7-whole-experience-part-06.b64 \
            .github/workflows/manzanita-whole-experience-bootstrap.yml \
            .github/workflows/manzanita-whole-experience.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "manzanita-whole-experience-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Manzanita: materialize source-bound whole experience"
          git push origin HEAD:agent/manzanita-whole-experience-017
