name: Eliminate Manzanita working-model favicon probe

on:
  push:
    branches:
      - review/manzanita-working-model-v1-1
    paths:
      - '.github/workflows/manzanita-working-model-favicon-fix.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Bind an empty inline favicon and eliminate the stray network request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('manzanita-working-model/index.html')
          text = path.read_text(encoding='utf-8')
          old = '  <title>Manzanita Works · Working Model</title>\n  <link rel="stylesheet" href="style.css">'
          new = '  <title>Manzanita Works · Working Model</title>\n  <link rel="icon" href="data:,">\n  <link rel="stylesheet" href="style.css">'
          if text.count(old) != 1:
              raise SystemExit(f'favicon insertion anchor count differed: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-shot normalizer
        run: rm '.github/workflows/manzanita-working-model-favicon-fix.yml'

      - name: Verify static release contract
        run: python manzanita-working-model/tests/public_contract_test.py

      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-review-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'manzanita: eliminate the stray favicon probe'
          git push origin HEAD
