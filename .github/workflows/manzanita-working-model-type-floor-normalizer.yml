name: Normalize Manzanita working-model type floor

on:
  push:
    branches:
      - review/manzanita-working-model-v1-1
    paths:
      - '.github/workflows/manzanita-working-model-type-floor-normalizer.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Raise every residual micro-label to the release floor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('manzanita-working-model/style.css')
          text = path.read_text(encoding='utf-8')
          counts = {
              'font-size: 9px;': text.count('font-size: 9px;'),
              'font-size: 10px;': text.count('font-size: 10px;'),
          }
          if counts != {'font-size: 9px;': 3, 'font-size: 10px;': 6}:
              raise SystemExit(f'unexpected residual micro-label counts: {counts}')
          text = text.replace('font-size: 9px;', 'font-size: 11px;')
          text = text.replace('font-size: 10px;', 'font-size: 11px;')
          if 'font-size: 9px;' in text or 'font-size: 10px;' in text:
              raise SystemExit('micro-label replacement incomplete')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot normalizer
        run: rm '.github/workflows/manzanita-working-model-type-floor-normalizer.yml'

      - name: Verify static release contract
        run: python manzanita-working-model/tests/public_contract_test.py

      - name: Commit exact normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-review-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'manzanita: enforce an eleven-pixel visual floor'
          git push origin HEAD
