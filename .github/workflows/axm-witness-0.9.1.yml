name: AXM Witness Department Ledger 0.9.1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/axm-witness-v0.9.1/**"
      - ".github/scripts/materialize_axm_witness_091.py"
      - ".github/workflows/axm-witness-0.9.1.yml"
      - ".github/workflows/axm-witness-bootstrap-0.9.1.yml"
      - ".github/workflows/axm-witness-bootstrap-pr-0.9.1.yml"
      - "axm-witness/**"
      - "witness/**"
      - "README.md"
      - "index.html"
      - "CONTINUITY.md"
  push:
    branches: [main]
    paths:
      - ".github/scripts/materialize_axm_witness_091.py"
      - ".github/workflows/axm-witness-0.9.1.yml"
      - "axm-witness/**"
      - "witness/**"
      - "README.md"
      - "index.html"
      - "CONTINUITY.md"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct and install the exact supplied site
        run: python .github/scripts/materialize_axm_witness_091.py

      - name: Commit the exact release transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'axm-witness-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No release change produced'; exit 1; }
          git commit -m 'axm-witness: publish exact Department Ledger 0.9.1 site'
          git push origin HEAD:${{ github.head_ref }}

  qualify:
    needs: materialize
    if: always() && (needs.materialize.result == 'success' || needs.materialize.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Verify exact 0.9.1 site identity and publication boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          root = Path('.')
          site = root / 'axm-witness'
          public = site / 'index.html'
          nojekyll = site / '.nojekyll'
          expected_sha = 'd5d1f33f6cb2981497489f24468939f752cc5de39e66ebcf4ff11838ad1843f7'
          expected_bytes = 497_004

          assert site.is_dir(), site
          assert sorted(path.name for path in site.iterdir()) == ['.nojekyll', 'index.html']
          assert public.stat().st_size == expected_bytes, public.stat().st_size
          assert hashlib.sha256(public.read_bytes()).hexdigest() == expected_sha
          assert nojekyll.read_bytes() == b''

          html = public.read_text(encoding='utf-8')
          assert '<title>AXM Witness Department Ledger | Independent Flock Review</title>' in html
          assert not re.search(r'<(?:script|link)[^>]+(?:src|href)=["\'](?:https?:)?//', html, re.I)
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I | re.S)
          assert scripts, 'inline runtime missing'
          Path('/tmp/axm-witness-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')

          readme = (root / 'README.md').read_text(encoding='utf-8')
          directory = (root / 'index.html').read_text(encoding='utf-8')
          continuity = (root / 'CONTINUITY.md').read_text(encoding='utf-8')
          for rendered in (readme, directory, continuity):
              assert 'AXM Witness Department Ledger 0.9.1' in rendered
              assert 'axm-witness/' in rendered

          assert not (root / 'witness').exists(), 'legacy witness surface remains'
          assert not (root / '.github' / 'axm-witness-v0.9.1').exists(), 'one-shot transport remains'
          assert not (root / '.github' / 'workflows' / 'axm-witness-bootstrap-0.9.1.yml').exists()
          assert not (root / '.github' / 'workflows' / 'axm-witness-bootstrap-pr-0.9.1.yml').exists()

          print({
              'application_bytes': expected_bytes,
              'application_sha256': expected_sha,
              'site_members': ['index.html', '.nojekyll'],
          })
          PY

      - name: Parse the exact inline runtime
        run: node --check /tmp/axm-witness-inline.js

      - name: Exercise the static route
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/axm-witness-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/axm-witness/ -o /tmp/served-index.html; then
              break
            fi
            sleep 0.25
          done
          test "$(wc -c </tmp/served-index.html)" -eq 497004
          test "$(sha256sum /tmp/served-index.html | awk '{print $1}')" = "d5d1f33f6cb2981497489f24468939f752cc5de39e66ebcf4ff11838ad1843f7"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qualify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed bytes and root-directory listing
        shell: bash
        run: |
          set -euo pipefail
          app_url='https://bigbirdreturns.github.io/axm-tools/axm-witness/'
          root_url='https://bigbirdreturns.github.io/axm-tools/'
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "${app_url}?release=0.9.1&attempt=${attempt}" -o /tmp/live-index.html; then
              bytes="$(wc -c </tmp/live-index.html)"
              sha="$(sha256sum /tmp/live-index.html | awk '{print $1}')"
              if [ "$bytes" = '497004' ] && [ "$sha" = 'd5d1f33f6cb2981497489f24468939f752cc5de39e66ebcf4ff11838ad1843f7' ]; then
                break
              fi
            fi
            sleep 5
          done
          test "$(wc -c </tmp/live-index.html)" -eq 497004
          test "$(sha256sum /tmp/live-index.html | awk '{print $1}')" = 'd5d1f33f6cb2981497489f24468939f752cc5de39e66ebcf4ff11838ad1843f7'
          curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "${root_url}?release=0.9.1" -o /tmp/root-index.html
          grep -F 'AXM Witness Department Ledger 0.9.1' /tmp/root-index.html
