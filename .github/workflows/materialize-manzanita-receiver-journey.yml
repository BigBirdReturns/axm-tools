name: Materialize Manzanita receiver journey convergence

on:
  push:
    branches:
      - review/manzanita-receiver-journey-convergence-v1
    paths:
      - '.github/workflows/materialize-manzanita-receiver-journey.yml'

permissions:
  contents: write

concurrency:
  group: materialize-manzanita-receiver-journey-v1
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore the deterministic materializer
