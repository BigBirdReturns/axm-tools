          tar -xzf /tmp/mw-convergence-materializer.tgz
          python -m py_compile tools/patch_mw_convergence.py tools/bump_mw_convergence_versions.py

      - name: Materialize the connected receiver journey
        run: |
          set -euo pipefail
          python tools/patch_mw_convergence.py
          python tools/bump_mw_convergence_versions.py
          git diff --check
          mkdir -p /tmp/mw-convergence
          git status --short > /tmp/mw-convergence/materialized-status.txt
          git diff --stat > /tmp/mw-convergence/materialized-diff-stat.txt

      - name: Verify all static contracts and runtime syntax
        run: |
          set -euo pipefail
          python manzanita-working-model/tests/public_contract_test.py
          python manzanita/tests/public_contract_test.py
          python essential-attention/tests/public_contract_test.py
          python manzanita-works/tests/public_contract_test.py
          python -m py_compile \
            manzanita-working-model/tests/browser_test.py \
            manzanita/tests/browser_test.py \
            essential-attention/tests/browser_test.py \
            manzanita-works/tests/browser_test.py \
            tests/pages/verify_manzanita_receiver_journey.py
          node --check manzanita-working-model/app.js
          node --check manzanita/app.js
          node --check manzanita/theme-init.js
          node --check manzanita-works/app.js
          node --check manzanita-works/data.js
          node --check /tmp/essential-attention-inline.js

      - name: Install deterministic browser dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Qualify the Working Model candidate
        env:
          MW_WORKING_MODEL_SCREENSHOT_DIR: /tmp/mw-convergence/working-model
        run: python manzanita-working-model/tests/browser_test.py

      - name: Qualify the Place Fabric candidate
        env:
          MANZANITA_SCREENSHOT_DIR: /tmp/mw-convergence/place-fabric
        run: |
          python manzanita/tests/browser_test.py
          python programs/manzanita-public-convergence/rendered_visual_floor.py --output /tmp/mw-convergence/place-fabric-visual-floor

      - name: Qualify Essential Attention and the Mila return surface
        env:
          EA_BROWSER_OUT: /tmp/mw-convergence/essential-attention
        run: python essential-attention/tests/browser_test.py

      - name: Qualify the Operating Fabric candidate
        env:
          MW_DREAMBOARD_SCREENSHOT_DIR: /tmp/mw-convergence/operating-fabric
        run: python manzanita-works/tests/browser_test.py

      - name: Audit the complete receiver journey
        env:
          MW_RECEIVER_AUDIT_OUT: /tmp/mw-convergence/receiver-journey
        run: python tests/pages/verify_manzanita_receiver_journey.py

      - name: Retain exact branch qualification evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-receiver-journey-convergence-${{ github.sha }}
          path: |
            /tmp/mw-convergence
            manzanita-working-model/RELEASE_CONTRACT.json
            manzanita-working-model/WORKING_MODEL_CONTRACT.json
            manzanita/QUALIFICATION.json
            manzanita/RELEASE_RECEIPT.json
            essential-attention/QUALIFICATION.json
            manzanita-works/QUALIFICATION.json
            manzanita-works/RELEASE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

      - name: Record the durable branch qualification
        if: success()
        env:
          MATERIALIZATION_PARENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          audit_path = Path('/tmp/mw-convergence/receiver-journey/AUDIT.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          if audit['classification'] != 'PASS_MANZANITA_RECEIVER_JOURNEY_CONVERGED':
              raise SystemExit(f"unexpected audit classification: {audit['classification']}")

          target = Path('programs/manzanita-receiver-journey-convergence')
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(audit_path, target / 'AUDIT.json')
          shutil.copy2('/tmp/mw-convergence/receiver-journey/AUDIT.md', target / 'AUDIT.md')

          qualification = {
              'schema': 'manzanita-works/receiver-journey-qualification@1',
              'campaign': 'MANZANITA_RECEIVER_JOURNEY_CONVERGENCE_V1',
              'state': 'PASS_BRANCH_CANDIDATE_NOT_DEPLOYED',
              'classification': audit['classification'],
              'qualified_at': audit['generated_at'],
              'candidate_branch': 'review/manzanita-receiver-journey-convergence-v1',
              'materialization_parent_sha': audit['materialization_parent_sha'],
              'controlled_source_digest': audit['controlled_source_digest'],
              'controlled_source_files': len(audit['controlled_source_manifest']),
              'surface_releases': {
                  'working_model': '1.2.0',
                  'place_fabric': '1.7.0',
                  'essential_attention': '1.2.2',
                  'operating_fabric': '0.3.0',
              },
              'gates': {
                  'static_contracts': 'PASS',
                  'runtime_syntax': 'PASS',
                  'working_model_browser': 'PASS',
                  'place_fabric_browser_and_visual_floor': 'PASS',
                  'essential_attention_and_mila_browser': 'PASS',
                  'operating_fabric_browser': 'PASS',
                  'whole_receiver_journey': 'PASS',
              },
              'evidence': {
                  'workflow_run_id': int(os.environ['RUN_ID']),
                  'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
                  'artifact_id': int(os.environ['ARTIFACT_ID']),
                  'artifact_url': os.environ['ARTIFACT_URL'],
                  'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                  'screenshots': 18,
              },
              'deployment': {
                  'performed': False,
                  'live_byte_parity': 'NOT_PERFORMED',
                  'live_browser_readback': 'NOT_PERFORMED',
              },
              'authority': {
                  'institutional_acceptance': False,
                  'participant_consent': False,
                  'field_authority': False,
                  'spend_authority': False,
                  'publication_authority': False,
                  'external_effect': 'none',
              },
              'commit_binding': 'The enclosing Git commit contains this qualification and the tested controlled tree. The exact tested bytes are bound by controlled_source_digest; the materialization parent and workflow evidence identify the qualifying transaction.',
              'terminal_condition': 'Branch qualification is complete. Promotion, Pages deployment, live byte parity, and live browser readback remain separate authority and terminal transactions.',
          }
          (target / 'QUALIFICATION.json').write_text(json.dumps(qualification, indent=2) + '\n', encoding='utf-8')
          (target / 'README.md').write_text(
              '# Manzanita Receiver Journey Convergence V1\n\n'
              'This campaign joins the Working Model, Place Fabric, Essential Attention, and Operating Fabric into one receiver path while preserving separate objects, runtimes, evidence ceilings, and authority boundaries. The branch candidate passed each surface contract and the six-route whole-journey audit at desktop, mobile, and 320 CSS pixels with 200 percent root text.\n\n'
              'The qualification proves branch-local behavior and exact controlled bytes. It does not prove deployment, live parity, participant acceptance, institutional adoption, field authority, spending authority, or publication authority. Those remain separate transactions.\n',
              encoding='utf-8',
          )
          PY
          python -m json.tool programs/manzanita-receiver-journey-convergence/QUALIFICATION.json >/dev/null

      - name: Commit the qualified branch candidate
        if: success()
        run: |
          set -euo pipefail
          rm -f tools/patch_mw_convergence.py tools/bump_mw_convergence_versions.py
          rm -f .github/workflows/materialize-manzanita-receiver-journey.yml
          rm -f .github/workflows/export-mw-convergence-source.yml
          git config user.name 'manzanita-receiver-journey-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'manzanita: qualify connected receiver journey v1'
          git push origin HEAD
