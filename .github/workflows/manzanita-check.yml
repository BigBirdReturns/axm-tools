name: Manzanita Works v1.1.2 contract

on:
  push:
    paths:
      - "manzanita/**"
      - "index.html"
      - "README.md"
      - ".github/workflows/manzanita-check.yml"
      - ".github/workflows/manzanita-live-check.yml"
  pull_request:
    paths:
      - "manzanita/**"
      - "index.html"
      - "README.md"
      - ".github/workflows/manzanita-check.yml"
      - ".github/workflows/manzanita-live-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact release bytes and public boundary
        run: python manzanita/tests/public_contract_test.py
      - name: Parse the runtime
        run: node --check manzanita/app.js
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Drive desktop and mobile contract
        run: python manzanita/tests/browser_test.py
