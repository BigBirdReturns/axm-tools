name: Manzanita Works v1.6.0 Photographic Place Fabric contract

on:
  push:
    paths:
      - "manzanita/**"
      - "programs/manzanita-public-convergence/**"
      - "index.html"
      - "README.md"
      - ".github/workflows/manzanita-check.yml"
      - ".github/workflows/manzanita-live-check.yml"
  pull_request:
    paths:
      - "manzanita/**"
      - "programs/manzanita-public-convergence/**"
      - "index.html"
      - "README.md"
      - ".github/workflows/manzanita-check.yml"
      - ".github/workflows/manzanita-live-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact release and visual constitution
        run: python manzanita/tests/public_contract_test.py
      - name: Parse the runtime
        run: |
          node --check manzanita/app.js
          node --check manzanita/theme-init.js
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Drive light, dark, desktop, and mobile contracts
        env:
          MANZANITA_SCREENSHOT_DIR: ${{ runner.temp }}/manzanita-screens
        run: python manzanita/tests/browser_test.py
      - name: Enforce rendered photographic composition and aperture distinction
        run: python programs/manzanita-public-convergence/rendered_visual_floor.py --output ${{ runner.temp }}/manzanita-rendered-visual-floor
      - uses: actions/upload-artifact@v4
        with:
          name: manzanita-place-fabric-v1.6.0-screens
          path: |
            ${{ runner.temp }}/manzanita-screens
            ${{ runner.temp }}/manzanita-rendered-visual-floor
          if-no-files-found: error
          retention-days: 30
