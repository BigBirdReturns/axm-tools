name: Converge organ evolution live census

on:
  push:
    branches:
      - agent/organ-evolution-live-census
    paths:
      - '.github/workflows/converge-organ-live-census.yml'
      - '.organ-live-payload/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/converge-organ-live-census.yml'
      - '.organ-live-payload/**'

permissions:
  contents: write

concurrency:
  group: converge-organ-evolution-live-census
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/organ-evolution-live-census
          fetch-depth: 0
          show-progress: false

      - name: Rehydrate the reviewed observation implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .organ-live-payload/part-* | base64 --decode > "$RUNNER_TEMP/organ-live-census.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/organ-live-census.tar.gz" | cut -d' ' -f1)" = "5efc1928444a33e7d889b1cfd1dd8ede4ebbef7b6f4b07961e7161de5d655c38"
          tar -xzf "$RUNNER_TEMP/organ-live-census.tar.gz"

      - name: Qualify the authority-neutral observer before publication
        shell: bash
        run: |
          set -euo pipefail
          python organ-evolution/scripts/validate.py
          python organ-evolution/scripts/test_observe.py -v
          node --check organ-evolution/observations-view.js
          node --check tests/pages/verify_organ_observations.mjs
          python organ-evolution/scripts/observe.py \
            --sources organ-evolution/data/fixtures/sources.fixture.json \
            --observed organ-evolution/data/fixtures/observed.fixture.json \
            --fixture organ-evolution/data/fixtures/github.fixture.json \
            --now 2026-07-28T00:00:00Z \
            --output "$RUNNER_TEMP/observations.json" \
            --js-output "$RUNNER_TEMP/observations.js"
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path('/home/runner/work/_temp/observations.json').read_text(encoding='utf-8'))
          assert value['format'] == 'axm-organ-observations/1'
          assert value['sourceDigest'] == 'organobs1_60f5cf7fe4911fdeb008c88b04e5f66e2291f9fefd6860ffacfa6be96ad2722e'
          encoded = json.dumps(value)
          for key in ('"decision"', '"candidates"', '"dimensions"', '"gates"', '"health"', '"mandates"', '"interests"'):
              assert key not in encoded, key
          print('PASS: deterministic authority-neutral observation product')
          PY
          git diff --check

      - name: Publish the source implementation and remove its payload carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .organ-live-payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add live estate observations to Organ Evolution'
          git push origin HEAD:agent/organ-evolution-live-census
