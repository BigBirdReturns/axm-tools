name: Reconcile Manzanita review board branch v2

on:
  push:
    branches:
      - agent/manzanita-review-board-027-v2
    paths:
      - ".github/workflows/manzanita-review-board-reconcile2.yml"

permissions:
  contents: write

concurrency:
  group: manzanita-review-board-reconcile-v2
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-review-board-027-v2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile from the latest remote head
        run: |
          git pull --ff-only origin agent/manzanita-review-board-027-v2
          python - <<'PY'
          import json
          from pathlib import Path

          activation_path = Path("programs/manzanita-99/review-board/ACTIVATION_STATE.json")
          activation = json.loads(activation_path.read_text(encoding="utf-8"))
          claim = "constitutional task-count mutation"
          if claim not in activation["prohibited_claims"]:
              activation["prohibited_claims"].append(claim)
          activation_path.write_text(
              json.dumps(activation, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          workflow_path = Path(".github/workflows/manzanita-review-board.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = workflow.replace(
              "          import json\n          from pathlib import Path\n",
              "          import json\n          import os\n          import re\n          from pathlib import Path\n",
          )
          workflow = workflow.replace(
              "          assert receipt[\"reviewed_head\"] == Path(\"/dev/stdin\").read_text() if False else receipt[\"reviewed_head\"]\n",
              "          expected_head = os.environ[\"REVIEW_HEAD_SHA\"]\n          assert re.fullmatch(r\"[0-9a-f]{40}\", expected_head)\n          assert receipt[\"reviewed_head\"] == expected_head\n",
          )
          workflow_path.write_text(workflow, encoding="utf-8")

          for relative in (
              ".github/workflows/manzanita-review-board-bootstrap.yml",
              ".github/workflows/manzanita-review-board-reconcile.yml",
              ".github/workflows/manzanita-review-board-reconcile2.yml",
          ):
              path = Path(relative)
              if path.exists():
                  path.unlink()
          PY

      - name: Prove the reconciled worktree
        run: |
          python -m py_compile programs/manzanita-99/review-board/validate_review_board.py
          python -m unittest discover \
            -s programs/manzanita-99/review-board/tests \
            -p "test_*.py"
          rm -rf programs/manzanita-99/review-board/out
          python programs/manzanita-99/review-board/validate_review_board.py \
            --repo-root . \
            --head 0000000000000000000000000000000000000000 \
            --receipt programs/manzanita-99/review-board/out/BOARD_ACTIVATION_RECEIPT.json
          rm -rf programs/manzanita-99/review-board/out

      - name: Publish the reconciled head
        run: |
          git config user.name "manzanita-review-board-reconcile"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Manzanita: reconcile review board activation controls"
          git push origin HEAD:agent/manzanita-review-board-027-v2
