name: Style Manzanita composite problem gate

on:
  push:
    branches:
      - review/manzanita-working-model-v1-1
    paths:
      - '.github/workflows/manzanita-working-model-problem-gate-style.yml'

permissions:
  contents: write

jobs:
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Add the composite problem-gate styles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('manzanita-working-model/style.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Composite problem gate. */'
          if marker in text:
              raise SystemExit('composite problem-gate styles already present')
          addition = r'''

          /* Composite problem gate. */
          .pilot-form fieldset {
            min-inline-size: 0;
            margin: 0 0 18px;
            padding: 0;
            border: 0;
          }
          .pilot-form legend {
            width: 100%;
            margin: 0 0 8px;
            padding: 0;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .055em;
            text-transform: uppercase;
          }
          .pilot-form legend b { margin-right: 8px; color: var(--green); }
          .problem-fields label { margin-bottom: 12px; }
          .problem-fields label:last-child { margin-bottom: 0; }
          .problem-fields label > span {
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .045em;
            text-transform: uppercase;
          }
          '''
          path.write_text(text + addition, encoding='utf-8')
          PY

      - name: Remove one-shot style controller
        run: rm '.github/workflows/manzanita-working-model-problem-gate-style.yml'

      - name: Commit exact style addition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-review-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'manzanita: style the concrete problem gate'
          git push origin HEAD
