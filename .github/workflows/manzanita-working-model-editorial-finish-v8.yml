name: Finish Manzanita working model public surface

on:
  push:
    branches:
      - fix/manzanita-working-model-editorial-finish-v1
    paths:
      - '.github/workflows/manzanita-working-model-editorial-finish-v8.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final editorial program
        run: python .github/scripts/manzanita_working_model_final_finish.py

      - name: Remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manzanita-working-model-editorial-finish-v6.yml
          rm -f .github/workflows/manzanita-working-model-editorial-finish-v7.yml
          rm -f .github/workflows/manzanita-working-model-editorial-finish-v8.yml
          rm -f .github/scripts/manzanita_working_model_final_finish.py

      - name: Qualify source, behavior, layout, and packet controls
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            manzanita-working-model/tests/public_contract_test.py \
            manzanita-working-model/tests/browser_test.py \
            manzanita-working-model/tests/live_browser_test.py \
            manzanita-working-model/tests/live_readback.py
          node --check manzanita-working-model/app.js
          python manzanita-working-model/tests/public_contract_test.py
          python -m pip install --disable-pip-version-check playwright==1.57.0
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            export MW_CHROMIUM_EXECUTABLE="$browser"
          else
            python -m playwright install --with-deps chromium
          fi
          export MW_WORKING_MODEL_SCREENSHOT_DIR="$RUNNER_TEMP/manzanita-working-model-final-surface"
          python manzanita-working-model/tests/browser_test.py

      - name: Retain exact visual and packet review evidence
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-working-model-final-surface-${{ github.sha }}
          path: ${{ runner.temp }}/manzanita-working-model-final-surface
          if-no-files-found: error
          retention-days: 30

      - name: Commit qualified public surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-editorial-bot'
          git config user.email 'actions@users.noreply.github.com'
          python - <<'PY'
          import subprocess

          required = {
              'manzanita-working-model/WORKING_MODEL_CONTRACT.json',
              'manzanita-working-model/app.js',
              'manzanita-working-model/index.html',
              'manzanita-working-model/tests/browser_test.py',
              'manzanita-working-model/tests/live_browser_test.py',
              'manzanita-working-model/tests/public_contract_test.py',
          }
          allowed = required | {
              '.github/scripts/manzanita_working_model_final_finish.py',
              '.github/workflows/manzanita-working-model-editorial-finish-v6.yml',
              '.github/workflows/manzanita-working-model-editorial-finish-v7.yml',
              '.github/workflows/manzanita-working-model-editorial-finish-v8.yml',
          }
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          observed = {row[3:] for row in rows}
          missing = required - observed
          unexpected = observed - allowed
          if missing or unexpected:
              raise SystemExit(
                  'changed-path gate failed\n'
                  f'missing={sorted(missing)}\n'
                  f'unexpected={sorted(unexpected)}\n'
                  f'observed={sorted(observed)}'
              )
          PY
          git add -A
          git commit -m 'manzanita: finish public working-model surface'
          git push origin HEAD
