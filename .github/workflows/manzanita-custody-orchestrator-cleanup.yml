name: Clean Manzanita custody orchestration carriers

on:
  push:
    branches:
      - agent/manzanita-donor-custody-v2-actual
    paths:
      - ".github/workflows/manzanita-custody-orchestrator-cleanup.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: manzanita-custody-orchestrator-cleanup
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-donor-custody-v2-actual
          fetch-depth: 0
          persist-credentials: true

      - name: Wait until the history branch has been created or the custody branch has terminalized
        run: |
          for attempt in $(seq 1 60)
          do
            git fetch origin agent/manzanita-donor-custody-v2-actual
            git reset --hard origin/agent/manzanita-donor-custody-v2-actual
            if git ls-remote --exit-code --heads origin agent/manzanita-historical-release-census-025 >/dev/null 2>&1
            then
              exit 0
            fi
            if test -f .github/workflows/manzanita-donor-custody-v2.yml
            then
              # The custody object has materialized. Do not retain orchestration carriers
              # merely because the dependent branch was delayed.
              exit 0
            fi
            sleep 10
          done
          exit 0

      - name: Remove temporary orchestration carriers from the custody branch
        run: |
          rm -f \
            .github/workflows/manzanita-history-census-bootstrap.yml \
            .github/workflows/manzanita-history-census-admission-installer.yml \
            .github/workflows/manzanita-custody-orchestrator-cleanup.yml
          git config user.name "manzanita-custody-orchestrator-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A .github/workflows
          if git diff --cached --quiet
          then
            exit 0
          fi
          git commit -m "Manzanita: remove custody orchestration carriers"
          git push origin HEAD:agent/manzanita-donor-custody-v2-actual
