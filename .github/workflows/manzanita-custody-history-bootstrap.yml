name: Bootstrap Manzanita history custody

on:
  push:
    branches:
      - agent/manzanita-custody-history-004
    paths:
      - ".github/bootstrap/manzanita-custody-history-part-*.b64"
      - ".github/workflows/manzanita-custody-history-bootstrap.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/bootstrap/manzanita-custody-history-part-*.b64"
      - ".github/workflows/manzanita-custody-history-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: manzanita-custody-history-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-custody-history-004
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and validate the exact source package
        run: |
          cat .github/bootstrap/manzanita-custody-history-part-00.b64 \
              .github/bootstrap/manzanita-custody-history-part-01.b64 \
              .github/bootstrap/manzanita-custody-history-part-02.b64 \
              > /tmp/manzanita-custody-history.b64
          base64 --decode /tmp/manzanita-custody-history.b64 \
            > /tmp/manzanita-custody-history.tar.gz
          test "$(sha256sum /tmp/manzanita-custody-history.tar.gz | cut -d' ' -f1)" \
            = "5db9b20306efd09a31bb97a11c524126d326a7a93e29c8573ff105ccbfbdeac5"
          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          expected = {
              ".github/workflows/manzanita-custody-history.yml",
              "programs/manzanita-99/custody/history/HISTORY_SWEEP_CONTRACT.json",
              "programs/manzanita-99/custody/history/README.md",
              "programs/manzanita-99/custody/history/history_sweep.py",
              "programs/manzanita-99/custody/history/tests/test_history_sweep.py",
          }
          with tarfile.open("/tmp/manzanita-custody-history.tar.gz", "r:gz") as archive:
              members = archive.getmembers()
              observed = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  normalized = path.as_posix().removeprefix("./")
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive member: {member.name}")
                  if not member.isfile():
                      raise SystemExit(f"Non-regular archive member: {member.name}")
                  if normalized in observed:
                      raise SystemExit(f"Duplicate archive member: {normalized}")
                  observed.add(normalized)
              if observed != expected:
                  raise SystemExit(
                      f"Archive member drift: missing={sorted(expected-observed)} "
                      f"unexpected={sorted(observed-expected)}"
                  )
          PY
          tar -xzf /tmp/manzanita-custody-history.tar.gz -C .

      - name: Prove the materialized source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            programs/manzanita-99/custody/history/history_sweep.py \
            programs/manzanita-99/custody/history/tests/test_history_sweep.py
          python -m json.tool \
            programs/manzanita-99/custody/history/HISTORY_SWEEP_CONTRACT.json \
            > /dev/null
          python -m unittest discover \
            -s programs/manzanita-99/custody/history/tests \
            -p "test_*.py"

      - name: Build exact source artifact and receipt
        env:
          SOURCE_TARBALL_SHA256: 5db9b20306efd09a31bb97a11c524126d326a7a93e29c8573ff105ccbfbdeac5
        run: |
          rm -rf /tmp/manzanita-custody-history-source
          mkdir -p \
            /tmp/manzanita-custody-history-source/.github/workflows \
            /tmp/manzanita-custody-history-source/programs/manzanita-99/custody/history/tests
          cp --preserve=mode,timestamps \
            .github/workflows/manzanita-custody-history.yml \
            /tmp/manzanita-custody-history-source/.github/workflows/
          cp --preserve=mode,timestamps \
            programs/manzanita-99/custody/history/HISTORY_SWEEP_CONTRACT.json \
            programs/manzanita-99/custody/history/README.md \
            programs/manzanita-99/custody/history/history_sweep.py \
            /tmp/manzanita-custody-history-source/programs/manzanita-99/custody/history/
          cp --preserve=mode,timestamps \
            programs/manzanita-99/custody/history/tests/test_history_sweep.py \
            /tmp/manzanita-custody-history-source/programs/manzanita-99/custody/history/tests/
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/manzanita-custody-history-source')
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              payload = path.read_bytes()
              rel = path.relative_to(root).as_posix()
              files.append({
                  'path': rel,
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
                  'git_blob_sha1': hashlib.sha1(
                      f'blob {len(payload)}\0'.encode('ascii') + payload
                  ).hexdigest(),
                  'executable': bool(path.stat().st_mode & 0o111),
              })
          receipt = {
              'schema': 'axm-tools/manzanita-custody-history-source-receipt@1',
              'source_tarball_sha256': os.environ['SOURCE_TARBALL_SHA256'],
              'source_branch': os.environ['GITHUB_HEAD_REF'] or os.environ['GITHUB_REF_NAME'],
              'source_commit': os.environ['GITHUB_SHA'],
              'file_count': len(files),
              'files': files,
              'public_route_effect': 'none',
              'release_authorized': False,
          }
          (root / 'SOURCE_PACKAGE_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          (
            cd /tmp/manzanita-custody-history-source
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS.txt
          )

      - name: Upload exact materialized source
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-custody-history-source
          path: /tmp/manzanita-custody-history-source
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
