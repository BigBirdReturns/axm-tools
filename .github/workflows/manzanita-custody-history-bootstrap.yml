name: Bootstrap Manzanita history custody

on:
  push:
    branches:
      - agent/manzanita-custody-history-004
    paths:
      - ".github/bootstrap/manzanita-custody-history-part-*.b64"
      - ".github/workflows/manzanita-custody-history-bootstrap.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/bootstrap/manzanita-custody-history-part-*.b64"
      - ".github/workflows/manzanita-custody-history-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: manzanita-custody-history-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-custody-history-004
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and validate the exact source package
        run: |
          cat .github/bootstrap/manzanita-custody-history-part-00.b64 \
              .github/bootstrap/manzanita-custody-history-part-01.b64 \
              .github/bootstrap/manzanita-custody-history-part-02.b64 \
              > /tmp/manzanita-custody-history.b64
          base64 --decode /tmp/manzanita-custody-history.b64 \
            > /tmp/manzanita-custody-history.tar.gz
          test "$(sha256sum /tmp/manzanita-custody-history.tar.gz | cut -d' ' -f1)" \
            = "5db9b20306efd09a31bb97a11c524126d326a7a93e29c8573ff105ccbfbdeac5"
          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          expected = {
              ".github/workflows/manzanita-custody-history.yml",
              "programs/manzanita-99/custody/history/HISTORY_SWEEP_CONTRACT.json",
              "programs/manzanita-99/custody/history/README.md",
              "programs/manzanita-99/custody/history/history_sweep.py",
              "programs/manzanita-99/custody/history/tests/test_history_sweep.py",
          }
          with tarfile.open("/tmp/manzanita-custody-history.tar.gz", "r:gz") as archive:
              observed = set()
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  normalized = path.as_posix().removeprefix("./")
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive member: {member.name}")
                  if not member.isfile():
                      raise SystemExit(f"Non-regular archive member: {member.name}")
                  if normalized in observed:
                      raise SystemExit(f"Duplicate archive member: {normalized}")
                  observed.add(normalized)
              if observed != expected:
                  raise SystemExit(
                      f"Archive member drift: missing={sorted(expected-observed)} "
                      f"unexpected={sorted(observed-expected)}"
                  )
          PY
          tar -xzf /tmp/manzanita-custody-history.tar.gz -C .

      - name: Prove the materialized source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            programs/manzanita-99/custody/history/history_sweep.py \
            programs/manzanita-99/custody/history/tests/test_history_sweep.py
          python -m json.tool \
            programs/manzanita-99/custody/history/HISTORY_SWEEP_CONTRACT.json \
            > /dev/null
          python -m unittest discover \
            -s programs/manzanita-99/custody/history/tests \
            -p "test_*.py"

      - name: Sweep every reachable historical Manzanita route tree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          rm -rf programs/manzanita-99/custody/history/out
          python programs/manzanita-99/custody/history/history_sweep.py \
            --repo-root . \
            --contract programs/manzanita-99/custody/history/HISTORY_SWEEP_CONTRACT.json \
            --output programs/manzanita-99/custody/history/out \
            | tee /tmp/manzanita-history-sweep-summary.json

      - name: Materialize exact bytes for every reachable route tree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SOURCE_TARBALL_SHA256: 5db9b20306efd09a31bb97a11c524126d326a7a93e29c8573ff105ccbfbdeac5
        run: |
          rm -rf /tmp/manzanita-route-tree-vault
          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import subprocess
          from pathlib import Path, PurePosixPath

          repo = Path.cwd()
          register_path = repo / 'programs/manzanita-99/custody/history/out/HISTORICAL_RELEASE_REGISTER.json'
          sweep_receipt_path = repo / 'programs/manzanita-99/custody/history/out/HISTORY_SWEEP_RECEIPT.json'
          contract_path = repo / 'programs/manzanita-99/custody/history/HISTORY_SWEEP_CONTRACT.json'
          register = json.loads(register_path.read_text(encoding='utf-8'))
          sweep_receipt = json.loads(sweep_receipt_path.read_text(encoding='utf-8'))

          root = Path('/tmp/manzanita-route-tree-vault')
          blob_root = root / 'blobs' / 'sha1'
          tree_root = root / 'trees'
          view_root = root / 'views'
          evidence_root = root / 'evidence'
          tooling_root = root / 'tooling'
          for directory in (blob_root, tree_root, view_root, evidence_root, tooling_root):
              directory.mkdir(parents=True, exist_ok=True)

          def sha256(payload: bytes) -> str:
              return hashlib.sha256(payload).hexdigest()

          def git_blob_sha1(payload: bytes) -> str:
              return hashlib.sha1(
                  f'blob {len(payload)}\0'.encode('ascii') + payload
              ).hexdigest()

          def clean_path(value: str) -> PurePosixPath:
              path = PurePosixPath(value)
              if not value or path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'Unsafe historical path: {value!r}')
              return path

          unique_blobs = {}
          tree_index = []
          regular_view_files = 0
          symlink_payloads = 0
          total_tree_blob_bytes = 0

          for tree in register['trees']:
              tree_sha = tree['tree_sha']
              manifest_files = []
              for row in tree['files']:
                  if row['object_type'] != 'blob':
                      raise SystemExit(
                          f"Unexpected non-blob in route tree {tree_sha}: {row}"
                      )
                  path = clean_path(row['path'])
                  object_sha = row['object_sha']
                  payload = subprocess.run(
                      ['git', 'cat-file', 'blob', object_sha],
                      cwd=repo,
                      check=True,
                      capture_output=True,
                  ).stdout
                  observed_git_sha = git_blob_sha1(payload)
                  observed_sha256 = sha256(payload)
                  if observed_git_sha != object_sha:
                      raise SystemExit(
                          f'Git blob identity mismatch: {tree_sha}:{path}'
                      )
                  if len(payload) != row['bytes']:
                      raise SystemExit(
                          f'Byte-count mismatch: {tree_sha}:{path}'
                      )
                  if observed_sha256 != row['sha256']:
                      raise SystemExit(
                          f'SHA-256 mismatch: {tree_sha}:{path}'
                      )

                  blob_path = blob_root / object_sha[:2] / object_sha
                  blob_path.parent.mkdir(parents=True, exist_ok=True)
                  if blob_path.exists():
                      if blob_path.read_bytes() != payload:
                          raise SystemExit(f'Conflicting blob vault entry: {object_sha}')
                  else:
                      blob_path.write_bytes(payload)
                      blob_path.chmod(0o444)
                      unique_blobs[object_sha] = {
                          'object_sha': object_sha,
                          'bytes': len(payload),
                          'sha256': observed_sha256,
                          'vault_path': blob_path.relative_to(root).as_posix(),
                      }

                  view_path = None
                  if row['file_kind'] in {'regular_file', 'executable_file'}:
                      destination = view_root / tree_sha / path.as_posix()
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(payload)
                      destination.chmod(
                          0o555 if row['file_kind'] == 'executable_file' else 0o444
                      )
                      view_path = destination.relative_to(root).as_posix()
                      regular_view_files += 1
                  elif row['file_kind'] == 'symbolic_link':
                      destination = (
                          view_root / tree_sha / '__symlink_payloads__' /
                          (path.as_posix().replace('/', '__') + '.txt')
                      )
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(payload)
                      destination.chmod(0o444)
                      view_path = destination.relative_to(root).as_posix()
                      symlink_payloads += 1
                  else:
                      raise SystemExit(
                          f"Unknown file kind {row['file_kind']}: {tree_sha}:{path}"
                      )

                  manifest_files.append({
                      **row,
                      'blob_vault_path': blob_path.relative_to(root).as_posix(),
                      'materialized_view_path': view_path,
                  })
                  total_tree_blob_bytes += len(payload)

              tree_manifest = {
                  'schema': 'axm-tools/manzanita-reachable-route-tree@1',
                  'tree_sha': tree_sha,
                  'classification': tree['classification'],
                  'approval_state': tree['approval_state'],
                  'deployment_state': tree['deployment_state'],
                  'release_claim': tree['release_claim'],
                  'file_count': tree['file_count'],
                  'blob_count': tree['blob_count'],
                  'total_blob_bytes': tree['total_blob_bytes'],
                  'file_manifest_sha256': tree['file_manifest_sha256'],
                  'register_payload_sha256': tree['payload_sha256'],
                  'release_markers': tree['release_markers'],
                  'route_change_commits': tree['route_change_commits'],
                  'reachable_refs': tree['reachable_refs'],
                  'files': manifest_files,
                  'public_effect': 'none',
                  'release_authorized': False,
              }
              manifest_path = tree_root / tree_sha / 'TREE_MANIFEST.json'
              manifest_path.parent.mkdir(parents=True, exist_ok=True)
              manifest_path.write_text(
                  json.dumps(tree_manifest, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )
              manifest_path.chmod(0o444)
              tree_index.append({
                  'tree_sha': tree_sha,
                  'classification': tree['classification'],
                  'declared_release_values': tree['release_markers'].get(
                      'declared_release_values', []
                  ),
                  'file_count': tree['file_count'],
                  'total_blob_bytes': tree['total_blob_bytes'],
                  'reachable_ref_count': len(tree['reachable_refs']),
                  'route_change_commit_count': len(tree['route_change_commits']),
                  'manifest_path': manifest_path.relative_to(root).as_posix(),
                  'view_root': (view_root / tree_sha).relative_to(root).as_posix(),
              })

          for source, destination in (
              (register_path, evidence_root / 'HISTORICAL_RELEASE_REGISTER.json'),
              (sweep_receipt_path, evidence_root / 'HISTORY_SWEEP_RECEIPT.json'),
              (contract_path, evidence_root / 'HISTORY_SWEEP_CONTRACT.json'),
              (repo / 'programs/manzanita-99/custody/history/history_sweep.py', tooling_root / 'history_sweep.py'),
              (repo / 'programs/manzanita-99/custody/history/tests/test_history_sweep.py', tooling_root / 'test_history_sweep.py'),
              (repo / '.github/workflows/manzanita-custody-history.yml', tooling_root / 'manzanita-custody-history.yml'),
          ):
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(source.read_bytes())
              destination.chmod(0o444)

          index = {
              'schema': 'axm-tools/manzanita-reachable-route-tree-index@1',
              'source_tarball_sha256': os.environ['SOURCE_TARBALL_SHA256'],
              'source_commit': os.environ['GITHUB_SHA'],
              'sweep_register_sha256': hashlib.sha256(
                  register_path.read_bytes()
              ).hexdigest(),
              'sweep_receipt_sha256': hashlib.sha256(
                  sweep_receipt_path.read_bytes()
              ).hexdigest(),
              'unique_tree_count': len(tree_index),
              'unique_blob_count': len(unique_blobs),
              'deduplicated_blob_bytes': sum(
                  row['bytes'] for row in unique_blobs.values()
              ),
              'tree_referenced_blob_bytes': total_tree_blob_bytes,
              'regular_view_file_count': regular_view_files,
              'symlink_payload_count': symlink_payloads,
              'route_event_count': register['route_event_count'],
              'route_absent_event_count': register['route_absent_event_count'],
              'reference_count': register['reference_count'],
              'current_guard_tree': register['current_guard_tree'],
              'current_guard_present': register['current_guard_present'],
              'trees': sorted(tree_index, key=lambda row: row['tree_sha']),
              'public_effect': 'none',
              'constitutional_count_effect': 'none',
              'release_authorized': False,
          }
          (root / 'TREE_VAULT_INDEX.json').write_text(
              json.dumps(index, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          receipt = {
              'schema': 'axm-tools/manzanita-route-tree-vault-receipt@1',
              'result': 'PASS',
              'source_commit': os.environ['GITHUB_SHA'],
              'source_tarball_sha256': os.environ['SOURCE_TARBALL_SHA256'],
              'unique_tree_count': index['unique_tree_count'],
              'unique_blob_count': index['unique_blob_count'],
              'deduplicated_blob_bytes': index['deduplicated_blob_bytes'],
              'tree_referenced_blob_bytes': index['tree_referenced_blob_bytes'],
              'regular_view_file_count': regular_view_files,
              'symlink_payload_count': symlink_payloads,
              'current_guard_tree': index['current_guard_tree'],
              'current_guard_present': index['current_guard_present'],
              'sweep_receipt_payload_sha256': sweep_receipt['payload_sha256'],
              'public_effect': 'none',
              'constitutional_count_effect': 'none',
              'release_authorized': False,
              'qualification_boundary': (
                  'This receipt proves exact materialization of every route-tree blob '
                  'identified by the reachable-history sweep. Reachability and exact '
                  'bytes do not establish approval, deployment, public serving, rollback, '
                  'or whole-product release.'
              ),
          }
          receipt['payload_sha256'] = hashlib.sha256(
              json.dumps(
                  receipt,
                  sort_keys=True,
                  separators=(',', ':'),
              ).encode('utf-8')
          ).hexdigest()
          (root / 'TREE_VAULT_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          for path in root.rglob('*'):
              if path.is_file() and path.stat().st_mode & 0o222:
                  path.chmod(0o444)
          PY
          (
            cd /tmp/manzanita-route-tree-vault
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS.txt
          )

      - name: Upload exact reachable route-tree vault
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-reachable-route-tree-vault
          path: /tmp/manzanita-route-tree-vault
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 0
