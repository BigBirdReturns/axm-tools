name: Materialize repaired Manzanita donor custody v2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/manzanita-donor-custody-v2-pr-bootstrap.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: manzanita-donor-custody-v2-pr-bootstrap
  cancel-in-progress: false

jobs:
  materialize-repair-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manzanita-donor-custody-001-v2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover the exact source package and repair generated-candidate coverage
        env:
          EXPECTED_PAYLOAD_SHA256: "abb3ff6942a9c30d134d3d03a19685cccdd63e546d885425c4c13bad4ddb3ebc"
          EXPECTED_PAYLOAD_BYTES: "16197"
        run: |
          cat .github/bootstrap/manzanita-donor-custody-v2.part*.b64 \
            > /tmp/manzanita-donor-custody-v2.tar.gz.b64
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          encoded = ''.join(
              Path('/tmp/manzanita-donor-custody-v2.tar.gz.b64')
              .read_text(encoding='ascii')
              .split()
          )
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != int(os.environ['EXPECTED_PAYLOAD_BYTES']):
              raise SystemExit('Custody payload byte count drifted')
          observed = hashlib.sha256(payload).hexdigest()
          if observed != os.environ['EXPECTED_PAYLOAD_SHA256']:
              raise SystemExit(f'Custody payload digest drifted: {observed}')
          archive = Path('/tmp/manzanita-donor-custody-v2.tar.gz')
          archive.write_bytes(payload)
          allowed_exact = {'.github/workflows/manzanita-donor-custody.yml'}
          allowed_prefix = 'programs/manzanita-99/custody/'
          names = []
          with tarfile.open(archive, 'r:gz') as tf:
              for member in tf.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe member: {member.name}')
                  if not member.isfile():
                      raise SystemExit(f'Non-regular member: {member.name}')
                  name = path.as_posix()
                  if name not in allowed_exact and not name.startswith(allowed_prefix):
                      raise SystemExit(f'Out-of-scope member: {name}')
                  names.append(name)
              if len(names) != 9 or len(names) != len(set(names)):
                  raise SystemExit(f'Unexpected member set: {names}')
              tf.extractall('.', filter='data')

          directory = Path('programs/manzanita-99/custody')
          register_path = directory / 'DONOR_REGISTER.json'
          register = json.loads(register_path.read_text(encoding='utf-8'))
          matches = [
              row for row in register['donors']
              if row.get('id') == 'pr-109-release_control'
          ]
          if len(matches) != 1:
              raise SystemExit('Release-control donor is absent or duplicated')
          donor = matches[0]
          if donor.get('class') != 'qualification_receipt':
              raise SystemExit(
                  f"Unexpected pre-repair class: {donor.get('class')!r}"
              )
          donor['class'] = 'generated_candidate'
          donor['claim_boundary'] = (
              'Portable internal generated candidate and local rollback proof; '
              'release HOLD. The repo retains its source and qualification law, '
              'while exact generated archive custody remains separately bounded '
              'by the open archive and standalone-export gaps.'
          )
          register_path.write_text(
              json.dumps(register, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          test_path = directory / 'tests/test_custody.py'
          text = test_path.read_text(encoding='utf-8')
          anchor = '''    def test_history_audit_distinguishes_trees_from_releases(self):\n'''
          addition = '''    def test_current_release_control_represents_generated_candidate(self):\n        directory = Path(__file__).resolve().parents[1]\n        package_contract = json.loads((directory / "CUSTODY_CONTRACT.json").read_text(encoding="utf-8"))\n        package_register = json.loads((directory / "DONOR_REGISTER.json").read_text(encoding="utf-8"))\n        donor = next(row for row in package_register["donors"] if row["id"] == "pr-109-release_control")\n        self.assertEqual(donor["class"], "generated_candidate")\n        represented = {row["class"] for row in package_register["donors"]}\n        represented.update(row["class"] for row in package_register["gaps"])\n        self.assertEqual(set(package_contract["required_classes"]) - represented, set())\n\n'''
          if 'test_current_release_control_represents_generated_candidate' not in text:
              if anchor not in text:
                  raise SystemExit('Custody test insertion anchor is missing')
              test_path.write_text(
                  text.replace(anchor, addition + anchor, 1),
                  encoding='utf-8',
              )
          print(f'PASS: recovered and repaired source package {observed}')
          PY

      - name: Prove exact public bytes and the complete partial-custody contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          test "$(git hash-object manzanita/QUALIFICATION.json)" = "a3cb3212c22a32b113929e079a331c5f9a9129dd"
          test "$(git hash-object manzanita/README.md)" = "072639fef3188c3524dad0c8cb76255d5033e406"
          test "$(git hash-object manzanita/VISUAL_CONSTITUTION.md)" = "23b3fa62fa8828e2725f6fcb6ec01865c8447d82"
          test "$(git hash-object manzanita/app.js)" = "e6eaac1f737b9a7562cf72bd5787403015089a8f"
          test "$(git hash-object manzanita/index.html)" = "1bede6eaab2618d29b6e66860fcd4a2049f53ae0"
          test "$(git hash-object manzanita/style.css)" = "1dd739faf9de442ee830c546870502437a87b453"
          test "$(git hash-object manzanita/tests/browser_test.py)" = "51eb4ec005fe638d1dbc62180baf7200a037ff71"
          test "$(git hash-object manzanita/tests/public_contract_test.py)" = "a15dd83b7ed48993cea4db1fc8dd0cdbc20e9ff0"
          test "$(git hash-object manzanita/theme-init.js)" = "18fc2f35742a15cc018b049702634934ee2ec2af"
          python -m py_compile \
            programs/manzanita-99/custody/build_custody.py \
            programs/manzanita-99/custody/validate_custody.py \
            programs/manzanita-99/custody/audit_history.py \
            programs/manzanita-99/custody/tests/test_custody.py
          python -m unittest discover \
            -s programs/manzanita-99/custody/tests \
            -p "test_*.py"
          python programs/manzanita-99/custody/build_custody.py \
            --repo-root . \
            --output programs/manzanita-99/custody/CUSTODY_MANIFEST.json
          python programs/manzanita-99/custody/validate_custody.py \
            --repo-root . \
            --manifest programs/manzanita-99/custody/CUSTODY_MANIFEST.json
          python programs/manzanita-99/custody/audit_history.py \
            --repo-root . \
            --output programs/manzanita-99/custody/HISTORY_AUDIT.json

      - name: Remove transport material and seal permanent custody source
        run: |
          rm -f \
            .github/workflows/manzanita-donor-custody-v2-pr-bootstrap.yml \
            .github/workflows/manzanita-donor-custody-v2-bootstrap.yml \
            .github/workflows/manzanita-donor-custody-v2-class-repair.yml \
            .github/bootstrap/manzanita-donor-custody-v2.part01.b64 \
            .github/bootstrap/manzanita-donor-custody-v2.part02.b64 \
            .github/bootstrap/manzanita-donor-custody-v2.part03.b64 \
            .github/bootstrap/manzanita-donor-custody-v2.part04.b64 \
            programs/manzanita-99/custody/CUSTODY_MANIFEST.json \
            programs/manzanita-99/custody/HISTORY_AUDIT.json
          find programs/manzanita-99/custody \
            -type d -name __pycache__ -prune -exec rm -rf {} +
          python - <<'PY'
          import subprocess

          rows = subprocess.run(
              ['git', 'status', '--porcelain'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          paths = []
          for row in rows:
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path)
          allowed_exact = {
              '.github/workflows/manzanita-donor-custody.yml',
              '.github/workflows/manzanita-donor-custody-v2-pr-bootstrap.yml',
              '.github/workflows/manzanita-donor-custody-v2-bootstrap.yml',
              '.github/workflows/manzanita-donor-custody-v2-class-repair.yml',
              '.github/bootstrap/manzanita-donor-custody-v2.part01.b64',
              '.github/bootstrap/manzanita-donor-custody-v2.part02.b64',
              '.github/bootstrap/manzanita-donor-custody-v2.part03.b64',
              '.github/bootstrap/manzanita-donor-custody-v2.part04.b64',
          }
          invalid = [
              path for path in paths
              if path not in allowed_exact
              and not path.startswith('programs/manzanita-99/custody/')
          ]
          if invalid:
              raise SystemExit(f'Out-of-scope source delta: {invalid}')
          if 'manzanita' in paths or any(
              path.startswith('manzanita/') for path in paths
          ):
              raise SystemExit('Historical public route changed')
          print(f'PASS: bounded source delta contains {len(paths)} paths')
          PY
          git config user.name "manzanita-donor-custody-v2-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Manzanita: operate donor custody against the admitted chain"
          git push origin HEAD:agent/manzanita-donor-custody-001-v2
