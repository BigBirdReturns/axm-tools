name: Organ evolution surface

on:
  push:
    paths:
      - 'organ-evolution/**'
      - 'tests/pages/verify_organ_evolution.mjs'
      - '.github/workflows/organ-evolution-check.yml'
      - 'index.html'
      - 'README.md'
      - 'CONTINUITY.md'
  pull_request:
    paths:
      - 'organ-evolution/**'
      - 'tests/pages/verify_organ_evolution.mjs'
      - '.github/workflows/organ-evolution-check.yml'
      - 'index.html'
      - 'README.md'
      - 'CONTINUITY.md'

jobs:
  organ-evolution:
    name: Organ evolution (static + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the model, references, and no-network source boundary
        run: python organ-evolution/scripts/validate.py

      - name: Install disposable browser harness
        run: |
          npm install --no-save playwright@1 >/tmp/organ-evolution-npm.log 2>&1
          npx playwright install --with-deps chromium >/tmp/organ-evolution-browser.log 2>&1

      - name: Drive the real production surface
        run: node tests/pages/verify_organ_evolution.mjs
