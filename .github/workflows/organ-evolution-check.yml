name: Organ evolution surface

on:
  push:
    paths:
      - 'organ-evolution/**'
      - 'tests/pages/verify_organ_evolution.mjs'
      - 'tests/pages/verify_organ_observations.mjs'
      - '.github/workflows/organ-evolution-check.yml'
      - 'index.html'
      - 'README.md'
      - 'CONTINUITY.md'
  pull_request:
    paths:
      - 'organ-evolution/**'
      - 'tests/pages/verify_organ_evolution.mjs'
      - 'tests/pages/verify_organ_observations.mjs'
      - '.github/workflows/organ-evolution-check.yml'
      - 'index.html'
      - 'README.md'
      - 'CONTINUITY.md'

jobs:
  organ-evolution:
    name: Organ evolution (static + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the model, observer, and decision-circulation boundary
        run: |
          set -euo pipefail
          python organ-evolution/scripts/validate.py
          python organ-evolution/scripts/test_observe.py -v
          python organ-evolution/scripts/test_decision_job.py -v
          node --check organ-evolution/decision-job.js
          node --check organ-evolution/decision-circulation-view.js
          node --check organ-evolution/app.js
          node --check tests/pages/verify_organ_evolution.mjs

      - name: Build and independently verify the accepted-decision fixture
        run: |
          set -euo pipefail
          python organ-evolution/scripts/decision_job.py build \
            organ-evolution/data/fixtures/accepted-decision.fixture.json \
            --output "$RUNNER_TEMP/accepted-decision-job.json" \
            | tee "$RUNNER_TEMP/accepted-decision-build.json"
          python organ-evolution/scripts/decision_job.py verify \
            "$RUNNER_TEMP/accepted-decision-job.json" \
            | tee "$RUNNER_TEMP/accepted-decision-verify.json"

      - name: Generate deterministic observation fixture for the browser journey
        run: |
          python organ-evolution/scripts/observe.py \
            --sources organ-evolution/data/fixtures/sources.fixture.json \
            --observed organ-evolution/data/fixtures/observed.fixture.json \
            --fixture organ-evolution/data/fixtures/github.fixture.json \
            --now 2026-07-28T00:00:00Z \
            --output organ-evolution/data/observations.json \
            --js-output organ-evolution/data/observations.js

      - name: Install disposable browser harness
        run: |
          npm install --no-save playwright@1 >"$RUNNER_TEMP/organ-evolution-npm.log" 2>&1
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/organ-evolution-browser-install.log" 2>&1

      - name: Drive the real production surfaces
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node tests/pages/verify_organ_evolution.mjs
            node tests/pages/verify_organ_observations.mjs
          } 2>&1 | tee "$RUNNER_TEMP/organ-evolution-browser.log"

      - name: Upload exact browser and decision-circulation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organ-evolution-qualification
          path: |
            ${{ runner.temp }}/organ-evolution-npm.log
            ${{ runner.temp }}/organ-evolution-browser-install.log
            ${{ runner.temp }}/organ-evolution-browser.log
            ${{ runner.temp }}/accepted-decision-job.json
            ${{ runner.temp }}/accepted-decision-build.json
            ${{ runner.temp }}/accepted-decision-verify.json
            organ-evolution/data/observations.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the browser gate result
        if: steps.browser.outcome != 'success'
        run: exit 1
