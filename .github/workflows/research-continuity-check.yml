name: Research Continuity qualification
on:
  push:
    paths: ['research-continuity/**', '.github/workflows/research-continuity-check.yml']
  pull_request:
    paths: ['research-continuity/**', '.github/workflows/research-continuity-check.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source, published custody boundary and complete runnable kit
        run: python research-continuity/scripts/validate.py
      - name: Native journal, judgment, discharge, measurement and reuse tests
        run: node --test research-continuity/tests/*.test.cjs
      - name: Install isolated test-only browser tooling
        run: |
          python -m pip install playwright==1.64.1
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
      - name: Existing research and measurement journeys remain usable
        env:
          TEST_CHROME: /opt/google/chrome/chrome
          TMPDIR: ${{ runner.temp }}
          EVIDENCE_DIR: ${{ runner.temp }}/research-continuity-browser/research
        run: python research-continuity/tests/browser.py
      - name: Exercise actual retained judgment and cold successor handoff
        env:
          TEST_CHROME: /opt/google/chrome/chrome
          TMPDIR: ${{ runner.temp }}
          EVIDENCE_DIR: ${{ runner.temp }}/research-continuity-browser/judgment
        run: python research-continuity/tests/judgment_browser.py
      - name: Install the exact existing Genesis kernel in a separate test environment
        run: |
          python -m venv "${{ runner.temp }}/genesis-env"
          "${{ runner.temp }}/genesis-env/bin/python" -m pip install 'axm-genesis[mldsa-compat] @ git+https://github.com/BigBirdReturns/axm-genesis.git@5fcd472d6119afc0e9bb80ffc91f9ccc8adde705'
      - name: Compile and consume real Genesis origin and amendment in separate processes
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          "${{ runner.temp }}/genesis-env/bin/python" -B research-continuity/tests/genesis_roundtrip.py --out "${{ runner.temp }}/research-continuity-browser/genesis"
      - name: Keep all observed verification and browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-judgment-complete-qualification
          path: ${{ runner.temp }}/research-continuity-browser
          if-no-files-found: warn
          retention-days: 90
