name: Repair AXM Witness 0.9.2 patcher anchor

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/axm-witness-theme-patcher-repair.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace the brittle CSP literal with a bounded regex anchor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/patch_axm_witness_theme_092.py')
          text = path.read_text(encoding='utf-8')
          if '\nimport re\n' not in text:
              text = text.replace('\nimport json\n', '\nimport json\nimport re\n', 1)

          lines = text.splitlines()
          start = next((i for i, line in enumerate(lines) if line.lstrip().startswith("csp = '<meta http-equiv=\"Content-Security-Policy\"")), None)
          if start is not None:
              if start + 1 >= len(lines) or 'replace_once(text, csp,' not in lines[start + 1]:
                  raise SystemExit('CSP replacement statement was not adjacent to the literal')
              replacement = [
                  '        csp_pattern = r\'(<meta http-equiv="Content-Security-Policy"[^>]*>)\'',
                  '        text, csp_count = re.subn(csp_pattern, lambda match: match.group(1) + "\\n" + THEME_BOOT, text, count=1)',
                  '        if csp_count != 1:',
                  '            raise SystemExit(f"theme boot insertion: expected one CSP meta element, found {csp_count}")',
              ]
              lines[start:start + 2] = replacement
              text = '\n'.join(lines) + '\n'
          elif 'csp_pattern = r\'(<meta http-equiv="Content-Security-Policy"[^>]*>)\'' not in text:
              raise SystemExit('Neither the brittle nor repaired CSP anchor was found')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python -m py_compile .github/scripts/patch_axm_witness_theme_092.py
          rm .github/workflows/axm-witness-theme-patcher-repair.yml

      - name: Commit the repaired materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'axm-witness-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'axm-witness: repair bounded CSP insertion anchor'
          git push origin HEAD:${{ github.head_ref }}
