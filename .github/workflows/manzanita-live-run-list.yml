name: Manzanita live-run observer

on:
  push:
    branches: [agent/manzanita-convergence-observer-v2]
    paths:
      - ".github/workflows/manzanita-live-run-list.yml"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish recent permanent live-gate runs
        run: |
          set -euo pipefail
          gh run list --repo "$GH_REPO" \
            --workflow manzanita-live-check.yml \
            --limit 10 \
            --json databaseId,name,status,conclusion,headBranch,headSha,event,createdAt,updatedAt,url \
            > /tmp/runs.json
          {
            echo 'Recent Manzanita v1.6.0 live-gate runs:'
            echo
            echo '```json'
            jq . /tmp/runs.json
            echo '```'
          } > /tmp/comment.md
          gh pr comment 117 --repo "$GH_REPO" --body-file /tmp/comment.md
