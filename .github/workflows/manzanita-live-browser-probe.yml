name: Manzanita Works v1.4.1 one-shot live browser proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manzanita-live-browser-probe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MANZANITA_BASE_URL: https://bigbirdreturns.github.io/axm-tools/manzanita
      MANZANITA_URL: https://bigbirdreturns.github.io/axm-tools/manzanita/?v=${{ github.sha }}
      OBSERVATION_TRIGGER_SHA: ${{ github.sha }}
      EVIDENCE_BRANCH: evidence/manzanita-live
      MANZANITA_SCREENSHOT_DIR: ${{ runner.temp }}/manzanita-live-browser-screens
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p /tmp/manzanita-live-browser
          {
            python -m pip install --disable-pip-version-check playwright==1.57.0
            python -m playwright install --with-deps chromium
          } 2>&1 | tee /tmp/manzanita-live-browser/install.log

      - name: Verify exact public bytes
        id: exact
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/manzanita-live-browser
          cp .github/pages-deployment.json /tmp/manzanita-live-browser/pages-deployment.json
          exec > >(tee /tmp/manzanita-live-browser/exact.log) 2>&1

          for attempt in $(seq 1 18); do
            code=$(curl -L -sS \
              -o /tmp/manzanita-live-browser/index.html \
              -w '%{http_code}' \
              "$MANZANITA_URL" || true)
            if [ "$code" = "200" ] \
              && grep -q 'data-release="1.4.1"' /tmp/manzanita-live-browser/index.html \
              && grep -q 'data-visual-system="signal-sheet"' /tmp/manzanita-live-browser/index.html; then
              break
            fi
            if [ "$attempt" = "18" ]; then
              echo "Public endpoint failed release marker gate: HTTP $code"
              head -100 /tmp/manzanita-live-browser/index.html || true
              exit 1
            fi
            sleep 5
          done

          for path in style.css app.js theme-init.js; do
            curl -L -f -sS \
              "$MANZANITA_BASE_URL/$path?v=$OBSERVATION_TRIGGER_SHA" \
              -o "/tmp/manzanita-live-browser/$path"
          done

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/manzanita-live-browser")
          qualification = json.loads(Path("manzanita/QUALIFICATION.json").read_text())
          observed = {}
          for path in ("index.html", "style.css", "app.js", "theme-init.js"):
              payload = (root / path).read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              expected = qualification["files"][path]
              if len(payload) != expected["bytes"] or digest != expected["sha256"]:
                  raise SystemExit(
                      f"live byte mismatch for {path}: "
                      f"observed=({len(payload)}, {digest}) "
                      f"expected=({expected['bytes']}, {expected['sha256']})"
                  )
              observed[path] = {"bytes": len(payload), "sha256": digest}

          Path("/tmp/manzanita-live-browser/files.json").write_text(
              json.dumps(observed, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Drive the live endpoint
        id: browser
        if: steps.install.outcome == 'success' && steps.exact.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python manzanita/tests/browser_test.py 2>&1 \
            | tee /tmp/manzanita-live-browser/browser.log

      - name: Retain live screenshots
        id: upload
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-signal-sheet-v1.4.1-one-shot-live-browser-screens
          path: ${{ runner.temp }}/manzanita-live-browser-screens
          if-no-files-found: error
          retention-days: 30

      - name: Retain the live browser observation
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          EXACT_OUTCOME: ${{ steps.exact.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          PROBE_RUN_ID: ${{ github.run_id }}
          PROBE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git fetch origin "$EVIDENCE_BRANCH"
          git switch -C "$EVIDENCE_BRANCH" "origin/$EVIDENCE_BRANCH"

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def tail(path: str, limit: int = 12000) -> str:
              target = Path(path)
              if not target.exists():
                  return ""
              return target.read_text(encoding="utf-8", errors="replace")[-limit:]

          outcomes = {
              "install": os.environ["INSTALL_OUTCOME"],
              "exact_file_gate": os.environ["EXACT_OUTCOME"],
              "browser_contract": os.environ["BROWSER_OUTCOME"],
              "screenshot_retention": os.environ["UPLOAD_OUTCOME"],
          }
          passed = all(value == "success" for value in outcomes.values())
          files_path = Path("/tmp/manzanita-live-browser/files.json")
          pages_path = Path("/tmp/manzanita-live-browser/pages-deployment.json")
          receipt = {
              "schema": "manzanita-works/live-browser-observation@1",
              "release": "1.4.1",
              "release_class": "public_maintenance_patch",
              "state": "PASS" if passed else "FAIL",
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "public_route": os.environ["MANZANITA_BASE_URL"] + "/",
              "observation_trigger_sha": os.environ["OBSERVATION_TRIGGER_SHA"],
              "probe": {
                  "workflow_run_id": int(os.environ["PROBE_RUN_ID"]),
                  "run_attempt": int(os.environ["PROBE_RUN_ATTEMPT"]),
                  "release_marker": "1.4.1",
                  "visual_system_marker": "signal-sheet",
                  "outcomes": outcomes,
              },
              "pages_deployment_receipt_at_observation": (
                  json.loads(pages_path.read_text()) if pages_path.exists() else {}
              ),
              "files": json.loads(files_path.read_text()) if files_path.exists() else {},
              "failure_receipts": {
                  "install_tail": tail("/tmp/manzanita-live-browser/install.log") if outcomes["install"] != "success" else "",
                  "exact_file_tail": tail("/tmp/manzanita-live-browser/exact.log") if outcomes["exact_file_gate"] != "success" else "",
                  "browser_tail": tail("/tmp/manzanita-live-browser/browser.log") if outcomes["browser_contract"] != "success" else "",
              },
              "authority": {
                  "successor_program_effect": "none",
                  "external_campaign_effect": "none",
                  "canonical_task_count_effect": "none",
              },
          }
          target = Path(".github/manzanita-live-receipts") / f"browser-{os.environ['OBSERVATION_TRIGGER_SHA']}.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          Path("/tmp/manzanita-live-browser/receipt-state.txt").write_text(receipt["state"] + "\n")
          PY

          target=".github/manzanita-live-receipts/browser-$OBSERVATION_TRIGGER_SHA.json"
          git config user.name "manzanita-live-browser-proof"
          git config user.email "actions@users.noreply.github.com"
          git add "$target"
          git diff --cached --check
          git commit -m "Manzanita: retain live browser observation $OBSERVATION_TRIGGER_SHA"
          git push origin "HEAD:$EVIDENCE_BRANCH"

      - name: Enforce the retained observation
        if: always()
        run: test "$(cat /tmp/manzanita-live-browser/receipt-state.txt)" = "PASS"
