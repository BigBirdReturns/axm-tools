name: Fix Essential Attention mobile receipt wrapping

on:
  push:
    branches:
      - agent/essential-attention-onboarding
    paths:
      - .github/workflows/essential-attention-mobile-receipt-fix.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make receipts and hashes wrap inside the mobile floor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("essential-attention/index.html")
          source = path.read_text(encoding="utf-8")

          old_fine = ".muted{color:var(--muted)}.fine{font-size:.79rem;color:var(--muted)}"
          new_fine = ".muted{color:var(--muted)}.fine{font-size:.79rem;color:var(--muted);overflow-wrap:anywhere;word-break:break-word}"
          if old_fine not in source:
              raise SystemExit("fine-text CSS seam not found")
          source = source.replace(old_fine, new_fine, 1)

          old_receipts = ".receipt-list,.draft-list,.queue-list{display:grid;gap:9px}.receipt,.draft,.queue-item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}.receipt-head,.draft-head,.queue-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.receipt code,.draft code{font-size:.74rem;color:var(--muted)}"
          new_receipts = ".receipt-list,.draft-list,.queue-list{display:grid;gap:9px;min-width:0}.receipt,.draft,.queue-item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;min-width:0}.receipt-head,.draft-head,.queue-head{display:flex;justify-content:space-between;gap:12px;align-items:start;min-width:0}.receipt-head>div,.draft-head>div,.queue-head>div{min-width:0}.receipt code,.draft code{font-size:.74rem;color:var(--muted)}"
          if old_receipts not in source:
              raise SystemExit("receipt CSS seam not found")
          source = source.replace(old_receipts, new_receipts, 1)

          old_meta = ".meta span{font-size:.75rem;background:var(--panel-2);border:1px solid #ddd5c7;border-radius:999px;padding:.28rem .48rem;color:var(--muted)}"
          new_meta = ".meta span{font-size:.75rem;background:var(--panel-2);border:1px solid #ddd5c7;border-radius:999px;padding:.28rem .48rem;color:var(--muted);overflow-wrap:anywhere;word-break:break-word;max-width:100%}"
          if old_meta not in source:
              raise SystemExit("metadata CSS seam not found")
          source = source.replace(old_meta, new_meta, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Rebuild the qualification receipt
        run: |
          python essential-attention/tests/public_contract_test.py
          node --check /tmp/essential-attention-inline.js

      - name: Commit the mobile repair
        run: |
          git config user.name "essential-attention-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add essential-attention/index.html essential-attention/QUALIFICATION.json
          git diff --cached --check
          git commit -m "essential-attention: contain mobile receipt hashes"
          git push origin HEAD:agent/essential-attention-onboarding
