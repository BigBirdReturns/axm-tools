name: Finish Manzanita working model editorial surface

on:
  push:
    branches:
      - fix/manzanita-working-model-editorial-finish-v1
    paths:
      - '.github/workflows/manzanita-working-model-editorial-finish-v1.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove visual and editorial residue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          ROOT = Path('manzanita-working-model')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact match, observed {count}')
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f'{label}: expected one structural match, observed {count}')
              return updated

          # Public HTML: remove repeated explanatory layers, eliminate public jargon,
          # and replace every generic proof tile with an operational instrument.
          index_path = ROOT / 'index.html'
          html = index_path.read_text(encoding='utf-8')
          html = replace_once(html, '<html lang="en" data-theme="light">', '<html lang="en">', 'html theme attribute')
          html = replace_once(html, '<meta name="color-scheme" content="light dark">', '<meta name="color-scheme" content="light">', 'color scheme')
          html = replace_once(html, '<span><b>Manzanita Works</b><small>Working model · public-safe</small></span>', '<span><b>Manzanita Works</b><small>Case-to-pilot working model</small></span>', 'brand subtitle')
          html = replace_once(
              html,
              '''    <nav class="topnav" aria-label="Primary">
                <a href="#run">Run one case</a>
                <a href="#ready">What exists</a>
                <a href="#unlock">What unlocks a pilot</a>
                <button id="theme" class="quiet-button" type="button" aria-label="Toggle light and dark theme">Theme</button>
              </nav>''',
              '''    <nav class="topnav" aria-label="Primary">
                <a href="#run">Run a case</a>
                <a href="#ready">Existing system</a>
                <a href="#unlock">Pilot gates</a>
              </nav>''',
              'primary navigation',
          )
          replacements = {
              '<p class="eyebrow">Not another architecture review</p>': '<p class="eyebrow">Start with one accountable case</p>',
              'This is the front door to the system that already exists. Pick a concrete community problem and it shows what evidence matters, who has authority, what can happen safely, what stays held, and how the work survives the next handoff.': 'Choose one concrete community problem. The model exposes the evidence, authority, safe action, fallback, closure, and handoff required to move it without inventing consent or assigning invisible labor.',
              'Run a representative case': 'Run a case',
              'See the five pilot decisions': 'See the pilot gates',
              '<strong>Silence is not consent, assignment, rejection, or completion.</strong>': '<strong>Silence creates no consent, assignment, rejection, or completion.</strong>',
              '<span>An unanswered offer stays unresolved. No person becomes the runtime by default.</span>': '<span>An unanswered offer remains unresolved.</span>',
              '<span class="console-kicker">Working case · N=0</span>': '<span class="console-kicker">Prepared example · no active case</span>',
              '<strong>MW-CASE-000</strong>': '<strong>MW-DEMO-001</strong>',
              '<p class="eyebrow">Start with the thing, not the platform</p>': '<p class="eyebrow">Four cases, one operating discipline</p>',
              '<h2>Run one case through the model</h2>': '<h2>Run one case</h2>',
              'These are ordinary examples of the same administrative transformation. The domain changes. Source custody, authority, safe action, fallback, closure, and continuity do not.': 'The domain changes. The control structure does not: source, authority, safe action, fallback, closure, and learning.',
              '<p class="eyebrow">Already built, separately governed</p>': '<p class="eyebrow">Open only what the case requires</p>',
              '<h2>The pieces are real. This page is the compression layer.</h2>': '<h2>The system is already built.</h2>',
              'The existing surfaces remain independently useful and independently bounded. The working model does not replace them. It gives a normal person a reason to open the right one.': 'The working model routes one case to the right surface. A decision-maker does not need to review the whole architecture first.',
              '<p class="eyebrow">The actual organizational ask</p>': '<p class="eyebrow">What a pilot actually requires</p>',
              '<h2>Five decisions turn an N=0 working model into one bounded pilot.</h2>': '<h2>Five decisions make one bounded pilot possible.</h2>',
              'No one has to approve the architecture. A pilot starts only when a specific problem has an owner, operating capacity, authority boundary, and stop condition.': 'A pilot begins when one problem has an accountable sponsor, a funded operator, an execution basis, an authority boundary, and a stop condition.',
              '<p class="eyebrow">If leadership returns tomorrow</p>': '<p class="eyebrow">When leadership returns</p>',
              '<h2 id="return-title">Do not schedule a scoping call. Produce one pilot packet.</h2>': '<h2 id="return-title">Produce one pilot packet, not another scoping cycle.</h2>',
              'Choose the problem, identify the organization-owned seats, state what exists, and preserve every blank as a blank. The packet is local preparation only. Exporting it does not contact anyone, accept anything, schedule anything, or bind the organization.': 'Choose the problem, name the organization-owned seats, state what exists, and preserve every unresolved gate. Exporting the packet contacts nobody and grants no authority.',
              'placeholder="Unresolved until named"': 'placeholder="Name unresolved"',
              'placeholder="Unresolved until assigned and funded"': 'placeholder="Operator and funding unresolved"',
              'placeholder="Unresolved until bounded"': 'placeholder="Venue unresolved"',
              'placeholder="Unresolved until committed"': 'placeholder="Resources unresolved"',
              '<p class="eyebrow">The state we are driving toward</p>': '<p class="eyebrow">The durable operating state</p>',
              '<h2>A return should be an input event, not a rescue event.</h2>': '<h2>A return moves one case forward. It does not restart the explanation.</h2>',
              '<div><span>Technical system</span><b>Already substantial</b></div>': '<div><span>Technical system</span><b>Ready for bounded use</b></div>',
              '<div><span>Working-model front door</span><b>Released public-safe route</b></div>': '<div><span>Working-model front door</span><b>Live</b></div>',
              '<div><span>Institutional adoption</span><b>Not inferred</b></div>': '<div><span>Institutional adoption</span><b>Unresolved</b></div>',
              '<div><span>Field authority</span><b>Held until supplied</b></div>': '<div><span>Field authority</span><b>Held</b></div>',
              '<div><span>Next external effect</span><b>None by default</b></div>': '<div><span>Next external effect</span><b>None</b></div>',
              'Public-safe photographic place, seven apertures, eight conditions, five seats, source state, action, acceptance, and handoff.': 'Source-state place model across seven apertures, eight conditions, five seats, safe action, acceptance, and handoff.',
              '<div><b>Manzanita Works · Working Model</b><span>Public-safe v1.0.0. No institutional acceptance is implied.</span></div>': '<div><b>Manzanita Works · Working Model</b><span>Preparation only. No institutional acceptance implied.</span></div>',
          }
          for old, new in replacements.items():
              html = replace_once(html, old, new, old[:60])

          html = sub_once(
              html,
              r'\n    <section class="compression-band" aria-label="The operating grammar">.*?</section>\n',
              '\n',
              'duplicate operating grammar band',
          )
          html = sub_once(
              html,
              r'\n    <section class="section-shell capacity-section" aria-labelledby="capacity-title">.*?</section>\n',
              '\n',
              'capacity exposition section',
          )

          proof_grid = '''      <div class="proof-grid">
                <a class="proof-card instrument-card" href="../manzanita/">
                  <div class="proof-instrument place-instrument" aria-hidden="true">
                    <div class="instrument-top"><span>Place Fabric</span><b>07 scales</b></div>
                    <ol class="place-stack">
                      <li><span>01</span><strong>Household</strong><i>Lived</i></li>
                      <li><span>02</span><strong>Property</strong><i>Reference</i></li>
                      <li><span>03</span><strong>Street</strong><i>Map</i></li>
                      <li><span>04</span><strong>Neighborhood</strong><i>Cached</i></li>
                      <li><span>05</span><strong>City</strong><i>Public</i></li>
                      <li><span>06</span><strong>Region</strong><i>Public</i></li>
                      <li><span>07</span><strong>Hazard</strong><i>Held</i></li>
                    </ol>
                    <div class="instrument-foot"><span>No score</span><span>No adverse use</span></div>
                  </div>
                  <div class="proof-copy">
                    <p class="proof-state">Public · released projection</p>
                    <h3>Place Fabric</h3>
                    <p>Seven scales over one demonstration place, eight conditions, five operating seats, source states, safe actions, acceptance, and handoff.</p>
                    <span>Open the place →</span>
                  </div>
                </a>

                <a class="proof-card instrument-card" href="../essential-attention/">
                  <div class="proof-instrument attention-instrument" aria-hidden="true">
                    <div class="instrument-top"><span>Essential Attention</span><b>Case ledger</b></div>
                    <ol class="attention-stack">
                      <li><span>Source</span><strong>Bound</strong><i>01</i></li>
                      <li><span>Decision</span><strong>Open</strong><i>02</i></li>
                      <li><span>Effect</span><strong>Held</strong><i>03</i></li>
                      <li><span>Receipt</span><strong>Ready</strong><i>04</i></li>
                      <li><span>Handoff</span><strong>Portable</strong><i>05</i></li>
                    </ol>
                    <div class="instrument-foot"><span>Local-first</span><span>0 participant records</span></div>
                  </div>
                  <div class="proof-copy">
                    <p class="proof-state">Local-first · administrative runtime</p>
                    <h3>Essential Attention</h3>
                    <p>A working case file for source, interpretation, decisions, effect boundaries, receipts, replay, and cold handoff without silently assigning a person.</p>
                    <span>Open the operating desk →</span>
                  </div>
                </a>

                <a class="proof-card instrument-card" href="../manzanita-works/">
                  <div class="proof-instrument fabric-instrument" aria-hidden="true">
                    <div class="instrument-top"><span>Operating Fabric</span><b>06 organs</b></div>
                    <div class="organ-grid">
                      <span>People</span><span>Place</span><span>Capacity</span>
                      <span>Decisions</span><span>Vendors</span><span>Continuity</span>
                    </div>
                    <div class="instrument-foot"><span>Vendors replaceable</span><span>Record organization-owned</span></div>
                  </div>
                  <div class="proof-copy">
                    <p class="proof-state">Architecture · advanced view</p>
                    <h3>Operating Fabric</h3>
                    <p>The deeper map of program organs, capacity classes, vendor boundaries, shared institutional substrate, and what must remain organization-owned.</p>
                    <span>Open the architecture index →</span>
                  </div>
                </a>

                <article class="proof-card instrument-card no-link">
                  <div class="proof-instrument glide-instrument" aria-hidden="true">
                    <div class="instrument-top"><span>Street Glide</span><b>Source order</b></div>
                    <ol class="source-chain">
                      <li class="is-source"><b>01</b><span>Reference</span><i>First</i></li>
                      <li><b>02</b><span>Cached</span><i>Fallback</i></li>
                      <li><b>03</b><span>Map-only</span><i>Honest</i></li>
                      <li class="is-held"><b>04</b><span>Held</span><i>Stop</i></li>
                    </ol>
                    <div class="role-strip"><span>Resident</span><span>Grower</span><span>Crew</span><span>Planner</span><span>Successor</span></div>
                    <div class="instrument-foot"><span>No feature claim</span><span>No adverse use</span></div>
                  </div>
                  <div class="proof-copy">
                    <p class="proof-state">Internal · bounded kernel</p>
                    <h3>Street Glide + role projections</h3>
                    <p>Provider fallback, map-only honesty, image registration proposals, five genuinely different functional seats, and explicit adverse-action prohibitions.</p>
                    <span>Held behind its own authority gates</span>
                  </div>
                </article>
              </div>'''
          html = sub_once(
              html,
              r'      <div class="proof-grid">.*?      </div>\n    </section>\n\n    <section class="rules-section">',
              proof_grid + '\n    </section>\n\n    <section class="rules-section">',
              'proof grid',
          )

          rules = '''    <section class="rules-section">
                <div class="section-shell">
                  <div class="section-heading inverse-heading">
                    <p class="eyebrow">Every case carries the same boundaries</p>
                    <h2>Five rules bound the work.</h2>
                  </div>
                  <div class="rules-grid">
                    <article><span>01</span><h3>Visibility grants no authority.</h3><p>Seeing evidence or preparing a packet grants no entry, spend, work, publication, representation, eligibility, or release authority.</p></article>
                    <article><span>02</span><h3>Help cannot become adverse standing.</h3><p>Evidence collected to assist cannot silently become insurance, enforcement, eligibility, property, resident, or punitive scoring.</p></article>
                    <article><span>03</span><h3>People retain authorship.</h3><p>Affected participants retain correction, refusal, narrowing, deferral, acceptance, and appeal where applicable.</p></article>
                    <article><span>04</span><h3>Vendors perform jobs. They do not own the model.</h3><p>A replaceable service cannot become the canonical institutional record by convenience.</p></article>
                    <article><span>05</span><h3>Continuity survives the original person.</h3><p>Offers, decisions, sources, holds, and handoffs must remain replayable after the founder, volunteer, operator, or builder leaves.</p></article>
                  </div>
                </div>
              </section>'''
          html = sub_once(
              html,
              r'    <section class="rules-section">.*?</section>\n\n    <section id="unlock"',
              rules + '\n\n    <section id="unlock"',
              'rules section',
          )

          prohibited_visible = [
              'N=0', 'compression-band', 'capacity-section', 'proof-symbol',
              'id="theme"', 'data-theme=', 'assets/property.webp', 'assets/household.webp'
          ]
          leftovers = [token for token in prohibited_visible if token in html]
          if leftovers:
              raise SystemExit(f'visible residue remains: {leftovers}')
          if html.count('class="proof-instrument') != 4:
              raise SystemExit('expected four operational proof instruments')
          index_path.write_text(html, encoding='utf-8')

          # Script: remove the theme subsystem and replace internal runtime rhetoric.
          app_path = ROOT / 'app.js'
          js = app_path.read_text(encoding='utf-8')
          js = replace_once(js, "  const THEME_KEY = 'mw-working-model-theme';\n", '', 'theme storage key')
          js = sub_once(
              js,
              r'\n  const themeButton = byId\(\'theme\'\);.*?\n  function scenarioFromHash\(\)',
              '\n  function scenarioFromHash()',
              'theme subsystem',
          )
          js = replace_once(js, '  applyTheme(initialTheme());\n', '', 'theme initialization')
          js = replace_once(
              js,
              'No founder, advisor, volunteer, operator, or builder becomes the runtime by default.',
              'No founder, advisor, volunteer, operator, or builder becomes the default operator.',
              'packet continuity rhetoric',
          )
          if 'THEME_KEY' in js or "byId('theme')" in js or 'applyTheme' in js:
              raise SystemExit('theme residue remains in application script')
          app_path.write_text(js, encoding='utf-8')

          # CSS: establish one authored visual mode, make the skip link truly latent,
          # tighten vertical rhythm, and qualify the three new evidence instruments.
          css_path = ROOT / 'style.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Editorial finish: one authored surface, no ornamental residue. */'
          if marker in css:
              raise SystemExit('editorial finish CSS already present')
          css += r'''

          /* Editorial finish: one authored surface, no ornamental residue. */
          html { color-scheme: light; }
          .skip {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
            transform: none;
          }
          .skip:focus-visible {
            position: fixed;
            top: 8px;
            left: 8px;
            width: auto;
            height: auto;
            padding: 10px 14px;
            margin: 0;
            overflow: visible;
            clip: auto;
            clip-path: none;
            white-space: normal;
            border: 2px solid var(--void);
            transform: none;
          }
          .hero {
            min-height: 0;
            padding-block: clamp(52px, 6.5vw, 94px);
          }
          .run-section,
          .ready-section,
          .unlock-section,
          .return-section,
          .handoff-section {
            padding-block: clamp(76px, 7.5vw, 116px);
          }
          .ready-section { padding-top: clamp(88px, 8vw, 128px); }
          .proof-card { min-height: 320px; }
          .proof-copy h3 { font-size: clamp(27px, 2.6vw, 42px); }
          .proof-instrument { min-width: 0; }

          .attention-stack,
          .source-chain {
            list-style: none;
            padding: 0;
            margin: 14px 0;
            border-top: 1px solid var(--void-line);
          }
          .attention-stack li,
          .source-chain li {
            min-width: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto 28px;
            align-items: center;
            gap: 9px;
            padding: 10px 0;
            border-bottom: 1px solid var(--void-line);
          }
          .attention-stack span,
          .source-chain span {
            min-width: 0;
            font: 800 12px/1 var(--display);
            text-transform: uppercase;
            overflow-wrap: anywhere;
          }
          .attention-stack strong {
            padding: 4px 6px;
            border: 1px solid rgba(200, 202, 154, .34);
            color: #c8ca9a;
            font: 700 7px/1 var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase;
          }
          .attention-stack i,
          .source-chain b {
            color: #858273;
            font: normal 7px/1 var(--mono);
            text-align: right;
          }
          .organ-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1px;
            margin: 15px 0;
            background: var(--void-line);
            border: 1px solid var(--void-line);
          }
          .organ-grid span {
            min-width: 0;
            min-height: 58px;
            display: flex;
            align-items: flex-end;
            padding: 11px;
            background: color-mix(in srgb, var(--void) 94%, var(--olive));
            font: 800 13px/1 var(--display);
            text-transform: uppercase;
            overflow-wrap: anywhere;
          }
          .source-chain li {
            grid-template-columns: 28px minmax(0, 1fr) auto;
          }
          .source-chain b { text-align: left; }
          .source-chain i {
            padding: 4px 5px;
            border: 1px solid rgba(236, 231, 216, .18);
            color: #b9b5a7;
            font: normal 700 7px/1 var(--mono);
            text-transform: uppercase;
          }
          .source-chain .is-source i { border-color: rgba(200, 202, 154, .45); color: #c8ca9a; }
          .source-chain .is-held i { border-color: rgba(183, 71, 45, .55); color: #dc876f; }
          .role-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 2px 0 14px;
          }
          .role-strip span {
            padding: 5px 6px;
            border: 1px solid var(--void-line);
            color: #b9b5a7;
            font: 700 7px/1 var(--mono);
            letter-spacing: .05em;
            text-transform: uppercase;
          }
          .rules-section { padding-block: clamp(72px, 7vw, 110px); }
          .rules-grid article { min-height: 220px; padding: 22px; }
          .rules-grid h3 { margin: 24px 0 12px; font-size: 21px; }
          .decision-list li { min-height: 116px; }
          .return-section { gap: clamp(38px, 7vw, 96px); }
          .handoff-box { gap: 44px; }

          @media (max-width: 1180px) {
            .proof-instrument { min-height: 260px; }
          }
          @media (max-width: 640px) {
            .hero { padding-block: 46px 64px; }
            .run-section,
            .ready-section,
            .unlock-section,
            .return-section,
            .handoff-section { padding-block: 66px; }
            .proof-instrument { min-height: 238px; }
            .rules-grid article,
            .rules-grid article:nth-child(4),
            .rules-grid article:nth-child(5) { min-height: 0; padding: 28px 22px; }
            .rules-grid h3 { margin-top: 18px; }
            .decision-list li { min-height: 0; }
          }
          @media (max-width: 480px) {
            .console-grammar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .console-grammar li { min-height: 68px; }
            .organ-grid span { min-height: 52px; }
          }
          '''
          css_path.write_text(css, encoding='utf-8')

          # Release and working-model contracts: current release carries no photo assets.
          release_path = ROOT / 'RELEASE_CONTRACT.json'
          release = json.loads(release_path.read_text(encoding='utf-8'))
          release['release_files'] = [
              item for item in release['release_files']
              if item not in {'assets/property.webp', 'assets/household.webp'}
          ]
          release['visual_evidence'] = {
              'primary_mode': 'operational_instrumentation',
              'rendered_image_elements': 0,
              'current_release_photo_assets': [],
              'prior_photo_assets_preserved_in_source_history': True,
              'field_activity_claimed': False,
          }
          release_path.write_text(json.dumps(release, indent=2) + '\n', encoding='utf-8')

          contract_path = ROOT / 'WORKING_MODEL_CONTRACT.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          contract['visual_evidence'] = {
              'primary_mode': 'operational_instrumentation',
              'hero': 'A bounded prepared-case trace showing source, authority, output, unresolved gates, and zero external effect.',
              'proof_instruments': ['place_fabric', 'essential_attention', 'operating_fabric', 'street_glide_and_roles'],
              'historical_or_low_resolution_photography_used_as_primary_proof': False,
              'current_release_photo_assets': [],
              'field_activity_claimed': False,
              'acceptance': [
                  'No rendered image element appears in the working-model main surface.',
                  'The duplicate operating-grammar band and generic capacity exposition are absent.',
                  'All four system cards expose specific operational instruments rather than generic initials.',
                  'The public surface contains no N=0 jargon or theme control.',
                  'Desktop, mobile, narrow, keyboard, reduced-motion, packet, and deep-link behavior remain qualified.',
              ],
          }
          contract_path.write_text(json.dumps(contract, indent=2) + '\n', encoding='utf-8')

          readme_path = ROOT / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = sub_once(
              readme,
              r'\n## Visual evidence posture\n\n.*?(?=\n## |\Z)',
              '\n## Visual evidence posture\n\nThe primary surface uses operational instrumentation. The hero exposes a prepared-case trace, unresolved gates, and zero external effect. Each system card shows a specific operating mechanism. Prior low-resolution photo assets remain in Git history and are absent from the current release. The page claims no current field activity.\n',
              'README visual posture',
          )
          readme_path.write_text(readme, encoding='utf-8')

          # Static contract: reject the removed layers and require all four instruments.
          static_path = ROOT / 'tests/public_contract_test.py'
          static = static_path.read_text(encoding='utf-8')
          static = sub_once(
              static,
              r'REQUIRED = \[.*?\]\n',
              '''REQUIRED = [
              "index.html",
              "style-base.css",
              "style.css",
              "app.js",
              "WORKING_MODEL_CONTRACT.json",
              "README.md",
              "RELEASE_CONTRACT.json",
          ]
          ''',
              'static required release files',
          )
          static = sub_once(
              static,
              r'    for phrase in \[.*?    \]:\n        require\(phrase in html, f"required public phrase absent: \{phrase\}"\)\n',
              '''    for phrase in [
                  "Start with one accountable case",
                  "One real problem.",
                  "One bounded promise.",
                  "Silence creates no consent, assignment, rejection, or completion.",
                  "Run one case",
                  "The system is already built.",
                  "Five rules bound the work.",
                  "Five decisions make one bounded pilot possible.",
                  "Produce one pilot packet, not another scoping cycle.",
                  "A return moves one case forward. It does not restart the explanation.",
                  "No institutional acceptance implied.",
              ]:
                  require(phrase in html, f"required public phrase absent: {phrase}")
          ''',
              'static public phrase list',
          )
          static = replace_once(
              static,
              '    require(html.count(\'<article><span>0\') >= 6, "capacity rail count differs")\n',
              '    require(html.count(\'class="proof-instrument\') == 4, "proof-instrument count differs")\n',
              'capacity count assertion',
          )
          start = static.index('    for asset in ["assets/property.webp", "assets/household.webp"]:')
          end = static.index('\n    personalized =', start)
          visual_block = '''    for asset in ["assets/property.webp", "assets/household.webp"]:
              require(not (ROOT / asset).exists(), f"removed photo asset remains in current release: {asset}")
              require(asset not in html, f"removed photo asset remains in public HTML: {asset}")

          for hook in [
              'class="hero-visual hero-console"',
              'class="console-grammar"',
              'class="console-ledger"',
              'class="proof-instrument place-instrument"',
              'class="proof-instrument attention-instrument"',
              'class="proof-instrument fabric-instrument"',
              'class="proof-instrument glide-instrument"',
              'class="attention-stack"',
              'class="organ-grid"',
              'class="source-chain"',
              'class="role-strip"',
              'No adverse use',
          ]:
              require(hook in html, f"operational evidence hook absent: {hook}")
          require("<img" not in html, "working-model main surface may not render photography")
          for residue in ["N=0", "compression-band", "capacity-section", "proof-symbol", 'id="theme"', "data-theme="]:
              require(residue not in html, f"public visual or editorial residue remains: {residue}")
          require("THEME_KEY" not in js and "applyTheme" not in js, "theme subsystem remains in script")
          visual = contract["visual_evidence"]
          require(visual["primary_mode"] == "operational_instrumentation", "visual evidence mode differs")
          require(visual["historical_or_low_resolution_photography_used_as_primary_proof"] is False, "legacy photography must not carry primary proof")
          require(visual["current_release_photo_assets"] == [], "current release photo asset list must be empty")
          require(visual["field_activity_claimed"] is False, "visual system may not manufacture field activity")
          require(release_contract["release_files"] == REQUIRED, "release-file contract differs from static release list")
          require(release_contract["visual_evidence"]["current_release_photo_assets"] == [], "release contract retained current photo assets")
          require(release_contract["visual_evidence"]["rendered_image_elements"] == 0, "release contract rendered-image count differs")
          '''
          static = static[:start] + visual_block + static[end:]
          static = replace_once(
              static,
              '    require("grid-template-columns: minmax(0, 1fr)" in override_css, "narrow capacity containment absent")\n',
              '    require("@media (max-width: 480px)" in override_css, "compact instrument breakpoint absent")\n    require(".console-grammar" in override_css, "compact grammar treatment absent")\n',
              'obsolete narrow capacity assertion',
          )
          static_path.write_text(static, encoding='utf-8')

          # Browser campaigns: require the clean structure, test the latent skip link,
          # and remove the discarded theme branch from both local and live qualification.
          for test_name in ['browser_test.py', 'live_browser_test.py']:
              test_path = ROOT / 'tests' / test_name
              test = test_path.read_text(encoding='utf-8')
              start = test.index('        assert page.locator(".proof-card").count() == 4')
              end = test.index('        assert_no_overflow(page)', start)
              assertions = '''        assert page.locator(".proof-card").count() == 4
                  assert page.locator(".proof-instrument").count() == 4
                  assert page.locator(".proof-symbol").count() == 0
                  assert page.locator("main img").count() == 0
                  assert page.locator("#theme").count() == 0
                  assert page.locator(".compression-band").count() == 0
                  assert page.locator(".capacity-section").count() == 0
                  assert page.locator(".hero-console").count() == 1
                  assert page.locator(".console-grammar li").count() == 7
                  assert page.locator(".console-ledger > div").count() == 4
                  assert page.locator(".place-stack li").count() == 7
                  assert page.locator(".attention-stack li").count() == 5
                  assert page.locator(".organ-grid span").count() == 6
                  assert page.locator(".source-chain li").count() == 4
                  assert page.locator(".role-strip span").count() == 5
                  assert "no adverse use" in page.locator(".instrument-foot").all_inner_texts()[0].lower()
                  assert "Silence creates no consent" in page.locator(".invariant").inner_text()
                  assert "N=0" not in page.locator("body").inner_text()
                  assert page.locator("html").get_attribute("data-theme") is None
                  skip = page.locator(".skip")
                  assert skip.evaluate("el => el.getBoundingClientRect().width <= 1")
                  skip.focus()
                  assert skip.evaluate("el => el.getBoundingClientRect().width > 1")
                  page.evaluate("document.activeElement.blur()")
          '''
              test = test[:start] + assertions + test[end:]
              test, count = re.subn(
                  r'\n        original_theme = page\.locator\("html"\).*?assert page\.locator\("html"\)\.get_attribute\("data-theme"\) == changed_theme\n',
                  '\n',
                  test,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'{test_name}: theme campaign block count differed: {count}')
              test_path.write_text(test, encoding='utf-8')

          # Live readback: require the exact seven-file release and prove that the two
          # former photo paths disappear from the deployed route.
          live_path = ROOT / 'tests/live_readback.py'
          live = live_path.read_text(encoding='utf-8')
          live = replace_once(live, '    "assets/property.webp",\n    "assets/household.webp",\n', '', 'live readback photo file list')
          live = replace_once(
              live,
              ']\n\n\ndef digest(data: bytes) -> str:',
              ']\nREMOVED_FILES = ["assets/property.webp", "assets/household.webp"]\n\n\ndef digest(data: bytes) -> str:',
              'removed-file registry',
          )
          probe = '''
                  removed_observed: dict[str, object] = {}
                  for relative in REMOVED_FILES:
                      url = urllib.parse.urljoin(BASE_URL, urllib.parse.quote(relative, safe="/"))
                      try:
                          data, content_type = fetch(cache_busted(url, attempt))
                          row = {
                              "url": url,
                              "bytes": len(data),
                              "sha256": digest(data),
                              "content_type": content_type,
                              "status": "UNEXPECTEDLY_PRESENT",
                          }
                          removed_observed[relative] = row
                          mismatches.append({"path": relative, "expected": "REMOVED", "observed": row})
                      except urllib.error.HTTPError as exc:
                          if exc.code == 404:
                              removed_observed[relative] = {"url": url, "status": "PASS_REMOVED", "http_status": 404}
                          else:
                              mismatches.append({"path": relative, "expected": "REMOVED", "http_status": exc.code})
                      except (urllib.error.URLError, TimeoutError) as exc:
                          mismatches.append({"path": relative, "expected": "REMOVED", "error": str(exc)})
          '''
          live = replace_once(
              live,
              '        root_ok = False\n',
              probe + '\n        root_ok = False\n',
              'live removed-file probe insertion',
          )
          live = replace_once(
              live,
              '                "root_directory_link": True,\n                "files": {',
              '                "root_directory_link": True,\n                "removed_files": removed_observed,\n                "files": {',
              'live removed-file receipt',
          )
          live_path.write_text(live, encoding='utf-8')

          # Remove obsolete release bytes. Git history remains the custody record.
          for relative in ['assets/property.webp', 'assets/household.webp']:
              path = ROOT / relative
              if not path.is_file():
                  raise SystemExit(f'expected legacy release asset absent before deletion: {relative}')
              path.unlink()
          assets = ROOT / 'assets'
          if assets.exists() and not any(assets.iterdir()):
              assets.rmdir()
          PY

      - name: Remove one-shot controller
        run: rm '.github/workflows/manzanita-working-model-editorial-finish-v1.yml'

      - name: Qualify the complete editorial finish
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            manzanita-working-model/tests/public_contract_test.py \
            manzanita-working-model/tests/browser_test.py \
            manzanita-working-model/tests/live_browser_test.py \
            manzanita-working-model/tests/live_readback.py
          node --check manzanita-working-model/app.js
          python manzanita-working-model/tests/public_contract_test.py
          python -m pip install --disable-pip-version-check playwright==1.57.0
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser" ]; then
            export MW_CHROMIUM_EXECUTABLE="$browser"
          else
            python -m playwright install --with-deps chromium
          fi
          export MW_WORKING_MODEL_SCREENSHOT_DIR="$RUNNER_TEMP/manzanita-working-model-editorial-finish"
          python manzanita-working-model/tests/browser_test.py

      - name: Retain exact visual review evidence
        uses: actions/upload-artifact@v4
        with:
          name: manzanita-working-model-editorial-finish-${{ github.sha }}
          path: ${{ runner.temp }}/manzanita-working-model-editorial-finish
          if-no-files-found: error
          retention-days: 30

      - name: Commit the qualified finish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'manzanita-working-model-editorial-bot'
          git config user.email 'actions@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          required = {
              'manzanita-working-model/README.md',
              'manzanita-working-model/RELEASE_CONTRACT.json',
              'manzanita-working-model/WORKING_MODEL_CONTRACT.json',
              'manzanita-working-model/app.js',
              'manzanita-working-model/assets/household.webp',
              'manzanita-working-model/assets/property.webp',
              'manzanita-working-model/index.html',
              'manzanita-working-model/style.css',
              'manzanita-working-model/tests/browser_test.py',
              'manzanita-working-model/tests/live_browser_test.py',
              'manzanita-working-model/tests/live_readback.py',
              'manzanita-working-model/tests/public_contract_test.py',
          }
          allowed = required | {'.github/workflows/manzanita-working-model-editorial-finish-v1.yml'}
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          observed = {row[3:] for row in rows}
          missing = required - observed
          unexpected = observed - allowed
          if missing or unexpected:
              raise SystemExit(f'changed-path gate failed\nmissing={sorted(missing)}\nunexpected={sorted(unexpected)}\nobserved={sorted(observed)}')
          PY
          git add -A
          git commit -m 'manzanita: complete working-model editorial finish'
          git push origin HEAD
